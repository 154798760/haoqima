<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>冷知识小问答 · 随机刷新版</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2317786E'/%3E%3Ctext x='32' y='44' font-size='36' text-anchor='middle' fill='%23ffffff' font-family='Georgia,serif' font-weight='bold'%3E?%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@600;900&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
  :root{
    --paper:#F6F3EA;
    --ink:#24281F;
    --ink-soft:#4C5144;
    --line:#E0DAC8;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{-webkit-text-size-adjust:100%;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    line-height:1.75;
  }
  main{max-width:880px;margin:0 auto;padding:0 24px 72px;}

  /* ===== 页眉 ===== */
  .masthead{padding:52px 0 6px;position:relative;}
  .kicker{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700;letter-spacing:.22em;color:var(--ink-soft);}
  .kicker::before{content:"";width:34px;height:2px;background:#17786E;border-radius:2px;}
  h1{font-family:"Noto Serif SC","Songti SC",serif;font-size:40px;font-weight:900;line-height:1.2;margin:16px 0 8px;letter-spacing:.01em;}
  .date{font-size:14px;color:var(--ink-soft);font-weight:500;}
  .lead{margin-top:16px;font-size:15px;color:var(--ink-soft);max-width:36em;}

  /* ===== 顶部工具条 ===== */
  .toolbar{display:flex;align-items:center;justify-content:flex-end;gap:14px;margin-top:24px;flex-wrap:wrap;}
  .actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .tbtn{
    display:inline-flex;align-items:center;gap:9px;
    font-family:inherit;font-size:15px;font-weight:700;color:#17786E;
    background:#FFFDF7;border:1px solid #17786E;border-radius:999px;padding:10px 20px;cursor:pointer;
    transition:background .15s ease, color .15s ease;
  }
  .tbtn:hover{background:#17786E;color:#fff;}
  .tbtn.active{background:#17786E;color:#fff;}
  .tbtn:active{transform:scale(.96);}
  .refresh{
    display:inline-flex;align-items:center;gap:9px;
    font-family:inherit;font-size:15px;font-weight:700;color:#fff;
    background:#17786E;border:0;border-radius:999px;padding:11px 22px;cursor:pointer;
    box-shadow:0 2px 10px rgba(23,120,110,.25);transition:transform .15s ease, box-shadow .15s ease;
  }
  .refresh:active{transform:scale(.96);}
  .refresh .ic{display:inline-block;transition:transform .45s ease;}
  .refresh.spin .ic{transform:rotate(360deg);}

  /* ===== 分类快捷导航 ===== */
  .nav{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px;}
  .nav a{
    display:inline-flex;align-items:center;gap:7px;
    font-size:13px;font-weight:700;color:var(--c);
    border:1px solid var(--c);border-radius:999px;
    background:color-mix(in srgb,var(--c) 8%,white);
    padding:6px 14px;text-decoration:none;outline-offset:3px;
    transition:background .15s ease, color .15s ease;
  }
  .nav a b{font-size:12px;opacity:.75;font-weight:700;}
  .nav a.active{background:var(--c);color:#fff;}
  .nav a.active b{opacity:.9;}

  /* ===== 卡片 ===== */
  .list{margin-top:26px;display:flex;flex-direction:column;gap:16px;}
  .card{border:1px solid var(--line);border-radius:16px;background:#FFFDF7;overflow:hidden;box-shadow:0 1px 4px rgba(36,40,31,.05);}
  .card-head{display:flex;align-items:baseline;gap:14px;padding:18px 22px;cursor:pointer;user-select:none;}
  .num{font-family:"Noto Serif SC","Songti SC",serif;font-size:30px;font-weight:900;color:var(--c);flex:none;line-height:1;}
  .card .tag{flex:none;font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--c);border:1px solid var(--c);border-radius:999px;padding:2px 11px;background:color-mix(in srgb,var(--c) 8%,white);}
  .q{font-family:"Noto Serif SC","Songti SC",serif;font-size:20px;font-weight:700;line-height:1.5;color:var(--ink);flex:1;}
  .chev{flex:none;font-size:20px;color:var(--c);font-weight:700;transform:rotate(90deg);transition:transform .25s ease;}
  .card.open .chev{transform:rotate(-90deg);}
  .card-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease;border-top:1px dashed var(--line);}
  .card.open .card-body{grid-template-rows:1fr;}
  .card-body-inner{overflow:hidden;min-height:0;}
  .a{padding:18px 22px 6px;font-size:15.5px;line-height:1.95;color:var(--ink-soft);}
  .meta{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 22px 18px;flex-wrap:wrap;}
  .src{font-size:13px;color:var(--ink-soft);text-decoration:none;border-bottom:1px dotted #B8B2A0;}
  .src:hover{color:var(--c);}
  .copy{
    font-family:inherit;font-size:13px;font-weight:700;color:var(--c);
    background:transparent;border:1px solid var(--c);border-radius:999px;padding:5px 15px;cursor:pointer;
  }
  .copy:active{transform:scale(.95);}
  .fav{
    font-family:inherit;font-size:13px;font-weight:700;color:var(--c);
    background:transparent;border:1px solid var(--c);border-radius:999px;padding:5px 15px;cursor:pointer;
    transition:background .15s ease, color .15s ease;
  }
  .fav.on{background:var(--c);color:#fff;}
  .fav:active{transform:scale(.95);}
  .meta-btns{display:flex;align-items:center;gap:8px;}
  .favbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:26px;flex-wrap:wrap;}
  .favbar[hidden]{display:none;}
  .favbar-info{font-size:14px;color:var(--ink-soft);font-weight:500;}
  .empty{
    border:1px dashed var(--line);border-radius:16px;background:#FFFDF7;
    padding:36px 24px;text-align:center;font-size:15px;color:var(--ink-soft);
  }

  footer{margin-top:40px;padding-top:20px;border-top:1px solid var(--line);text-align:center;font-size:13px;color:var(--ink-soft);line-height:1.9;}
  footer .status{font-size:14px;font-weight:700;color:var(--ink);margin-bottom:12px;}

  /* ===== 下拉刷新提示 ===== */
  #pullTip{
    position:fixed;top:0;left:0;right:0;z-index:99;
    text-align:center;font-size:13px;font-weight:600;color:#17786E;
    background:rgba(246,243,234,.95);padding:10px 0;
    transform:translateY(-100%);transition:transform .18s ease;pointer-events:none;
  }
  #pullTip.show{transform:translateY(0);}

  /* ===== Toast ===== */
  #toast{
    position:fixed;left:50%;bottom:34px;transform:translate(-50%,16px);z-index:99;
    background:#24281F;color:#F6F3EA;font-size:13.5px;font-weight:500;
    padding:10px 20px;border-radius:999px;opacity:0;transition:opacity .25s ease, transform .25s ease;pointer-events:none;
    box-shadow:0 4px 16px rgba(0,0,0,.18);
  }
  #toast.show{opacity:1;transform:translate(-50%,0);}

  /* ===== 窄屏 ===== */
  @media (max-width:640px){
    .masthead{padding-top:36px;}
    h1{font-size:29px;}
    .actions{flex-wrap:nowrap;}
    .tbtn{min-height:44px;padding:6px 13px;font-size:13px;gap:6px;}
    .refresh{min-height:44px;padding:7px 15px;font-size:13px;gap:6px;}
    .nav a{min-height:44px;display:inline-flex;align-items:center;padding:10px 16px;}
    .card-head{flex-wrap:wrap;gap:10px;padding:16px 16px;}
    .q{font-size:18px;flex-basis:calc(100% - 60px);}
    .num{font-size:26px;}
    .card .tag{font-size:12px;}
    .a{padding:16px 16px 4px;font-size:15px;}
    .meta{padding:4px 16px 16px;}
    .copy{min-height:44px;padding:8px 18px;font-size:14px;}
    .fav{min-height:44px;padding:8px 18px;font-size:14px;}
    .src{display:inline-block;padding:10px 0;min-height:44px;}
    .lead{font-size:14px;}
  }
</style>
</head>
<body>
<main>
    <div id="pullTip">↓ 下拉再好奇</div>

  <header class="masthead">
    <p class="kicker">冷知识小问答 · 随机刷新版</p>
    <h1>今天，你好奇了吗？</h1>
    <p class="date">2026 年 9 月 29 日 · 星期二</p>
    <p class="lead">一个陪你长知识的冷知识小馆：8 大领域随机出题，看过不重样，喜欢就收藏。</p>
  </header>

  <div class="toolbar">
    <div class="actions">
      <button class="tbtn active" id="allBtn" type="button">全部</button>
      <button class="tbtn" id="expandBtn" type="button">展开</button>
      <button class="tbtn" id="favBtn" type="button">我的</button>
      <button class="refresh" id="refreshBtn" type="button"><span class="ic">⟳</span>再好奇</button>
    </div>
  </div>

  <nav class="nav" id="nav" aria-label="分类快捷导航"></nav>

  <div class="favbar" id="favbar" hidden>
    <span class="favbar-info" id="favbarInfo"></span>
    <button class="tbtn" type="button" onclick="window.copyAllFav();">全部复制</button>
  </div>

  <section class="list" id="list" aria-live="polite"></section>

  <footer>
    <p class="status" id="count">正在加载题库…</p>
    <p>点分类只看单领域，点「我的」看收藏，点「再好奇」随时换新题。</p>
    <p>每条内容均经权威科普渠道核验后改写，来源见卡片内链接。</p>
  </footer>
</main>

<div id="toast"></div>

<script>
(function(){
  "use strict";

  /* ===== 题库（每条：q 问题 / a 答案 / s 来源名 / u 来源链接） ===== */
  var BANK = {
    "科学":[
      {q:"为什么北极星好像永远不动？",a:"因为地球的自转轴几乎正好指向北极星。地球绕地轴自转，地轴的延长线直指北方天空的一点，北极星就恰好落在这根「轴」附近。地球转，其他星星都绕着这个点转圈，唯独北极星几乎待在原地，像钉在天上的一根轴心。所以在北半球，找北极星就能定方向：它永远指向正北方。古代航海靠它辨认方向，如今的星空摄影里，所有星星都在它周围画同心圆。几千年后地轴会慢慢摆动，北极星的位置将被别的星接替，但在这段日子里，它是最忠诚的「定北针」。",s:"维基百科·北极星",u:"https://zh.wikipedia.org/wiki/北极星"},
      {q:"为什么天空是蓝色的？",a:"这是「光的散射」在作怪。阳光看似白色，其实是多种颜色光的混合，不同颜色的光波长不同。空气里的微小分子会散射阳光，对短波长的蓝紫光散射得特别厉害，这叫瑞利散射。蓝光被四面八方弹来弹去，布满整个天空，所以我们抬头看到的就是蓝色；红橙光波长长、散射弱，大多直接穿过去了。傍晚太阳斜射，阳光要走更长的路穿过大气，蓝光在中途几乎被散射光了，剩下的红橙光到达眼睛，天空就变成橘红色。天空不是「蓝的」，而是被蓝光「刷」蓝的。",s:"科普中国",u:"https://cloud.kepuchina.cn/h5/detail?id=7384624722989568000"},
      {q:"为什么水滴落在荷叶上会滚成圆珠？",a:"因为荷叶天生「不沾水」。荷叶表面布满无数肉眼看不见的微小凸起，像一片纳米级的「小森林」，水滴落上去，接触面积被这些小凸起撑得极小，水根本摊不开，只能在表面张力的作用下缩成圆珠，轻轻一歪就滚走了，顺便把灰尘也带走——这就是著名的「荷叶效应」，也叫超疏水现象。科学家受它启发，做出了防水面料、自清洁玻璃和不挂雨滴的车窗。所以荷叶不是「懒」，而是长了一身微观的绒毛，让雨水自己识趣地滚蛋。",s:"维基百科·莲叶效应",u:"https://zh.wikipedia.org/wiki/莲叶效应"},
      {q:"为什么焰火能放出五颜六色的光？",a:"秘密在金属盐。烟花里掺了不同的金属化合物，燃烧时金属原子受热，电子跳到高能量状态，落回原位时会把多余的能量以光的形式放出来——每种金属放出的光颜色不同：钠放黄光，锶放红光，钡放绿光，铜放蓝光，这就是「焰色反应」。所以烟花的配方表，其实就是一张调色盘：要红色加锶盐，要绿色加钡盐，要黄色加钠盐，再配上氧化剂和黏合剂，一颗烟花就能炸出满天花雨。烟花的美，是一场金属元素的化学秀。",s:"维基百科·焰色反应",u:"https://zh.wikipedia.org/wiki/焰色反应"},
      {q:"为什么冰面那么滑？",a:"滑的不是冰本身，而是冰面上的「一层水膜」。人踩上去，鞋底对冰面产生压力，冰的熔点会稍稍降低，局部化成水；同时鞋底和冰面摩擦生热，也加速表面融化，于是冰面上总有一层薄薄的水。冰刀能滑、冰壶能走，靠的都是这层水做的润滑剂。冰面越光滑，水膜越均匀，滑起来越顺。还有个有趣的事实：冰能这么滑，恰恰因为它熔点低——像石英那样的晶体怎么压都不融化，永远滑不起来。所以不是冰天生顺滑，而是压力一碰，它就给自己「上油」。",s:"维基百科·冰",u:"https://zh.wikipedia.org/wiki/冰"},
      {q:"为什么轮胎都是黑色的？",a:"天然橡胶本来是乳白色的，但纯橡胶不耐磨、怕晒、容易老化。轮胎里要加一种叫炭黑的填料——炭黑能大幅提升橡胶的强度和耐磨性，还能吸收紫外线、延缓老化。于是橡胶一掺炭黑，就成了黑色，这个配方从汽车诞生用到现在，成了行业标准。所以轮胎黑不是因为审美，而是「好用」逼出来的。偶尔能看到彩色轮胎，那是用了别的填料，但性能和寿命通常都不如黑轮胎。下次看到黑黢黢的轮胎，它其实是橡胶界的「碳纤维战甲」。",s:"维基百科·炭黑",u:"https://zh.wikipedia.org/wiki/炭黑"},
      {q:"为什么海拔越高反而越冷？",a:"因为空气是被地面「烤热」的。太阳辐射穿过大气时，真正被加热的不是空气，而是地面：地面吸收阳光后升温，再把热量传给贴近地面的空气，所以越靠近地面空气越暖。海拔越高，离这个「暖气片」越远，空气又稀薄、存不住热量，气温就一路走低——平均每升高一千米，大约降六摄氏度。所以山顶终年积雪、山脚绿树成荫，不是山把冷气吸走了，而是热空气都堆在山脚不愿上来。登山时越走越冷，是你在远离地面的「暖气」。",s:"科普中国",u:"https://www.kepuchina.cn/wiki/science/201606/t20160614_189672.shtml"},
      {q:"为什么夏天柏油路上会看到「水洼」？",a:"那不是水，是光在「变魔术」。夏天路面被晒得滚烫，贴近路面的空气受热膨胀、变稀，折射率随之变化；光线从冷空气钻进热空气层时发生弯折，把天空的影像「折」到路面上，看起来就像前方有一滩水，走近却消失了——这叫「下蜃景」，是海市蜃楼的一种。沙漠里旅人看到的「绿洲」，也是同一种把戏。越烫的路面，影像越清晰。所以开车时看到前面「一片水」，先别急着踩，那多半是太阳在路面画的假象。",s:"维基百科·蜃景",u:"https://zh.wikipedia.org/wiki/蜃景"},
      {q:"彩虹为什么是七色的？",a:"阳光看着是白色，其实里头藏着一整套色光。雨后空气中飘着无数小水滴，阳光一穿进去，就像进了三棱镜：不同颜色的光在水滴里折射的角度不一样，红光拐弯少、紫光拐弯多，出来时就被拆成一条红橙黄绿蓝靛紫的光带。所以彩虹不是天上画出来的，是阳光被小水滴「拆快递」拆出来的。你看彩虹的方向永远背对太阳，那是因为光线要在你和太阳之间的水滴里拐一个大弯，才正好落进你眼睛。",s:"维基百科·彩虹",u:"https://zh.wikipedia.org/wiki/彩虹"},
      {q:"为什么星星会一闪一闪地眨眼？",a:"星星本身其实很稳，晃的是地球的大气。星光要穿过厚厚一层空气才能到你眼里，而空气不是静止的：冷热气流不停地上下翻滚，密度一会儿密一会儿稀，光线被折来折去，到你眼睛时位置就微微晃动，于是看起来一闪一闪。越靠近地平线的星星，光要钻过越厚的大气，眨眼越厉害；头顶正上方的星星就稳得多。宇航员在太空看星星，是又亮又稳、一点不闪的。所以星星眨眼，是它在替大气「打哆嗦」。",s:"维基百科·视宁度",u:"https://zh.wikipedia.org/wiki/视宁度"},
      {q:"月亮自己会发光吗？",a:"月亮自己不发光，它只是个「大镜子」。月亮本身又冷又暗，我们看到的月光，其实是月亮表面把太阳光反射到地球上的。月球表面灰暗粗糙，反射率并不高，差不多相当于一块旧沥青，但架它个儿大、离我们近，足够把夜空照亮。月亮为什么有圆缺？也不是它被吃掉一块，而是太阳照亮的那一半，随着月亮绕地球转，被我们看到的角度不一样：全亮时是满月，只看到侧边时是月牙。月光其实是迟到一秒多的阳光。",s:"维基百科·月球",u:"https://zh.wikipedia.org/wiki/月球"},
      {q:"为什么闪电总是弯弯曲曲的？",a:"闪电不是笔直的电线，而是电在空气里「找路」。云里积聚了大量电荷，要找电阻最小的路径劈到地面。空气里湿度、尘埃、温度处处不同，哪条道好走，电就先往哪探一步，探错了再拐回来，于是路径歪歪扭扭、枝枝杈杈，像一棵倒着长的发光树。先导一步一步往下摸，最后那道最亮的回击，就把这条曲折的路照亮给你看。所以闪电不是画出来的直线，是电流在看不见的空气里走出来的「羊肠小道」。",s:"维基百科·闪电",u:"https://zh.wikipedia.org/wiki/闪电"},
      {q:"为什么在山谷里喊一声会有回声？",a:"声音是一种波，撞到硬东西会被弹回来。你在空旷山谷喊一声，声波往前跑，撞上对面的山崖、岩壁，就像皮球撞墙一样被反弹回来，隔一小段时间再钻进你耳朵，你就听到了自己刚才那句话——这就是回声。障碍物越远，回声来得越晚；距离合适时，原声和回声分得开，你才能听清；太近的话，回声和原声叠在一起，只会让声音变响亮，这就是大房间要做吸音的原因。山谷、隧道、空房子，都是天然的回音壁。",s:"维基百科·回声",u:"https://zh.wikipedia.org/wiki/回声"},
      {q:"为什么先看到闪电，后听到雷声？",a:"因为光比声音快太多了。闪电和雷声其实是同一时刻发生的：放电瞬间既发光又发出巨响。但光速大约每秒三十万公里，眨眼就到你眼前；声速在空气里每秒只有三百四十米左右，慢悠悠地跑。所以打雷时你先「看」到那道光，过几秒才「听」到那声雷。想要估算雷雨离你多远？看到闪电开始数秒，每过三秒大约折合一公里，数到几就是几公里。下次打雷别只顾捂耳朵，顺便量一量雷离你多远。",s:"维基百科·声速",u:"https://zh.wikipedia.org/wiki/声速"},
      {q:"为什么影子中午短、早晚长？",a:"影子长短，全看太阳在天上的高度。太阳越低，斜斜照下来，人挡住的光就被拉得长长的，影子自然拖在身后很长；太阳升到头顶附近，光几乎垂直往下照，人挡住的光只在脚下留一小团，影子就缩得很短。中午太阳最高，影子最短；早晚太阳贴地平线，影子最长。所以古人看影子计时：日晷就是靠影子位置读时辰。下次晴天出门低头看看自己的影子，它其实在告诉你现在是几点钟。",s:"维基百科·影子",u:"https://zh.wikipedia.org/wiki/影子"},
      {q:"为什么放大镜对着太阳能点燃纸？",a:"放大镜是一块中间厚、边上薄的凸透镜。阳光照上去，被透镜往中间弯折，本来散开的一整片阳光，全被聚到一个小小的亮点上——这个亮点叫焦点。阳光本来分散的能量，挤到硬币大小的一点上，温度迅速升高，再加上黑色纸吸光厉害，没过一会儿就冒烟、起火。老人用它取火，小孩用它烧蚂蚁洞，用的都是同一招：把一大束阳光「浓缩」成一个小亮点。放大镜不是变魔术，是把阳光聚在一起烤。",s:"维基百科·凸透镜",u:"https://zh.wikipedia.org/wiki/透镜"},
      {q:"为什么铁放久了会生锈？",a:"铁生锈是一场慢慢进行的「电化学腐蚀」。铁天天和空气、水打交道，表面吸附一层薄薄的水膜，水里溶着氧气和二氧化碳，就成了微电池。铁原子失去电子，变成铁锈——疏松多孔的红褐色氧化铁。铁锈不像铝锈那样致密，它挡不住水和氧，反而像海绵一样把水吸住，让锈蚀一路往里钻。所以铁会从表面一路烂到底。刷漆、镀锌、抹油，都是把铁和水、氧隔开，让这场「慢电解」没法开工。",s:"维基百科·锈",u:"https://zh.wikipedia.org/wiki/铁锈"},
      {q:"为什么不锈钢不容易生锈？",a:"秘密在于钢里加了铬。不锈钢不是「不会锈」，而是表面能自己长一层看不见的保护膜。铬这东西特别爱和氧结合，钢一暴露在空气里，表面立刻生成一层极薄、极致密的氧化铬薄膜，紧紧贴在钢上，把水和氧全挡在外面。这层膜还很「自愈」：万一被划伤，暴露的新表面会马上再生成一层新膜。所以不锈钢水槽、餐具天天沾水也亮堂堂。但它也不是刀枪不入——长期泡在盐水、强酸里，保护膜也会破，照样会长锈点。",s:"维基百科·不锈钢",u:"https://zh.wikipedia.org/wiki/不锈钢"},
      {q:"为什么磁铁有南极和北极？",a:"磁铁里藏着无数个微小的「小磁针」，叫磁畴。平时它们方向乱着，互相抵消，整块铁不显磁性；可一旦被磁铁吸过，这些小磁畴齐刷刷朝一个方向看齐，整块铁就有了统一的南极和北极。磁畴整齐排列的方向，就是磁铁的磁极方向。把磁铁切成两半，每一半又会自己重新分出南北极——你永远切不出一根「单极磁铁」。指南针指北、冰箱贴吸门，靠的都是这千万亿个小磁畴一起点头的力量。",s:"维基百科·磁畴",u:"https://zh.wikipedia.org/wiki/磁畴"},
      {q:"为什么指南针总是指向北方？",a:"因为地球本身就是一块大磁铁。地球内部的液态金属在转动中产生了一个巨大的磁场，这个磁场从南极附近出来，绕到北极附近进去。指南针那根小磁针，其实是个能自由转动的小磁铁，它的北极会被地球磁场的南极吸引，于是一头稳稳指向北方。不过严格说指南针指的是地磁北极，和真正的地理北极并不完全重合，还有个小偏差叫磁偏角。航海、野外徒步靠它定向，就是借了地球这块「天然大磁铁」的光。",s:"维基百科·指南针",u:"https://zh.wikipedia.org/wiki/指南针"},
      {q:"为什么电池用久了会没电？",a:"电池里的电，是内部化学物质「反应」出来的。普通干电池正极是碳棒、负极是锌壳，中间塞着糊状物。一接上灯泡，内部的化学物质就开始反应，把电子从负极往正极推，电流就跑起来了。用着用着，反应物一点点消耗，到最后没东西可反应了，电压就跌下去，灯变暗、遥控器失灵——这就是「没电」。充电电池之所以能复活，是因为通上反向电流，把反应再「倒回去」，反应物又攒回来了。所以电池不是电的仓库，是一罐慢慢烧完的化学燃料。",s:"维基百科·电池",u:"https://zh.wikipedia.org/wiki/电池"},
      {q:"为什么灯泡里的灯丝会烧断？",a:"白炽灯的灯丝是一根细细的钨丝，通电时热到两千多摄氏度，亮得发白。可就算泡在充了惰性气体的玻璃泡里，钨丝还是会一点点蒸发变细，时间一长，最细的那一处扛不住高温，「啪」地断了。钨是熔点最高的金属，可两千多度长年累月地烤，再硬的丝也会变细。这就是为什么灯泡用久了会先变暗、再闪两下、最后彻底黑——灯丝在悄悄变瘦，瘦到撑不住那一刻就退休。节能灯和LED不靠烧丝，寿命自然长得多。",s:"维基百科·白炽灯",u:"https://zh.wikipedia.org/wiki/白炽灯"},
      {q:"为什么方便面的面条是弯的？",a:"把面条做成波浪形，是为了省地方又好煮。直面条一捆一捆占地方，压成波浪卷，同样一块面饼能塞进去更多面条，运输和包装都省钱。更妙的是，卷曲的面条之间留了缝隙，开水一泡，水能钻到每一根面条中间，熟得又快又匀；真要煮，波浪面也比直面条不容易粘成一坨。油炸脱水后面块又脆又干，一捏就碎，加水立刻还原。小小一个弯，藏着节约空间、加速吸水、防止粘连三重心思。",s:"维基百科·方便面",u:"https://zh.wikipedia.org/wiki/方便面"},
      {q:"为什么飞机的窗户是圆角的？",a:"因为方角会「吃应力」。飞机飞到高空，舱内要加压、舱外气压低，机身像个被吹胀的气球，金属蒙皮处处受拉。如果窗户开成方形，四个角就是应力集中的地方——拉力全挤在尖角上，时间一长，裂纹会从角上悄悄冒出来。早期客机出过几次因为方窗裂纹导致的事故，后来工程师把所有窗户都改成圆角，让应力顺着圆弧平滑地散开，不再扎堆。所以你坐在舷窗边看云，那个圆圆的角不是为了好看，是为了把你安全送到目的地。",s:"维基百科·座舱",u:"https://zh.wikipedia.org/wiki/增压座舱"},
      {q:"钢铁做的轮船为什么不会沉？",a:"虽然钢铁比水重得多，但轮船是个空心大壳。阿基米德两千年前就想明白了：一个物体在水里受到的浮力，等于它排开的那部分水的重量。轮船虽然外壳是钢，可肚子里装着大量空气，整体平均密度比水小，排开水的重量大于船自身重量，浮力就把它托起来了。等船一沉、水灌进肚子，平均密度一下超过水，它立刻往下钻。所以船越大、肚子越空，浮力越足；装货要小心配平，水一进舱，再大的巨轮也得沉。",s:"维基百科·浮力",u:"https://zh.wikipedia.org/wiki/浮力"},
      {q:"为什么热气球能升上天空？",a:"靠的是热空气比冷空气轻。球囊里装着一大团空气，底下烧一把火，囊里的空气受热膨胀，一部分被挤出去，球里剩下的空气变轻了。同样体积下，热空气比外面的冷空气轻，外面的冷空气就把它往上托——这就是浮力。火一烧，球变轻，往上升；火一关，空气凉下来、变重，球就缓缓下降。飞行员没什么方向盘，全靠调节火力和找不同高度的风向来走。天上飘着的彩色气球，其实是一团被火加热的、轻飘飘的空气。",s:"维基百科·热气球",u:"https://zh.wikipedia.org/wiki/热气球"},
      {q:"为什么用吸管能把饮料吸上来？",a:"其实不是你「吸」上来的，是大气压替你压上来的。吸管插在饮料里，管里管外都被大气压着，液面一样平。你一吸，先把吸管里的空气抽走，管子里气压变低，管外液面受到的大气压就把饮料顺着管子压进你嘴里。所谓「吸」，只是你制造了一个低压区，让大气压有空可钻。这也是为什么吸管不能太长：十米左右就是大气压能压水柱的极限，再长你把肺抽瘪了也吸不上来。吸管喝饮料，是大气在帮你端杯子。",s:"维基百科·大气压",u:"https://zh.wikipedia.org/wiki/大气压"},
      {q:"为什么镜子里的你左右是反的？",a:"镜子其实没把左右颠倒，它颠倒的是前后。你举起右手，镜子里的人举起的那只手，从他自己的角度看也是右手——他只是脸朝你转过来了。镜面是垂直于你的，它把「前后」这一对方向翻转了过来，上下、左右都没动。可你脑补时会把镜中人当成一个面对面的人，于是觉得他的右手长在了左边。不信你对着镜子举一支笔，笔尖指向哪，镜里的笔尖也指向哪，根本没反。所以镜子不骗你，是你自己的大脑在做角色扮演。",s:"维基百科·镜像",u:"https://zh.wikipedia.org/wiki/镜像"},
      {q:"为什么冰会浮在水面上？",a:"水是少见的「冷了反而胀」的物质。绝大多数东西热胀冷缩，可水在四摄氏度以下却反过来：温度越低体积越大，结冰时体积一下子膨胀约一成。体积变大、质量不变，冰的密度就比液态水小。于是同体积的冰比水轻，自然浮在上面。这看似小事，其实是大自然的温柔：冬天湖面结冰，冰浮在表面像一床被子，把下面的水和鱼盖住，水里才不至于整体冻成硬块。要是冰比水沉，江河湖海从底往上冻，鱼早就冻成冰棍了。",s:"维基百科·水",u:"https://zh.wikipedia.org/wiki/水"},
      {q:"为什么高山上水不到100℃就开了？",a:"水开不开，不看温度，看气压。标准大气压下，水到一百摄氏度才沸腾；可高山上空气稀薄、气压低，水分子不用等到一百度就能挣脱水的束缚变成气泡。海拔每升高一千米，沸点大约降三度。在珠峰顶上，七十多度水就哗哗开了，可这水看着滚开，却煮不熟米饭——温度不够。所以高原上做饭得用高压锅，把气压强行压上去，沸点才能回到一百度。难怪登山队都背高压锅：不是讲究，是没有它连碗熟饭都吃不上。",s:"维基百科·沸点",u:"https://zh.wikipedia.org/wiki/沸点"},
      {q:"为什么肥皂能把油洗干净？",a:"肥皂分子长着「两头」：一头爱水，一头爱油。沾了油污的盘子上水和油互相躲着，水冲不动油。抹上肥皂后，爱油的一头钻进油里，爱水的一头露在外面朝水，把一滴油团团包成小球，再被水一冲就带走。这就是乳化作用。洗衣服、洗手都是这个道理：肥皂不是把油「溶」掉，是把油打包成小油滴，让水能把它冲走。光用水洗不掉油，是因为水和油天生不对付；肥皂是那个中间牵线的和事佬。",s:"维基百科·肥皂",u:"https://zh.wikipedia.org/wiki/肥皂"},
      {q:"为什么高压锅做饭特别快？",a:"高压锅把盖子一扣，严丝合缝，加热时里面水蒸气跑不出去，气压越攒越高。气压一高，水的沸点就跟着升高——普通锅一百度就开了，高压锅里水能到一百一十多摄氏度。温度越高，食物熟得越快：豆子炖烂、米饭软糯，本来要一小时，二十分钟就搞定。锅盖上那个限压阀，就是专门在压力过大时「嗤」地放掉一点气，保证安全。高压锅快，靠的不是猛火，是把气压硬抬上去，让水「烧得更烫」。",s:"维基百科·高压锅",u:"https://zh.wikipedia.org/wiki/压力锅"},
      {q:"为什么保温杯能保温大半天？",a:"保温杯是个双层玻璃（或不锈钢）瓶子，两层之间被抽成真空。真空里没有空气、没有水，热量最难传导——热要靠分子互相碰来传，真空里几乎没有分子，热传不出去。杯口再加个软木或塑料塞，把那点缝隙也堵住。于是杯里的热水热量既传不出去，外面的冷气也进不来，半天之后还是烫嘴。普通杯子壁是单层，热量顺着杯壁哗哗往外跑，自然凉得快。保温杯的秘密，就是在两层壳之间挖了个「真空隔热层」。",s:"维基百科·保温瓶",u:"https://zh.wikipedia.org/wiki/保温瓶"},
      {q:"为什么玻璃是透明的？",a:"材料透不透明，看它挡不挡可见光。玻璃由硅、氧等原子组成，原子里电子的能量「台阶」比较高，可见光的光子能量不够把电子踢上去，就没法被吸收，直接穿过去了。木头、金属里电子的台阶低，可见光一撞上就被吸收或反射，自然不透明。但玻璃不是对所有光都透明：紫外线就穿不过它，这也是为什么隔着玻璃晒不黑。一块玻璃，本质上是对可见光「网开一面」的材料，让光顺路走，自己却不怎么拦。",s:"维基百科·玻璃",u:"https://zh.wikipedia.org/wiki/玻璃"},
      {q:"为什么钻石那么硬？",a:"钻石里每一个碳原子，都和周围四个碳原子紧紧拉手，组成一张三维立体的共价键大网。键又短又牢，四面八方都连得死死的，想把哪个原子挤开，都得同时掰断好几根强键——这就是钻石硬度天下第一的原因。石墨也是纯碳，可它的原子只是一层一层松松叠着，层与层之间一滑就开，所以软得能写字。同样是碳，一个是最硬的王，一个是最软的笔芯，差别全在原子怎么排队。硬，是因为它们手拉手站得密不透风。",s:"维基百科·钻石",u:"https://zh.wikipedia.org/wiki/钻石"},
      {q:"为什么铅笔芯能在纸上写出字？",a:"铅笔芯不是铅做的，是石墨和黏土压成的。石墨里碳原子一层一层像扑克牌叠着，层与层之间结合得很松，轻轻一蹭就掉一层。写字时笔尖在纸上划动，最上面那层石墨片被纸面的小纤维刮下来，薄薄一层留在纸的纹路里，就成了黑色的字。粘土加得多，笔芯硬、颜色浅；石墨加得多，笔芯软、颜色黑。橡皮之所以能擦掉字，是因为橡胶比纸更爱粘石墨，一蹭就把那层黑粉带走。写字，就是在纸上刮下一层碳。",s:"维基百科·石墨",u:"https://zh.wikipedia.org/wiki/石墨"},
      {q:"为什么急刹车时人会往前冲？",a:"这是牛顿第一定律在「推你」。任何物体都有惯性——原来怎么动，就想接着怎么动。车往前开时，你和车一个速度；车一脚刹停，你的脚被座位和地板带着停了，可你的上半身还想保持原来的速度继续往前跑，于是就往前栽。系安全带，就是把你牢牢按在座位上，让身体和车一起减速；不系安全带，人会一头撞挡风玻璃。坐车时身体跟着晃，本质都是惯性在捣乱：它只想保持原来的状态，谁叫车突然变。",s:"维基百科·惯性",u:"https://zh.wikipedia.org/wiki/惯性"},
      {q:"为什么冬天摸铁比摸木头凉？",a:"铁和木头其实温度一样，是铁「导冷」快。冬天室外的铁和木头都被冻到零度上下，可铁的导热本领强，你手一摸，热量飞快地从你皮肤传进铁里、被带走，你手上热量一丢，神经就喊「凉」；木头导热慢，手上传过去那点热散不开，留在皮肤附近，就觉得没那么冰。夏天摸铁栏杆觉得烫，也是同一个道理——铁把晒热的温度飞快传到你手上。所以铁不是更冷，它只是更勤快地把你的热量「送走」。",s:"维基百科·热传导",u:"https://zh.wikipedia.org/wiki/热传导"},
      {q:"为什么羽绒服那么保暖？",a:"羽绒服暖和，靠的不是羽毛本身，而是羽毛兜住的那层空气。羽绒又轻又蓬，每根小绒毛都能撑开无数 tiny 小口袋，把空气锁在里面。空气是热的不良导体，身体散出来的热被这层「空气棉袄」拦住，跑不出去，外面的冷空气也钻不进来。衣服越蓬，锁住的空气越多，越暖。压扁了、受潮了，羽绒打结、空气跑掉，羽绒服就不暖和了——所以羽绒服要经常拍松、晒一晒。保暖的秘密，其实是把空气缝在了衣服里。",s:"维基百科·羽绒",u:"https://zh.wikipedia.org/wiki/羽绒"},
      {q:"为什么湿衣服挂着会慢慢变干？",a:"衣服上的水，悄悄变成水蒸气跑回空气里了。水分子一直在乱动，水面上那些跑得快的分子，会挣脱别的水分子的拉扯，飞到空气里去，这就是蒸发。温度越高、风越大、阳光越晒，分子跑出去得越快，衣服干得也越快。就算在阴凉处，水也会慢慢蒸发，只是慢一些。湿衣服晾干，不是水「消失」了，是它们变成看不见的水蒸气，被风轻轻带走了。南方梅雨天衣服晾不干，是因为空气里水汽太多，水跑不动。",s:"维基百科·蒸发",u:"https://zh.wikipedia.org/wiki/蒸发"},
      {q:"为什么电风扇吹着觉得凉快？",a:"电风扇并没有把空气吹凉，它在帮你身上的汗蒸发。人皮肤上一直有汗，汗液蒸发时会带走热量，人才觉得凉快。可空气里水汽一多，汗就赖在皮肤上不肯蒸发，闷热难耐。电风扇一吹，风把皮肤附近潮湿的空气吹走，换上干燥的空气，汗蒸发得快了，热量带走得多，你就觉得凉飕飕。温度计放在风扇前吹，读数一点不降——风不降温，它只是帮你「加速散热」。天越潮，风扇越管用，原理就在这。",s:"维基百科·蒸发散热",u:"https://zh.wikipedia.org/wiki/出汗"},
      {q:"为什么冬天脱毛衣会噼啪冒火花？",a:"那是静电在放电。冬天空气干燥，毛衣和衬衣互相摩擦，电子从一件衣服跑到另一件，一件带正电、一件带负电，电荷越攒越多。脱衣服时两件衣服分开，电压瞬间冲到几千甚至上万伏，它们急着找中和，就通过空气「啪」地打个小火花，还带一点蓝紫光。摸金属门把手、碰到别人被电一下，也是同一个道理。空气潮湿时，电荷被水汽导走，攒不起来，所以夏天很少被电。冬天的噼啪声，是静电在小打小闹。",s:"维基百科·静电",u:"https://zh.wikipedia.org/wiki/静电"},
      {q:"为什么小鸟站在高压线上不会触电？",a:"触电要「形成回路」——电流得从一只脚进去、另一只脚出来，才能穿过身体。小鸟两只脚同时踩在同一根电线上，两脚之间电压几乎为零，电流没动力穿过鸟身。可一旦鸟翅、尾巴不小心碰到另一根线或铁塔，两根线之间的高压立刻在鸟身上架起一座桥，瞬间就会被电焦。电工师傅穿的均压服、高压线上的小鸟，道理一样：身体只碰一个电位，电流绕着走；一旦连了两个电位，电流立刻穿堂过。",s:"维基百科·高压电",u:"https://zh.wikipedia.org/wiki/高压电"},
      {q:"为什么油罐车后面要拖一条铁链？",a:"那根铁链是用来「放电」的。油罐车跑起来，油在罐里晃荡、和罐壁摩擦，会产生大量静电，电荷越攒越多，一旦窜出火花，汽油蒸气遇火就炸。铁链一头搭在罐身上，一头拖到地上，把静电时时刻刻导进地里，不让它攒成大火花。飞机加油、油库装卸油，也都有专门的接地夹，道理一样。所以别小看那根锈迹斑斑的铁链，它是油罐车的「保命绳」，一路走一路把静电悄悄放走。",s:"维基百科·静电接地",u:"https://zh.wikipedia.org/wiki/静电"},
      {q:"为什么雪后的世界特别安静？",a:"新下的雪像一块巨大的吸音棉。雪花一片片堆起来，雪层里藏着无数细小的孔隙，是松软多孔的结构。声波钻进这些小孔隙，在里面反复反射、摩擦，能量被一点点消耗掉，传不远了——这就是多孔吸声。所以雪后大街上喇叭声、车声都小了，连脚步都沙沙的。等雪被压实、结冰，孔隙没了，吸音效果大打折扣。走在雪后清晨的公园，那种万籁俱寂的安静，是新雪在偷偷吸走噪音。",s:"维基百科·吸音",u:"https://zh.wikipedia.org/wiki/吸声"},
      {q:"为什么隔着墙也能听到说话声？",a:"声音是靠空气和固体传播的波，还会「绕弯」。声波遇到墙，一部分被挡住，一部分沿着墙和门缝钻过去，还有一部分像水绕石头一样，能绕到障碍物后面——这叫声波的衍射。声音的波长比光长得多，十几厘米到几米，绕一堵矮墙、一扇关着的门轻轻松松。所以卧室里的说话声能飘到客厅，隔壁吵架听得一清二楚。光就做不到这一点——光波长短，绕不过墙，所以你看不见隔壁。声音比光更「会钻空子」。",s:"维基百科·衍射",u:"https://zh.wikipedia.org/wiki/衍射"},
      {q:"为什么水快烧开前壶会嗡嗡响？",a:"那是小气泡在壶底「炸」。壶底先受热，最底下一层水先达到沸点，冒出小气泡；可这时候上层水还没热，气泡一升到较冷的水里，里面的水蒸气立刻遇冷凝结，气泡体积瞬间塌缩、啪地破掉。无数小气泡同时在塌缩破裂，引起水和壶身一起振动，发出嗡嗡声。等整壶水都一百度了，气泡升到水面才破，声音变成哗哗的翻滚声。所以水响不开、开水不响——听到嗡嗡响时，其实还差几分钟才真正滚开。",s:"维基百科·沸腾",u:"https://zh.wikipedia.org/wiki/沸腾"},
      {q:"为什么冬天嘴里会哈出白气？",a:"那不是你呼出的气是白的，而是气里的水蒸气被冷空气冻成了小水珠。你呼出来的气里有水蒸气，看不见；冬天室外很冷，这些热气一碰到冷空气，温度骤降，水蒸气抱成无数细小的小水滴，飘在眼前，就成了一团白雾。夏天冰棍冒白烟、戴眼镜从室外走进屋内起雾，都是同一个道理——水蒸气遇冷液化成小水珠。等走回暖和的屋里，小水珠又蒸发成看不见的水蒸气，白雾就散了。",s:"维基百科·液化",u:"https://zh.wikipedia.org/wiki/液化"},
      {q:"为什么厚玻璃杯倒开水容易炸？",a:"因为玻璃是「脾气倔」的东西，热胀冷缩又不均匀。开水一冲，杯子内壁立刻受热膨胀，可玻璃传热慢，外壁还没热、还是凉的。内壁拼命要胀，外壁却不肯配合，两层之间互相较劲，内应力越攒越大，超过玻璃能扛的极限，「啪」一下就裂开了。厚壁杯比薄壁杯更容易炸，因为内外温差更大。冬天用厚杯子前，先用温水涮一下，让杯壁慢慢预热，内外一起胀，就不会炸了。玻璃杯怕的不是烫，是「只烫一边」。",s:"维基百科·热胀冷缩",u:"https://zh.wikipedia.org/wiki/热胀冷缩"},
      {q:"为什么冬天水管会冻裂？",a:"水结冰时体积会变大，把管子撑裂。绝大多数东西热胀冷缩，可水偏不：四度以下越冷越胀，零度结冰那一刻，体积一下子膨胀约一成。管子里的水封得严严实实，一结冰就没地方可去，只能往管壁上使劲，铁管、PVC管都能被撑裂。这也是为什么冰会浮在水面——同质量的冰体积大了、密度小了。冬天户外的水管要包保温棉，不是怕它冻住，是怕它结冰那一撑，把家给淹了。",s:"维基百科·冰",u:"https://zh.wikipedia.org/wiki/冰"},
      {q:"为什么肥皂泡是彩色的？",a:"肥皂泡是一层极薄的水膜，前后两个表面都能反光。阳光照上去，从前表面和后表面各反射一道光，这两道光叠在一起，有的颜色互相加强、有的互相抵消——这叫薄膜干涉。膜厚一点点，被加强的颜色就换一种；泡泡往下流，膜越变越薄，颜色就跟着一圈圈转。所以肥皂泡表面那层虹彩，不是颜料，是光在两层薄膜之间「自己跟自己打架」打出来的。泡泡越薄越鲜艳，等薄到要破之前，颜色反而变暗。",s:"维基百科·薄膜干涉",u:"https://zh.wikipedia.org/wiki/薄膜干涉"},
      {q:"为什么油会浮在水面上？",a:"因为油比水轻，而且油和水「合不来」。油的密度大约每立方厘米零点九克，水是一克，同体积油更轻，自然浮在上层。更关键的是油和水的分子脾气不合：水分子喜欢拉手抱团，油分子插不进去，两边各过各的，谁也不溶谁——这叫不互溶。所以汤上永远漂着一层金黄的油花，哪怕你使劲搅，静置一会儿它又浮上来。洗洁精之所以能洗碗，就是出动表面活性剂，把油和水勉强牵在一起，随水冲走。",s:"维基百科·油",u:"https://zh.wikipedia.org/wiki/油"},
      {q:"为什么死海里人沉不下去？",a:"死海是个超级咸的盐湖，浮力大得惊人。死海水含盐量超过百分之三十，是普通海水的近十倍，水里溶解了一大堆盐，密度比人体还大。根据浮力原理，人一进去，排开水的重量立刻超过自身体重，被浮力稳稳托在水面上，想沉都沉不下去，还能轻轻松松躺着看报纸。盐分越高，水的浮力越大。这也是为什么在江海里游泳容易淹死、在死海却淹不死——不是你会游，是水太咸，根本不让你沉下去。",s:"维基百科·死海",u:"https://zh.wikipedia.org/wiki/死海"},
      {q:"为什么氦气球能飘上天？",a:"因为氦气比空气轻。空气主要是氮气和氧气，每升大约重一点二九克；氦气轻得多，一升才零点一八克。同样体积下，氦气球受到的空气浮力，大于气球皮加里面氦气的重量，就像水里塞个木塞会浮上来一样，被空气托着往上跑。氢气球更轻，但氢气能烧、会炸，所以现在街上卖的大多是氦气球。可过几天气球会瘪——氦原子太小了，能从橡胶分子的小缝隙里慢慢钻出去，气一漏，气球就蔫下来。",s:"维基百科·氦",u:"https://zh.wikipedia.org/wiki/氦"},
      {q:"为什么吸盘挂钩能牢牢贴在墙上？",a:"靠的是大气压。把吸盘往墙上一按，吸盘和墙面之间的空气被挤出去，里面几乎成了真空，可外面的大气压还在拼命往墙上压——每平方厘米约一公斤的压力，把吸盘死死按在墙上。只要吸盘不漏气，外面这股大力气就一直帮你挂钥匙、挂毛巾。吸盘之所以怕油污和缝隙，是因为一旦漏气，空气钻回吸盘里面，内外压力抵消，挂钩立刻掉。所以贴之前要把墙面擦干净、按实，让那层「真空」别破。",s:"维基百科·大气压",u:"https://zh.wikipedia.org/wiki/大气压"},
      {q:"为什么飞机能飞上天？",a:"飞机靠机翼的形状产生升力。机翼上面是弯弯的弧线、下面较平，空气流过机翼时，上面的路长、走得快，下面的路短、走得慢。流速快的地方压强小，流速慢的地方压强大，于是下面的空气就把机翼往上托——这就是伯努利原理。加上机头仰起一个角度，空气迎面拍在机翼下表面，也给了一股向上的力。发动机负责把飞机推到足够快的速度，速度越快，升力越大。飞机不是被「吸」上去的，是被空气从下面「抬」上去的。",s:"维基百科·升力",u:"https://zh.wikipedia.org/wiki/升力"},
      {q:"为什么一只小鸟能把飞机撞坏？",a:"因为相对速度太快，小鸟也能变成炮弹。飞机起飞降落时速度也有每秒七八十米，鸟迎面飞过来，相对速度就是两者相加。动能和速度平方成正比，速度越快，撞击能量暴涨。一只一斤重的鸟，撞上时速三百公里的飞机，冲击力相当于被一颗炮弹砸中。轻则挡风玻璃碎裂，重则撞坏发动机、机翼。所以机场周围天天在赶鸟、驱鸟，不是怕鸟被撞，是怕鸟把飞机撞下来。小鸟虽小，在高速面前也成了危险物。",s:"维基百科·鸟击",u:"https://zh.wikipedia.org/wiki/鸟击"},
      {q:"为什么鞋底要有花纹？",a:"花纹是为了在湿滑地面上「咬得住」。鞋底光溜溜的，踩在有水的地砖上，水膜把脚和地面隔开，摩擦力大减，一踩就滑。鞋底刻上花纹，走路时花纹把水挤到凹槽里，让橡胶直接贴住地面，摩擦力一下就上来了。不同花纹有不同脾气：深沟适合户外泥地，细纹路适合室内防滑。鞋底磨平了为什么容易摔？就是排水纹路没了，水膜又垫了回来。一双新鞋的防滑力，大半是靠鞋底那些花纹纹路在干活。",s:"维基百科·摩擦",u:"https://zh.wikipedia.org/wiki/摩擦力"},
      {q:"为什么坐过山车不会掉下来？",a:"靠的是圆周运动时的离心力。过山车冲到最高处后倒着往下俯冲，车子和人其实有沿直线飞出去的趋势，可轨道把它死死按住，于是人被一股向外甩的力紧紧压在座位上——哪怕倒悬过来，这股力也比重力还大，你只会觉得被压在椅子上，而不是往下掉。安全带和压杆是双重保险，真正「不让你掉」的，是足够快的速度和轨道配合产生的离心力。速度越够，压得越牢；速度不够，才真有危险。",s:"维基百科·离心力",u:"https://zh.wikipedia.org/wiki/离心力"},
      {q:"为什么潜水艇能沉下去又浮上来？",a:"潜水艇肚子里有几个巨大的压载水舱。要下潜时，打开阀门往水舱里灌海水，潜艇变重，总重量超过浮力，就缓缓沉下去；要上浮时，用压缩空气把水舱里的水吹出去，艇身变轻，浮力又大于重力，就浮上来。整个过程就是在调「轻重」——和鱼靠鱼鳔充气排气上浮下沉是一个道理。潜水艇能悬在某一深度不动，是因为它把自身重量调到和浮力刚刚好相等。这艘铁鱼，靠的就是几舱水在身上进进出出。",s:"维基百科·潜艇",u:"https://zh.wikipedia.org/wiki/潜艇"},
      {q:"为什么降落伞打开后下落变慢？",a:"降落伞是一张巨大的空气阻力网。人从空中落下，越坠越快，空气阻力也跟着变大；伞一开，几十平米的布兜住一大团空气，阻力猛地翻了几十倍，很快和重力抵消，下落速度一下从每秒几十米降到每秒五六米，像一片树叶那样稳稳飘下来。伞布越大、兜的空气越多，减速越好；但太大又会被风吹得乱窜。伞兵落地的速度，和从两米多高的跳下来差不多，蹲一蹲就能卸力。伞不神奇，它是把空气当成了「空气刹车」。",s:"维基百科·降落伞",u:"https://zh.wikipedia.org/wiki/降落伞"},
      {q:"为什么汽车尾灯是红色的？",a:"红色在可见光里波长最长、散射最弱，能传得最远。雾天、黄昏、大雨里，红光穿过空气和水滴的本领比别的颜色强，远远就能被后车看到。而且红色在人眼里天生就是「停、危险」的信号，看到红光本能就会警觉。所以尾灯、刹车灯、灭火器、消防车全用红色——不是大家商量好要喜庆，是红色真的最容易在远处被看见。刹车灯一亮，后车百米外就知道你要减速，这是用波长换安全。",s:"维基百科·汽车灯",u:"https://zh.wikipedia.org/wiki/汽车灯"},
      {q:"为什么光纤能一秒钟传那么多数据？",a:"光在玻璃丝里靠「全反射」跑长途。光纤是头发丝粗的透明玻璃丝，光从一头进去，在丝的内壁上一次次全反射，像在两面镜子之间弹来弹去，一点不漏地跑到千里之外。光的频率极高，一根光纤能同时承载上百万路电话、几千套电视，容量大得吓人。光速又快，信号几乎没有延迟。所以越洋海底光缆、家里的千兆宽带，背后都是一束束光在透明玻璃丝里疯狂弹跳。我们上网、打视频电话，其实是光在玻璃管里跑马拉松。",s:"维基百科·光纤",u:"https://zh.wikipedia.org/wiki/光纤"},
      {q:"为什么LED灯比白炽灯省电？",a:"白炽灯是把灯丝烧到两千度才亮，九成多的电全变成热浪费掉，只有不到一成变成光。LED不一样：它是半导体里电子一跳「台阶」，直接把电能变成光，发热极少，同样亮度下耗电只有白炽灯的一成左右，寿命还长几十倍。所以家里换个LED灯泡，电费一年能省不少，灯泡也五六年不用换。LED不是更亮，是它「不把电烧成热」，省下的电全变成了光。照明的历史，是从「烧红丝」一路走到「半导体发光」。",s:"维基百科·发光二极管",u:"https://zh.wikipedia.org/wiki/发光二极管"},
      {q:"为什么霓虹灯能发出彩色的光？",a:"霓虹灯玻璃管里充了不同的稀有气体。通电后，电子在管里跑来跑去，撞在气体原子上，把原子里的电子踢到高能状态；电子回落时，就把多余能量以光的形式放出来——每种气体放的光颜色不同：氖气发红橙光，氩气发蓝光，氦气粉紫光，再在管壁涂不同荧光粉，能调出几十种颜色。所以霓虹灯的颜色不是颜料，是不同气体通电后自己发的光。晚上街上那些花里胡哨的招牌，每一根管子里都装着一种会发光的稀有气体。",s:"维基百科·霓虹灯",u:"https://zh.wikipedia.org/wiki/霓虹灯"},
      {q:"为什么荧光棒一掰就亮？",a:"它靠的是两种化学液体碰面。荧光棒里有个小玻璃管，外面装着一种液体，管里装着另一种。一掰，玻璃管碎了，两种液体混合，发生化学反应，把能量传给荧光染料，染料再把能量以光的形式放出来——这叫化学发光。整个过程不发热、不耗电，亮度够舞会用几小时。颜色由加的染料决定：绿的、粉的、蓝的随你调。想让它再亮一点？泡热水里反应加速；想让它亮久一点？放冰箱里减速。荧光棒不是发光，是两种液体在悄悄「放电」。",s:"维基百科·化学发光",u:"https://zh.wikipedia.org/wiki/化学发光"},
      {q:"为什么太阳能板能发电？",a:"靠的是光伏效应。太阳能板里一片片硅片，被做成特殊的半导体结构：阳光照上去，光子撞进硅里，把电子撞出来，电子在硅片内部的电场驱动下定向流动，就成了直流电。一块板由几十个小硅电池串联起来，电压升到十几伏，再通过逆变器变成家用的交流电。阳光越强、光越足，发电越多；阴天也能发，只是少些。太阳能板不是「晒热了发电」，是光子直接把硅里的电子撞出来，变成电流。",s:"维基百科·太阳能电池",u:"https://zh.wikipedia.org/wiki/太阳能电池"},
      {q:"为什么电磁炉上放铝锅煮不熟饭？",a:"电磁炉靠电磁感应在铁锅里自己生热。炉子里有一圈线圈，通上高频交流电，产生飞速变化的磁场；磁场穿过锅底，在铁锅里感应出无数小涡流，铁电阻大，电流一跑就发热——锅自己发热，再传给食物。可铝、铜、陶瓷不是铁磁性材料，磁场穿过去几乎不感应电流，锅根本不发热，放上去跟没开一样。所以电磁炉专用锅，必须是铁的或不锈钢的。它不是炉盘发热，是磁场让铁锅自己变成了发热体。",s:"维基百科·电磁炉",u:"https://zh.wikipedia.org/wiki/电磁炉"},
      {q:"为什么三脚插头有一只脚更长？",a:"那只最长的脚是接地脚。它比另外两只长一点，插插头时，地线先接通；拔插头时，地线最后断开。这样在整个用电过程中，电器外壳始终通过地线连到大地。万一电器内部漏电，外壳带电，电流会顺着地线直接跑进大地，而不是穿过你的身体——人摸上去也不会触电。所以冰箱、洗衣机、电热水器都必须用三脚插头，绝不能把地线脚掰断凑合用。那只长脚不是设计失误，是它在抢时间：先接地，再通电。",s:"维基百科·接地",u:"https://zh.wikipedia.org/wiki/接地"},
      {q:"为什么高压线要架那么高？",a:"一是安全，二是减少漏电。高压线动辄几万、几十万伏，离人离车太近，空气都可能被电击穿，酿成事故。架在几十米高的铁塔上，人和动物够不着，风吹树叶也碰不到。另外，高压线下会形成电场，离地面太近，电流会通过空气和地面慢慢漏掉，越高压越要离地远。铁塔本身也是钢结构，为什么工人敢在上面走？因为他们整个人站在同一电位上，没有电位差，就没有电流穿过身体。高压电不可怕，可怕的是同时碰到两个电位。",s:"维基百科·高压输电",u:"https://zh.wikipedia.org/wiki/高压电"},
      {q:"为什么避雷针能保护大楼？",a:"避雷针不是「避雷」，是「引雷」。楼顶那根尖金属杆，用粗铜线一路连到地下深处。雷电本来劈下来时东找西找，一看到这根又高又尖的金属杆，就优先拿它当目标——因为尖端容易放电。雷被引到杆上，顺着铜线直接导入大地，大楼和人就没事了。所以避雷针不是把雷挡住，是主动把雷「骗」过来，再悄悄送走。高层住宅楼、电视塔顶上那一根根小针，都是大地伸出的「接雷之手」。",s:"维基百科·避雷针",u:"https://zh.wikipedia.org/wiki/避雷针"},
      {q:"为什么冬天舌头舔铁门会被粘住？",a:"因为铁太冷，把你舌头上的水瞬间冻成了冰。冬天室外铁门温度远低于零度，你湿舌头一贴上去，舌面上那层薄薄的唾液被铁门瞬间吸热，立刻结成一层薄冰，舌头就和铁门「焊」在了一起。这不是铁门有胶水，是它导热太快，把热量一秒吸光，水来不及反应就冻住了。冬天别用湿手摸户外的金属栏杆，也是同一个道理。被粘住别硬撕，用温水慢慢浇在连接处，冰化了自然松开。",s:"维基百科·热传导",u:"https://zh.wikipedia.org/wiki/热传导"},
      {q:"为什么冰块放进饮料里杯壁会「出汗」？",a:"那是空气里的水蒸气在杯壁上液化。杯子里加了冰块，杯壁变得冰凉；周围空气里本来就有水蒸气，一碰到冷杯壁，温度骤降，水蒸气抱成小水珠附在外面——和从冰箱拿出来的饮料瓶外壁挂满水珠是同一回事。水珠越聚越大，会顺着杯子流到桌上。这不是杯子漏水，是空气里的水分被冷杯子「吸」了出来。夏天潮湿天特别明显，因为空气里水汽多。想让桌子不湿，给杯子套个杯垫就行。",s:"维基百科·液化",u:"https://zh.wikipedia.org/wiki/液化"},
      {q:"为什么易拉罐大多用铝做？",a:"铝轻、延展性好、不锈，还能无限回收。铝很轻，同样容量的罐子比铁皮罐轻一半，运输成本低；铝又软又韧，薄薄一层就能拉成圆筒，封口一压就密封；表面还会自己长一层致密氧化膜，不生锈。最妙的是铝回收重炼只需要原生产百分之五的电，所以易拉罐回收再利用非常划算。一瓶可乐能拉环即开，靠的也是铝那点恰到好处的软硬度。铝罐看着不起眼，它是材料、成本、回收三者平衡出来的最优解。",s:"维基百科·铝",u:"https://zh.wikipedia.org/wiki/铝"},
      {q:"为什么不粘锅煎蛋不粘？",a:"锅内壁涂了一层特氟龙。特氟龙是一种神奇的塑料，表面张力极低，水和油都铺不开，食物更是沾不住——鸡蛋倒上去，滑来滑去，轻轻一铲就整块下来。它化学性质稳定，酸碱都不怕，所以能扛住炒菜。但特氟龙怕刮：金属铲、钢丝球会把涂层划花，露出下面的铝底，锅就开始粘了。所以不粘锅要用木铲、硅胶铲，不能空烧太烫。那层不粘的黑色薄膜，是它吃饭的本钱，得省着用。",s:"维基百科·特氟龙",u:"https://zh.wikipedia.org/wiki/聚四氟乙烯"},
      {q:"为什么拉链能紧紧扣住？",a:"拉链两边有一排小牙齿，每颗牙都是楔形的。拉头往前一推，把两边的牙一颗一颗挤进对方牙缝里；楔形结构让它们越拉越紧，想扯开都难。拉头往后一拉，又把这些牙一颗一颗掰开。几千颗小牙配合好，一条拉链就能扛住几百斤拉力。为什么拉链会坏？通常是某颗牙歪了、磨平了，挤不进去，后面跟着全部分开。小小一条拉链，是人类设计过最精巧的小机械之一，从军装到行李箱都靠它。",s:"维基百科·拉链",u:"https://zh.wikipedia.org/wiki/拉链"},
      {q:"为什么橡皮擦能擦掉铅笔字？",a:"因为橡皮比纸更「粘」石墨。铅笔字是一层薄薄的石墨粉嵌在纸纤维里。橡皮摩擦纸面时，橡胶分子会把那层石墨粉粘起来、带走，就像把黑粉从纤维里「拔」出来。越软的橡皮粘石墨越厉害，擦得越干净；太硬的橡皮只会磨破纸。为什么钢笔字擦不掉？因为钢笔墨水渗进了纸纤维内部，不是表面一层粉，橡皮够不着。铅笔字是浮在表面的灰，钢笔字是沁进纸里的墨，一个好擦，一个擦不掉。",s:"维基百科·橡皮",u:"https://zh.wikipedia.org/wiki/橡皮擦"},
      {q:"为什么玻璃刀能划开玻璃？",a:"因为刀头上镶的是真钻石。玻璃再硬，也硬不过金刚石。金刚石是自然界最硬的物质，硬度是玻璃的好几倍。玻璃刀头部那颗小钻石，在玻璃表面轻轻一划，划出一道细细的裂纹；然后沿着裂纹一掰，玻璃就整整齐齐断开。划玻璃不是「切开」，是先划一道痕，再让玻璃顺着这条痕裂开。没有钻石，用碳化钨轮也能凑合，道理一样：用更硬的东西在玻璃上刻一道印。所以玻璃工划玻璃，讲究的是那一下「准」。",s:"维基百科·金刚石",u:"https://zh.wikipedia.org/wiki/钻石"},
      {q:"为什么防弹玻璃打不穿？",a:"它不是一块厚玻璃，而是好几层夹在一起。普通玻璃和坚韧的透明塑料（如PVB薄膜）一层压一层，子弹打上去，外层玻璃被击碎，可中间的塑料膜把碎片和子弹一起粘住，能量被层层消耗，子弹穿不透下一层。所以防弹玻璃被打后会坑坑洼洼、白花花一片，可它不会碎成渣，也不会让子弹穿堂过。银行柜台、运钞车的玻璃都是这种夹层结构。它靠的不是「硬」，是「层层卸力」。",s:"维基百科·防弹玻璃",u:"https://zh.wikipedia.org/wiki/防弹玻璃"},
      {q:"为什么汽车玻璃碎了不扎人？",a:"汽车侧窗和后窗用的是钢化玻璃。普通玻璃碎了成尖锐长片，划人；钢化玻璃是把普通玻璃加热到快软化再骤然吹风冷却，表面一层先收缩变硬，内部后冷，结果内部往外撑、表面往里拉，形成一层预应力。一旦被撞破，整块玻璃立刻碎成无数黄豆大的小颗粒，没有锋利尖角，扎到人也只是擦伤。所以你看汽车玻璃被砸后一地小碎粒，不是偷工减料，是它故意设计成这样——碎成颗粒反而更安全。",s:"维基百科·钢化玻璃",u:"https://zh.wikipedia.org/wiki/钢化玻璃"},
      {q:"为什么轮胎上要有花纹？",a:"花纹是用来排水和抓地的。光面轮胎在干地抓地最强，可一下雨，路面有一层水膜，轮胎和地面之间被水垫住，摩擦力骤降，车就像滑冰一样失控——这叫水滑。轮胎花纹的沟槽，就是把轮胎底下的水迅速挤出去，让橡胶紧紧咬住地面。沟槽越深、方向越对，雨天越稳。轮胎花纹磨到和胎面齐平（磨损标记露出来），就该换了——再开雨天很危险。轮胎黑黢黢、沟壑纵横，不是为了好看，是为了在雨天把水排走。",s:"维基百科·轮胎",u:"https://zh.wikipedia.org/wiki/轮胎"},
      {q:"为什么高铁轨道铺得那么平？",a:"因为高铁速度太快，一点小颠簸都被放大。普通火车时速一百多公里，轨道有点高低起伏没关系；高铁三百公里一小时，车身飞过铁轨接缝，每一处不平都会被弹起，旅客会觉得颠簸，甚至影响安全。所以高铁用无砟轨道——把铁轨直接铺在一整块混凝土板上，不用碎石子，平整度极高，轨道几乎像直尺一样直。再加上无缝钢轨，把一根根铁轨焊成长长一根，接缝几乎消失。坐着高铁平稳得能立硬币，靠的就是这条被铺得像镜面一样直的轨道。",s:"维基百科·高速铁路",u:"https://zh.wikipedia.org/wiki/高速铁路"},
      {q:"为什么月亮好像总跟着人走？",a:"这是视错觉在作怪。月亮离我们三十八万公里远，你走一两百米，相对月亮的位置几乎没变——就像你坐在车里看远处的山，山好像跟着车慢慢挪；而路边的树唰唰往后退。大脑拿近处的景物当参照物，觉得月亮相对这些参照物几乎没动，于是错觉它在跟着自己走。不信你走一段路，看看月亮是不是还在原来那栋楼的方向？它根本没动，是你在动。月亮跟人走，和太阳跟人走、远处云跟车走，是同一个道理：太遥远的东西，我们的小位移算不了什么。",s:"维基百科·视错觉",u:"https://zh.wikipedia.org/wiki/月亮错觉"},
      {q:"为什么太阳和月亮在地平线时看起来特别大？",a:"这是大脑在「骗」你。月亮刚升起或快落下时，贴着楼房、树梢，和熟悉的地面景物比在一起，大脑觉得它离得远、应该更大；等它升到头顶，四周空空荡荡没有参照物，大脑又觉得它小。其实月亮在视网膜上的投影，大小根本没变——你用手比个小圆圈套住它，从地平线套到头顶，它始终那么大。这叫月亮错觉。同理，早上的太阳看着比中午大，也是大脑在比来比去。拍照拍出来，太阳和月亮从头到尾都是同一个尺寸。",s:"维基百科·月亮错觉",u:"https://zh.wikipedia.org/wiki/月亮错觉"},
      {q:"为什么GPS能知道我在哪？",a:"靠头顶好几颗卫星一起「报数」。天上绕着二十多颗GPS卫星，每颗都在不停地发自己的位置和精确时间。你手机收到至少四颗卫星的信号，根据信号到达的时间差，算出你和每颗卫星的距离；知道到四颗卫星的距离，就能在三维空间里把你的交点位置算出来——这就是三角定位。美国的GPS、中国的北斗、欧洲的伽利略，原理都一样。所以手机没信号、被高楼挡住卫星时，导航就会飘。你在地图上那一个小蓝点，是头顶几颗卫星同时给你量出来的。",s:"维基百科·GPS",u:"https://zh.wikipedia.org/wiki/全球定位系统"},
      {q:"为什么二维码比条形码能装更多信息？",a:"条形码只在一个方向上存数据，而二维码是横竖两个方向都存。它像一张小矩阵：黑白小方块按规律排列，横着数一遍、竖着数一遍，还能加定位角和纠错码。同样大小的面积，二维码装的信息是条形码的几十倍——网址、联系方式、Wi-Fi密码都能塞进去。就算缺角、被弄脏一点，靠纠错码也能还原出来。所以手机扫一扫，一下跳转到网页，背后是那堆小方块把网址编进了二维平面。一维码只够报个价格，二维码能装下一整个网页。",s:"维基百科·二维码",u:"https://zh.wikipedia.org/wiki/QR码"},
      {q:"为什么用吸管喝饮料，吸管一端要做成斜口？",a:"斜口是为了好扎破封膜，也为了不堵住。易拉罐、饮料盒顶部有一层铝箔或封口膜，平口吸管戳上去容易打滑、戳不破；斜口像个小刀刃，一用力就扎穿。喝的时候，斜口即使贴在杯底或冰块上，也留着一条缝进饮料，不会被堵死。直平口贴底就吸不上来了。小小一个切口，藏着「易插入、防堵塞」两个小心思。下次拆吸管时，留意那一头尖尖的斜口，它是专门负责破膜和留缝的。",s:"维基百科·吸管",u:"https://zh.wikipedia.org/wiki/吸管"},
      {q:"为什么纸杯内壁不怕水？",a:"纸杯外面是纸，里面却贴了一层薄膜。这层膜通常是聚乙烯塑料，像给杯子里穿了件雨衣，水和饮料根本碰不到纸，自然不会漏、不会软。装热水时，这层膜还能把水和纸隔开，让你握着不烫手。可正因为多了一层塑料膜，纸杯回收起来比纯纸麻烦——要把纸和塑料分开。所以纸杯虽方便，用完最好冲一冲再丢。它不漏水的秘密，不在纸，在那层薄薄的塑料内衣。",s:"维基百科·纸杯",u:"https://zh.wikipedia.org/wiki/纸杯"},
      {q:"为什么近视眼镜是凹透镜，老花镜是凸透镜？",a:"眼睛的晶状体像个透镜，帮你把光线聚焦在视网膜上。近视的人晶状体太鼓，光聚焦在视网膜前面，看远模糊——戴凹透镜先把光发散一下，焦点后移到视网膜上，就清楚了。老花、远视则相反，晶状体调节不动，光聚在视网膜后面——戴凸透镜先把光会聚一点，焦点前移到视网膜上，近处就看清了。所以近视镜中间薄边上厚，老花镜中间厚边上薄。两种眼镜形状相反，因为它们要把焦点往相反方向拉。",s:"维基百科·凹透镜",u:"https://zh.wikipedia.org/wiki/透镜"},
      {q:"为什么用肥皂洗手要搓二十秒才干净？",a:"细菌和病毒很多藏在皮肤油脂和污垢里，光用水冲不掉。肥皂分子一头扎进油、一头朝水，把油脂和细菌一起包成小油滴，被水冲走。可这需要时间：手心、指缝、指甲缝都得搓到，让肥皂分子有机会碰到每一处油污和细菌。二十秒差不多是一遍《生日快乐》歌的时间，刚好够覆盖所有部位。洗太快等于没洗——泡沫刚抹上就冲，细菌还赖在油里。所以七步洗手法、唱完两遍歌，不是形式主义，是给肥皂留够干活时间。",s:"维基百科·洗手",u:"https://zh.wikipedia.org/wiki/洗手"}
    ],
    "历史":[
      {q:"为什么古人见面要「作揖」而不是握手？",a:"作揖是中国人流传了三千多年的见面礼。拱手、抱拳、弯腰，双手抱在胸前微微前倾，表示敬意。古人选择作揖而不是握手，除了礼仪讲究，还有一个很实在的原因：拱手时双手互握、不接触对方，意味着「我手里没有武器，也没有敌意」，是一种安全的问候方式，尤其适合陌生人相见。作揖的姿势还有讲究：男子一般左手抱右手为吉拜，丧事则相反。后来生活节奏快了，握手、点头逐渐流行，但作揖没有消失——过年时互道「新年好」顺手作个揖，依然是很多人喜欢的年味。",s:"维基百科·拱手礼",u:"https://zh.wikipedia.org/wiki/拱手礼"},
      {q:"为什么皇帝的诏令叫「圣旨」？",a:"「圣」是古人对皇帝和圣人的尊称，「旨」本义是「意思」，合起来就是「皇帝的意思」。但「圣旨」成为固定叫法，是明清两代的事。明朝起，皇帝的重要诏令有了统一形制：用丝绸织成，两端有银色龙纹轴头，开头一句固定的「奉天承运皇帝，诏曰」——意思是「承奉上天之意、顺应时运的皇帝，宣告如下」。圣旨的材质还分等级：五彩织锦给一品大员，素色的给低品官员。一张圣旨，既是命令文书，也是一件工艺考究的皇家织锦。",s:"维基百科·圣旨",u:"https://zh.wikipedia.org/wiki/圣旨"},
      {q:"为什么古代银子叫「雪花银」？",a:"因为成色足的银锭，洁白如雪、光可鉴人。古代银子常用「成色」衡量纯度，含银量高、杂质少的银子呈银白色，光泽温润，像刚落下的雪花，所以人们叫它「雪花银」；成色差的银子发灰发黄，价格也大打折扣。古代钱庄收银子，要看成色、称重量，还要「听音」——好银子掷地有声、清脆悦耳，掺了铅锡的银子声音发闷。民间那句「三年清知府，十万雪花银」，讽刺的是贪官，但「雪花银」三个字，也侧面说明了好银子在当时就是硬通货和财富的象征。",s:"维基百科·白银",u:"https://zh.wikipedia.org/wiki/白银"},
      {q:"为什么秦朝要修那么宽的「驰道」？",a:"秦始皇统一六国后，下令以首都咸阳为中心，向全国修了多条驰道，宽度要求达到五十步（约七十米），相当于双向八车道还要宽。修这么宽，一是军事需要：大军和粮草要快速调动，路宽才跑得开；二是政令畅通：皇帝的诏令要靠马车驿站迅速送达各地，路修好了，车马跑得快，中央的统治才能延伸到每个郡县。驰道中间是专供皇帝车驾的御道，两旁是普通行人的便道，规格森严。两千多年前就有了这种「国家级高速公路网」，秦始皇的基建手笔可见一斑。",s:"维基百科·秦直道",u:"https://zh.wikipedia.org/wiki/秦直道"},
      {q:"为什么古代官员要「五更上朝」？",a:"因为上朝是古代官员每天最重要的事，而朝会开始得极早。明清时皇帝通常在卯时（早上五点到七点）升殿，住在城外的官员必须摸黑起床，赶在五更天（凌晨三点到五点）之前出门，所以叫「五更上朝」。冬天凌晨寒风刺骨，官员们提着灯笼挤在宫门外候朝，是常态。为了不迟到，朝官们想尽办法：有的提前住进宫门附近的会馆，有的靠固定叫醒的服务。唐代诗人白居易有诗「鼓动出新昌，鸡鸣赴建章」，写的就是官员闻鸡而起、赶去上朝的辛苦。当官不容易，光早起这一关就够喝一壶。",s:"维基百科·朝会",u:"https://zh.wikipedia.org/wiki/朝会"},
      {q:"为什么皇帝的龙袍是黄色的？",a:"黄色成为皇家专属，跟五行学说有关。五行里中央属土，土为黄色，代表方位之中心和最高权力，所以从隋唐起，黄色逐渐成了皇帝的御用色，尤其是明黄。唐代明确规定士庶不得穿黄色衣，宋元明清一路沿袭，「黄袍加身」就成了登基称帝的代名词。有意思的是，更早的皇帝礼服其实以黑红为主——秦尚黑、汉尚赤，黄色是慢慢「升格」成御用色的。一件龙袍的颜色，背后藏着一整套关于方位和权力的宇宙观。",s:"维基百科·服饰",u:"https://zh.wikipedia.org/wiki/中国服饰"},
      {q:"为什么古人打仗要「击鼓进军、鸣金收兵」？",a:"因为两种声音各司其职。鼓声低沉浑厚、传得远，能振奋士气，冲锋时战鼓一响，士兵跟着节奏往前冲；「金」指铜锣或钲，声音清脆尖利、穿透力强，收兵时鸣金，号令队伍撤退、停止追击，防止阵型散掉。战场上人喊马嘶、万箭齐发，只有高亢的金属声才压得住场，低沉鼓声才能传遍全军。所以才有「一鼓作气」「鸣金收兵」这些成语。一套鼓锣，就是古代战场的「交通信号灯」——鼓是油门，金是刹车。",s:"维基百科·钲",u:"https://zh.wikipedia.org/wiki/钲"},
      {q:"为什么古人贬官叫「左迁」？",a:"这跟古代的尊卑方位有关。秦汉时期以右为尊，右丞相的位置高于左丞相，官职被降级，人往「左」挪，就叫「左迁」；升官则叫「右迁」。这个习惯一直延续到唐宋，李白写「闻王昌龄左迁龙标遥有此寄」，就是得知好友被贬去龙标，心疼又无奈。不过汉代以前也有过以左为尊的时候，比如「左贤王」比「右贤王」尊贵。左右到底谁尊，古代并非一成不变。一个「左」字，藏着古代官场的座次哲学。",s:"维基百科·左迁",u:"https://zh.wikipedia.org/wiki/左迁"},
      {q:"长城为什么不是一道孤零零的墙",a:"因为长城根本不是一道墙，而是一整套防御网。它由城墙、敌楼、关隘、烽火台、屯兵城连缀而成，依山就势、乘高据险。墙本身是挡住骑兵冲锋的障碍，敌楼里驻兵、放哨、存粮，烽火台一站接一站传警报，关隘则是进出的咽喉。游牧民族骑兵再厉害，也不能轻易越过这一道道山梁上的工事。所以修长城不是「砌一堵墙」，而是在北方山地搭起一张巨大的防御网络，让中原王朝的边防有了依托。",s:"维基百科·长城",u:"https://zh.wikipedia.org/wiki/长城"},
      {q:"为什么兵马俑能做到「千人千面」",a:"因为每一尊陶俑都是单独塑造的。工匠先做出大致的躯干和四肢，再一件件雕刻面部、发髻、铠甲和表情，相当于用陶土「捏」出一支真人军队。头发怎么梳、胡须什么样、眼皮单双、嘴角上扬还是下垂，各有各的模样。这种做法既费工，又能威慑后人——秦始皇要带到地下的，是一支真真切切、有鼻子有眼的卫队。如今考古学家甚至能从陶俑的脸型、发式上看出不同地区工匠的风格，难怪被称为「世界第八大奇迹」。",s:"维基百科·兵马俑",u:"https://zh.wikipedia.org/wiki/兵马俑"},
      {q:"都江堰为什么能造福两千年",a:"因为它修得特别「聪明」，不靠大坝硬堵。战国时李冰父子在岷江中游劈出一条鱼嘴分水堤，把江水分成内江、外江：外江排洪，内江引水灌溉；再用飞沙堰把多余的水和泥沙甩出去，最后通过宝瓶口把水引进成都平原。整个工程顺着山势水势走，水大了自动溢走，水小了自动多进，几乎不用人管。成都平原从此「水旱从人，不知饥馑」，成了天府之国。两千年后的今天，它还在灌溉着千万亩良田，是全世界迄今为止年代最久、仍在使用的无坝引水工程。",s:"维基百科·都江堰",u:"https://zh.wikipedia.org/wiki/都江堰"},
      {q:"科举考试为什么能在中国沿用一千三百年",a:"因为它解决了「谁来当官」这个大难题。在科举之前，魏晋南北朝选官看家世，出身寒门的人再有才也上不去；隋唐开创分科考试，不管你爹是谁，只要书读得好、考得中，就能做官。这等于给天下读书人开了一扇公平的门，也让皇帝有机会从全国选拔人才，而不是被几大家族把持。考试内容从诗词歌赋到经义策论不断调整，但「以考试取官」的核心一直没变，直到清末才被废除。它不仅影响中国，还传到了朝鲜、越南，后来西方的文官考试制度也参考了它。",s:"维基百科·科举",u:"https://zh.wikipedia.org/wiki/科举"},
      {q:"为什么古人要避讳皇帝和长辈的名字",a:"因为「名字」在古代是一种不能随便碰的东西。对皇帝的名字要避，写文章、说话时遇到相同的字要改成同义字或缺笔；对父母祖父母的名字也要避，以示尊敬。这一套规矩叫「避讳」。比如汉文帝叫刘恒，「恒山」就被改成「常山」；唐太宗叫李世民，「民部」改成「户部」。这套规矩看似繁琐，背后其实是古人「为尊者讳、为亲者讳」的伦理秩序——连名字都不能直呼，才显得你心里有长辈、有君主。今天我们偶尔还会听到「免贵姓」「不敢直称其名」，都是这种老规矩的影子。",s:"维基百科·避讳",u:"https://zh.wikipedia.org/wiki/避讳"},
      {q:"为什么皇帝从秦始皇开始自称「朕」",a:"「朕」本来人人都能用，先秦时期就是个普通的「我」字，屈原在《离骚》里都写过「朕皇考曰伯庸」。秦始皇统一六国后，觉得「寡人」「孤」这些称呼配不上自己的功绩，就规定「朕」只能皇帝一人用，从此成了皇帝的专属自称。这个字的好处是简洁、庄重，又不像「寡人」那样透着孤家寡人的凄凉。从秦到清，两千年间「朕」字几乎被皇帝一人垄断，老百姓谁要是敢自称「朕」，那可是杀头的大罪。一个字被皇帝独占，本身就是权力的象征。",s:"维基百科·朕",u:"https://zh.wikipedia.org/wiki/朕"},
      {q:"为什么管皇帝叫「万岁」",a:"「万岁」本来是古人欢呼时的一句口号，类似今天喊「好啊」「太棒了」，打仗赢了、宴会上一高兴，群臣就山呼「万岁」。汉武帝、唐玄宗都特别爱听这一声，后来「万岁」渐渐成了对皇帝的专属祝福——希望皇帝万寿无疆。再往后，不仅当面要喊「万岁、万岁、万万岁」，连奏折里、匾额上都要写。百姓私下里谁要是随便喊「万岁」，被听见了可能被当成谋逆。于是一句普通的欢呼，慢慢变成了皇帝一个人的「生日祝福语」。",s:"维基百科·万岁",u:"https://zh.wikipedia.org/wiki/万岁"},
      {q:"北京故宫为什么叫「紫禁城」",a:"这名字来自天上的星象。古人把天上的恒星分成三垣、二十八宿，其中紫微垣位于正北天空的正中，被认为是天帝居住的地方，叫「紫宫」。地上的皇帝自称天子，他住的地方自然也要对标天上的紫宫，加上皇宫门禁森严、寻常人等根本进不来，是一座「禁城」，两者合一，就叫「紫禁城」。直到1925年故宫博物院成立，才改叫「故宫」，意思是「旧日的皇宫」。所以今天我们说的故宫，在明清两代，是老百姓连远远看一眼都可能掉脑袋的地方。",s:"维基百科·紫禁城",u:"https://zh.wikipedia.org/wiki/紫禁城"},
      {q:"「明修栈道，暗度陈仓」是怎么回事",a:"这是韩信给刘邦出的主意。刘邦被项羽封到汉中，去的路上把栈道烧了，表示自己再也不回东边，麻痹项羽。等时机成熟，韩信派人大张旗鼓地修栈道，摆出要从旧路打回去的架势，守将章邯一看，把主力全摆在栈道口等着；哪知韩信暗中率主力绕道陈仓（今陕西宝鸡），突然杀出，章邯猝不及防，刘邦一举拿下关中。这一明一暗，成了后世「声东击西」的代名词——明面上的动作是给你看的，真正的杀招在另一条路上。",s:"维基百科·韩信",u:"https://zh.wikipedia.org/wiki/韩信"},
      {q:"越王勾践为什么要「卧薪尝胆」",a:"因为他打了败仗，被吴王夫差围困在会稽，差点亡国。勾践忍辱求和，给夫差当奴仆三年才被放回国。回国后他立志报仇：晚上不睡柔软的床铺，而是躺在柴草上（卧薪）；屋里挂一只苦胆，吃饭、睡觉前都要舔一口（尝胆），提醒自己别忘了会稽之耻。他还亲自下地种田、夫人织布，十年生聚、十年教训，国力渐渐恢复，最后一举灭吴。「卧薪尝胆」后来成了所有忍辱负重、立志翻盘者的座右铭——日子再舒服，也别忘了当初吃过的苦。",s:"维基百科·卧薪尝胆",u:"https://zh.wikipedia.org/wiki/卧薪尝胆"},
      {q:"「纸上谈兵」的赵括打了什么仗",a:"他打的是战国后期最惨烈的一仗——长平之战。赵括是赵国名将赵奢的儿子，从小爱读兵书，谈起行军布阵连他爹都辩不过他，但他没有实战经验。赵国中了秦国的反间计，用赵括换掉了老将廉颇。赵括一到前线就主动出击，秦将白起假装败退，把赵军引入包围圈，截断粮道四十六天。赵军饿到人吃人的地步，赵括率军突围时被射死，四十万赵军降卒被坑杀。从此赵国一蹶不振。这个成语告诉后人：兵书读得再熟，没上过战场，也只是「纸上」而已。",s:"维基百科·长平之战",u:"https://zh.wikipedia.org/wiki/长平之战"},
      {q:"刘备为什么要「三顾茅庐」",a:"因为刘备当时已经四十七岁，还在寄人篱下，身边有关羽、张飞这样的猛将，却缺一个能帮他规划天下的军师。徐庶、司马徽都向他推荐诸葛亮，说这个人是「卧龙」，得他能安天下。刘备于是亲自带着关羽、张飞去隆中请，第一次没见到，第二次又没见到，第三次终于在家，诸葛亮正在午睡，刘备就站在门外等他醒来。这一等等出了《隆中对》——诸葛亮给他规划了三分天下的战略。后来「三顾茅庐」成了求贤若渴的代名词：真要请大才，姿态就得放低。",s:"维基百科·三顾茅庐",u:"https://zh.wikipedia.org/wiki/三顾茅庐"},
      {q:"蔺相如凭什么能「完璧归赵」",a:"因为他既有胆又有谋。赵惠文王得到稀世宝玉「和氏璧」，秦昭王说要用十五座城来换。赵国知道秦王想白抢，但又不敢不给。蔺相如主动请缨带璧入秦。献璧后见秦王根本没诚意，他借口璧上有瑕疵，把玉要回，靠着柱子以摔碎玉璧相逼，迫使秦王答应斋戒五天再受璧。蔺相如暗中派人把璧偷偷送回赵国，自己留下来当面把话说清楚。秦王虽然恼怒，但杀了他也得不到璧，反而伤了两国和气，只好放他回去。一块玉，就这样靠着一个人的智勇完整地回了赵国。",s:"维基百科·完璧归赵",u:"https://zh.wikipedia.org/wiki/完璧归赵"},
      {q:"秦始皇为什么要「焚书坑儒」",a:"「焚书」是为了统一思想。秦统一后，一些儒生拿古代的制度批评当朝，丞相李斯认为这会动摇统治，建议把民间私藏的《诗》《书》和诸子百家著作烧掉，只留医药、种树、法令等实用书。「坑儒」则是因为两个为秦始皇求长生药的方士骗了钱逃跑，还背后议论他，秦始皇大怒，在咸阳坑杀了一批犯禁的方士和儒生。这两件事在历史上一直被视作暴政典型——靠烧书、杀人来统一思想，结果反而让秦朝的形象永远背了黑锅。",s:"维基百科·焚书坑儒",u:"https://zh.wikipedia.org/wiki/焚书坑儒"},
      {q:"丝绸之路为什么偏偏叫「丝」路",a:"因为当年这条路上最硬通货、最受西方欢迎的中国货，就是丝绸。从西汉张骞凿空西域开始，中国的丝绸经过河西走廊、中亚，一直运到罗马帝国。罗马贵族为了买丝绸不惜一掷千金，丝绸在当时的欧洲比黄金还贵。这条连接欧亚的商路上，除了丝绸，还运过瓷器、茶叶、香料、玻璃器，但因为丝绸最早、最有名、最能代表中国，德国地理学家李希霍芬在十九世纪给它起名时，就叫它「丝绸之路」。一条路以一种商品命名，足见丝绸在古代国际贸易里的分量。",s:"维基百科·丝绸之路",u:"https://zh.wikipedia.org/wiki/丝绸之路"},
      {q:"郑和为什么要七下西洋",a:"官方说法是明成祖朱棣想炫耀国威、招各国来朝，也有野史说他怀疑建文帝逃到海外，派人去找。不管真正动机是什么，郑和这支船队在1405到1433年间七次远航，最远到达非洲东海岸。船队有大小船只两百多艘、两万七千人，最大的宝船长约一百米，比后来哥伦布的船大好几倍。他们带着丝绸、瓷器、赏赐沿途各国，换回香料、珍宝和长颈鹿（当时被当成麒麟）。这是世界航海史上空前的壮举，但耗资巨大，后来明朝觉得划不来，就停了，航海档案也被销毁。",s:"维基百科·郑和下西洋",u:"https://zh.wikipedia.org/wiki/郑和下西洋"},
      {q:"郑成功为什么能从荷兰人手里收复台湾",a:"因为他是被逼到那一步的。明末郑成功在东南沿海抗清，南京兵败后根据地越来越小，需要找一个能长期立足的地方，于是盯上了被荷兰人占据三十多年的台湾。1661年，他率两万五千将士、几百艘战船，趁海水涨潮时通过鹿耳门航道，突然在台湾登陆，切断荷兰人在热兰遮城和普罗文遮城之间的联系，围城九个月。荷兰总督揆一弹尽粮绝，终于签字投降，退回巴达维亚。郑成功收复台湾后推行屯田、兴办学校，被尊为「开台圣王」。",s:"维基百科·郑成功",u:"https://zh.wikipedia.org/wiki/郑成功"},
      {q:"为什么古人说「半斤八两」",a:"因为古代的一斤本来就是十六两。从秦代统一度量衡开始，中国的秤长期采用十六两制——一斤等于十六两，那么半斤自然就是八两。八两对八两，轻重完全一样，所以「半斤八两」用来形容彼此差不多、不相上下，带点「谁也别笑话谁」的意思。这个十六两秤其实还藏着讲究：秤杆上十六颗星标，象征北斗七星、南斗六星加上福、禄、寿三星，叫「秤星」，卖东西短一两损福、短二两伤禄、短三两折寿，是商人的道德约束。直到1959年中国才把一斤改成十两。",s:"维基百科·斤",u:"https://zh.wikipedia.org/wiki/斤"},
      {q:"清朝男人为什么要剃发留辫子",a:"这是满人入关后强行推行的发型要求。满族在东北时就有剃发习俗：把前额到头顶的头发剃光，剩下的头发编成一条辫子垂在背后。1644年清军入关，顺治皇帝下令「剃发易服」，要求所有汉族男子必须照满人样子剃发留辫，违者处死——「留头不留发，留发不留头」。这在当时被视为对汉族传统「身体发肤受之父母」的极大冒犯，引发了激烈反抗。三百年后，辛亥革命一声枪响，剪辫子又成了革命的标志。一条辫子，从投降的象征，变成了必须剪掉的旧物。",s:"维基百科·剃发易服",u:"https://zh.wikipedia.org/wiki/剃发易服"},
      {q:"为什么皇帝去世叫「驾崩」",a:"「崩」字本来指山倒塌。古人认为皇帝是天子、是天下的支柱，他一死，就像大山崩塌了一样，天塌了一角，所以叫「驾崩」。诸侯死叫「薨」，大夫死叫「卒」，士死叫「不禄」，老百姓死才叫「死」——同样是闭眼，叫法严格按身份等级来，这是古代「礼」的一部分。皇帝死后还有一堆讲究：谥号、庙号、陵寝，全国要停止嫁娶、宴乐、屠宰，官员百姓服丧。一个「崩」字，把皇帝的死和普通人的死从字眼上就拉开了距离。",s:"维基百科·驾崩",u:"https://zh.wikipedia.org/wiki/皇帝"},
      {q:"古代最重的罪为什么叫「株连九族」",a:"因为古代法律的逻辑是「一人犯罪，全家连坐」。如果有人犯了谋反、大逆这类重罪，皇帝认为这个人的亲戚朋友都可能包庇他、支持他，所以干脆一网打尽。「九族」一般指上自高祖、下至玄孙的同族亲属，外加母族、妻族。这样一来，一个人犯事，几百口人跟着掉脑袋，目的是杀一儆百、斩草除根。历史上真被株连九族的案例并不多，更多是吓唬人的重典，但这个词本身透出古代专制的残酷——亲情在皇权面前，薄得像一张纸。",s:"维基百科·株连九族",u:"https://zh.wikipedia.org/wiki/族诛"},
      {q:"为什么古代一天只算十二个「时辰」",a:"因为古人计时不靠钟表，而靠日影和滴漏。他们把一天平分成十二段，用地支命名：子时、丑时、寅时……一直到亥时。一个时辰等于现在的两个小时，比如子时是夜里十一点到凌晨一点，午时是中午十一点到一点。这种分法跟中国古代的阴阳历法、十二地支、十二生肖是配套的，简单好记，老百姓用了几千年。到了近代，西方的机械钟表传入，一昼夜被分成二十四小时，「小时」就是「小时辰」的意思。所以我们今天说的「小时」，其实是古代十二时辰的一半。",s:"维基百科·时辰",u:"https://zh.wikipedia.org/wiki/时辰"},
      {q:"古代打仗为什么要用「烽火」报警",a:"因为没有电话电报，火光和浓烟是最快的信号。从商周开始，北方边境就修筑了一列列烽火台，台上堆满柴草、硫磺，发现敌人入侵就白天烧烟、晚上点火。一台接着一台，几千里外的京城半天就能知道消息。这套系统在长城沿线最完善——每隔几里一座，有敌来犯，一台点火，邻台看见也点下去，像多米诺骨牌一样把警报一传到底。周幽王为了博褒姒一笑，随便点烽火骗诸侯赶来，结果真有敌人时没人再信，亡国于骊山。这就是「烽火戏诸侯」的教训。",s:"维基百科·烽火台",u:"https://zh.wikipedia.org/wiki/烽火台"},
      {q:"古代军队为什么「兵马未动，粮草先行」",a:"因为人要吃饭、马要吃料，这是行军的命根子。一支几万人的军队，一天消耗的粮食就是几十万斤，还得靠民夫、牛车一路运。如果粮道被截断，再能打的军队也撑不过十天半个月——项羽在巨鹿、曹操在官渡，靠的就是烧对方的粮道翻盘。所以古代名将出兵前，第一件事不是调兵，而是算粮草：能支撑几天、运到哪里、谁来押运、被劫了怎么办。诸葛亮几次北伐失败，很大原因就是蜀道难运粮。打仗打的不是刀枪，是后勤。",s:"维基百科·粮草",u:"https://zh.wikipedia.org/wiki/官渡之战"},
      {q:"古代传递公文为什么靠「驿站」",a:"因为古代没有邮局、没有快递，官方文件和军情要靠人马一站一站接力送。从秦汉到明清，全国主要道路上每隔二三十里设一个驿站，备有马匹、口粮、床铺。邮递员到了驿站换马不换人，日夜兼程，紧急军情一天能跑几百里。驿卒凭官方的符信才能用马，普通老百姓想寄封信，只能托顺路的商人、进京的举子。驿站系统是帝国的神经——皇帝的命令从北京发到广州，靠的就是这一整套马力网络。元朝疆域最大时，驿站遍布欧亚，马可·波罗都惊叹过它的效率。",s:"维基百科·驿站",u:"https://zh.wikipedia.org/wiki/驿站"},
      {q:"古代帝王为什么要去泰山「封禅」",a:"因为封禅是皇帝能办的最高规格的「祭天典礼」。在泰山顶上筑土祭天叫「封」，在泰山脚下的梁父山辟场祭地叫「禅」，意思是向天地汇报自己的功绩，同时证明自己是真命天子。历史上真去泰山封禅的皇帝不多：秦始皇、汉武帝、光武帝、唐高宗、唐玄宗、宋真宗，屈指可数。不是谁都有资格去——得天下太平、有祥瑞出现、皇帝觉得自己够格才行。连康熙、乾隆这么自负的皇帝，也只是在承德避暑山庄搞搞类似仪式，没敢轻易上泰山。",s:"维基百科·封禅",u:"https://zh.wikipedia.org/wiki/封禅"},
      {q:"孔子为什么被后世捧成「圣人」",a:"因为他开创的儒家思想，正好成了两千年帝制中国的主流意识形态。孔子生前周游列国，推销自己「仁」「礼」的主张，没几个国君真听他的；他死后弟子们把他的言行编成《论语》。到了汉武帝「罢黜百家、独尊儒术」，儒家成了官方学问，孔子的地位一路被抬高：从「先师」到「文宣王」，再到「大成至圣先师」。历代皇帝都要到孔庙拜一拜，全国各县都有文庙。他生前失意，死后却成了整个中华文明的精神坐标——这是历史对他最大的补偿。",s:"维基百科·孔子",u:"https://zh.wikipedia.org/wiki/孔子"},
      {q:"为什么商朝人遇事总爱「占卜」",a:"因为商人特别迷信，他们相信天上的祖先和神灵在主宰一切。打仗、打猎、收成、生孩子、甚至牙疼，都要先问问神灵同不同意。办法是在龟甲或牛肩胛骨上钻个小坑，用火烧，骨头受热裂开「卜」的一声，巫师根据裂纹的走向判断吉凶，再把问的事和结果刻在骨头上——这就是甲骨文。近代在河南殷墟出土了十几万片这样的甲骨，上面记的就是商人三千多年前的「聊天记录」。我们今天能读懂最早的汉字，靠的就是这些被烧过的骨头。",s:"维基百科·甲骨卜辞",u:"https://zh.wikipedia.org/wiki/甲骨文"},
      {q:"甲骨文为什么刻在龟甲和兽骨上",a:"因为商人占卜需要一种能被火烤出裂纹的东西，龟甲和牛肩胛骨正好合适。乌龟被认为是通灵的神兽，牛是祭祀的主要牺牲品，它们的骨头在商人眼里能传递神意。占卜时先在骨板背面钻凿，再用火灼，正面就爆出各种裂纹，巫师看着裂纹判断吉凶，然后把所问之事、应验结果用刀刻在骨板上。这些刻辞就是甲骨文。到了周代，金文铸在青铜器上；再后来竹简、纸张普及，甲骨就没人用了。所以甲骨文能保存三千年，全靠那批骨头埋在地下、没人翻动。",s:"维基百科·甲骨文",u:"https://zh.wikipedia.org/wiki/甲骨文"},
      {q:"古代为什么用「鼎」象征国家权力",a:"因为鼎最早是煮肉、盛祭品的礼器，在祭祀祖先时地位极高。传说夏禹收九州之金，铸成九鼎，象征九州，从此鼎成了国家政权的代名词。谁拥有九鼎，谁就是天下共主。春秋时楚庄王带兵到周王室边境「问鼎之大小轻重」，意思是他想取而代之，这就是「问鼎中原」的来历。后来改朝换代叫「定鼎」，建立政权叫「鼎立」，宰相治国叫「调鼎」。一只本来煮肉的锅，就这样成了国家权力的最高象征。",s:"维基百科·鼎",u:"https://zh.wikipedia.org/wiki/鼎"},
      {q:"「指鹿为马」到底是怎么回事",a:"这是秦朝赵高测试朝臣的一场闹剧。秦二世时，赵高想篡位，又怕群臣不服，就牵了一头鹿上朝，献给二世说「这是一匹马」。二世笑着说丞相搞错了，鹿怎么是马？赵高转头问左右大臣：这到底是鹿还是马？有人沉默，有人顺着赵高说是马，少数几个人敢说是鹿。事后，赵高把那些说是鹿的人一一陷害处死。从此群臣都怕赵高，没人敢说他的错。「指鹿为马」后来成了故意颠倒黑白、仗势欺人的代名词。",s:"维基百科·指鹿为马",u:"https://zh.wikipedia.org/wiki/指鹿为马"},
      {q:"项羽为什么要「破釜沉舟」",a:"因为巨鹿之战时，楚军面对秦军主力，人数处于劣势。项羽率全军渡过漳河后，下令把做饭的锅全部砸碎，把渡河的船全部凿沉，每人只带三天干粮，以示「不胜利就去死」的决心。士兵们一看退路没了，个个以一当十，九战九捷，生擒秦将王离，逼降章邯，解了巨鹿之围。这一战奠定了项羽「西楚霸王」的地位，也留下了「破釜沉舟」这个成语——人在没有退路时，往往能爆发出想象不到的勇气。",s:"维基百科·巨鹿之战",u:"https://zh.wikipedia.org/wiki/巨鹿之战"},
      {q:"刘邦为什么能在「鸿门宴」上全身而退",a:"因为他装孙子装得及时。刘邦先入关中，惹得项羽大怒，四十万大军驻扎鸿门，准备第二天开打。项羽的叔父项伯受过张良救命之恩，连夜告密；刘邦第二天一早亲自带百骑来谢罪，低声下气说自己「不敢倍德」。范增在席上多次示意项羽动手，项羽犹豫不决；项庄拔剑舞，想借机刺杀刘邦，项伯也起来对舞护住刘邦。刘邦借上厕所的机会，抄小路逃回军营，留下张良献璧谢罪。一场杀机四伏的饭局，就靠刘邦的低姿态和手下人的配合，有惊无险地过去了。",s:"维基百科·鸿门宴",u:"https://zh.wikipedia.org/wiki/鸿门宴"},
      {q:"韩信为什么受过「胯下之辱」",a:"因为他年轻时穷得叮当响，却背着一把剑在街上走。屠户里有个少年当众拦住他：你虽然个子高大、带剑，其实是个胆小鬼；有本事就刺我一剑，没本事就从我裤裆底下钻过去。韩信盯着他看了一会儿，真的弯下腰，从那人胯下爬了过去。满街人都笑韩信怯懦。后来韩信辅佐刘邦打下天下，被封楚王，回到故乡，不但没杀那个少年，还封他做了中尉，说当年他羞辱我时，我难道不敢杀他吗？杀了他没有意义，所以忍了下来，才有今天。",s:"维基百科·韩信",u:"https://zh.wikipedia.org/wiki/韩信"},
      {q:"为什么西汉要对匈奴「和亲」",a:"因为刚打完四年楚汉战争，汉朝穷得连皇帝都凑不齐四匹同色的马，而匈奴骑兵正强盛，根本打不过。刘邦在白登山被匈奴围困七天七夜，差点回不来。谋士刘敬建议：把汉朝公主嫁给匈奴单于，再陪送大量礼物，让单于变成汉朝的女婿，女婿总不好老打岳父吧？这套「和亲」政策从汉初一直用到汉武帝反击匈奴之前，先后嫁了十几位宗室女给单于。它本质上是用女人和财宝换和平，是弱者的无奈。等到汉武帝攒够了钱、养出了骑兵，卫青、霍去病才把匈奴一路打跑。",s:"维基百科·和亲",u:"https://zh.wikipedia.org/wiki/和亲"},
      {q:"王昭君为什么要出塞远嫁",a:"她是被宫廷画师「坑」过去的。汉元帝按画像选宫女，宫女们都贿赂画师毛延寿，把自己画美一点；王昭君不肯行贿，毛延寿就把她画得很丑，她一直没被皇帝见过。后来匈奴呼韩邪单于来朝，请求和亲，汉元帝按画像选了王昭君。临行前召见，才发现她是后宫第一美人，后悔也来不及，事后杀了毛延寿。王昭君到塞外后，先后嫁给两任单于，生儿育女，推动了汉匈几十年的和平。「昭君出塞」成了历代文人写不完的题材——一个宫女的远嫁，换来边疆数十年的安宁。",s:"维基百科·王昭君",u:"https://zh.wikipedia.org/wiki/王昭君"},
      {q:"张骞出使西域为什么被称为「凿空」",a:"因为他之前，中原王朝根本不知道西边的世界有多大。汉武帝想联合大月氏夹击匈奴，派张骞带队出使。结果一出门就被匈奴抓了，扣了十年，还给他娶了老婆生了孩子；张骞找机会逃出来，继续西行，到了大宛、康居、大月氏，走了一圈回到长安。虽然大月氏已经不想报仇，但他带回了西域各国的地理、物产、兵力情报：原来西边有大宛的汗血马、有地中海的大秦。司马迁在《史记》里把这一趟叫「凿空」——意思是打通了前人从未走过的路。丝绸之路的正式开通，就是从他这双脚开始的。",s:"维基百科·张骞",u:"https://zh.wikipedia.org/wiki/张骞"},
      {q:"苏武为什么能在北海边牧羊十九年",a:"因为他死也不肯投降。汉武帝时苏武奉命出使匈奴，被卷入一场内乱，单于把他扣押，逼他投降。苏武宁死不降，被关在地窖里，断食断水，他靠吃雪、嚼毡毛活了下来。单于没招，把他流放到北海（今贝加尔湖）边放羊，说等公羊生了小羊才放他回去。苏武在冰天雪地里靠挖野鼠储藏的草籽充饥，手里始终拄着汉朝的符节，节上的毛掉光了也不松手。十九年后汉昭帝与匈奴和亲，苏武才被接回长安。回国时他须发尽白，但那根光杆符节成了汉代气节的象征。",s:"维基百科·苏武",u:"https://zh.wikipedia.org/wiki/苏武"},
      {q:"司马迁受了宫刑为什么还要写《史记》",a:"因为他觉得还有没写完的事，不能死。司马迁为李陵投降匈奴辩护，触怒汉武帝，被处宫刑——这在当时是奇耻大辱，他一度想自杀。但他想起父亲司马谈的遗愿：完成一部贯通古今的史书。他在《报任安书》里写：「人固有一死，或重于泰山，或轻于鸿毛。」于是忍辱负重，发愤著书，十几年后完成了一百三十篇、五十二万字的《史记》，从黄帝写到汉武帝。这部书开创了中国纪传体史书的体例，被鲁迅誉为「史家之绝唱，无韵之离骚」。如果他当年一死了之，中国史学就少了一座泰山。",s:"维基百科·司马迁",u:"https://zh.wikipedia.org/wiki/司马迁"},
      {q:"汉武帝为什么要「罢黜百家，独尊儒术」",a:"因为他需要一套能把全国思想拧成一股绳的统治学说。汉朝初年奉行「黄老无为」，朝廷清静、地方自由，结果王国势力越来越大，思想界也五花八门。董仲舒上书建议：不在儒家六经范围内的各家学说，都要断绝其晋升之路，不要让它们和儒学并存。汉武帝采纳了，设五经博士、办太学，用儒家经典培养官员。从此读儒书、通过考试成为入仕的主要通道，儒家思想主导中国两千年。这不是孔子本人的胜利，而是帝王选择了一套最适合中央集权的意识形态。",s:"维基百科·独尊儒术",u:"https://zh.wikipedia.org/wiki/独尊儒术"},
      {q:"诸葛亮为什么能「草船借箭」",a:"这个故事主要来自《三国演义》，正史里并没有完整记载，更接近小说创作。小说里周瑜刁难诸葛亮，要他十天造十万支箭。诸葛亮却答应三天，趁大雾天扎二十条草船、船上堆满草人，开到曹营前擂鼓呐喊。曹操雾中不知虚实，下令弓弩手乱放箭，箭全射在草人身上；诸葛亮等船两边射满，从容回去，轻松凑够十万支箭。故事的重点不是诸葛亮真有妙计，而是他利用了「雾」和曹操「多疑」这两个变量——知己知彼，连造箭这种苦差事都能省掉。",s:"维基百科·草船借箭",u:"https://zh.wikipedia.org/wiki/草船借箭"},
      {q:"赤壁之战曹操为什么会惨败",a:"因为他犯了三个大错。第一，北方士兵不习惯水上作战，晕船呕吐，他下令把战船首尾用铁链连起来，想让船像平地一样稳——结果给了火攻的机会。第二，黄盖假意投降，带着装满茅草膏油的小船直冲曹营，当时东南风大作，火借风势，瞬间烧遍连环船。第三，曹军不熟悉南方冬天的气候，疫病流行，战斗力大减。一把火下去，几十万曹军灰飞烟灭，曹操退回北方，三国鼎立的格局就此奠定。所以赤壁之战不是周瑜打赢的，是曹操自己把船绑在一起，送上去的。",s:"维基百科·赤壁之战",u:"https://zh.wikipedia.org/wiki/赤壁之战"},
      {q:"苻坚为什么会「投鞭断流」又「草木皆兵」",a:"前秦苻坚统一北方后，率八十七万大军南下想一举灭东晋。出发前他夸口：我这么多军队，把马鞭扔进长江，都能把江水截断——这就是「投鞭断流」。结果在淝水，东晋八万北府兵主动渡河决战，秦军稍一后撤就乱了阵脚。苻坚在城楼上看见对岸晋军队伍严整，又望八公山上，把漫山的草木都当成了晋兵，心里开始发虚——这就是「草木皆兵」。最后秦军一败涂地，自相践踏，风声鹤唳都以为是追兵。淝水之战成了「骄兵必败」的最典型战例。",s:"维基百科·淝水之战",u:"https://zh.wikipedia.org/wiki/淝水之战"},
      {q:"祖逖为什么要每天「闻鸡起舞」",a:"因为他年轻时就有一番报国大志。东晋初年，北方被胡人占领，祖逖和好友刘琨同睡一床，每天半夜听到野外鸡叫，祖逖就踢醒刘琨：「这不是恶声。」两人起床拔剑到院子里舞剑练功，这就是「闻鸡起舞」。后来祖逖上书要求北伐，带着旧部渡江，在江心敲着船桨发誓：「祖逖不能清中原而复济者，有如大江！」他招募兵马，收复了黄河以南大片土地。一个人想做成大事，先得有半夜听见鸡叫就爬起来练本事的劲头。",s:"维基百科·祖逖",u:"https://zh.wikipedia.org/wiki/祖逖"},
      {q:"王羲之为什么被尊为「书圣」",a:"因为他把行书、草书推到了一个后人难以逾越的高度。东晋王羲之早年师从卫夫人，后来遍览汉魏名家碑帖，一改汉魏古朴的书风，把字写得飘逸洒脱、结构精妙。他的《兰亭集序》被称为「天下第一行书」——据说唐太宗太爱这篇字，死后把真迹陪葬进了昭陵，我们今天看到的都是唐人摹本。传说他曾在门板上写字，工匠刮了一层又一层，墨还透在里面；成语「入木三分」就是这么来的。他的儿子王献之也是大书法家，父子合称「二王」。",s:"维基百科·王羲之",u:"https://zh.wikipedia.org/wiki/王羲之"},
      {q:"左思的赋为什么弄得「洛阳纸贵」",a:"因为他写的《三都赋》实在太受欢迎。西晋左思花了十年时间，构思、查证、写作，完成了描写魏、蜀、吴三国都城的《三都赋》。写完后起初没人看重，他请皇甫谧等名士作序推荐，立刻轰动洛阳。豪门世家、读书人争着抄阅，洛阳的纸张一下子供不应求，纸价被炒得大涨——这就是「洛阳纸贵」的来历。一个作品火到连原材料都涨价，在印刷术还没发明的时代，是最高级别的畅销榜。",s:"维基百科·左思",u:"https://zh.wikipedia.org/wiki/左思"},
      {q:"北魏孝文帝为什么执意迁都洛阳、改汉姓",a:"因为他想把鲜卑政权彻底「汉化」。北魏从平城（今山西大同）起家，但那里偏远、保守，鲜卑贵族旧势力太强，不利于推行改革。孝文帝以南征为名，率大军和文武百官走到洛阳，正好赶上连日大雨，群臣苦不堪言，他趁机说：如果不南征，就定都洛阳。大家只好同意。迁都后，他下令禁胡服、说汉语、改汉姓——皇族拓跋氏改姓元，自己叫元宏；鼓励鲜卑贵族和汉族士族通婚。这场改革让北魏迅速汉化，但也动摇了北方边防军的根基，几十年后引发了六镇之乱。",s:"维基百科·孝文帝改革",u:"https://zh.wikipedia.org/wiki/孝文帝改革"},
      {q:"隋炀帝为什么要花重金开凿大运河",a:"因为他想把中国南北「焊」在一起。隋朝定都长安、洛阳，但江南已经是粮食和财赋的主要来源；旧的运输靠陆运，又慢又贵。于是隋炀帝征发几百万民工，把海河、黄河、淮河、长江、钱塘江五大水系用一条人工运河串起来，北到涿郡（今北京），南到余杭（今杭州），全长两千多公里。运河修通后，南方的粮食、物资源源不断北运，洛阳、开封成了繁华都会。但工程太急、死人太多，加上三征高句丽，民怨沸腾，隋朝很快灭亡。功在千秋，罪在当代，说的就是这条运河。",s:"维基百科·大运河",u:"https://zh.wikipedia.org/wiki/京杭大运河"},
      {q:"李世民为什么要发动「玄武门之变」",a:"因为他和太子李建成已经到了你死我活的地步。李世民为唐朝打下大半江山，功高震主，太子李建成联合齐王李元吉排挤他。626年六月，李世民率长孙无忌、尉迟恭等埋伏在玄武门，趁李建成、李元吉入朝经过时突然杀出。李世民亲手射死李建成，尉迟恭杀死李元吉，然后派兵控制唐高祖李渊。李渊三天后立李世民为太子，两个月后禅位。这场政变虽然血腥，但李世民即位后开创了贞观之治，成为中国历史上最著名的治世之一。兄弟阋墙，换来的是二十三年的太平。",s:"维基百科·玄武门之变",u:"https://zh.wikipedia.org/wiki/玄武门之变"},
      {q:"唐太宗为什么被各族尊为「天可汗」",a:"因为他不光靠打，还靠「怀柔」。唐太宗灭东突厥后，没有把突厥人赶尽杀绝，而是把他们安置在边境，任命其首领为将军；周边民族的酋长在长安朝廷里做官的多达几百人。他自己说：「自古皆贵中华、贱夷狄，朕独爱之如一。」这种开放态度让周边各族心服口服，647年，回纥、薛延陀等各族首领齐聚长安，给唐太宗上了一个尊号——「天可汗」，意思是天下各族共同的大汗。从此唐朝皇帝在对北方民族的文书里，都同时使用「皇帝」和「天可汗」两个头衔。",s:"维基百科·唐太宗",u:"https://zh.wikipedia.org/wiki/唐太宗"},
      {q:"魏征为什么敢当面顶撞皇帝",a:"因为他遇到了一个能容忍他的皇帝。魏征原本是太子李建成的谋士，曾劝李建成早下手除掉李世民。玄武门之变后，李世民欣赏他的耿直，不但没杀他，还任命为谏议大夫。魏征前后向唐太宗进谏二百多次，经常当着满朝文武的面顶撞皇帝，有时把李世民气得回宫大骂「早晚杀了这个乡巴佬」。但长孙皇后换上朝服向皇帝道贺：只有明君才有直臣。李世民冷静下来，照样重用魏征。魏征死后，唐太宗说：「以铜为镜，可以正衣冠；以史为镜，可以知兴替；以人为镜，可以明得失。魏征没，朕亡一镜矣。」",s:"维基百科·魏征",u:"https://zh.wikipedia.org/wiki/魏征"},
      {q:"武则天死后为什么立一块「无字碑」",a:"这块碑立在陕西乾陵，和她丈夫唐高宗的墓碑并排，但上面一个字都没刻。她是中国历史上唯一的正统女皇帝，在位期间做过不少事：打击门阀、提拔寒门、延续贞观之治；也重用酷吏、大兴佛寺、晚年男宠专权。怎么评价她，朝臣吵成一团。有说法是她临终前留下遗命：自己的功过，留给后人去评说，所以不刻一字。也有说法是她原本有碑文，后来被唐玄宗派人磨掉了。不管真相如何，一块空碑反倒成了最好的墓志铭——她这一生，确实不是一两行字能说清的。",s:"维基百科·武则天",u:"https://zh.wikipedia.org/wiki/武则天"},
      {q:"玄奘为什么要冒着危险西行取经",a:"因为他觉得当时国内的佛经译本互相矛盾，搞不清楚，要去印度求「真经」。贞观初年，朝廷禁止百姓出境，玄奘混在难民里偷渡出境，只身走过八百里沙漠，翻过雪山，经历了无数生死，走了一百多次国家，终于到达印度那烂陀寺，拜戒贤法师为师。他在印度游学十几年，精通大小乘，645年带着六百多部佛经回到长安。此后十九年，他在弘福寺、大慈恩寺专心译经，译出佛经七十五部、一千三百三十五卷，还口述了《大唐西域记》。《西游记》里的孙悟空、猪八戒都是后来加的，真实的玄奘，是一个人用脚走完了丝绸之路。",s:"维基百科·玄奘",u:"https://zh.wikipedia.org/wiki/玄奘"},
      {q:"鉴真为什么要六次东渡日本",a:"因为日本僧人来中国请他去传戒，他觉得这是使命。鉴真是扬州大明寺的高僧，742年日本留学僧邀请他东渡日本，他的弟子们太危险，他说：「是为法事也，何惜身命？」从742年到753年，他先后六次尝试：前五次遇到风浪、官府阻挠、船毁人亡，他自己双目失明，弟子死了好几个。第六次终于成功抵达日本萨摩。他带去了佛经、医药、建筑、书法，在日本奈良主持修建唐招提寺，被尊为日本律宗初祖。一个盲人和尚，用了十一年、六条船的代价，把唐朝文化搬到了日本。",s:"维基百科·鉴真",u:"https://zh.wikipedia.org/wiki/鉴真"},
      {q:"杨贵妃为什么最后死在马嵬坡",a:"因为士兵们把安史之乱的账算到了杨家头上。安禄山以「清君侧」、讨伐杨国忠为名起兵，唐玄宗带着杨贵妃、杨国忠和禁军逃往四川。走到马嵬坡（今陕西兴平），禁军将士又累又饿，哗变：先杀了杨国忠，然后围住行宫，要求唐玄宗赐死杨贵妃，否则不肯护驾。玄宗犹豫良久，高力士劝他：将士安，陛下才能安。玄宗只好命高力士把杨贵妃带到佛堂，缢死在梨树下，时年三十八岁。安史之乱后玄宗回到长安，派人改葬，发现尸体已腐，只有一个香囊还在。一代贵妃，成了士兵怒火的牺牲品。",s:"维基百科·杨贵妃",u:"https://zh.wikipedia.org/wiki/杨贵妃"},
      {q:"宋太祖为什么要「杯酒释兵权」",a:"因为他自己就是靠兵变上台的。赵匡胤原是后周大将，陈桥兵变、黄袍加身，从孤儿寡母手里夺了天下。他当了皇帝后，最怕手下的将领也来这么一出。961年，他把石守信等老将留下喝酒，酒酣时叹气：我这个位子睡不着啊，假如你们的部下也把黄袍披在你们身上，你们怎么办？将领们吓得磕头求指教。赵匡胤说：你们不如交出兵权，多买良田美宅、歌妓舞女，天天喝酒养老，君臣之间两无猜疑。第二天众人称病辞职，兵权顺利收归中央。这一招比杀功臣温和得多，但也定下了宋朝重文轻武的基调。",s:"维基百科·杯酒释兵权",u:"https://zh.wikipedia.org/wiki/杯酒释兵权"},
      {q:"岳飞为什么会被十二道金牌从前线召回",a:"因为宋高宗和秦桧想议和。岳飞在郾城、朱仙镇接连大败金兵，逼近开封，他豪迈地说「直抵黄龙府，与诸君痛饮尔」。但宋赵构怕迎回徽钦二帝后自己的位子不保，秦桧则怕岳飞功成后自己失势，两人合谋，一天之内连下十二道「金字牌」，催岳飞班师。岳飞望着东边叹息：「十年之功，废于一旦！所得州郡，一朝全休！」他退兵后被解除兵权，以「莫须有」的罪名杀害于大理寺狱，年仅三十九岁。十二道金牌，是皇帝用最高命令把一个能打赢的将军拉了回来。",s:"维基百科·岳飞",u:"https://zh.wikipedia.org/wiki/岳飞"},
      {q:"为什么说岳飞死在「莫须有」三个字上",a:"因为秦桧实在找不到岳飞谋反的真证据。岳飞被关了两个月，御史们拼凑不出像样的罪名。韩世忠不服，去问秦桧：岳飞到底犯了什么罪？秦桧支支吾吾说：「飞子云与张宪书虽不明，其事体莫须有。」「莫须有」就是「也许有、大概有」的意思。韩世忠当场怒道：「『莫须有』三字，何以服天下？」但岳飞还是被处死了。后世「莫须有」成了冤杀功臣的代名词——要杀一个人，根本不需要真罪名，三个字就够了。",s:"维基百科·岳飞",u:"https://zh.wikipedia.org/wiki/岳飞"},
      {q:"成吉思汗为什么被称为「一代天骄」",a:"因为他和他的子孙打下了人类历史上最大的陆上帝国。铁木真从蒙古草原一个部落少年起步，父亲被毒死、妻子被抢走，他靠自己的能力和义气，用二十年统一了蒙古各部，1206年被尊为「成吉思汗」。此后蒙古骑兵横扫欧亚：灭西夏、灭金朝、打中亚、踏俄罗斯，一直打到东欧的多瑙河。他死后，帝国由子孙扩张到三千多万平方公里。毛泽东在《沁园春·雪》里写「一代天骄，成吉思汗，只识弯弓射大雕」——既是夸他的武功，也点出他的局限。",s:"维基百科·成吉思汗",u:"https://zh.wikipedia.org/wiki/成吉思汗"},
      {q:"朱元璋早年为什么当过和尚",a:"因为他家穷得活不下去。朱元璋是安徽凤阳人，1344年淮北大旱加蝗灾，他的父亲、母亲、大哥在半个月内相继饿死，家里连埋葬的地都没有。十七岁的朱元璋孤苦无依，只能到附近的皇觉寺当小行童，混口饭吃。才过了五十天，庙里也断粮，他只好托着瓦钵云游淮西三年，沿街化缘，走遍庐州、固始、信阳一带。这段流浪经历让他见识了民间疾苦，也锻炼了性格。二十五岁那年他投奔红巾军，一步步从士兵做到皇帝。历史上真正「布衣出身」的皇帝，除了刘邦，就是他。",s:"维基百科·朱元璋",u:"https://zh.wikipedia.org/wiki/朱元璋"},
      {q:"张居正为什么死后被抄家",a:"因为他管皇帝管得太狠了。张居正是万历皇帝的老师，万历十年前，太后把朝政全权交给他。他推行「一条鞭法」，清丈土地、整顿吏治，让明朝财政一下子好转。但他对万历要求极严：小皇帝读书错一个字，他就声色俱厉；想花钱，他说国库没钱。万历八年，十八岁的万历喝醉了酒，调戏宫女，冯太后差点废掉他，还让张居正写奏章劝谏。皇帝表面怕，心里恨。张居正一死，言官立刻弹劾，万历下令抄家，张居正的儿子被逼自杀，家属饿死十几人。直到天启年间才平反。",s:"维基百科·张居正",u:"https://zh.wikipedia.org/wiki/张居正"},
      {q:"戚继光为什么能把倭寇打得闻风丧胆",a:"因为他专门练出了一支「戚家军」。明朝倭寇在东南沿海烧杀抢掠，明军腐败，打不过。戚继光到浙江后，招募义乌农民和矿工三千人，亲手训练，创造了「鸳鸯阵」——十二人一队，盾牌、狼筅、长枪、短刀配合，长短兵器互相掩护，专门克制倭寇的双刀。他还改进了火炮、战船。十几年间，戚家军在台州、横屿、平海卫九战九捷，消灭倭寇数万，东南沿海终于太平。戚继光的兵书《纪效新书》至今还是研究古代军事的重要文献。一个名将，不光要勇敢，更要会练兵、会设计阵法。",s:"维基百科·戚继光",u:"https://zh.wikipedia.org/wiki/戚继光"},
      {q:"吴三桂为什么「冲冠一怒为红颜」",a:"这句话来自吴伟业的《圆圆曲》，是文学夸张，但背后有真实事件。明朝山海关总兵吴三桂本来打算投降李自成的大顺政权。结果他听说父亲吴襄被大顺军拷打追赃，爱妾陈圆圆被李自成部下刘宗敏抢走，勃然大怒，拔剑斩案：「大丈夫不能保一女子，何面目见人！」当即率部返回山海关，投降清朝多尔衮，引清军入关。李自成亲率大军来攻，在一片石被吴三桂和清军联手击败。清军从此入主中原。当然，吴三桂降清主要是政治权衡，但「冲冠一怒为红颜」把它说成了为一个女人——历史的戏剧性，常常就是这样被诗人们放大的。",s:"维基百科·吴三桂",u:"https://zh.wikipedia.org/wiki/吴三桂"},
      {q:"康熙为什么能年少智擒鳌拜",a:"因为他知道硬来不行，只能装小孩。康熙八岁即位，辅政大臣鳌拜专横跋扈，根本不把小皇帝放在眼里，甚至当着康熙的面诛杀大臣。康熙八年，十六岁的康熙假装贪玩，从侍卫子弟里挑了一批少年，天天在宫里练布库（摔跤）。鳌拜以为皇帝不务正业，完全不防备。一天鳌拜单独入宫，康熙一声令下，这群少年一拥而上，把这位身经百战的权臣按倒在地。康熙随即宣布鳌拜三十条大罪，革职禁锢。一个十六岁的少年，靠一场摔跤戏，把权力拿了回来——这是康熙一生政治智慧的起点。",s:"维基百科·康熙",u:"https://zh.wikipedia.org/wiki/康熙"},
      {q:"为什么康熙晚年闹出「九子夺嫡」",a:"因为他立了太子又废掉，给了所有儿子幻想。康熙原本立二阿哥胤礽为太子，培养了三十多年，后来嫌他「不仁不孝」，两度废立。结果其他二十多个儿子都觉得自己有机会当皇帝，结成几个党派：大阿哥、八阿哥、十四阿哥各有一帮朝臣支持，明争暗斗几十年。康熙为此心力交瘁，甚至在朝堂上痛哭，求儿子们别再争。最后康熙驾崩于畅春园，四阿哥胤禛在隆科多、年羹尧支持下即位，就是雍正。关于雍正是不是篡位，至今还是清宫第一悬案。但「九子夺嫡」直接导致后来雍正发明了「秘密立储」——把传位诏书藏在乾清宫正大光明匾后面，皇帝死了才打开。",s:"维基百科·九子夺嫡",u:"https://zh.wikipedia.org/wiki/九子夺嫡"},
      {q:"雍正为什么要设立「军机处」",a:"因为他想把权力抓到自己一个人手里。雍正为了对准噶尔用兵，在寝宫附近设了一个临时军事指挥小组，叫军机处，挑信任的大臣兼职入值。这个机构没有正式编制、没有衙署、没有属官，大臣每天被皇帝召见、跪受笔录、直接发往前线。原来的议政王大臣会议、内阁都被架空，所有政令从皇帝口中直接发出。皇帝一个人每天批阅几十斤奏折，勤政到死。军机处后来延续到清末，成为清朝两百年的权力中枢——它存在的意义，就是让皇帝乾纲独断。",s:"维基百科·军机处",u:"https://zh.wikipedia.org/wiki/军机处"},
      {q:"和珅为什么能贪到「和珅跌倒，嘉庆吃饱」",a:"因为他是乾隆最宠信的人。和珅出身低微，但聪明、会办事，精通满、汉、蒙、藏四种语言，能替乾隆处理各种棘手事务，特别是乾隆晚年巡游、修园的开销，全靠他张罗。他趁机卖官鬻爵、收受贿赂、霸占田产。乾隆做了太上皇的三年，和珅更是「二皇帝」，连嘉庆都得让他三分。1799年乾隆一死，嘉庆立刻抄和珅的家，抄出的财产估算八亿到十一亿两白银，相当于清政府十五年的财政收入。民间于是编出这句话——和珅贪了二十年，新皇帝一上台，国库就满了。",s:"维基百科·和珅",u:"https://zh.wikipedia.org/wiki/和珅"},
      {q:"林则徐为什么要在虎门当众销烟",a:"因为鸦片正在把中国拖垮。1830年代，英国向中国走私鸦片，每年输入几万箱，白银大量外流，上至官员下至兵丁，吸食者遍地，「弱种几千万户」。道光皇帝派林则徐到广东禁烟。1839年6月3日，林则徐在虎门海滩挖了两个大池子，引入海水，把鸦片切块、撒盐、加石灰，海水沸腾，鸦片化为渣沫，退潮时送入大海。整整二十三天，销毁鸦片一万九千多箱，总重两百多万斤。这是中国第一次大规模禁毒。英国以此为借口发动鸦片战争，中国近代史由此拉开。林则徐在给道光的奏折里写：「若犹泄泄视之，是使数十年后，中原几无可以御敌之兵，且无可以充饷之银。」",s:"维基百科·虎门销烟",u:"https://zh.wikipedia.org/wiki/虎门销烟"},
      {q:"邓世昌为什么在甲午海战中驾舰撞敌",a:"因为他那艘舰已经打不动了。1894年9月17日，黄海大东沟，北洋水师与日本联合舰队激战。邓世昌指挥的「致远」舰在激战中多处中弹、水线进水，舰身倾斜，炮弹也打光了。他对全舰官兵说：「今日有死而已！」下令开足马力，直冲日本旗舰「吉野」，想撞沉它同归于尽。途中致远被日军鱼雷击中，锅炉爆炸，全舰沉没。邓世昌落水后，他的爱犬游过来叼住他的胳膊，他却按住犬首，一同沉入海中，全舰二百五十余人壮烈殉国。甲午战败后，光绪帝亲撰挽联：「此日漫挥天下泪，有公足壮海军威。」",s:"维基百科·邓世昌",u:"https://zh.wikipedia.org/wiki/邓世昌"},
      {q:"为什么古代考场要写「八股文」",a:"因为明清考试需要一种标准化的文体。科举发展到明清，规定考生必须用「八股文」答题：文章由破题、承题、起讲、入手、起股、中股、后股、束股八个部分组成，后面四股每股还要有两股对仗排比的文字，字数、格式严格限定，内容必须照搬朱熹对四书五经的注解，不能发挥自己的见解。这种文体阅卷时好统一判分，公平但僵化。读书人一辈子钻研怎么写好八股，对实际治国一窍不通。顾炎武痛斥：「八股之害，等于焚书！」1905年科举废除，八股文才跟着进了历史博物馆。",s:"维基百科·八股文",u:"https://zh.wikipedia.org/wiki/八股文"},
      {q:"古代铜钱为什么是「外圆内方」",a:"因为这是铸币工艺逼出来的。古代铜钱用范铸法浇铸，铸好的铜钱边缘有毛刺，需要打磨。如果在铜钱中间钻一个圆孔，打磨时钱币会在轴上转动，磨不匀；改成方孔，把一批铜钱串在一根方形铁条上，就固定住了，可以一起快速打磨。所以外圆内方最初是为了干活方便。后来被赋予哲学意义：外圆象征天，内方象征地，「天圆地方」；做人也要外圆内方——外表圆滑、内心有原则。从秦朝的「半两」到清末的「宣统通宝」，这种方孔钱用了两千多年。",s:"维基百科·方孔钱",u:"https://zh.wikipedia.org/wiki/方孔钱"},
      {q:"古代官员的官服为什么要绣「补子」",a:"因为要一眼看出对方是几品官。明清两代规定：官员常服的前胸和后背，各缝一块刺绣的「补子」，上面的图案代表品级。文官用鸟：一品仙鹤、二品锦鸡、三品孔雀；武官用兽：一品麒麟、二品狮子、三品豹。一看胸前绣的是什么，就知道对方多大官。补子的颜色、大小、纹样都有严格规定，乱绣、错穿都是犯罪。我们今天看老照片里的清代官员，胸前那一块方方正正的彩绣，就是品级身份证。「衣冠禽兽」这个词最早本来是夸官员的，后来才慢慢变成骂人话。",s:"维基百科·补子",u:"https://zh.wikipedia.org/wiki/补子"},
      {q:"宋朝官员的帽子两边为什么有长翅",a:"这顶帽子叫「长翅帽」，传说是赵匡胤发明的。宋朝官员上朝时喜欢交头接耳，赵匡胤不爽，就下令在官帽两侧加上长长的薄翅，用铁片、竹篾做骨架。这样大臣们面对面说话时，帽子翅膀会互相碰、甚至戳到脸，不得不保持距离，朝堂一下子安静了。这当然是民间传说，但长翅帽确实在宋代官场流行，一尺多长的翅子在街上走都得小心。一个帽子的设计，藏着皇帝对臣子「别扎堆嘀嘀咕咕」的小心思。",s:"维基百科·长翅帽",u:"https://zh.wikipedia.org/wiki/官帽"},
      {q:"古代大臣上朝为什么要带「笏板」",a:"因为它是古代大臣的「笔记本」。大臣上朝奏事，要把皇帝的指示、自己要讲的事写在这块狭长的板子上，免得临时忘词；同时面对皇帝时，笏板还能用来遮挡面部，表示「不敢直视天颜」。唐代五品以上用象牙做笏，六品以下用竹木。一个官员上朝带两块笏：一块记事，一块备忘。《礼记》里规定：「凡有指画于君前，用笏。」这块板子一直用到明朝，清朝改穿满族服饰，笏板才退出历史。今天我们看老剧里大臣手里那块狭长的板子，就是他们的政务平板。",s:"维基百科·笏",u:"https://zh.wikipedia.org/wiki/笏"},
      {q:"为什么古代皇帝要选「太子」",a:"因为帝国必须有一个明确的接班人，不然老皇帝一死，儿子们就要抢。从周朝开始，「立嫡以长」——正妻生的大儿子天然是太子——成了宗法制度的核心。太子居住在东宫，有自己的官属、太傅、少傅，从小按皇帝标准培养。皇帝在位时，太子是「储君」，是未来的皇帝；但如果太子太有能耐，又会让老皇帝不安，怕他提前抢班。所以历史上太子当得顺利的不多：汉武帝的太子被逼死，唐太宗的太子被废，康熙的太子两立两废。选太子，是皇帝家里最难的一道题。",s:"维基百科·太子",u:"https://zh.wikipedia.org/wiki/太子"},
      {q:"古代为什么常常「立嫡以长不以贤」",a:"因为「贤不贤」没法量化，「长不长」却一眼能看清。如果皇位按谁最贤明来选，每个皇子都可以说自己贤明，每个权臣都能推一个自己支持的皇子，国家立马内战。所以古人定下一条铁律：正妻（皇后）生的大儿子，不管他是笨是傻，都是法定继承人。这样所有人都不用争——规矩就是规矩。这条制度虽然死板，但它最大限度地减少了权力交接时的流血。历史上汉武帝、唐太宗、康熙都试过「立贤」，结果都引发了残酷的夺嫡。立长虽蠢，立贤更险。",s:"维基百科·宗法制",u:"https://zh.wikipedia.org/wiki/宗法制"},
      {q:"尧舜禹的「禅让」是真的让贤吗",a:"古书上说尧年老时不传位给儿子丹朱，而是禅让给贤明的舜；舜后来又禅让给治水有功的禹。儒家把这一段美化成「天下为公」的黄金时代。但另外一些记载——比如《竹书纪年》《韩非子》——却说舜是把尧囚禁起来、把丹朱赶走，才夺到的位子；禹的儿子启更是直接起兵杀了伯益，建立了夏朝。两种说法都流传至今。真相如何，没有直接证据。但「禅让」这个词后来被曹丕用得很溜：他逼汉献帝禅位给自己后，叹道「舜禹之事，吾知之矣」——原来所谓禅让，就是这么回事。",s:"维基百科·禅让制",u:"https://zh.wikipedia.org/wiki/禅让制"},
      {q:"大禹治水为什么改用「疏导」",a:"因为他爹鲧就是「堵」失败的。尧时洪水滔天，鲧奉命治水，用修堤坝、堵缺口的办法，治了九年，越堵越漏，被舜处死在羽山。禹接手后，改堵为疏：顺着地势把洪水引入江河、再导向大海。他带着人凿开龙门、疏通九河，辛苦十三年，三过家门而不入，终于把洪水治平。禹因此威望极高，舜把帝位禅让给他，他的儿子启建立了夏朝。「堵不如疏」这四个字，后来成了中国人处理一切危机的哲学——治水如此，治河、治国、治民，也是如此。",s:"维基百科·大禹治水",u:"https://zh.wikipedia.org/wiki/大禹治水"},
      {q:"古代打仗为什么要先写「檄文」",a:"因为打仗要先占个「理」字。古代大军出动前，统帅要写一篇文章，通告天下：我方为什么打、对方犯了什么罪、不投降是什么下场。这篇文章叫檄文，相当于古代的「开战公告」。陈琳为袁绍写的《讨曹操檄》，把曹操祖宗三代都骂了一遍，曹操当时正患头风，看完文章惊得一身冷汗，头风居然好了。骆宾王为徐敬业写的《讨武曌檄》，武则天看完反而夸他有才。一篇好的檄文，能让己方士气百倍、敌方人心惶惶——打仗还没开始，笔杆子先分了高下。",s:"维基百科·檄文",u:"https://zh.wikipedia.org/wiki/檄文"},
      {q:"古代的「门客」「养士」是怎么回事",a:"这是战国时代的「人才投资」。当时贵族纷纷供养一批有本事的人——会出主意的、会武功的、会学鸡叫的、会偷东西的——这些人叫门客或食客。最有名的是战国四公子：齐国孟尝君、赵国平原君、楚国春申君、魏国信陵君，每人门下都养着几千人。门客平时吃白饭，关键时刻为主人出力。孟尝君靠「鸡鸣狗盗」两门客逃出函谷关；信陵君靠「窃符救赵」的门客夺了兵权。养士不是做慈善，是战国贵族为自己留的「安全边际」——谁知道哪天哪门本事就救命？",s:"维基百科·战国四公子",u:"https://zh.wikipedia.org/wiki/战国四公子"},
      {q:"荆轲为什么敢孤身去「刺秦王」",a:"因为燕国真的走投无路了。战国末期，秦国先后灭赵破韩，大军压到燕国边境。燕太子丹早年在秦国做人质，受尽委屈，回国后想找办法挡住秦国。他找到游侠荆轲，让他假装献督亢地图和秦国叛将樊於期的首级，趁机劫持秦王嬴政，逼他退还六国土地。荆轲带着秦舞阳入秦，在咸阳宫献图，地图展开到最后，藏在里面的匕首露了出来——「图穷匕见」。荆轲抓匕首刺秦王，秦王绕柱而走，最终荆轲被杀死。这次刺杀失败后，秦军立刻伐燕，五年后秦统一天下。「风萧萧兮易水寒，壮士一去兮不复还」——他从出发那天起，就没打算回来。",s:"维基百科·荆轲",u:"https://zh.wikipedia.org/wiki/荆轲"},
      {q:"古代为什么会有「文字狱」",a:"因为皇帝太敏感，看什么文字都像在骂自己。从秦始皇的「焚书坑儒」到明清两代，文字狱就是因为文人写的诗、文章、科举试题被皇帝或特务机构解读出「谋反」「诽谤」的意思，作者被抄家、杀头、灭族。最有名的是清朝康熙、雍正、乾隆三朝：雍正时「维民所止」被解读为「雍正无头」，主考官查嗣庭死在狱中还被戮尸；乾隆时「一把心肠论浊清」，因为「浊」字放在「清」前面，作者被处死。文人不敢写诗、不敢写史，只能埋头考据。文字狱是专制对思想最直接的钳制。",s:"维基百科·文字狱",u:"https://zh.wikipedia.org/wiki/文字狱"}
    ],
    "自然":[
      {q:"为什么云是白色的，乌云却是黑色的？",a:"云的颜色，取决于云的厚度和光线。一朵云由无数小水滴和小冰晶组成，它们会把照到身上的阳光向各个方向散射，阳光是白色的，散射出来自然也是白色，所以晴天我们看到朵朵白云。可当云层变厚，阳光要穿过层层水滴，被一次次反射、吸收，到云底时已透不过去多少光，云的下方看起来就灰暗发黑——这就是乌云。雷雨云又高又厚，底部光线几乎全被挡住，所以黑得像要压下来。其实乌云和白云是同一种东西，区别只在于：白的是看得见阳光，黑的是阳光被自己挡住了。",s:"维基百科·云",u:"https://zh.wikipedia.org/wiki/云"},
      {q:"为什么盐碱地种不出庄稼？",a:"因为土壤里的盐分太多，把水「抢」走了。植物吸水靠根部的渗透压——根细胞里的浓度比土壤溶液高，水才会乖乖流进根里。可盐碱地里溶解的盐分浓度极高，土壤溶液的渗透压比根细胞还高，水不但进不去，甚至会被倒吸出来，植物根系严重缺水，自然长不起来。盐分本身对植物也有毒害，会破坏细胞、阻碍营养吸收。所以盐碱地上要么长着耐盐的碱蓬、柽柳，要么干脆一片荒芜。治理盐碱地，核心就是压盐排碱：灌水洗盐、深翻排水，把土里的盐分降下来，才能重新种出庄稼。",s:"科普中国",u:"https://cloud.kepuchina.cn/h5/detail?id=7438278850306940928"},
      {q:"为什么瀑布底下总是有一个深潭？",a:"因为水流的势能全砸在了河床上。瀑布从高处倾泻而下，水流带着巨大的冲击力，日复一日地砸在落点，河床的岩石被冲刷、撞击、掏蚀，越陷越深，渐渐挖出一个凹坑——就是深潭。而且瀑布落水还会卷起大量泥沙和碎石，这些「天然砂轮」随着水流在坑底旋转打磨，掏蚀效果加倍。深潭形成后，落水砸进潭里，冲击力被水缓冲，反而减慢了继续下切的速度，所以很多瀑布的潭都稳定在某个深度。看瀑布时别光顾着看水，脚下那个碧绿的深潭，其实是水流几万年凿出来的杰作。",s:"维基百科·瀑布",u:"https://zh.wikipedia.org/wiki/瀑布"},
      {q:"为什么有的沙丘会「唱歌」？",a:"这是著名的「鸣沙」现象。在特定的沙漠地带，沙粒大小均匀、颗粒圆润，表面还有一层极薄的「外壳」。风吹动沙层、或人从沙丘上滑下时，表层沙粒和下层沙粒剧烈摩擦振动，整片沙层像共鸣箱一样把声音放大，发出嗡嗡、低沉甚至像管风琴一样的声音，能持续几分钟，数公里外都听得见。不是所有沙子都会唱：颗粒太杂、太湿都不行，只有干燥、均匀、光滑的沙子才具备歌喉。我国敦煌的鸣沙山、宁夏的沙坡头，都是著名的会唱歌的沙丘。",s:"科普中国",u:"https://cloud.kepuchina.cn/newSearch/imgText?id=7500966346331717632"},
      {q:"为什么南北极会有极昼和极夜？",a:"因为地球是「歪着」转的。地球的自转轴相对公转轨道面倾斜约 23.5 度，这个倾斜让太阳光在一年里照射南北极的范围不断变化。夏天，太阳直射北半球，整个北极圈内连续几个月见不到日落，叫极昼；同一时间南极圈内却整日不见太阳，叫极夜。半年后地球转到轨道另一侧，情况刚好反过来。所以两极地区一年只有一次日出日落——极昼极夜各自持续约半年。在极地科考站，人们会经历一整个夏天不拉窗帘的日子，也有一整个冬天不见太阳、全靠灯光和维生素 D 撑着的时光。地球歪一歪，极地就有了黑白半年的奇观。",s:"维基百科·极昼",u:"https://zh.wikipedia.org/wiki/极昼"},
      {q:"为什么雷雨前总是又闷又热？",a:"因为雷雨云是「热空气顶出来的」。夏天午后地面被晒得滚烫，大量热空气快速上升，越升越高，水汽在高空凝结成庞大的积雨云。云里的空气上升时，把地面的热「锁」在低空，湿度又大，汗蒸发不出去，人就觉得又闷又热——闷热其实是雷雨的前奏，说明大气正在「憋大招」。等积雨云攒够能量，一场大雨倾盆而下，把闷热带走，气温立刻凉爽。所以老人说「闷热必有雷雨」，是有道理的：雷雨前，空气先把热全存着，再用一场雨一次性还给你。",s:"维基百科·积雨云",u:"https://zh.wikipedia.org/wiki/积雨云"},
      {q:"为什么沙漠昼夜温差那么大？",a:"因为沙漠里「存不住热」。沙子的比热容很小：白天太阳一晒，地表温度能冲到五六十摄氏度；可沙子导热性差，热量只留在表层。夜里太阳一落，地面很快把白天攒的热辐射回太空，加上沙漠空气干燥、云量极少，没有「被子」锁温，气温就直线下跌，一夜之间能降几十摄氏度。相比之下，海边有水和湿润空气当「保温层」，昼夜温差就小得多。沙漠的热来得快、去得也快，所以去沙漠要记住：白天防中暑，夜里防着凉。",s:"维基百科·沙漠气候",u:"https://zh.wikipedia.org/wiki/沙漠气候"},
      {q:"为什么雪花都是六角形？",a:"这是水分子「规定」好的。水结成冰晶时，分子会按特定角度彼此连接，这个角度让冰晶在生长时自然呈现出六边形的对称结构。温度、湿度不同，冰晶六个角长得快慢不一，于是演化出针状、片状、柱状、树枝状等各种形态，但万变不离其宗——始终保持着六角对称。所以放大镜下每片雪花都不一样，却都长着同一个「六角家族」的脸。雪花六角不是巧合，而是分子世界秩序之美：自然界最浪漫的图案，往往来自最严格的物理规则。",s:"维基百科·雪",u:"https://zh.wikipedia.org/wiki/雪"},
      {q:"为什么会有极光？",a:"极光是太阳送来的「礼物」。太阳风是从太阳吹出来的带电粒子流，平时被地球磁场挡在外面；可在南北两极，磁场线是「开口」的，带电粒子顺着这些线冲进高层大气，和那里的氧、氮原子猛烈碰撞，把能量交给它们。原子被激发后回落，就放出绿、红、紫等彩色光——这就是极光。绿色来自氧，红色和紫色多来自氮。极光只在高纬度出现，因为那里是地球磁场的「大门」。极光越绚烂，说明太阳越活跃。它不是云，也不是火，是带电粒子在高空大气里跳的光舞。",s:"维基百科·极光",u:"https://zh.wikipedia.org/wiki/极光"},
      {q:"为什么会发生日食？",a:"月球跑到了太阳和地球中间。月亮绕地球转，有时候正好转到太阳正前方，把太阳挡住。月影扫过地球，被影子遮住的地方的人，就看到太阳被一点点吃掉——这就是日食。月亮离地球近时能把太阳全挡住，叫日全食；离得远只能挡住中间一圈，叫日环食。日食不是天狗吃太阳，是一场刚好对齐的「日月排队」：三者几乎连成一条直线。因为月亮轨道有点斜，不是每个月都排得这么齐，所以日食并不常见。",s:"维基百科·日食",u:"https://zh.wikipedia.org/wiki/日食"},
      {q:"为什么会发生月食？",a:"地球跑到了太阳和月亮中间。满月的时候，地球正好挡在太阳和月亮之间，地球的影子落在月亮上，月亮慢慢钻进影子里，就发生月食。月食时月亮不会完全变黑，因为地球大气会把阳光折射一点到月亮上，其中红光偏多，所以月亮看起来古铜色、暗红色——这就是「红月亮」。月食半个地球的人都能同时看到，不像日食只有窄窄一条带。它不是妖怪吞月，只是地球的影子轻轻盖在了月亮脸上。",s:"维基百科·月食",u:"https://zh.wikipedia.org/wiki/月食"},
      {q:"为什么会有流星雨？",a:"地球撞上了彗星撒下的「灰渣」。彗星靠近太阳时，冰被晒化，一路上撒出大量尘埃和小碎屑，在轨道上留下一条碎石带。当地球每年公转经过这条带时，无数碎屑以每秒几十公里的速度撞进地球大气，和空气摩擦烧起来，在天空划出一道亮线——这就是流星。碎屑多的时候，一小时能看到几十上百颗，像下雨一样，叫流星雨。著名的英仙座、狮子座流星雨，都是地球定期穿过某颗彗星留下的尘埃带。",s:"维基百科·流星雨",u:"https://zh.wikipedia.org/wiki/流星雨"},
      {q:"为什么月亮有时会变成红色？",a:"那是月全食时的「红月亮」。月亮钻进地球本影后，太阳光本来被地球挡住，可地球大气会拐弯：阳光穿过厚厚的大气层，蓝紫光被散射掉，剩下红橙色的光被折射到月亮上，再从月亮反射回地球。于是月亮不是黑的，而是蒙上一层暗红、古铜色。月全食越明显，月亮越红。平时月亮靠近地平线时看着也偏红，那是月光斜穿大气，蓝光被散射掉、只剩红光的缘故。红月亮不是凶兆，是地球大气把阳光「滤」成红的，再打在月面上。",s:"维基百科·血月",u:"https://zh.wikipedia.org/wiki/血月"},
      {q:"为什么海水是咸的？",a:"河流花了几十亿年，把陆地的盐一点点搬进海里。雨水略带动酸性，冲刷岩石和土壤，溶解出钠、镁、氯等盐类，跟着江河一路流入大海。海水被太阳晒蒸发，变成云、再变成雨回到陆地，可盐留在海里，越积越多。几十亿年下来，海水盐度稳定在百分之三点五左右。海底火山、热泉也在持续往海里加矿物质。所以海水咸，不是一开始就咸，是陆地被河流「洗脱」了几十亿年，盐分全存进了海里。",s:"维基百科·海水",u:"https://zh.wikipedia.org/wiki/海水"},
      {q:"为什么会有潮汐？",a:"潮汐是月亮和太阳在「拉」海水。月亮虽然远，引力却能隔着地球起作用：正对月亮那一侧的海水被月亮引力拉起来，背对月亮那一侧因为地球本身被拉向月亮，海水相对往外凸，于是一天出现两次涨潮。太阳引力也参与，月圆月缺时日月引力叠加，潮水特别大，叫大潮；上弦下弦时两者拉扯方向垂直，潮水小，叫小潮。潮汐不是海在呼吸，是月亮、太阳和地球一起玩引力跷跷板。钱塘江大潮壮观，正是因为地形和潮月叠加。",s:"维基百科·潮汐",u:"https://zh.wikipedia.org/wiki/潮汐"},
      {q:"为什么台风是旋转的？",a:"这是地球自转在「搅局」。赤道附近热空气上升，周围空气流过来补充；可地球自西向东自转，流动的空气在北半球会被偏转成向右，南半球向左——这叫科里奥利力。流过来补位的空气一边往低压中心冲、一边被偏转，就绕着低压中心逆时针转起来（北半球），这就是台风。台风越转越快、能量越攒越大，中心形成风平浪静的台风眼。台风不是天上自己长出来的，是热带洋面的暖湿空气和地球自转一起拧出来的大漩涡。",s:"维基百科·台风",u:"https://zh.wikipedia.org/wiki/台风"},
      {q:"为什么会有龙卷风？",a:"它是强对流空气拧出的「大吸管」。夏天强雷雨云里，高空风速快、低空风速慢，两股风一搓，空中就慢慢打起转来，形成一根水平的空气旋管；再被上升气流往上一抬，旋管一头垂到地面，就成了龙卷风。它中心气压极低，像吸尘器一样把地面的东西吸起来，所到之处房倒树拔。龙卷风范围小、时间短，但风速极快，是大气里最暴烈的小漩涡。它不是龙在喷水，是雷雨云里的风被拧成了一根通天的吸管。",s:"维基百科·龙卷风",u:"https://zh.wikipedia.org/wiki/龙卷风"},
      {q:"为什么火山会喷发？",a:"地下的岩浆憋不住了。地球内部又热又压，岩石被熔成岩浆，里面还溶着大量气体。岩浆比周围岩石轻，慢慢往上涌，聚集在地下岩浆房里。上面的岩层像个塞子，压得越久，岩浆和气体攒得越多；一旦压力大过岩层承受极限，岩浆、气体、火山灰顺着最薄弱的裂缝冲出来——就是火山喷发。气体膨胀把岩浆炸成碎末，冲上高空再落下来；黏稠的岩浆堵在通道里，喷发尤其猛烈。火山不是发脾气，是地下高温高压在找出口。",s:"维基百科·火山",u:"https://zh.wikipedia.org/wiki/火山"},
      {q:"为什么会有温泉？",a:"地下水被地下的热「煮热」了。雨水渗进地下深处，被地热（靠近岩浆或被地下热源烤着）加热，再顺着裂缝涌回地面，就是温泉。越往地下越热，每深一百米温度约升三摄氏度；如果附近有年轻火山活动，热源更近，水温更高。温泉里的矿物质来自岩石溶解，所以不同温泉味道、颜色不同：含硫磺的臭鸡蛋味，含铁的发红。温泉不是谁在地下烧水，是地下水在地下被地热当了一回「锅」。",s:"维基百科·温泉",u:"https://zh.wikipedia.org/wiki/温泉"},
      {q:"为什么钟乳石会慢慢长大？",a:"那是水在洞顶「滴石头」。溶洞里的水溶解了石灰岩里的碳酸钙，一滴一滴从洞顶渗下来。每滴水落到洞顶时，因为压力变化和水分蒸发，析出一点碳酸钙，像粉笔灰一样挂在顶上。一年一年，这些沉淀一点点堆下来，越堆越长，长成下垂的钟乳石；水滴到洞底，同样析出碳酸钙，向上堆成石笋。钟乳石和石笋越长越近，最后接成一根石柱。它们一百年才长几毫米，一根大钟乳石可能长了几十万年。石头会「长」，是水在一点一点搬石头。",s:"维基百科·钟乳石",u:"https://zh.wikipedia.org/wiki/钟乳石"},
      {q:"为什么会有溶洞？",a:"是水把石灰岩「溶」出来的。石灰岩主要成分是碳酸钙，本来很硬；可雨水里溶了二氧化碳，变成弱碳酸，一路渗进岩石裂缝，把碳酸钙一点点溶蚀掉。几万年、几十万年下来，裂缝被溶成通道，通道又溶成大厅，就成了溶洞。洞顶和洞壁继续滴水，长出钟乳石、石笋。桂林芦笛岩、宜兴善卷洞，都是地下水花了几十万年雕刻出来的。溶洞不是谁挖的，是一滴一滴弱碳酸水，慢慢啃出来的地下宫殿。",s:"维基百科·溶洞",u:"https://zh.wikipedia.org/wiki/溶洞"},
      {q:"为什么石头里会有化石？",a:"古生物死后被泥沙迅速埋住，没腐烂掉。动物的硬壳、骨骼埋在泥沙里，周围的泥沙慢慢压实变成岩石；地下水中的矿物质一点点渗进骨骼，把原来的骨头替换成石头——这个过程叫石化。亿万年后，地壳抬升、风雨剥蚀，岩石被削开，里面的生物形状露出来，就是化石。恐龙骨架、三叶虫、远古树叶，都是这样变成石头的。化石不是古生物「变成」了石头，是它们的形状被石头原样保存了下来，成了地球的日记本。",s:"维基百科·化石",u:"https://zh.wikipedia.org/wiki/化石"},
      {q:"为什么琥珀里会包着小虫子？",a:"那是远古松树的树脂。亿万年前，松树受伤时会流出黏稠的松脂，一滴一滴往下挂。小虫子路过或停在上面，被粘住逃不掉；松脂继续滴，把它整只包起来，最后变硬成了化石——琥珀。树脂密封、抗菌，虫子的外形、翅膀、甚至绒毛都被原样保存，像时间胶囊。矿工从煤层或砂岩里挖出琥珀，切开就看到几千万年前的小昆虫还在里面。琥珀不是石头里长虫，是远古松脂把小虫子封印了几千万年。",s:"维基百科·琥珀",u:"https://zh.wikipedia.org/wiki/琥珀"},
      {q:"为什么煤和石油是古代生物变的？",a:"煤是几亿年前的植物变的。石炭纪等古代，大量森林长在沼泽里，死后倒在水里，没被完全腐烂，被泥沙一层层盖住；在地下高温高压下，经过亿万年，植物纤维慢慢变成煤。石油和天然气则是古代海洋里浮游生物、藻类的遗骸，沉到海底被泥沙掩埋，在地下高温高压下「熬」成了黑油和气。所以我们今天烧煤、加油，本质上是在用几亿年前存下来的太阳能——远古植物吸的阳光，被埋到今天才烧。",s:"维基百科·煤",u:"https://zh.wikipedia.org/wiki/煤"},
      {q:"为什么高山上会有冰川？",a:"因为高山上下雪不化，一年年堆成了冰。高山上温度常年在零度以下，夏天也不暖和，冬天下的雪到第二年还没化。一年一年新雪压陈雪，下面的雪被压得越来越紧，气泡被挤出去，慢慢变成蓝色的冰川冰。冰厚到一定程度，在重力作用下会顺着山谷慢慢往下滑，像一条凝固的河——这就是冰川。冰川往下滑到温度高的地方，末端融化成水，就是大江大河的源头。高山冰川不是冻住的河，是雪被压了几百年压出来的冰。",s:"维基百科·冰川",u:"https://zh.wikipedia.org/wiki/冰川"},
      {q:"为什么红树林能长在海里？",a:"它有一整套「海上生存装备」。红树林泡在又咸又淹的海水里，叶子能把多余的盐排出去；树干上长出许多露出水面的呼吸根，涨潮被淹时也能透气；种子提前在树上发芽成小苗，再掉下去插进泥里，像小棒槌一样扎住，不会被潮水冲走。所以红树林能在海边滩涂成片生长，风浪越大它越稳，是海岸的天然防护林。它不是普通树硬下海，是专门进化出了一套耐盐、耐淹、能呼吸的本事。",s:"维基百科·红树林",u:"https://zh.wikipedia.org/wiki/红树林"},
      {q:"为什么仙人掌能在沙漠里活下来？",a:"它把自己改成了「节水仓库」。沙漠里雨水极少，仙人掌的叶子退化成刺，大大减少水分蒸发——叶子本来是失水大户，变成刺后还能防动物啃；茎变得肥厚多汁，平时存水，下雨时一顿喝饱，够撑几个月；表面还有一层蜡质，锁住水分。根系又广又浅，一下雨就拼命吸收。所以仙人掌能在几乎不下雨的沙漠里活好几年。它不是耐旱，是把自己改造成了一棵会存水、几乎不漏水的植物。",s:"维基百科·仙人掌",u:"https://zh.wikipedia.org/wiki/仙人掌"},
      {q:"为什么臭氧层那么重要？",a:"臭氧层是地球的「防晒霜」。它在离地面二十到三十公里的高空，集中了大气里大部分臭氧。臭氧分子有个本事：能吸收太阳光里对生物有害的紫外线。没有这层臭氧，紫外线直射地面，人和动物皮肤癌、眼病会暴增，植物也会被晒伤。上世纪发现冰箱里的氟利昂会破坏臭氧，南极上空出现臭氧洞，全球后来签了蒙特利尔公约淘汰这类气体。现在臭氧层在慢慢恢复。它看不见摸不着，却替所有生命挡住了太阳最毒的那束光。",s:"维基百科·臭氧层",u:"https://zh.wikipedia.org/wiki/臭氧层"},
      {q:"为什么会有温室效应？",a:"大气像一层棉被，把地面散出去的热留住。太阳的短波辐射穿过大气晒热地面，地面再向外散出长波红外热。二氧化碳、甲烷、水蒸气这些温室气体会吸收长波热，不让它直接跑回太空，而把热量留在低层大气里——这就是温室效应，是地球保持宜居温度的关键。没有它，地球平均温度会降到零下十几度。可人类烧煤、排森林、养牲畜，温室气体越来越多，被子越盖越厚，地球就越来越热，这就是全球变暖。温室效应本身不是坏事，过了头才是问题。",s:"维基百科·温室效应",u:"https://zh.wikipedia.org/wiki/温室效应"},
      {q:"为什么高山上有一条「雪线」？",a:"因为山到一定高度，夏天也化不完雪。山脚下温暖，冬天的雪夏天全化光；越往上越冷，到某个高度，冬天积的雪夏天只化掉一部分，年年累积，就成了终年不化的积雪和冰川。这条「夏天雪线之上、雪不化完」的分界线，就是雪线。纬度越低、越干燥的地方，雪线越高——赤道附近雪线在五六千米；到了极地，海平面就已经是雪线了。雪线不是人画上去的，是温度在山上画的一条线：线以上，冬天的雪赢了夏天的热。",s:"维基百科·雪线",u:"https://zh.wikipedia.org/wiki/雪线"},
      {q:"为什么一年会有春夏秋冬？",a:"因为地球是歪着身子公转的。地球自转轴倾斜约二十三点五度，绕太阳转一圈要一年。当地球转到这一侧，北半球倾向太阳，阳光直一点、照得久，就是夏天；转半圈后，北半球斜着背对太阳，阳光斜、白天短，就是冬天。春秋两季是过渡。南半球和北半球季节正好相反：我们过夏天，澳大利亚过冬天。所以不是地球离太阳远近决定季节（其实冬天地球离太阳更近），而是地轴倾斜让阳光照射角度变了。地球歪一歪，人间就有了四季。",s:"维基百科·四季",u:"https://zh.wikipedia.org/wiki/季节"},
      {q:"为什么会有白天和黑夜？",a:"因为地球在不停地自转。地球是个不透明的大球，太阳一次只能照亮半个球面。地球每二十四小时自西向东转一圈，你所在的地方转到向阳面，就是白天；转到背阳面，就是黑夜。所以太阳看起来从东边升起、西边落下，其实是你自己被地球转着换了个方向。空间站里的宇航员，九十分钟就能经历一次日出日落，因为他们转得比我们快。白天黑夜不是太阳在动，是地球在把你轮流送到向阳面和背阳面。",s:"维基百科·地球自转",u:"https://zh.wikipedia.org/wiki/地球自转"},
      {q:"为什么太阳每天东升西落？",a:"不是太阳在走，是地球在转。地球自西向东自转，所以我们站在地球上看，天体都像从东边冒出来、往西滑下去。太阳、月亮、星星都是这个道理。地球自转一圈大约二十四小时，于是太阳每小时「走」十五度。你坐飞机从北京飞纽约，会经历一次特别长的白天——你在顺着地球自转方向追太阳。东升西落，是地球给所有天体安排的统一「时刻表」。",s:"维基百科·太阳",u:"https://zh.wikipedia.org/wiki/太阳"},
      {q:"为什么月亮会有圆缺？",a:"月亮本身不发光，靠反射太阳。月亮绕地球转，一个月一圈。我们看到的「月亮脸」，其实是月亮被太阳照亮的那一半，转到不同角度时露给我们的部分不一样：正对我们全亮时是满月；只照到侧边时是弯弯月牙；转到地球和太阳之间，被照亮的那面背对我们，就是看不见的新月。月相变化不是月亮被吃了一块，是我们在不同角度看那半个被照亮的球面。一个月，月亮把自己的「亮面」转着给我们看了一圈。",s:"维基百科·月相",u:"https://zh.wikipedia.org/wiki/月相"},
      {q:"为什么银河看起来像一条光带？",a:"因为我们正躺在银河系里面。银河系是一个巨大的盘状恒星系统，上千亿颗星星排在一个扁圆盘里。太阳系就嵌在这个盘的边缘附近，我们往盘的中心方向看，密密麻麻的星星叠在一起，肉眼分辨不出单颗，就成了一条白茫茫的光带；往盘外看，星星稀稀拉拉。所以银河不是天上一条河，是我们顺着银河系圆盘往里看，看到的无数恒星挤在一起的光。秋天的夜空，那条斜跨天际的亮带，就是我们所在星系的切面。",s:"维基百科·银河",u:"https://zh.wikipedia.org/wiki/银河"},
      {q:"为什么白天看不到星星？",a:"不是星星下班了，是太阳光太亮，把它们淹没了。白天太阳把地球大气照得蓝蓝亮亮，这层亮光比遥远的星光强几百万倍，瞳孔一缩，暗弱的星星就被「盖住」了。其实星星白天一直挂在天上，宇航员在太空没有大气散射，白天照样能看到星星。日全食时，天一下子黑下来，能看到几颗最亮的星。所以星星不是晚上才出来，是白天的天空太亮，它们不好意思露面。",s:"维基百科·星光",u:"https://zh.wikipedia.org/wiki/恒星"},
      {q:"为什么草叶上会有露水？",a:"夜晚地面和草叶散热很快，温度降到露点以下，空气里的水蒸气就在草叶上凝成小水珠。白天晒了一天，空气里水汽多；夜里地面辐射散热快，草叶特别凉，贴在它旁边的空气一下子装不住那么多水汽，多余的水汽就抱成小水珠挂在叶尖——这就是露。夏天清晨草地湿漉漉、蜘蛛网上挂一串珍珠，都是露。露不是从天上掉下来的，是空气里的水汽在凉草叶上「现形」。",s:"维基百科·露",u:"https://zh.wikipedia.org/wiki/露"},
      {q:"为什么冬天早晨会有霜？",a:"霜是水蒸气直接冻成的小冰晶。冬天夜里地面温度降到零度以下，贴地空气里的水蒸气不经过液态，直接在草叶、瓦片上凝华成白色的小冰晶，就是霜。霜和露是亲兄弟，区别只在于地面温度：高于零度结露，低于零度结霜。霜打蔬菜后特别甜，是因为低温刺激植物把淀粉转化成糖来防冻。冬天早上车窗上那层冰花，也是霜。霜不是下下来的雪，是水蒸气在冷面上「冻」出来的花。",s:"维基百科·霜",u:"https://zh.wikipedia.org/wiki/霜"},
      {q:"为什么山里的雾一会儿来一会儿散？",a:"雾是贴地面的云。山里地形复杂，白天太阳晒热山坡，山谷里的湿空气被抬升，遇冷凝结成小水滴，聚成雾；风一吹、太阳再晒，小水滴蒸发，雾又散了。山谷常常清晨起雾、中午散开，因为夜间山风把冷空气灌进谷底，水汽凝结成雾；一上午阳光加热，雾就抬升成云。山顶在云雾里、山脚下却晴天，是因为雾被抬到了山腰。雾不是神秘仙气，是山里空气在冷热间反复折腾出来的小水珠。",s:"维基百科·雾",u:"https://zh.wikipedia.org/wiki/雾"},
      {q:"为什么江南会有梅雨季节？",a:"这是北方冷空气和南方暖湿空气在长江中下游「拉锯」。每年六七月，来自太平洋的暖湿气流北上，和从北方下来的冷空气在江淮一带相遇，谁也推不动谁，形成一条长长的雨带，在这一带来回摆动，一下就是一个月。天天下小雨、衣服晾不干、东西发霉——所以叫梅雨。等夏天彻底站稳，雨带北抬到华北，梅雨才结束。梅雨不是谁特别多雨，是冷暖空气在江南上空僵持不下，雨就下个没完。",s:"维基百科·梅雨",u:"https://zh.wikipedia.org/wiki/梅雨"},
      {q:"为什么秋老虎那么厉害？",a:"秋老虎是副热带高压在秋后又回来「打卡」。立秋之后，本来该凉快了，可西太平洋副热带高压偶尔西伸北抬，重新控制江南、华南一带，天空晴朗、太阳毒辣，连续十几二十天又热又晒，像回到了三伏。这种回马枪式的高温，就是秋老虎。它特点是白天晒得狠、早晚却凉，不像三伏那样闷。老人说「秋凉还有十八天地火」，说的就是这股反扑的热气。秋老虎不是秋天变热，是夏天临走前再回头烫你一下。",s:"维基百科·秋老虎",u:"https://zh.wikipedia.org/wiki/秋老虎"},
      {q:"为什么春天会有倒春寒？",a:"春天本来该暖了，可冷空气还没退休。春天太阳北抬，南方暖湿气流开始北上，气温回升；但北方西伯利亚的冷空气还很有后劲，每隔一段时间就大举南下，打个回马枪，把刚穿上薄外套的人又冻回去。倒春寒就是这种回暖后突然大幅降温的天气，对刚开花的果树、刚出苗的庄稼特别伤害。春天的天气就像小孩的脸，一天暖一天冷，是冷暖气团在交接岗位上反复拉扯。",s:"维基百科·倒春寒",u:"https://zh.wikipedia.org/wiki/倒春寒"},
      {q:"为什么钱塘江大潮那么壮观？",a:"喇叭形河口把潮挤大了。钱塘江入海口外宽内窄，外面杭州湾宽达上百公里，往里越来越窄，到海宁盐官一带只剩几公里。东海涨潮时，一大片海水往里涌，被两岸一挤，水位越堆越高，前面的潮走不动，后面的潮又涌上来，潮头越叠越高，最后掀起一道几米高的水墙，轰隆隆推上来——就是钱塘潮。再加上江水向东流，和潮头顶头撞，潮更猛。中秋节前后日月引力叠加，潮最大。",s:"维基百科·钱塘江大潮",u:"https://zh.wikipedia.org/wiki/钱塘江大潮"},
      {q:"为什么会有海啸？",a:"它不是海浪，是海底在「晃」。海底地震、火山爆发或大滑坡，一下子把大片海水顶起来或砸下去，巨大的水体被推动，以极快的速度向四周扩散。在外海它只是一道不起眼的低涌，可一到浅海，水变浅、浪被挤高，堆成几十米高的水墙扑上岸。海啸和普通风浪完全不同：风浪只动表层水，海啸是整层海水从底到面一起冲。所以海啸到来前，海水常常先突然退下去，露出大片海底——那是大浪在憋大招。",s:"维基百科·海啸",u:"https://zh.wikipedia.org/wiki/海啸"},
      {q:"为什么会有地震？",a:"地球的岩石圈不是整块，而是裂成好几块「板块」，像裂开的蛋壳。板块在地下缓慢移动，互相挤、互相撞，边缘积累巨大应力；应力攒到岩石扛不住，突然断裂、错动，能量一下子释放出来，地震波传遍地面，就是地震。所以地震多发生在板块边界——比如环太平洋地震带。浅源地震离地面近、破坏大；深源地震人感觉弱，但范围广。地震不是地在发脾气，是板块在缓慢挪动时，突然「咔」地错了一下。",s:"维基百科·地震",u:"https://zh.wikipedia.org/wiki/地震"},
      {q:"为什么有的温泉会定时喷泉水？",a:"那是间歇泉，像一口天然高压锅。地下有个弯弯的管道，底下被岩浆或地热烤着，水越热越多、压力越大；可上面的冷水压住，水一时喷不出来。等底下的水被烧成过热状态，突然沸腾膨胀，把管里的水一股脑顶出地面——喷一大阵。喷完后，地下水又慢慢渗回来、重新加热，攒上几小时或几天，再喷一次。美国黄石公园的老忠实泉，就是著名的间歇泉。它不是被人开关控制，是地下这口「高压锅」在反复憋压、喷气。",s:"维基百科·间歇泉",u:"https://zh.wikipedia.org/wiki/间歇泉"},
      {q:"为什么会有天坑？",a:"地下溶洞塌了个顶。在厚层石灰岩地区，地下水长年累月溶蚀出巨大的地下溶洞；溶洞顶部越来越薄，终于撑不住上面岩层的重量，轰然塌陷，露出一个圆形的大深坑，四周是笔直的崖壁，坑底常常有地下河。中国广西、贵州天坑特别多，因为那里石灰岩厚、雨水足。天坑里往往藏着与世隔绝的小生态，长着外面见不到的植物。天坑不是谁挖的井，是地下溶洞天花板塌下来的结果。",s:"维基百科·天坑",u:"https://zh.wikipedia.org/wiki/天坑"},
      {q:"为什么云南石林那么奇特？",a:"那是雨水把石灰岩「雕刻」出来的。几亿年前这里是一片浅海，沉积了厚厚的石灰岩；后来地壳抬升成陆地，雨水顺着石灰岩的裂缝慢慢溶蚀，裂缝越溶越深、越溶越宽，剩下没被溶掉的部分，就成了一根根矗立的灰色石柱，远看像石头森林。昆明石林、桂林山水都是同一种地貌——喀斯特。石柱高低错落、尖尖薄薄，是雨水花了几千万年「刻」出来的。不是古人搬来的石头，是水在大地上凿出的一片石头盆景。",s:"维基百科·石林",u:"https://zh.wikipedia.org/wiki/石林"},
      {q:"为什么会有丹霞地貌？",a:"红色砂砾岩被流水和风雨切成了城堡。一亿多年前，这里是内陆盆地，河流带来大量泥沙、碎石，一层层沉积成厚厚的红色砂砾岩——因为含铁多，石头呈丹红色。后来地壳抬升，流水顺着岩石的垂直裂缝下切，把平整的岩层切成一座座顶平、身陡、麓缓的红色城堡、方山、石墙。福建武夷山、广东丹霞山、张掖七彩丹霞都是这类。远远看去，一片红赤壁立在青山绿水间，像天上的霞光落到了地上。",s:"维基百科·丹霞地貌",u:"https://zh.wikipedia.org/wiki/丹霞地貌"},
      {q:"为什么戈壁上会有「魔鬼城」？",a:"那是风把岩石吹出来的城。干旱地区昼夜温差大，岩石热胀冷缩一层层剥裂；再加上常年刮大风，风卷着沙粒像砂纸一样打磨岩石，软的岩层被吹走、硬的留下来，被雕成一座座奇形怪状的土丘、城堡、街巷。晚上大风穿过这些土丘，呜呜作响，像鬼哭狼嚎，所以叫魔鬼城。它的学名叫雅丹地貌，是风的杰作。新疆罗布泊、甘肃敦煌一带最典型。所谓城堡，不是人造的，是狂风在戈壁上吹了几十万年吹出来的泥塑。",s:"维基百科·雅丹地貌",u:"https://zh.wikipedia.org/wiki/雅丹"},
      {q:"为什么沙漠里会有绿洲？",a:"那是地下水流到了地面。沙漠里不是完全没有水，高山上的冰川融水顺着地下透水层流到沙漠边缘，在地势低的地方冒出来，形成泉或浅湖。水一出露，植物就活了，慢慢长成一片片绿洲。新疆塔克拉玛干沙漠边的绿洲，靠的就是昆仑山、天山的雪水。绿洲像沙漠里的小岛，行人沿绿洲连成商路。所以沙漠里不是遍地黄沙，只要地下有水露头的地方，就藏着一片生机。",s:"维基百科·绿洲",u:"https://zh.wikipedia.org/wiki/绿洲"},
      {q:"为什么湖水有的咸有的淡？",a:"看出水口。有河流流出的湖，盐跟着河水一起排走，就是淡水湖——比如鄱阳湖、洞庭湖。湖水只进不出、又被太阳猛晒，蒸发掉的是纯水，盐分留下来，越积越咸，就成了咸水湖——青海湖、死海都是这样。一个湖咸不咸，关键看它有没有「出水口」：有出水口，盐随水走；没出水口，盐越攒越多。青藏高原上很多咸水湖，就是因为冰川退缩后，蒸发量大于补给量，盐分留下来了。",s:"维基百科·咸水湖",u:"https://zh.wikipedia.org/wiki/咸水湖"},
      {q:"为什么长江黄河都自西向东流？",a:"因为中国的地势西高东低。青藏高原平均海拔四五千米，像一座世界屋脊；往东是高原、盆地，再往东是平原，一直降到海边。水往低处流，发源于西部高原的大江，自然顺着地势一路向东，冲进大海。长江、黄河、珠江、黑龙江，大多这方向。这种西高东低的三级台阶，是几千万年前印度板块撞欧亚板块、把青藏高原顶起来形成的。水往东流，不是老天爷安排，是大地西边被顶高了。",s:"维基百科·中国河流",u:"https://zh.wikipedia.org/wiki/中国河流"},
      {q:"为什么大河入海口会有三角洲？",a:"那是河流自己带沙堆出来的。江河一路从山上冲下来，夹带大量泥沙；到了入海口，地势平缓、水流变慢，再加上海水顶托，泥沙再也带不动，纷纷沉下来。一年一年，泥沙越堆越多，露出水面，形成扇形的平原，形状像希腊字母Δ，所以叫三角洲。长江三角洲、珠江三角洲、黄河三角洲，都是河水几万年搬沙堆出来的沃土。三角洲土地肥、人口密，是文明的摇篮。",s:"维基百科·三角洲",u:"https://zh.wikipedia.org/wiki/三角洲"},
      {q:"为什么黄土高原有那么厚的黄土？",a:"那是西北风刮了两百万年堆出来的。西北方向沙漠广布，冬春季节大风把细小的粉尘吹起来，一路往东南飘，碰到秦岭、太行山被挡住，慢慢沉降下来。两百万年下来，粉尘堆成几十到几百米厚的黄土层。黄土疏松多孔、直立性好，所以窑洞能挖得很结实；但也容易被雨水冲刷，形成千沟万壑。黄土不是本地的土，是风从沙漠那边远道搬来的「尘雪」，一层一层盖了几百万年。",s:"维基百科·黄土高原",u:"https://zh.wikipedia.org/wiki/黄土高原"},
      {q:"为什么喜马拉雅山还在长高？",a:"因为板块还在挤。五千万年前，印度板块从南边往北撞，撞到欧亚板块上，两个板块都不肯让，边界被顶得越来越高，挤出了喜马拉雅山和青藏高原。直到今天，印度板块还在以每年几厘米的速度往北推，珠峰每年大约长高几毫米。所以它不是一座死山，是一座还在被挤高的「活山」。几千万年后，它可能还会更高。山在长高，不是传说，是板块在持续较劲。",s:"维基百科·喜马拉雅山脉",u:"https://zh.wikipedia.org/wiki/喜马拉雅山脉"},
      {q:"为什么东非大裂谷像一道大伤疤？",a:"那是地球地壳正在「裂开」。非洲板块和旁边的板块在向两边分离，地壳被拉薄、拉裂，形成一条几千公里长的大裂谷，谷底下沉，两边是陡峭的悬崖。裂谷里串着一连串狭长的湖——坦噶尼喀湖、马拉维湖。再过几千万年，海水会灌进来，这里可能变成新的海洋。东非大裂谷不是造出来的风景，是地球正在被掰开的现场。人类最早的化石就在裂谷里被发现，所以它也被称为「人类的摇篮」。",s:"维基百科·东非大裂谷",u:"https://zh.wikipedia.org/wiki/东非大裂谷"},
      {q:"为什么马里亚纳海沟那么深？",a:"那是海洋板块钻到大陆板块底下去的地方。太平洋板块密度大、位置低，往西俯冲到菲律宾板块下面，两块板交汇的地方被拉出一道极深的海沟——最深处约一万一千米，把整座珠峰放进去还没顶。海沟里压力是地表的一千多倍，终年黑暗冰冷，却依然有生命。它是地球板块俯冲带的天然剖面。海沟不是海底有个洞，是两块板块挤在一起，一块低头钻到了另一块下面。",s:"维基百科·马里亚纳海沟",u:"https://zh.wikipedia.org/wiki/马里亚纳海沟"},
      {q:"为什么深海热泉附近会有生物？",a:"那是一片不靠太阳的生命绿洲。海底火山裂缝喷出滚烫的含硫热泉，细菌和古菌靠化学能把硫化物变成能量，构成食物链底层；然后虾、蟹、白蛤、管状蠕虫围上来，形成热闹的生态。这里终年不见阳光，和光合作用无关，全靠地球内部的化学能养活。科学家认为，地球生命最早可能就诞生在这种热泉口附近。深海热泉不是荒凉的海底沙漠，是地球内部能量养出来的一片外星般的丛林。",s:"维基百科·深海",u:"https://zh.wikipedia.org/wiki/深海"},
      {q:"为什么南极比北极更冷？",a:"因为南极是一块大陆，北极是一片海洋。南极中心是平均两千米厚的冰盖盖着的陆地，陆地吸热快、散热也快，冰面又把阳光反射掉，年平均气温零下五十度；北极是北冰洋，海水虽然冷，却能储存热量、缓慢释放，像个大暖水袋，气温比南极高十几二十度。所以南极最低气温能到零下八十九度，北极熊待的北极比企鹅待的南极暖和多了。南极冷，是因为它脚下是陆地；北极暖和，是因为它底下是海。",s:"维基百科·南极洲",u:"https://zh.wikipedia.org/wiki/南极洲"},
      {q:"为什么冰山只露出一个小角？",a:"因为冰的密度比海水小，大部分体积藏在水下。冰比水轻，大约一成浮在水面、九成藏在水里。你看到海面那一小块尖尖的冰山，下面其实拖着一个巨大的水下山体，形状还不规则——这就是「冰山一角」。泰坦尼克号就是侧面撞上了水面下看不见的那部分，才被划开钢板。所以在冰区航行，老远看见一小块冰，千万要绕得远远的，真正的大块头藏在水面下。看到的只是十分之一，水下才是九分。",s:"维基百科·冰山",u:"https://zh.wikipedia.org/wiki/冰山"},
      {q:"为什么雪崩那么可怕？",a:"因为山坡上的积雪本来就不稳定。高山上风把雪吹成一层一层的板状雪，有的层硬、有的层松，像叠饼干。一旦被新降雪、动物经过或声音震动触发，那层松雪突然失稳，整面山坡的雪开始滑——越滑越快，卷进碎石和空气，变成一堵几百米宽、每秒几十米的雪墙。人埋进去几分钟就窒息。雪崩不是雪自己想跑，是山坡上那叠「雪饼干」被轻轻一碰，整片垮了下来。",s:"维基百科·雪崩",u:"https://zh.wikipedia.org/wiki/雪崩"},
      {q:"为什么冬天树枝上会有雾凇？",a:"那是过冷水汽在树枝上冻出来的花。冬天湖面没完全封冻，蒸发上来的水汽，遇到极冷的树枝，来不及变成水滴就直接凝华成冰晶，一层一层挂在树枝上，像开满白色的花——这就是雾凇。吉林雾凇最有名，因为松花江水电站发电后水温较高，冬天还在冒水汽，碰上零下二十多度的树，一夜之间就挂满玉树琼枝。雾凇不是雪，是水汽在冷树枝上「冻」出来的冰花，天亮日出后最漂亮。",s:"维基百科·雾凇",u:"https://zh.wikipedia.org/wiki/雾凇"},
      {q:"为什么太阳周围有时会出现一圈光圈？",a:"那是日晕，是高空冰晶在折光。五千米到一万米高空常常有卷层云，里面布满六方柱状的小冰晶。阳光穿过这些小冰晶时，被折射、反射，在太阳周围形成一圈彩色或白色的亮环——常见的是二十四度晕。月亮周围也会出现类似的亮圈，叫月晕。民间说「日晕三更雨，月晕午时风」，因为卷层云常常跟着锋面雨系过来。那圈光环不是太阳长了头发，是高空冰晶把阳光拆了个圈给你看。",s:"维基百科·日晕",u:"https://zh.wikipedia.org/wiki/日晕"},
      {q:"为什么峨眉山顶会看到「佛光」？",a:"那是阳光、云海和你自己一起演的戏。清晨或傍晚，你站在山顶，背后是低角度的太阳，前面是一片云海。阳光照在你身上，影子投到前面的云雾上；云雾里的小水滴把光衍射、干涉，在影子周围晕出一圈彩色光环——你的影子被光环罩着，像菩萨背光。这就是峨眉宝光。它不是佛显灵，是阳光穿过小水滴时自己绕出来的彩色环。更妙的是，那光环里的影子永远是你自己，谁站着就是谁的影子。",s:"维基百科·宝光",u:"https://zh.wikipedia.org/wiki/宝光"},
      {q:"为什么太阳黑子会影响地球？",a:"太阳黑子是太阳表面温度较低的斑块，看起来黑，其实比熔炉还热。它不是太阳长斑，而是太阳磁场特别强的地方，抑制了对流，温度稍低。黑子成群出现时，往往伴随耀斑和日冕物质抛射，把大量带电粒子和X射线抛向太空。这些粒子抵达地球，会干扰卫星、通信、电网，在两极拉出极光。黑子有十一年的周期，多时太阳活跃，少时太阳安静。太阳脸上的斑点，其实是它在打喷嚏。",s:"维基百科·太阳黑子",u:"https://zh.wikipedia.org/wiki/太阳黑子"},
      {q:"为什么彗星会拖着长尾巴？",a:"那是太阳风在吹它。彗星是一颗脏雪球，由冰、尘埃和碎石组成。平时它在遥远的冰冷深空，安安静静。一靠近太阳，冰被晒化、升华，喷发出大量气体和尘埃，形成朦胧的彗发；太阳风和太阳光压把这些物质往外推，推成一条长长的尾巴——永远背向太阳。越靠近太阳尾巴越长，远离后尾巴消失。彗星的尾巴不是它「跑」出来的，是太阳风在它屁股后面吹出来的。",s:"维基百科·彗星",u:"https://zh.wikipedia.org/wiki/彗星"},
      {q:"为什么流星会划亮夜空？",a:"那是宇宙小碎石在大气里烧起来。绕太阳转的不止行星，还有无数尘埃和小石块。地球公转时撞上这些碎屑，它们以每秒几十公里的速度冲进大气，和空气剧烈摩擦、压缩空气，温度瞬间升到几千度，烧得发白光——这就是流星。大多数小颗粒在高空就烧光了，像一道转瞬即逝的光；大一点的没烧完落到地面，就是陨石。流星不是星星在掉，是星际小石子在地球大气里最后烧了一把。",s:"维基百科·流星",u:"https://zh.wikipedia.org/wiki/流星"},
      {q:"为什么月亮正在慢慢远离地球？",a:"是潮汐在「偷走」地球的自转能。月亮引力在地球上拉出潮汐隆起，地球自转比月亮公转快，这个隆起被地球自转带到月亮前方，反过来把能量一点点传给月亮，让月亮轨道越变越高。结果是：月亮每年远离地球约三点八厘米，和指甲生长速度差不多。同时地球自转在变慢，几亿年前一天只有二十多小时。几十亿年后，月亮会远到日全食都看不到了。月亮不是越飞越远，是地球在通过潮汐把能量送给它。",s:"维基百科·潮汐加速",u:"https://zh.wikipedia.org/wiki/潮汐加速"},
      {q:"为什么海边昼夜温差小？",a:"因为海水是个大空调。水的比热容大——晒一天，海水升不了多少温；夜里散热，又慢又稳。海边的空气被海水这么一调节，白天不怎么热、晚上不怎么冷，昼夜温差小。陆地就不同，沙土比热容小，白天晒得烫、夜里冷得快。所以海边夏天凉快、冬天暖和，是避暑和过冬的好地方；内陆沙漠昼夜能差二十度。海洋不是普通的水，它是地球最大号的温度缓冲器。",s:"维基百科·海洋性气候",u:"https://zh.wikipedia.org/wiki/海洋性气候"},
      {q:"为什么山谷里白天吹谷风、晚上吹山风？",a:"山坡和谷底受热不均匀。白天太阳先晒热山坡，山坡上的空气变轻上升，谷底的空气就沿山坡补上来——这就是谷风，从山谷吹向山顶。晚上山坡散热快，山上的冷空气重，顺着坡往谷底沉，这就是山风。山谷里这种昼夜风向反转，叫山谷风。住山区的人都知道：白天风往山上吹，夜里风往山下灌。不是山神在吹，是山坡和谷底在谁先热谁先冷上较着劲。",s:"维基百科·山谷风",u:"https://zh.wikipedia.org/wiki/山谷风"},
      {q:"为什么城市比周围乡村更热？",a:"这是热岛效应。城里到处是水泥、沥青、高楼，这些材料白天吸热、晚上慢慢放热；汽车、空调、工厂还不停往外排热；树木绿地少，蒸发降温也少。于是整个城市像一个比周边农村高出两三度的暖岛，市中心最烫，越往外越凉。夏天傍晚城里比乡下闷热，晚上退凉也慢。多栽树、多建公园、铺浅色路面、少开车，都是给城市「退烧」的办法。城市热，不是太阳偏心，是它被钢筋水泥捂热了。",s:"维基百科·热岛效应",u:"https://zh.wikipedia.org/wiki/热岛效应"},
      {q:"为什么雨后空气特别清新？",a:"雨把空气里的灰尘和臭气洗了一遍。雨滴在下落过程中，像小小的吸尘器，把悬浮在空气中的灰尘、花粉、污染物都粘住、带下来。空气一下子干净了，呼吸就顺。此外，闪电打雷时，空气中的一部分氧气被打成臭氧，微量臭氧有一种特别清新的气味，就是雨后那股「下雨味」。所以雨后天晴，深吸一口气觉得特别舒服，是空气刚被雨洗过一遍、还带了一点点臭氧。",s:"维基百科·降水",u:"https://zh.wikipedia.org/wiki/降水"},
      {q:"为什么雷雨后庄稼长得更好？",a:"因为闪电在给庄稼「施肥」。空气里最多的气体是氮气，可植物不能直接用。闪电一瞬间的高温高压，把空气中的氮气和氧气打成氮氧化物，随雨水落到田里，变成硝酸盐——这就是天然氮肥。一场雷雨下来，相当于给地里撒了一遍氮肥，庄稼喝了水又吃了肥，自然蹭蹭长。所以农谚说「雷雨发庄稼」，不是迷信，是闪电在帮忙把空气里的氮变成肥料。",s:"维基百科·氮循环",u:"https://zh.wikipedia.org/wiki/氮循环"},
      {q:"为什么酸雨会伤害森林？",a:"酸雨不是酸得像醋，它比正常雨水酸一些，可长年累月就毁了生态。工厂、汽车烧煤烧油，排二氧化硫和氮氧化物，在空气里变成硫酸、硝酸，随雨落下，pH 值低到五以下。酸雨落到土里，把土壤里的钙、镁等营养元素冲走，还溶出铝等有毒离子，树根被毒害；树叶被直接腐蚀，光合作用变差。森林成片枯萎、湖泊鱼死，都是酸雨干的。烧煤脱硫、汽车装尾气处理，就是在治酸雨。",s:"维基百科·酸雨",u:"https://zh.wikipedia.org/wiki/酸雨"},
      {q:"为什么南极上空会有臭氧洞？",a:"是人类排放的氟利昂把臭氧剪开了。冰箱、空调早年用的氟利昂升到平流层，在南极冬天极寒、云里冰晶表面，被紫外线活化，疯狂分解臭氧。南极春天来时，臭氧被大量破坏，形成一个比中国还大的臭氧稀薄区——就是臭氧洞。紫外线从洞里直照下来，威胁地面生物。后来全球签了蒙特利尔议定书，禁用氟利昂，臭氧洞在慢慢缩小。它是人类第一次亲眼看见自己活动在星球层面留下的伤口。",s:"维基百科·臭氧层",u:"https://zh.wikipedia.org/wiki/臭氧层"},
      {q:"为什么高山冰川在退缩？",a:"因为地球在变暖。高山冰川靠冬天积雪续命，夏天融一点、冬天补一点，本来平衡。可近一百年来全球平均气温上升，夏天融得比冬天补得还多，冰川一年年变薄、末端后退，雪线往上挪。很多名山的冰川都在缩小，甚至消失。冰川融水短期让河流水多，长期却会断流——亚洲几条大江的源头都靠冰川。冰川退缩不是风景小事，它关系到下游几十亿人的水。",s:"维基百科·冰川退缩",u:"https://zh.wikipedia.org/wiki/冰川"},
      {q:"为什么珊瑚礁被称为「海底雨林」？",a:"因为它小面积里藏着巨大的生命。珊瑚礁只占海底不到千分之一，却养活了四分之一的海洋鱼类——热带鱼、龙虾、海龟、海星全挤在这方寸之地。珊瑚是 tiny 珊瑚虫一代代分泌的石灰质骨架，越堆越大，成了海底城市。可它对水温极敏感，海水升温一点点，珊瑚就会白化、死亡。珊瑚礁是海洋里最热闹也最脆弱的生态系统，一旦白化退化，整条食物链都会动摇。",s:"维基百科·珊瑚礁",u:"https://zh.wikipedia.org/wiki/珊瑚礁"},
      {q:"为什么红树林能护岸？",a:"它的根是天然的防波堤。红树林长在海边滩涂上，树干上密密麻麻伸出支柱根、呼吸根，像一张张开的网。海浪拍过来，被这张根网一层层削弱，能量被吸收，到岸边时已经软了大半。台风、风暴潮来时，红树林能挡住大半风浪，减少堤岸崩塌和村庄被淹。同时它还能淤积泥沙、造陆。所以沿海国家都在保护和恢复红树林——它不是普通树林，是海岸边一堵活的、会生长的防波墙。",s:"维基百科·红树林",u:"https://zh.wikipedia.org/wiki/红树林"},
      {q:"为什么温带的树秋天会落叶？",a:"那是树木在「过冬」。冬天又冷又干，土壤冻住，根吸不上水；叶子大面积蒸腾失水，树会被「干死」。所以阔叶树入秋就让叶子脱落：叶柄基部提前长出一层离层，叶子自动掉下来，把水分和养分锁在树干里过冬。落叶前，叶绿素分解掉，露出平时被盖住的黄色、橙色花青素，叶子就变得金黄火红。落叶不是树死了，是它主动把叶子扔掉，等明年再长一批新的。",s:"维基百科·落叶树",u:"https://zh.wikipedia.org/wiki/落叶树"},
      {q:"为什么松树冬天不落叶？",a:"因为它把叶子改成了针。松、柏、杉的叶子细细长长像针，表面积小，外面还裹着一层厚蜡，水分蒸发极少，冬天不怎么失水，就不用像阔叶树那样落叶保命。针叶能活两三年，老叶分批慢慢换，所以一年四季都是绿的。当然它也有代价：针叶光合作用效率低，长得慢。寒温带的森林全是针叶林，不是松树硬扛，是它把叶子改成了最省水、最耐寒的样子。",s:"维基百科·针叶树",u:"https://zh.wikipedia.org/wiki/针叶林"},
      {q:"为什么草原上很少有树？",a:"因为草原又干又多火。草原年降水量在二百到四百毫米之间，不够大树长大成材；再加地下常常有一层硬钙质层，树根扎不深，长不成大树。更关键的是：春夏干燥、秋天草一点就着火，树苗没来得及长粗就被烧死了。野草烧根不死，第二年照全长出来。所以世界上的草原，比如内蒙古、北美大草原，都是草的地盘，树被气候和大火挡在了门外。",s:"维基百科·草原",u:"https://zh.wikipedia.org/wiki/草原"},
