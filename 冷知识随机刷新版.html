    "文化":[
      {q:"为什么中国古建筑的屋檐要向上翘起？",a:"飞檐翘角，是功能和审美一起「翘」出来的。古建筑屋顶坡度大，下雨时雨水要快速排走，屋檐挑出墙外，把雨水甩得远远的，保护墙基；而屋檐两端向上翘起，能让雨水顺着翘角呈抛物线飞出去，落得更远——这叫上翘排水。同时翘起的檐角让阳光更容易照进室内，采光更好；四个翘角还让沉重的大屋顶显得轻盈，像鸟翼舒展。故宫太和殿、江南园林的亭子，翘角各有风格：北方的雄浑，南方的灵秀。所以飞檐不只是好看，它是古人给排雨水和进阳光设计的双重方案。",s:"维基百科·飞檐",u:"https://zh.wikipedia.org/wiki/飞檐"},
      {q:"为什么古人写字从右往左、竖着写？",a:"这是竹简「惯」出来的习惯。纸张普及之前，古人把字写在狭长的竹简、木牍上，再把竹简用绳子编起来、卷成卷。书写时从右往左写，写完一简放左边，正好符合人拿笔的顺手方向；展开阅读时，卷轴从左边打开，一行一行往右读，也顺理成章。竖排则是竹简天然的长条形决定的，字顺着简的方向写，一行写完换下一行。这个习惯延续了两千多年，连印章、牌匾、对联至今仍保留着从右往左、竖排的传统。直到近代引入西方书籍版式，横排左起才逐渐成为主流。今天看竖排书觉得新鲜，其实那才是汉字最古老的家。",s:"维基百科·汉字书写方向",u:"https://zh.wikipedia.org/wiki/汉字书写方向"},
      {q:"为什么中国人见面爱问「吃了吗」？",a:"这是一句有年头的老问候。在漫长的农业社会里，粮食产量低、饥荒常见，「有没有饭吃」是普通人家每天最要紧的事。熟人见面问一句「吃了吗」，不是真关心你这顿饭吃什么，而是一种「我惦记着你」的问候——就像现在问「最近怎么样」。回答也讲究：说「吃了」表示日子过得还行，说「还没呢」，对方通常会接一句「那赶紧去吃」。物资匮乏的年代，这句话还隐含着「要不要来我家吃」的善意。如今粮食不再短缺，「吃了吗」渐渐变成见面随口的一句寒暄，但那份「关心你过得好不好」的暖意，一直没变。",s:"人民网·文化频道",u:"http://culture.people.com.cn/n/2014/0318/c172318-24665681.html"},
      {q:"为什么别人给你倒茶，你要用手指敲桌子？",a:"这叫「叩指礼」，是茶桌上的致谢暗号。流传最广的说法和乾隆皇帝有关：传说乾隆微服私访时给大臣倒茶，大臣不能当众跪拜谢恩，怕暴露身份，就弯起手指在桌上轻叩几下，表示「叩首谢恩」——以指代跪。后来这礼数传开，成了茶桌上通用的谢礼：长辈给你倒茶，用五指并拢轻叩；平辈之间，用食指中指并拢轻叩；晚辈给你倒茶，单指叩两下就行。如今在广东的茶楼里，这个动作依然随处可见。茶桌上不用开口，几根手指就能把「谢谢」说得明明白白。",s:"南方+",u:"https://static.nfapp.southcn.com/content/201902/27/c1956595.html"},
      {q:"为什么筷子总是一双两根？",a:"因为两根才「夹得起」，而且藏着「阴阳」。一根筷子只能戳、不能夹，两根配合，靠杠杆和摩擦力才能稳稳夹起食物，这是最根本的原因。古人还赋予了它哲学含义：一根为阳、一根为阴，一静一动、一主一辅，象征天地和谐、成双成对；筷子一头方一头圆，对应「天圆地方」，圆的一头入口，代表「民以食为天」。所以筷子从来不成单，结婚时送筷子寓意成双成对，餐桌上摆单根筷子则被视为不吉利。一双小小的筷子，既是吃饭的工具，也是中国人「好事成双」的人生观。",s:"中国新闻网",u:"http://m.chinanews.com/wap/detail/chs/zwsp/8684080.shtml"},
      {q:"为什么婚礼上要贴红「囍」字？",a:"囍字是「喜」的加倍，取双喜临门、好事成双之意。传说与王安石有关：他赴京赶考途中娶亲，考场上又高中，双喜临门，便写下「囍」字贴在门上，从此流传开来（民间传说，代表美好寓意）。红色在中国文化里象征喜庆、吉祥，也用来驱邪，红囍字贴在门窗、新房、嫁妆上，既宣告喜事，也寄托对新人的祝福。婚礼上处处成双：双喜、双烛、双杯，图的就是「成双成对」。一张红囍字，是中国人最直白的祝福。",s:"维基百科·囍",u:"https://zh.wikipedia.org/wiki/囍"},
      {q:"为什么祝寿要吃寿桃？",a:"寿桃寓意「长寿」，因为桃子在中国文化里是长寿的象征。相传西王母有蟠桃园，桃子三千年开花、三千年结果，吃了能延年益寿——神话让桃子和长寿挂上了钩；加上「桃」谐音「逃」，又添了逃灾避难的吉利意味。买不到鲜桃的季节，人们就用面粉蒸出桃形的馒头，顶部点红，就成了寿桃。给长辈祝寿送寿桃，是借桃的寓意说「祝您长寿健康」。所以寿桃吃的不是桃，是那份「岁岁平安、长命百岁」的心意。",s:"维基百科·寿桃",u:"https://zh.wikipedia.org/wiki/寿桃"},
      {q:"为什么中秋要吃月饼？",a:"月饼和「团圆」绑在一起。传说最早与赏月有关：八月十五月圆，古人祭月、赏月，用圆形的饼敬月，圆饼象征满月，也象征团圆。到了明代，月饼逐渐成了中秋的固定节令食品，亲友互赠，寓意「人月两团圆」。加上中秋正值秋收之后，新粮新果上市，做饼的原料充足，吃月饼也成了庆祝丰收的仪式。今天月饼花样百出，但核心不变：圆圆的饼，提醒我们月圆人也要圆。所以中秋吃月饼，吃的是「团圆」两个字。",s:"维基百科·中秋节",u:"https://zh.wikipedia.org/wiki/中秋节"},
      {q:"过年为什么要放鞭炮",a:"民间传说里，放鞭炮是为了驱赶一只叫「年」的怪兽。传说「年」头上长角、凶猛异常，每到除夕就爬上岸来吃人。人们发现「年」怕红色、怕火光、怕巨响，于是家家户户贴红纸、燃火把、烧竹子。竹子燃烧时爆裂发出「啪啪」的巨响，把「年」吓得逃回山里——这就是「爆竹」的由来。后来发明了火药，把火药装在纸筒里，就成了鞭炮。虽然「年」是传说，但除夕夜里噼里啪啦的声响，确实把旧岁的晦气和烦恼一并炸走，给新年讨个热闹、红火的好彩头。",s:"维基百科·鞭炮",u:"https://zh.wikipedia.org/wiki/鞭炮"},
      {q:"过年为什么要贴春联",a:"春联的前身是「桃符」。古人在正月初一，用两块桃木板写上「神荼」「郁垒」两位捉鬼神将的名字，挂在大门两边，用来驱鬼辟邪。到了五代十国，后蜀君主孟昶在桃木板上写了一副「新年纳余庆，嘉节号长春」，被认为是中国第一副春联。明代朱元璋大力推广，要求家家户户都用红纸写对联贴在门上，从此春联成了过年的标配。红色避邪、吉利，对联又讲究平仄对仗，把新年的祝福、期望写在红纸上，往门上一贴，年味儿立刻就出来了。",s:"维基百科·春联",u:"https://zh.wikipedia.org/wiki/春联"},
      {q:"长辈为什么要给晚辈压岁钱",a:"压岁钱最早不是真给孩子花的钱，而是「压祟」的护身符。「祟」是一种专门在除夕夜里出来害小孩的小妖，它用手摸睡着的孩子的脑门，孩子就会发烧、变傻。大人为了保护孩子，就用红纸包上钱，压在孩子枕头底下，「祟」看到钱被吓跑——这叫「压祟钱」，后来谐音成了「压岁钱」。演变到今天，压岁钱真的变成了钱：长辈用红包包好，在晚辈拜年时递过去，既表达「长命百岁」的祝福，也顺便给孩子一点零花钱。一个红包，装的是长辈的牵挂。",s:"维基百科·压岁钱",u:"https://zh.wikipedia.org/wiki/压岁钱"},
      {q:"正月十五为什么要吃元宵",a:"因为正月十五是元宵节，而元宵节的主角就是这团糯米团子。它最早叫「浮元子」，因在锅里煮开后浮起来而得名，南方人叫「汤圆」，北方人叫「元宵」——做法还不一样：元宵是把馅切成小方块，在糯米粉里滚出来的；汤圆是用糯米粉把馅包进去的。不管哪种做法，圆滚滚、甜滋滋的样子，都象征「团团圆圆」。正月十五是新年第一个月圆之夜，一家人围坐吃一碗热元宵，是祝福新年全家团圆、和和美美。如今元宵花样百出，从芝麻花生到榴莲芝士，核心还是那份「圆」。",s:"维基百科·元宵",u:"https://zh.wikipedia.org/wiki/元宵节"},
      {q:"端午节为什么要吃粽子",a:"最流行的说法是纪念屈原。战国时楚国大夫屈原眼看国家沦丧，在五月初五投汨罗江而死。百姓划船打捞，又把饭团扔进江里，怕鱼虾咬食屈原的身体——这就是赛龙舟和粽子的由来。不过早在屈原之前，南方吴越民族就有五月初五祭龙、吃粽子的习俗，粽子其实是古老的祭祀食品。只是屈原的故事太动人，人们把它附会到粽子上，让这团糯米有了家国情怀。今天粽子南北口味差别巨大：北方多甜粽、豆沙枣泥；南方多咸粽、鲜肉蛋黄。但剥开粽叶时，那份对屈原的纪念，是一样的。",s:"维基百科·粽子",u:"https://zh.wikipedia.org/wiki/粽子"},
      {q:"赛龙舟到底是怎么来的",a:"赛龙舟的起源有好几种说法，最广为人知的是划龙舟抢救投江的屈原。但学者认为，龙舟竞渡的历史比屈原更早：古代南方吴越民族信奉龙，每年五月初五举行祭龙仪式，把船雕成龙形，在江上竞渡，祈求风调雨顺、驱瘟避邪。不管起源如何，赛龙舟今天已经成了一项国际化的运动：鼓手在船头敲鼓指挥，划手们听鼓点一齐挥桨，几十人一条船齐心协力，拼的就是速度和配合。一条龙舟上如果有一个人节奏错了，全队都得翻。这项运动本身就是「团结」二字最好的注脚。",s:"维基百科·龙舟",u:"https://zh.wikipedia.org/wiki/龙舟"},
      {q:"清明为什么要扫墓",a:"扫墓其实融合了两个古老节日。清明本来是二十四节气之一，表示天气转暖、草木萌发；旁边还有一个「寒食节」，在冬至后一百零五天，这一天禁火、吃冷食，扫墓祭祖。唐代开始，两节逐渐合并，人们在清明前后到坟前除草、添土、烧纸钱、摆供品，表达对先人的思念。清明踏青也是老传统：冬去春来，一家人借着给先人上坟的机会，到郊外走走，呼吸新鲜空气，所以清明既有追思的肃穆，也有踏青的明朗。一边怀念故人，一边迎接春天——这是中国人独有的生死观。",s:"维基百科·清明节",u:"https://zh.wikipedia.org/wiki/清明节"},
      {q:"重阳节为什么要登高",a:"重阳节在农历九月初九，「九九」谐音「久久」，代表长寿。登高的习俗来自一个传说：东汉时汝南人桓景跟着费长房学道，费长房告诉他九月初九你家有灾，让家人缝绛囊、装茱萸、登上高山、喝菊花酒。桓景照做，晚上回家发现家里的鸡犬全暴死了——登高避灾的说法从此传开。当然这是民间故事，实际原因是九月秋高气爽、天高云淡，正是登山的好时节；古人也相信登高能祛病延年。1989年，中国把九月初九定为「老人节」，登高敬老，让这个节日多了一层温暖。",s:"维基百科·重阳节",u:"https://zh.wikipedia.org/wiki/重阳节"},
      {q:"腊八为什么要喝腊八粥",a:"农历十二月初八叫「腊八」，这一天喝腊八粥，最早是佛教习俗。传说佛祖释迦牟尼在十二月初八悟道成佛，之前他苦修六年、饿得半死，最后喝了一位牧羊女供养的乳糜才恢复体力、在菩提树下成道。寺院于是在这一天用谷物、果子煮粥供佛，施舍给信众和穷人，叫「佛粥」。佛教传入中国后，这个习俗慢慢普及到民间。到了宋朝，腊八粥已经成了全民食品：用大米、小米、糯米、红豆、莲子、红枣、花生、桂圆等八样甚至更多食材慢火熬成一大锅，又甜又暖。在最冷的腊月里喝一碗热粥，是中国人对岁末最温柔的仪式。",s:"维基百科·腊八粥",u:"https://zh.wikipedia.org/wiki/腊八粥"},
      {q:"十二生肖里为什么没有猫",a:"最流行的故事是「被老鼠耍了」。传说玉皇大帝要选十二种动物当生肖，通知所有动物早上来排队。猫爱睡懒觉，让老鼠第二天叫醒它，老鼠一口答应，却故意没叫。猫醒来时选拔已经结束，老鼠还偷偷爬到牛背上抢了第一名。从此猫和老鼠成了世仇。不过从历史看，中国十二生肖在先秦时期就定型了，那时中国还没有家猫——猫是汉明帝前后才从国外传入的。所以不是猫被排挤，而是十二生肖定局时，猫还没「户口」。猫来晚了一步，没赶上这班车。",s:"维基百科·十二生肖",u:"https://zh.wikipedia.org/wiki/十二生肖"},
      {q:"本命年为什么要穿红",a:"因为红色在中国人心里是「辟邪」的万能色。本命年就是你属相那一年，十二年一次。民间认为本命年「犯太岁」，容易倒霉、不顺、招小人，必须用红色来冲一冲：红内衣、红袜子、红腰带、红绳手链，从头到脚都得红。红色象征太阳、火焰、鲜血，能吓跑邪祟；加上中国人逢年过节本就爱红，穿红既是民俗，也是心理安慰。所以一到本命年，商场里红内衣立刻热销。不管灵不灵，穿一身红，自己心里先踏实了一半——这大概就是民俗的真正作用。",s:"维基百科·本命年",u:"https://zh.wikipedia.org/wiki/本命年"},
      {q:"「福」字为什么要倒着贴",a:"因为「倒」和「到」谐音。把「福」字倒着贴在门上、水缸上、米缸上，路人看见就会喊：「福倒了！」「福倒了！」谐音「福到了」——福气进门、福气到我家。不过并不是所有「福」都要倒着贴：大门上的福字必须正着贴，因为大门是庄重的入口，正贴寓意「开门迎福」「福如东海」；倒着贴的多在水缸、垃圾箱、柜子上，寓意「福倒（到）家中、福倒（到）出门」。一个小小的贴法，藏着中国人对语言谐音的巧妙玩梗。",s:"维基百科·福",u:"https://zh.wikipedia.org/wiki/福"},
      {q:"为什么送礼不能送钟",a:"因为「送钟」和「送终」谐音。「送终」是指长辈临死时子女在身边服侍，到最后料理丧事——这是一件极沉重、甚至不吉利的事。如果你给朋友送一座钟，人家嘴里念出来是「我给你送钟」，听着像诅咒人家全家办丧事，对方心里肯定不舒服。同理，梨不能分着吃（「分梨」谐音「分离」），伞不能送人（「伞」谐音「散」），扇子不能在夏天后送（「送扇，无相见」）。中国人送礼，先得把谐音过一遍，不然礼送出去了，交情也送没了。",s:"中国新闻网",u:"https://www.chinanews.com.cn/"},
      {q:"打碎碗为什么要说「碎碎平安」",a:"因为「碎」和「岁」谐音。逢年过节、办喜事时打碎碗碟，本来是件扫兴的事，还容易被认为「不吉利」。这时候旁边的人赶紧笑着说一句「碎碎平安」，把「碎」谐音成「岁」——「岁岁平安」，意思是虽然破了，但今年平平安安。一句话，把尴尬化解成彩头。类似的还有：筷子掉地上叫「快乐（筷落）」，杯子倒了叫「悲（杯）去喜来」。中国人遇到不顺利的小事，第一反应往往不是懊恼，而是用谐音往好里圆——这是一种非常乐观的生存智慧。",s:"科普中国",u:"https://www.kepuchina.cn/"},
      {q:"筷子为什么不能插在饭上",a:"因为那像上香祭祀。中国丧葬习俗里，给死者供饭时，筷子是直插在饭上的——这碗饭叫「倒头饭」，是给亡人的祭品。如果你在自家饭桌上把筷子直直插进米饭里，看起来就像供死人，长辈看到一定会立刻把筷子拔出来骂一句「不懂规矩」。此外，筷子也不能敲碗（像乞丐讨饭）、不能竖在桌上（不吉利）、不能用筷子指人（没礼貌）。一双筷子怎么拿、怎么放，都是饭桌礼仪。这些规矩看着繁琐，其实是把「敬畏」和「尊重」从生活细节里教给孩子。",s:"维基百科·筷子",u:"https://zh.wikipedia.org/wiki/筷子"},
      {q:"结婚时新娘为什么要跨火盆",a:"因为火在中国民俗里能「驱邪」和「旺财」。新娘花轿到了新郎家门口，要先迈过一个烧着木炭的火盆，再跨马鞍，然后进门。跨火盆的寓意：一是火能把路上带来的邪气、晦气烧干净，让新娘干干净净进婆家门；二是「火」和「红红火火」挂钩，预示小两口日子越过越旺；三是「盆」谐音「盘」，「跨过火盆，往后日子越过越盘（满）」。这是传统中式婚礼里最有仪式感的一关。如今跨火盆的少了，但那份「驱邪纳福」的意思，依然是婚礼上长辈最看重的。",s:"维基百科·婚礼",u:"https://zh.wikipedia.org/wiki/中式婚礼"},
      {q:"除夕为什么要守岁",a:"守岁就是除夕夜一夜不睡，辞旧迎新。最早的说法和「年」兽有关：大家要熬到半夜，等「年」跑了才敢睡觉。但更实在的意义是：这是一年里最后一个夜晚，一家人围炉、聊天、吃零食、看春晚，送旧岁、迎新年。老年人守岁是「辞旧岁」，有珍惜光阴的意思；年轻人守岁，是为父母延寿，寓意「父母长寿」。守岁的「守」，守的不是夜，是一家人在一起的时光。零点钟声一响，旧岁翻篇，新年开始——中国人最郑重的一次跨年仪式。",s:"维基百科·守岁",u:"https://zh.wikipedia.org/wiki/守岁"},
      {q:"年夜饭为什么一定要有鱼",a:"因为「鱼」和「余」谐音。年夜饭上整条鱼端上桌，不吃完，留到第二天，叫「年年有余」——意思是去年的钱、粮、福气有剩余，今年还会更多。有些地方讲究把鱼头对着长辈或贵客，吃鱼时也不能翻动，图个「顺顺当当、不翻船」。一条鱼，从年初吃到年尾，象征着「富富有余、吃用不愁」。所以年夜饭的菜单可以换，鱼不能少。哪怕不爱吃鱼，也得摆上一条——这是对新一年最直白的祝福。",s:"维基百科·年夜饭",u:"https://zh.wikipedia.org/wiki/年夜饭"},
      {q:"「五福临门」到底指哪五福",a:"出自《尚书·洪范》：一曰寿，二曰富，三曰康宁，四曰攸好德，五曰考终命。翻译成白话就是：长寿、富贵、健康平安、喜好美德、得善终。这五个福凑在一起，才算圆满人生——光有钱不行，还得健康；光长寿不行，还得善终。后来民间把「五福」画成五只蝙蝠，因为「蝠」谐音「福」：一只蝙蝠飞进门，就是「福到了」；五只蝙蝠围住一个「寿」字，就是「五福捧寿」。一个传统纹样，藏着古人对幸福最完整的定义。",s:"维基百科·五福",u:"https://zh.wikipedia.org/wiki/五福"},
      {q:"为什么说「无酒不成席」",a:"因为酒在中国的饭桌上从来不只是饮料，而是「气氛催化剂」。古人祭祀要献酒，结盟要歃血为盟，婚嫁要喝交杯酒，送行要喝壮行酒，接风要喝洗尘酒——几乎所有重要场合都离不开酒。朋友来了，不摆酒显得慢待；生意场上，三杯下肚什么都好谈；婚丧嫁娶，没有酒就不像个正式宴席。酒能让人放松、拉近关系、把客套话变成真心话。所以「无酒不成席」不是说非要喝醉，而是中国文化里，酒是把「请客」两个字落到实处的关键道具。",s:"维基百科·酒文化",u:"https://zh.wikipedia.org/wiki/酒"},
      {q:"泡茶为什么一定要用开水",a:"因为茶叶里的香气和味道，得靠高温水才能「逼」出来。茶叶是干的，里面的茶多酚、氨基酸、咖啡碱只有在接近100℃的水里才能快速溶解，释放出滋味。水温不够，茶就泡不香，喝着淡而无味；但不同的茶对水温要求不一样：绿茶用80℃左右的水，太烫会烫熟茶叶、发苦；红茶、乌龙茶、普洱茶要用滚水，甚至煮着喝。所以老茶客一定盯着水壶，水不开不泡茶。「水不开，茶不香」，是茶叶和水之间的物理约定。",s:"维基百科·茶",u:"https://zh.wikipedia.org/wiki/茶"},
      {q:"过年为什么北方吃饺子、南方吃汤圆",a:"这跟气候和物产有关。北方冬天气候冷、产小麦，饺子是用面皮包馅，热乎、顶饱，过年包一大堆，从除夕吃到初五，正好省事；更妙的是饺子像元宝，吃饺子寓意「招财进宝」。南方气候温暖、产大米，过年吃汤圆（元宵），糯米粉包馅，圆溜溜的，象征「团圆」。加上南方冬天也没那么冷，吃汤圆的轻食习惯更合适。所以北方人过年桌上不包饺子，就像南方人过年不做汤圆，总觉得少了点什么。一方水土养一方年俗。",s:"维基百科·春节",u:"https://zh.wikipedia.org/wiki/春节"},
      {q:"年三十为什么要吃团圆饭",a:"因为这是中国人一年里最看重的一顿饭。不管离家多远、工作多忙，除夕之前都要赶回家，和父母妻儿围坐一桌吃年夜饭。这顿饭的意义不在吃什么，而在「齐」——一家人必须到齐，筷子少一双都不行。这顿饭的菜也讲究：鱼不能少（年年有余）、丸子不能少（团团圆圆）、年糕不能少（年年高）。吃完年夜饭，一起守岁、看春晚、等零点钟声。中国人的「家」，在这顿饭里最具体——外面世界再大，年三十这桌饭，才是根。",s:"维基百科·年夜饭",u:"https://zh.wikipedia.org/wiki/年夜饭"},
      {q:"正月初五为什么要「破五」吃饺子",a:"「破五」是说从除夕到正月初四的各种禁忌，过了今天就可以打破了。比如过年不倒垃圾、不扫地、不动剪刀、不煮生米，到了初五就全部解禁。北方人在这一天吃饺子，有几个讲究：包饺子叫「捏小人嘴」——把小人的嘴捏住，一年不惹是非；饺子形似元宝，初五又是迎财神的日子，吃饺子等于「咬住元宝」；剁馅时咚咚响，还能把晦气剁走。所以破五的饺子，吃的不是味道，是「把不顺的事捏掉」。",s:"维基百科·春节",u:"https://zh.wikipedia.org/wiki/春节"},
      {q:"正月初五为什么要迎财神",a:"因为民间传说正月初五是「五路财神」的生日。五路指东、西、南、北、中，意思是「出门五路，皆可得财」。这一天家家户户放鞭炮、摆供品，把财神接进家门，祈求新一年财源广进。商家更看重这一天：初五一大早开门、放鞭炮、吃「发财蛋」（水煮蛋），希望一年生意兴隆。迎财神其实反映了老百姓最朴素的愿望——日子过好一点、钱多一点。不管财神到底存不存在，人们愿意用这种方式，给自己一个「新的一年要好好干」的心理暗示。",s:"维基百科·财神",u:"https://zh.wikipedia.org/wiki/财神"},
      {q:"元宵节为什么要赏花灯",a:"因为元宵节是中国的「狂欢节」。汉朝时佛教传入，听说正月十五寺院供佛点灯，宫廷也跟着张灯结彩。到了唐朝，国力强盛，长安的元宵节连续三天三夜不夜城，十万盏灯彻夜通明，市民自由上街赏灯、猜灯谜、看歌舞。宋朝更热闹，灯盏花样百出：龙灯、凤灯、走马灯，通宵达旦。在古代，平时女子是不能随便出门的，但元宵节这天可以结伴夜游、逛灯会——所以元宵节也被称作中国古代的「情人节」。辛弃疾写「众里寻他千百度，蓦然回首，那人却在灯火阑珊处」，写的就是灯市上的相遇。",s:"维基百科·花灯",u:"https://zh.wikipedia.org/wiki/花灯"},
      {q:"清明为什么要插柳",a:"插柳和佛教、纪念介子推有关。观音菩萨手持柳枝蘸圣水，民间因此认为柳条能驱邪避鬼；另一则传说是清明节为了纪念被烧死在绵山的介子推，百姓在他死的那一天插柳条、禁火寒食。不管哪种说法，柳枝在中国人的民俗里一直是「辟邪树」：清明这天把柳条插在门楣上、戴在头上，能让邪祟近不了身。加上四月初正是柳树抽芽的时候，柳条嫩绿，插在门上也应了春天的景。「清明不戴柳，红颜成皓首」——一句民谚，把这个习俗的分量说透了。",s:"维基百科·清明节",u:"https://zh.wikipedia.org/wiki/清明节"},
      {q:"端午为什么要挂艾草菖蒲",a:"因为端午前后正是初夏，湿热、蚊虫、瘟疫开始流行。艾草和菖蒲都有浓烈的药味，能驱虫、杀菌、祛湿。古人把它们扎成束，挂在门楣上，或者煎水洗澡、熏屋子——这其实是最古老的「天然蚊香」和「消毒剂」。从外形看，菖蒲的叶子像一把剑，挂在门上能「斩妖除魔」；艾草颜色偏红，也被认为能驱邪。所以端午挂艾草菖蒲，不是迷信，而是古人用天然草药给全家做的一次卫生防疫。两千年下来，它从实用习俗变成了节日标志。",s:"维基百科·艾草",u:"https://zh.wikipedia.org/wiki/艾草"},
      {q:"端午为什么要给小孩系五彩绳",a:"因为五彩绳是给孩子的「护身符」。端午这天，大人用红、黄、蓝、白、黑五色彩线搓成细绳，系在小孩的手腕、脚踝或脖子上，要一直戴到节后第一场大雨，然后把五彩绳摘下来扔到雨水里。这样做寓意：五彩绳把孩子身上的疾病、晦气「绑住」，下雨时随雨水冲走，孩子一年不生病、不招灾。五种颜色对应五行（金木水火土），有平衡辟邪之意。这个习俗在北方尤其流行。一根细细的彩绳，系的是大人对孩子最朴素的牵挂。",s:"维基百科·端午节",u:"https://zh.wikipedia.org/wiki/端午节"},
      {q:"七夕为什么又叫「乞巧节」",a:"因为七月初七本来是女孩子的节日。传说这天晚上，织女会在天上织布，心灵手巧的织女是所有女孩子羡慕的对象。于是古代女子在七月初七晚上摆上瓜果、对着织女星穿针引线，祈求自己也能像织女一样手巧——这就叫「乞巧」。穿得过针的，叫「得巧」；穿不过的，叫「输巧」。后来又慢慢演变成拜织女、拜魁星、晒书晒衣。直到现代，商家把七夕包装成「中国情人节」，其实它最初的内核不是男女爱情，而是女孩子对自己「一双巧手」的美好期许。",s:"维基百科·七夕",u:"https://zh.wikipedia.org/wiki/七夕"},
      {q:"中元节为什么要烧纸钱",a:"中元节在农历七月十五，民间俗称「鬼节」。按道教说法，这一天地府开门，已故祖先可以回家探望；佛教叫「盂兰盆节」，目连救母的故事也讲这天要超度亡魂。于是家家户户在门口、路边烧纸钱、摆供品，让祖先有钱花，也祭奠无主孤魂。烧纸钱的逻辑很「人间」：人死了到另一个世界，也要花钱、过日子；活着的人烧过去的纸钱，就是给先人寄生活费。这其实是中国人「慎终追远」的表达方式——哪怕阴阳两隔，儿女的孝心也要用钱来表示。",s:"维基百科·中元节",u:"https://zh.wikipedia.org/wiki/中元节"},
      {q:"重阳为什么要插茱萸",a:"茱萸是一种有浓烈香气的中药，能驱寒、驱虫、逐湿。九月初九正值深秋，气温下降、湿气渐重，古人认为这一天是「大凶之日」，出门必须佩戴茱萸避邪。唐代诗人王维写「遥知兄弟登高处，遍插茱萸少一人」，说的就是这个习俗：兄弟们登高时把茱萸插在头上或身上，唯独少了自己。后来这个习俗慢慢弱化，被赏菊、喝菊花酒取代。但在唐诗里，茱萸几乎是重阳节的代名词——一提起它，就想起登高望远、思念亲人的秋天。",s:"维基百科·茱萸",u:"https://zh.wikipedia.org/wiki/茱萸"},
      {q:"冬至为什么北方吃饺子、南方吃汤圆",a:"这背后有个医圣张仲景的故事。东汉时张仲景在长沙做官，退休回乡时正好是冬至，看见南阳百姓耳朵冻烂了，就叫徒弟用面皮包上羊肉和驱寒药材，捏成耳朵的样子，下锅煮熟，叫「祛寒娇耳汤」，分给穷人吃。人们吃了「娇耳」，耳朵慢慢好了——这就是饺子的由来。所以北方人说「冬至不端饺子碗，冻掉耳朵没人管」。南方则不同，冬至这天全家团聚，吃汤圆、祭祖，叫「冬至大如年」。一个冻耳朵的医生故事，让南北在同一天用不同的食物取暖。",s:"维基百科·冬至",u:"https://zh.wikipedia.org/wiki/冬至"},
      {q:"腊月二十三为什么要「祭灶」吃糖瓜",a:"传说这一天是灶王爷上天汇报的日子。每家的灶王爷从大年三十待到腊月二十三，把这一家人一年干的好事坏事都记在账本上，二十三这天要回天庭向玉皇大帝汇报。人们于是摆上又甜又粘的糖瓜（麦芽糖做的葫芦状甜食）供奉灶王爷：一是用糖把他的嘴粘住，让他「上天言好事，下界保平安」；二是用甜食让他在玉帝面前多说好话。送完灶王爷，二十三到除夕这几天叫「乱岁」，娶亲搬家都可以。糖瓜粘牙，是老百姓和神仙之间的一次「公关」。",s:"维基百科·祭灶",u:"https://zh.wikipedia.org/wiki/祭灶"},
      {q:"过年前为什么要「掸尘」大扫除",a:"「尘」和「陈」谐音，「掸尘」就是「除陈布新」。从腊月二十三年后，家家户户都要扫房、擦窗、洗被、刷厨具，把一年积攒的灰尘、细菌、晦气统统扫出门。这可不是随便的打扫，而是有讲究的：扫帚要从门口往屋里扫，再从屋里往门外扫——寓意把财宝先迎进来，再把霉运扫出去。其实冬天大扫除也有实际卫生意义：经过一年，屋里积了不少灰、尘螨，过年前彻底打扫一遍，干干净净迎新年。所以民谚说「腊月不扫尘，来年招瘟神」。",s:"维基百科·春节",u:"https://zh.wikipedia.org/wiki/春节"},
      {q:"过年为什么要穿新衣",a:"穿新衣的习俗跟「年」兽和驱邪都有关系。传说「年」怕红色、怕巨响，但人们也希望在新年第一天以崭新的面目出现——这叫「辞旧迎新」。新衣服在古代是奢侈品，普通人一年到头不一定有几件新衣服，只有过年这一天，大人小孩都换上新的，从头到脚都是新的，预示新年新气象。加上红色新衣最受欢迎，既能避邪，又喜庆。如今买衣服太方便了，但过年穿新衣的心理没变：新年第一天，谁都想精神抖擞、漂漂亮亮地出门拜年。",s:"维基百科·春节",u:"https://zh.wikipedia.org/wiki/春节"},
      {q:"过年为什么要放「开门炮」",a:"大年初一一早，家家户户一开门就放鞭炮，叫「开门炮」。炮仗一般放三个，寓意「福、禄、寿」三星高照；放得越响越好，说明今年财运越旺；炸完之后地上红纸屑越多越好，叫「满地红」，预示新年红红火火。开门炮的实际意义是用鞭炮声驱走昨夜潜伏在门口的邪祟，告诉大家：新年开始了，把晦气都炸走。今天不少城市禁放鞭炮，但老人们还是记得——初一早上那一阵噼里啪啦，年才算真的到了。",s:"维基百科·鞭炮",u:"https://zh.wikipedia.org/wiki/鞭炮"},
      {q:"过年为什么要逛庙会",a:"庙会最早是在寺庙旁边的集市。佛教、道教的寺庙在节日常常举办法会、进香活动，周边的小贩、手艺人、卖小吃的、演杂耍的，自然聚到寺庙门口做生意，久而久之形成「庙会」。北方的地坛庙会、厂甸庙会，南方的金陵庙会、上海城隍庙，都是百年老庙会。庙会上有什么？糖葫芦、面人、糖画、风车、杂技、说书、京剧清唱——几乎把一整年的民间艺术都集中到这几天。逛庙会不只是买东西，是一家人挤在人堆里感受「年味」。",s:"维基百科·庙会",u:"https://zh.wikipedia.org/wiki/庙会"},
      {q:"过年为什么要舞龙舞狮",a:"舞龙舞狮都是从驱邪祈福演变来的。龙在中国是行云布雨的神兽，过年舞龙，祈求风调雨顺、五谷丰登；龙灯越长、越灵活，越显威风。舞狮则来自一个传说：山里出现怪兽叫「年」，人们用扎成狮子模样的布偶、敲锣打鼓把它吓跑，从此舞狮成了过年的保留节目。南狮更重表情和功夫，梅花桩上腾挪跳跃；北狮更像真狮子，翻跟头、打滚。一条醒狮或长龙穿街过巷，家家户户放鞭炮迎接，祈求新一年平安吉祥。",s:"维基百科·舞狮",u:"https://zh.wikipedia.org/wiki/舞狮"},
      {q:"庙会为什么爱踩高跷",a:"踩高跷是民间一种杂技表演，早在春秋时期就有了。表演者把两根长木杆绑在腿上，离地一两米高，边走边演，扮成八仙、西游记人物、戏曲角色，在街上扭秧歌、翻跟头。高跷的好处是站得高、看得远，人堆里的观众也能看清；而且越高越惊险，越吸引眼球。过去农村没有舞台、没有广场，高跷队直接在田埂、街道上表演，是庙会里最受欢迎的节目之一。表演者要从小练平衡性，踩断腿的事也发生过——但只要锣鼓一响，高跷队就敢上。",s:"维基百科·高跷",u:"https://zh.wikipedia.org/wiki/高跷"},
      {q:"京剧脸谱为什么红脸是好人、白脸是坏人",a:"脸谱的颜色是给观众「剧透」的。红色代表忠勇正义，关羽一生忠肝义胆，所以是红脸；白色代表奸诈多疑，曹操在戏里被塑造成奸雄，所以是白脸；黑色代表刚正不阿，包拯铁面无私，所以是黑脸；蓝色代表刚直勇猛，黄色代表凶狠骁悍。演员一出场，脸谱一画，台下的老人小孩立刻知道这人是好是坏——这是一种非常直观的「角色标签」。京剧脸谱不是为了吓人，而是为了让不识字的老百姓也能一眼看懂戏剧。",s:"维基百科·京剧脸谱",u:"https://zh.wikipedia.org/wiki/脸谱"},
      {q:"为什么唱戏的戏台两边叫「出将」「入相」",a:"「出将入相」本来是说一个人文武全才：出去能当将军，回来能当宰相。但戏台的上下场门用这两个词，意思是：演员从左边门（出将）上场，演完从右边门（入相）下场。这两个名字既吉利——祝演员将来能当大官——又暗合戏曲里「将相和」的传统题材。观众一进剧场，看见门上这四个字，就知道哪边进人、哪边出人。中国老戏台到处都有这套布局：它已经成了中式戏台的标准配置。",s:"维基百科·戏台",u:"https://zh.wikipedia.org/wiki/戏台"},
      {q:"说话办事为什么叫「唱红脸」「唱白脸」",a:"来自京剧脸谱的引申。红脸的角色（关羽）忠诚耿直，白脸的角色（曹操）奸诈多谋。但在现实生活里，「唱红脸」和「唱白脸」指的是配合：一个人扮演严厉的坏人（白脸），一个人扮演和善的好人（红脸），两人一唱一和，把事情办成。比如孩子闯祸了，爸爸先骂一顿（白脸），妈妈再来安慰讲道理（红脸），这就叫「一个唱红脸，一个唱白脸」。一个脸谱颜色，从舞台走进了家庭和职场。",s:"维基百科·脸谱",u:"https://zh.wikipedia.org/wiki/脸谱"},
      {q:"老北京四合院为什么要坐北朝南",a:"因为中国在北半球，朝南的房子冬天能晒到最多太阳，夏天又避开正午暴晒。更重要的是：北方冬天刮西北风，四合院的北墙厚实、不开窗，正好挡住寒风；南边开窗开门，冬天暖和、夏天通风。四合院的布局还讲究「北屋为尊」：正房坐北朝南，是家里长辈住的；东西厢房住晚辈；南房当客房。一家人关起门来过日子，外面的风雨进不来。这种格局从西周延续到今天，是中国北方最经典的住宅智慧。",s:"维基百科·四合院",u:"https://zh.wikipedia.org/wiki/四合院"},
      {q:"为什么大户人家门前要摆石狮子",a:"石狮子是看门的「护卫」。狮子不是中国本土动物，是汉代从西域进贡来的，当时人们觉得它威猛、能镇邪。从唐朝开始，宫殿、陵墓、衙门、高官宅邸门口开始摆石狮子：左边是雄狮，右爪踩绣球（象征执掌乾坤）；右边是雌狮，左爪踩小狮子（象征子孙绵延）。狮子嘴里还叼着石球，据说能驱邪。普通百姓家是不能摆石狮子的——那是官威的象征。今天银行、大宅门口还爱摆，图的就是「镇宅、守门、旺族」。",s:"维基百科·石狮",u:"https://zh.wikipedia.org/wiki/石狮"},
      {q:"老宅子门口为什么要修一面「照壁」",a:"照壁又叫「影壁」，是大门外或门内的一堵墙，正对着大门。它的作用有三个：第一，挡住外人视线，不让人从门外一眼看穿整个院子，保护隐私；第二，风水上说，直冲大门的气流会把家里的财气带走，照壁把气流挡一下，让它绕弯慢下来，「曲则有情」；第三，照壁上常常雕福字、松鹤、麒麟，进门第一眼就看到吉祥图案。北京故宫的九龙壁、山西四合院的砖雕照壁，都是艺术品。一堵墙，挡的是视线，也是邪气。",s:"维基百科·照壁",u:"https://zh.wikipedia.org/wiki/照壁"},
      {q:"「门当户对」到底说的是什么",a:"「门当」和「户对」原本是大门上的两个建筑构件。「门当」是大门前的一对石鼓（抱鼓石），武官家用鼓形、文官用箱形，大小代表官阶高低；「户对」是门楣上凸出的圆柱形木雕或砖雕，一般两个或四个，数量代表品级。两家结亲前，先看对方的门当和户对是不是相配——如果一样大、一样多，说明两家社会地位相当，这桩婚事就合适。后来「门当户对」引申为「男女双方家庭条件相当」。这个成语，其实是中国古代建筑留给我们的婚姻观。",s:"维基百科·四合院",u:"https://zh.wikipedia.org/wiki/四合院"},
      {q:"为什么把第一次结婚叫「结发夫妻」",a:"「结发」是古代婚礼上的一个仪式。新婚之夜，新郎新娘各剪下一绺头发，绾在一起，表示「结发为夫妻，恩爱两不疑」。古人认为头发受之父母，极其珍贵；把两人的头发系在一起，象征从此身心合一、白头偕老。后来第一次结婚的夫妻就叫「结发夫妻」，以区别于续弦、再婚。苏武有诗「结发为夫妻，恩爱两不疑」，写的就是这种从一而终的愿望。一绺头发，是婚礼上最朴素也最深情的信物。",s:"维基百科·结发",u:"https://zh.wikipedia.org/wiki/结发"},
      {q:"结婚新人为什么要「对拜」",a:"传统婚礼上的「拜堂」是三跪九叩：一拜天地，感谢天地保佑；二拜高堂，感谢父母养育；夫妻对拜，两人从此相敬如宾。「对拜」这一拜最有意义：男女从陌生人变成一家人，互相鞠躬、互敬互爱，从此祸福与共、白头偕老。在古代，女子在婚礼上给丈夫行的这一拜，代表「三从四德」的开始；但在今天，对拜更多是两个人互相承诺、彼此尊重。一拜下去，夫妻关系才算正式成立。",s:"维基百科·中式婚礼",u:"https://zh.wikipedia.org/wiki/中式婚礼"},
      {q:"婚礼上为什么要「闹洞房」",a:"闹洞房的目的，一是驱邪，二是让新人消除羞涩。传说洞房里会有狐狸、鬼怪来捣乱，宾客们故意在新房里说笑、逗乐、灌新人酒，把邪祟吓跑；同时新郎新娘婚前大多没见过面，闹一闹，气氛轻松了，两个人也不那么紧张。闹洞房的习俗从秦汉就有，到现在已经两千多年。不过闹过头了也会出事——所以老规矩是「三日无大小」，新婚三天内不分辈分，都可以逗新人，但不能太过分。一场热闹，是为了让小两口记住洞房花烛夜。",s:"维基百科·闹洞房",u:"https://zh.wikipedia.org/wiki/闹洞房"},
      {q:"新娘出嫁为什么要盖红盖头",a:"红盖头最早是为了「遮羞」。古代新娘出嫁当天要坐在花轿里，从娘家到婆家，一路上不能让外人看见脸——盖一块红布在头上，到了洞房由新郎用秤杆挑开。民间传说盖头最早是为了遮羞，因为古代新人婚前不见面，新娘害羞；后来又赋予驱邪的意义：红色能挡鬼怪，盖头让新娘一路上不被邪祟盯上。用秤杆挑盖头也有讲究——「秤杆」上有十六两秤星，象征「称心如意」。一块红布，遮的是脸，藏的是整个婚礼的神秘感。",s:"维基百科·盖头",u:"https://zh.wikipedia.org/wiki/盖头"},
      {q:"古代新娘为什么一定要坐花轿",a:"花轿是古代婚礼最核心的道具。普通人家出嫁用一乘轿，富贵人家用八抬大轿。花轿外面披红挂彩、雕花描金，里面铺红毡。新娘从出家门开始脚不能踩地，由哥哥或舅舅抱上轿——脚不沾地是为了不把娘家的土带走，也避免路上邪气侵身。花轿一路吹吹打打到婆家，新娘跨火盆、过马鞍、拜堂。不坐花轿的女子，在古代被认为「明媒正娶」的资格都不够。一顶花轿，是女孩一生最风光的时刻。",s:"维基百科·花轿",u:"https://zh.wikipedia.org/wiki/花轿"},
      {q:"古人结婚为什么要讲「三书六礼」",a:"「三书六礼」是古代结婚的完整程序。六礼指：纳采（男方提亲送大雁）、问名（女方生辰八字）、纳吉（合八字吉利）、纳征（送聘礼）、请期（定婚期）、亲迎（新郎迎娶新娘）。三书是六礼过程中交换的文书：聘书、礼书、迎书。一整套走下来，快则半年、慢则两年。这是因为古代婚姻不是两个人的事，而是两个家族的事——必须有文书、有聘礼、有仪式，才算合法有效。没有经过六礼的婚姻，会被认为「无媒苟合」。",s:"维基百科·三书六礼",u:"https://zh.wikipedia.org/wiki/三书六礼"},
      {q:"婚宴上新人为什么要喝「交杯酒」",a:"交杯酒古代叫「合卺（jǐn）」。卺是一个瓢分成两个，新郎新娘各拿一半，倒上酒，一起喝完。把一个瓢分成两个，喝完再合起来，象征「合二为一、从此是一家人」。后来演变成用两个酒杯，手臂交缠着喝酒，叫「交杯酒」。这杯酒里混了两人的酒，喝下去表示从此同甘共苦、不分彼此。今天婚礼上喝交杯酒，已经从古代仪式变成了一个必不可少的甜蜜环节——一杯酒，把「你中有我、我中有你」喝进心里。",s:"维基百科·合卺",u:"https://zh.wikipedia.org/wiki/合卺"},
      {q:"新娘出嫁三天为什么要「回门」",a:"回门是婚礼最后一道程序。婚后第三天，新郎要陪着新娘带着礼品回娘家，看望父母。这是出嫁女第一次回娘家，新郎要给岳父母磕头、办酒席。回门的寓意：一是让新娘回娘家报平安，让父母放心；二是女婿正式拜见岳父母，确立两家亲戚关系；三是过去新娘在婆家装了三天，回娘家能歇口气。回门当天必须日落前赶回婆家，不能在娘家过夜——传说如果新婚之夜在娘家过，会给娘家带来晦气。回门之后，婚礼才算真正结束。",s:"维基百科·回门",u:"https://zh.wikipedia.org/wiki/回门"},
      {q:"老人去世为什么要「披麻戴孝」",a:"披麻戴孝是中国古代丧服制度（五服）的体现。子女为父母服丧，要穿最粗的麻布衣服，不缝边、不装饰，头上扎麻绳、手持孝杖（哭丧棒），这叫「斩衰（cuī）」——是最重的丧服，要穿三年。为什么穿粗麻布？因为丧礼上不能穿漂亮衣服，要表现出「悲痛到无心修饰」。麻布越粗，表示关系越近、悲痛越深。这套制度从西周一直延续到民国，今天虽然简化了，但「披麻戴孝」还是表示对逝者的深切哀悼。一身粗麻，是儿女最后一次为父母尽孝。",s:"维基百科·五服",u:"https://zh.wikipedia.org/wiki/五服"},
      {q:"人去世后为什么要「守灵」",a:"守灵是停棺期间，家属守在灵柩旁、日夜不离。最初的意思是守护遗体，防止猫狗耗子靠近——民间传说猫狗跳过尸体，会让尸体「起尸」。更重要的是情感层面：老人走了，最后这几天家人要多陪一陪，接受亲朋好友来吊唁、告别。灵堂里要点长明灯、烧纸钱、摆遗像，儿女守着香烛，有人来吊唁就跟着磕头回礼。守灵一般三天到七天，然后出殡入土。守的不是尸体，是儿女心里那份「再多待一会儿」的不舍。",s:"维基百科·守灵",u:"https://zh.wikipedia.org/wiki/守灵"},
      {q:"为什么说逝者「头七」要回家",a:"民间传说，人去世后魂魄并不知道自己已经死了，会在去世后的第七天（头七）最后一次回家看看，然后才去阴间报到。所以这一天家人要摆好逝者生前爱吃的饭菜，在床边撒一层灰或面粉，等魂魄来过留下脚印。之后还有「二七」「三七」……一直到「七七」（第四十九天），魂魄才真正投胎转世。这套习俗反映了中国人对死亡的态度：不是彻底消失，而是阴阳之间还有一段告别的路。头七这天，全家人不吵不闹，给魂魄留一份安静。",s:"维基百科·头七",u:"https://zh.wikipedia.org/wiki/头七"},
      {q:"上坟为什么要烧纸钱",a:"纸钱是模仿人间货币的祭祀品。古人相信人死了到阴间，也要吃饭、穿衣、花钱，所以活着的人要烧纸钱、纸房子、纸汽车过去，让祖先在另一个世界过得好。最早的纸钱是汉代的「瘗钱」，后来演变成黄色或白色的纸，印成铜钱或纸币的样子。上坟时烧纸钱，等于给祖先「寄钱」；同时还要摆酒菜、倒酒、磕头、除草、添土。烧纸钱不只是迷信，它表达的是「我们还记得你、还在照顾你」——这是中国人慎终追远最具体的方式。",s:"维基百科·纸钱",u:"https://zh.wikipedia.org/wiki/纸钱"},
      {q:"进庙烧香为什么要点三炷",a:"三炷香代表「佛、法、僧」三宝，或者「天、地、人」三才。第一炷香供佛，第二炷香供法（经书），第三炷香供僧（和尚）。也有人说三炷香代表「戒、定、慧」三学。三炷香点着后，要插得整齐：中间一柱、左边一柱、右边一柱，不能歪。道教则三炷香代表「三清」（元始天尊、灵宝天尊、道德天尊）。所以进庙烧香，不管佛道，基本都是三炷——不是越多越虔诚，三炷已经代表全部心意。",s:"维基百科·烧香",u:"https://zh.wikipedia.org/wiki/烧香"},
      {q:"庙里为什么可以「抽签」问吉凶",a:"签是寺庙给善男信女的「咨询服务」。一般庙里有一个签筒，里面装着几十到一百根竹签，每根签上写着编号。求签的人先跪拜、报上姓名住址、所求之事，然后摇晃签筒，掉出来的第一根就是「神的回答」。再按编号到旁边的签诗架上找对应的诗——大多是七言绝句，寓意模糊，可吉可凶。解签的和尚或庙公根据你的问题解释。求签本质上是一种心理安慰：大事当前，人需要一个「神的指引」来做决定。抽到好签，心里踏实；抽到坏签，多烧几柱香补救。",s:"维基百科·抽签",u:"https://zh.wikipedia.org/wiki/求签"},
      {q:"为什么说「男戴观音女戴佛」",a:"这是民间一种祈福搭配。男子多在外打拼、脾气容易暴躁，戴观音是取「观音」谐音「官运」，也是希望男性能像观音一样慈悲、柔和；女子戴佛（笑口常开的弥勒佛），是希望女性豁达、乐观、笑口常开，不要斤斤计较。这其实是民间对性格的一种「互补」期待——男人需要观音的慈悲，女人需要弥勒的度量。当然这不是佛教教义，纯粹是老百姓图吉利、戴个心理暗示。一颗玉佛或玉观音，戴的不是宗教，是长辈的叮咛。",s:"维基百科·玉",u:"https://zh.wikipedia.org/wiki/玉"},
      {q:"中国人为什么相信玉能辟邪",a:"因为玉在中国人心里是「有灵性」的石头。古人认为玉是天地精华所化，能通神灵、驱邪祟。从新石器时代的良渚文化开始，玉就是礼器；后来更变成君子的象征（「君子比德于玉」）。民间相信：玉能挡灾——戴在身上的玉镯、玉佩如果突然碎了，说明它替主人挡了一次灾。玉还能养人：「人养玉三年，玉养人一生」。玉的温润、坚硬、稀缺，加上几千年文化的加持，让它成了中国人最心爱的护身符。一块玉戴久了，真的会有感情。",s:"维基百科·玉",u:"https://zh.wikipedia.org/wiki/玉"},
      {q:"玉镯为什么大多戴在左手",a:"一方面是习惯：大多数人用右手干活多，戴在右手容易磕碰、打碎；戴在左手，右手写字、炒菜、打字不受影响。另一方面，中医和风水有说法：左手离心脏近，玉镯贴左手腕，能「养心血」；佛教也认为「左手是净手」，戴在左手更恭敬。还有一种更实际的：玉镯戴在左手，自己看的时候、别人夸的时候，都更方便。一个小小的佩戴位置，藏着实用、健康、文化三层考虑。",s:"维基百科·玉镯",u:"https://zh.wikipedia.org/wiki/玉"},
      {q:"盖房子为什么讲究「左青龙右白虎」",a:"这是古代风水对住宅周围地形的要求。传统的理想宅子：左边（青龙位）要有蜿蜒的河流或道路，右边（白虎位）要有低矮的山丘或长道，后面（玄武位）要有靠山，前面（朱雀位）要有开阔的明堂或池塘。青龙要「蜿蜒」、白虎要「驯服」——左边可以高一点，右边不能压过左边。这种布局其实有实际道理：北面靠山挡住北风，南面开阔迎阳光，左有水方便生活，右有路方便出行。风水听起来玄，其实是古人总结出来的居住环境最优解。",s:"维基百科·风水",u:"https://zh.wikipedia.org/wiki/风水"},
      {q:"古人结婚嫁娶为什么总要挑「黄道吉日」",a:"「黄道吉日」是老黄历上挑出来的好日子。古代没有手机日历，婚丧嫁娶、动土搬家、出门远行，都要翻老黄历，看当天宜什么、忌什么。比如「宜嫁娶」「宜出行」「忌动土」。这套体系来自古代天文历法：古人认为天上有黄道黑道，不同的日子有不同的星宿当值，吉日办事顺利，凶日容易出事。虽然现在看来是古代的迷信，但挑个好日子办喜事，图的是个心安——一辈子一次的婚礼，谁都不想在「忌嫁娶」的日子办。",s:"维基百科·黄历",u:"https://zh.wikipedia.org/wiki/黄历"},
      {q:"为什么中国人忌讳数字「4」、偏爱「8」",a:"都是谐音闹的。「4」和「死」读音接近，所以中国很多城市的电梯没有4楼、14楼、24楼，手机号带4的便宜，车牌带4的没人要。「8」和「发」（发财）谐音，所以带8的手机号、车牌动辄拍卖出高价；开店、开业、结婚都挑带8的日子。南方尤其讲究：8点8分开业、8块8的红包。这种数字迷信虽然没科学依据，但反映了中国人对「发财」「平安」的朴素愿望。一个数字，因为发音不同，命运截然不同。",s:"维基百科·数字谐音",u:"https://zh.wikipedia.org/wiki/谐音"},
      {q:"酒席上为什么总要劝酒",a:"劝酒是中国酒桌上的「人情练习」。劝酒的逻辑是：酒喝到位了，感情才到位；你不喝，就是不给我面子。长辈劝晚辈、领导劝下属、主人劝客人，都有说辞：「这杯不喝，是不是看不起我？」「感情深，一口闷；感情浅，舔一舔。」劝酒的本质，是用酒来测试对方愿不愿意为自己付出、接受考验。近年来反对「强制劝酒」的声音越来越多，因为真的喝出过事故。但劝酒文化在商务宴请、农村酒席上依然盛行——它从来不是为了喝酒，是为了「表态」。",s:"维基百科·酒文化",u:"https://zh.wikipedia.org/wiki/酒"},
      {q:"为什么有时候要「以茶代酒」",a:"「以茶代酒」最早是三国东吴的典故。吴主孙皓每次宴客，都要求每人喝七升酒，不然就是不敬。有个叫韦曜的大臣酒量小，孙皓暗中让人把他的酒换成茶——这就是「以茶代酒」的由来。后来这成了一个体面的说法：不能喝酒、不方便喝酒时，举起茶杯说一句「我以茶代酒，敬您一杯」，既表达了敬意，又不扫大家的兴。今天开车不能喝酒、身体不能喝酒的人越来越多，这句话使用频率越来越高。",s:"维基百科·茶",u:"https://zh.wikipedia.org/wiki/茶"},
      {q:"倒酒为什么要倒满、倒茶却不能满",a:"这是中国茶酒桌上的「双重标准」。倒酒要倒满，叫「酒满敬人」——酒杯满了，说明主人实在、不抠门；倒茶不能满，叫「茶满欺人」——茶是热的，倒满了客人端不起来、烫手，等于故意让人难堪。所以茶倒七八分满最合适。民间还有一句「酒满敬人，茶满欺人，饭满愁人」。一个茶杯倒多少，都是待人接物的分寸。懂这个规矩的主人，才是会请客的人。",s:"中国新闻网",u:"https://www.chinanews.com.cn/"},
      {q:"喝酒为什么要「碰杯」",a:"碰杯的起源有好几种说法。最有意思的是古希腊人：他们注意到，喝酒时眼睛能看到酒的颜色、鼻子能闻到酒香、舌头能尝到酒味，唯独耳朵什么都没得到——于是两人碰杯，让耳朵也分享到酒杯相碰的清脆声，五官就都满足了。另一种说法是古代人怕对方在酒里下毒，碰杯时把酒晃到对方杯子里，这样谁下毒谁同归于尽。不管起源如何，碰杯已经变成一种仪式：杯口一碰、喊一句「干杯」，感情立刻升温。一个小小的动作，把「我敬你」三个字说透了。",s:"维基百科·碰杯",u:"https://zh.wikipedia.org/wiki/碰杯"},
      {q:"吃饭时为什么忌讳「吧唧嘴」",a:"吧唧嘴就是吃东西时嘴唇一张一合发出声响。在中国人的饭桌上，这是非常不礼貌的行为——吧唧嘴听起来像猪吃食，会让同桌人觉得你没教养、只顾自己吃。老规矩是：嘴里有东西不说话、喝汤不出声、咀嚼时嘴唇闭合。吃饭的声音越小，越显教养。这种规矩其实是从古代「食不语」的传统来的：吃饭就该安静、斯文。一个人吧唧嘴，一桌人都倒胃口——所以老人们一定要在孩子小时候就把这条规矩教会。",s:"维基百科·餐桌礼仪",u:"https://zh.wikipedia.org/wiki/餐桌禮儀"},
      {q:"吃饭为什么要等长辈先动筷",a:"这是「长幼有序」的饭桌规矩。一桌人坐下，长辈或主客不动筷子，晚辈不能先吃；长辈夹哪道菜，晚辈才能跟着夹。如果晚辈先动筷，会被认为「没规矩、饿相」。这个规矩的本质是「尊重」——尊重长辈、尊重主客、尊重请客的人。它从《礼记》时代就有：「共饭不泽手」「毋抟饭」。今天虽然不那么严格了，但家宴上还是会看到：爷爷拿起筷子说「动吧」，一桌子人才开始吃。一双筷子，等的是礼数。",s:"维基百科·餐桌礼仪",u:"https://zh.wikipedia.org/wiki/餐桌禮儀"},
      {q:"家里来客人为什么要赶紧敬茶",a:"「客来敬茶」是中国最基本的待客之道。客人一进门，坐下第一件事就是端上一杯热茶——表示「欢迎、请坐、歇歇脚」。茶不贵，但它代表主人的心意：让你润润嗓子、暖暖心。如果只坐着不烧水，客人会觉得自己不受欢迎。倒茶还有规矩：七分为宜、双手递上、茶杯把手对着客人。客人走时也要敬茶。所以老话讲：「寒夜客来茶当酒」——没有酒可以，没有茶不行。一杯热茶，是中国人待客的第一张名片。",s:"维基百科·茶",u:"https://zh.wikipedia.org/wiki/茶"},
      {q:"敲门为什么要敲两三下而不是猛敲",a:"敲门的规矩从古代就有：不能「擂门」，要轻敲两三下，停一下，再敲两三下。猛敲像报丧、像抓贼，会把主人吓一跳；连珠炮似地敲更是不礼貌。老规矩还说：进别人房门要先敲门，等里面应声「请进」再推门；敲两三下是提醒「我来了」，不是催促。从声学上讲，两三下敲门声最能让屋里人听清，又不会被吓着。一个敲门的力度和节奏，藏着一个人的教养。",s:"维基百科·礼仪",u:"https://zh.wikipedia.org/wiki/礼仪"},
      {q:"为什么说「正月不剃头」",a:"老话说「正月不剃头，剃头死舅舅」。其实这是一个被讹传的故事。明末清初，清朝强制汉人剃发留辫，很多汉族人不愿剃，但又不敢反抗，就在正月里相约不剃头——「思旧」，怀念明朝、怀念旧习俗。结果「思旧」被口口相传讹成了「死舅」。于是正月不剃头的习俗就这么传下来了，虽然真正的原因和舅舅没关系。今天很多人还是习惯正月不理发，等到二月二「龙抬头」才剪——一整个正月不剪头，就是为了让舅舅平平安安。",s:"维基百科·正月",u:"https://zh.wikipedia.org/wiki/正月"},
      {q:"二月二为什么要「龙抬头」剪头发",a:"农历二月初二，是二十四节气惊蛰前后，传说这一天龙从冬眠中醒来，抬头升天，开始行云布雨，所以叫「龙抬头」。这一天人们要剪头发，叫「剃龙头」——寓意像龙一样精神、有好兆头。小孩这天剪头发叫「剃喜头」，保佑孩子健康长大；大人剪头发叫「辞旧迎新」，盼一年好运。从实际看，整个正月大家都不剃头，头发长了一个月，正好趁这天剪。加上二月二正好是春耕开始的日子，剃个头，精神抖擞地下地干活。",s:"维基百科·龙头节",u:"https://zh.wikipedia.org/wiki/二月二"},
      {q:"古代女人为什么要裹小脚",a:"裹小脚是中国古代最残酷的审美习俗。女孩四五岁时，家人就用长布把四个脚趾弯到脚底、紧紧缠住，让脚停止生长，变成三寸左右的「莲花脚」。据说起源于南唐李煜的妃子窅娘，她用帛缠脚在莲花台上跳舞，李煜大加赞赏，宫中贵妇纷纷效仿，传到民间。裹脚的理由：一是男人觉得小脚美、性感；二是「大门不出、二门不迈」，小脚走不快，方便管女人；三是社会风气——不裹脚嫁不出去。这种制度从五代延续到清末，民国成立后才明令废除。一双小脚，裹的是女性千年的血泪。",s:"维基百科·缠足",u:"https://zh.wikipedia.org/wiki/缠足"},
      {q:"产妇为什么要「坐月子」",a:"坐月子是中国女性产后恢复的传统，已经有两千年历史。按老规矩，生完孩子一个月里，产妇要卧床、不能洗头洗澡、不能吹风、不能吃凉的、不能干活，每天吃鸡、吃蛋、喝鸡汤。这些规矩虽然被现代医学批评了不少——比如完全不洗头洗澡会滋生细菌——但背后有合理内核：分娩对女性身体是巨大消耗，确实需要充分休息、补充营养、避免受凉。科学的坐月子是：合理休息、注意卫生、均衡营养，而不是闷在屋里一个月。老祖宗的经验，要去粗取精。",s:"维基百科·坐月子",u:"https://zh.wikipedia.org/wiki/坐月子"},
      {q:"小孩满周岁为什么要「抓周」",a:"抓周是在孩子满周岁那天，把各种物品摆在他面前，看他伸手抓哪样，以此预测他将来的志趣和职业。男孩面前一般摆：笔（文人）、算盘（商人）、刀枪（武将）、印章（当官）、经书（学者）；女孩面前摆：针线（女红）、尺子（裁缝）、吃食（有口福）。抓周的习俗从魏晋南北朝就有，三国时孙权就用过这招选太子。当然孩子抓什么，完全是随机的，长辈图个乐、讨个好兆头。如果抓到笔，全家高兴；抓到算盘，可能要做生意。",s:"维基百科·抓周",u:"https://zh.wikipedia.org/wiki/抓周"},
      {q:"为什么说「嫁鸡随鸡，嫁狗随狗」",a:"这句话是古代妇女地位的写照。在传统父权社会，女人结婚后就脱离娘家，进入夫家，丈夫就是她一辈子的依靠——丈夫是农民，就跟着种地；丈夫是乞丐，就跟着讨饭；丈夫死了，还要守节。这句话最早是「嫁乞随乞，嫁叟随叟」，后来谐音讹变成「嫁鸡随鸡，嫁狗随狗」。它反映了古代女性没有独立选择的命运：婚姻不是两个人的事，而是女人后半辈子的全部归宿。今天这句话已经很少有人再说，因为现代女性有自己的事业和选择。",s:"维基百科·俗语",u:"https://zh.wikipedia.org/wiki/俗语"},
      {q:"古人为什么讲究「男耕女织」",a:"这是中国古代小农经济的标准分工。男人主要下地种田，生产粮食；女人在家养蚕、织布、做饭、带孩子，生产衣服。这种分工从西周就有，《墨子》《孟子》里反复提到「男耕而食，妇织而衣」。它的好处：一个小家庭就是一个生产单位，粮食和衣服都自给自足，不用依赖市场。加上古代「士农工商」的排序，农民地位最高，男耕女织就是理想社会的样子。这种模式延续了两三千年，直到近代工业兴起才被打破。",s:"维基百科·小农经济",u:"https://zh.wikipedia.org/wiki/小农"}
    ],
    "常识":[
      {q:"为什么手机掉进水里要马上关机？",a:"因为「通电」比「泡水」更致命。手机泡水后，水里的杂质是导电的，电路板上的金属触点一旦被水连在一起，就会短路，电流乱窜，烧坏芯片；电池也可能因此异常放电甚至鼓包。关机、断开电源，等于先掐断电流，让水暂时「没电可导」，把损伤降到最小。正确的急救顺序是：立刻捞起、关机、别开机别充电，甩干表面水分，用纸巾吸干接口，再放进干燥剂或米缸里密封静置一两天，让内部水分慢慢蒸发。切忌用吹风机热风猛吹，高温会伤零件。手机怕的不是水，是「水加电」这个组合。",s:"科普中国",u:"https://cloud.kepuchina.cn/h5/detail?id=7453529420791320576"},
      {q:"为什么微波炉里不能放金属？",a:"因为金属会「反射」微波，还可能打火。微波炉的原理是用微波让食物里的水分子高速振动、摩擦生热，而金属会像镜子一样把微波反射回去，食物热不到不说，反射的微波还可能在天线、勺尖这些尖锐处集中，产生电火花，严重时甚至烧毁磁控管、引发危险。所以金属容器、带金边银边的碗碟、锡纸，都不能进微波炉。但有一类例外：微波炉专用的金属烤架、带金属边的解冻盘，是厂家设计好的，微波炉能「容忍」。普通人家记住一条就够：除了专用配件，金属一律别进微波炉。",s:"科普中国",u:"https://cloud.kepuchina.cn/h5/detail?id=7453529420791320576"},
      {q:"为什么刚煮好的鸡蛋特别难剥壳？",a:"因为蛋白和壳「黏得太紧」。鸡蛋壳内壁有一层薄膜，蛋白煮熟后膨胀，和这层膜紧紧贴在一起；而新鲜鸡蛋里空气少、蛋白浓，煮出来壳膜和蛋白几乎焊在一起，自然难剥。放了几天的鸡蛋，气室变大、蛋内空气增多，煮的时候蛋白收缩，壳和蛋白之间容易分离，反而好剥。想好剥壳有两个办法：煮蛋时水里加点盐或醋，帮助蛋白凝固收缩、壳膜分离；煮好立刻过凉水，热胀冷缩让壳和蛋白「松绑」。所以难剥的蛋不是煮得不好，是蛋太新鲜了——新鲜是优点，剥壳是代价。",s:"科普中国",u:"https://cloud.kepuchina.cn/h5/detail?id=7453529420791320576"},
      {q:"为什么洗完澡，镜子会起一层雾？",a:"因为热空气中的水蒸气「撞了冷墙」。洗澡时热水产生大量热的水蒸气，镜子温度低（尤其是冬天），热空气碰到凉镜面，温度骤降，水蒸气容纳不了那么多水分，就凝结成细小的水珠附在镜面上——这就是「液化」，跟夏天冰可乐瓶外壁冒水珠是同一个道理。想让镜子不起雾，办法都是让镜面别那么凉或别沾水：抹一层肥皂或洗洁精，干了之后会形成一层薄膜，水汽挂不住；或者用吹风机把镜面吹热，水蒸气就不容易凝结了。雾气不是镜子的错，是冷热相遇时，水在镜面上现了原形。",s:"科普中国",u:"https://cloud.kepuchina.cn/h5/detail?id=7453529420791320576"},
      {q:"为什么空调遥控器要对准空调才灵？",a:"因为遥控器用的是「红外线」，而红外线像手电筒的光一样，是直线传播、有方向性的。遥控器前端的小灯珠发出红外信号，只有信号打到空调的接收窗口上，空调才能「听懂」；中间隔着障碍物、角度偏了，信号就传不到。有些遥控器对准天花板或墙壁按，也能开空调，那是红外线被墙面漫反射后碰巧进了接收窗，所以偶尔「盲按」也灵，但距离一远、障碍一多就不行。现在的智能空调支持 Wi-Fi 和蓝牙，手机 App 隔着墙也能开关，但遥控器家族的主力，依然是那束看不见的红外光。",s:"科普中国",u:"https://cloud.kepuchina.cn/h5/detail?id=7453529420791320576"},
      {q:"为什么白纸放久了会发黄？",a:"因为纸里藏着「变黄的种子」。纸张的主要原料是木浆，含有木质素——它本身是淡黄色的，造纸时会尽量漂白，但很难完全除净。木质素见光、接触氧气后会被氧化，颜色逐渐变深，纸也就慢慢发黄。报纸变黄最快，因为新闻纸用机械浆、木质素含量高；打印纸、书本纸经过化学处理，木质素少，黄得慢一些。想减缓发黄，把纸避光、防潮保存就行。所以老书泛黄不是纸「变老」，是木质素在悄悄氧化——书页里藏着时间的颜色。",s:"维基百科·木质素",u:"https://zh.wikipedia.org/wiki/木质素"},
      {q:"为什么超市结账台旁边总摆着口香糖？",a:"这是经典的「冲动消费」设计。结账排队时，顾客已经买完计划内的东西，正处于「马上要付钱」的心理放松期，顺手再拿一件小东西的阻力最小；口香糖、巧克力、小糖果单价低、不用挑、结账快，放购物篮不心疼。它们体积小，正好塞在收银台附近，排队时顺手就拿，结账时多花几块钱也不显眼。商家把这类商品叫「收银台冲动品」，靠的就是你排队那几十秒。所以每次结账多出的那盒口香糖，不是你的错，是货架设计的功劳。",s:"维基百科·冲动购买",u:"https://zh.wikipedia.org/wiki/冲动购买"},
      {q:"为什么新买的衣服总有一股味道？",a:"那股味道主要是「纺织助剂」和包装的功劳。新衣服在生产过程中会用不少化学助剂：防皱的树脂、防缩的整理剂、染色的固色剂，还有仓库运输时的防霉剂，它们残留在面料上，就散发出特有的气味。此外新衣服的塑料包装袋本身也有味道，刚拆开时气味更明显。这些助剂大多在安全标准允许的范围内，但对皮肤敏感的人可能有点刺痒。建议新衣服先洗一遍再穿：清水或加一点盐浸泡，能带走大部分残留助剂和浮色，晒干后味道基本就没了。",s:"维基百科·纺织品",u:"https://zh.wikipedia.org/wiki/纺织品"},
      {q:"为什么红绿灯要用红黄绿三种颜色？",a:"因为这三种颜色是经过长期挑出来的。红色光波长、穿透力强，大雾大雨天最显眼，又天生带着警示意味，适合代表停；绿色波长也长、和红色对比最强，视觉上又让人安心，代表行；黄色波长居中、亮度高，夹在中间用来提醒切换。这套组合从铁路信号灯沿用至今，全球通用。所以红绿灯的颜色不是随便选的，是能见度、心理习惯和安全一起定下来的。",s:"维基百科·交通信号灯",u:"https://zh.wikipedia.org/wiki/交通信号灯"},
      {q:"为什么灭火器大多是红色的？",a:"因为红色最醒目、最紧急。灭火器要在着火的一瞬间被人一眼找到，红色波长最长、穿透力最强，在烟雾和昏暗环境里也跳得出来；同时红色在全世界都代表危险和紧急，看到红罐子，人们立刻知道是救命的家伙。法规也规定灭火器必须涂成醒目的红色，放在走廊、楼道显眼处。所以灭火器涂红，不是好看，是为了让你在浓烟里三秒内找到它。",s:"维基百科·灭火器",u:"https://zh.wikipedia.org/wiki/灭火器"},
      {q:"为什么自动扶梯上要靠右站？",a:"因为左边留给着急的人走。扶梯慢，有人赶时间想大步走上去，就靠左侧通行；右边站着不动的人把右侧留给站立者，两边互不打架。这个习惯从伦敦地铁传开来，很多大城市都跟着做。不过也有地方反过来靠左站，其实关键不是左右，而是留出一条通畅的急行道。所以站扶梯时靠右、把左边让出来，是一种默默的文明默契，那点小小的让位，让早高峰的扶梯不再堵成一团。",s:"维基百科·自动扶梯",u:"https://zh.wikipedia.org/wiki/自动扶梯"},
      {q:"为什么人民币上有盲文？",a:"因为这是给视障人士的贴心设计。盲人看不见钞票上的数字，光靠摸厚薄又分不清面值，于是人民币在票面一角印上凸起的盲文符号，用手一摸就能认出是多大面额。这从第四套人民币开始加入，第五套继续沿用。那几个不起眼的小凸点，让视障朋友也能独立数钱、找零。所以人民币上的盲文，是把方便留给最需要的人，这几个不起眼的凸点，让视障朋友也能独立花钱、有尊严地生活。",s:"维基百科·盲文",u:"https://zh.wikipedia.org/wiki/盲文"},
      {q:"为什么银行卡上有个小芯片？",a:"因为它比磁条安全得多。早年银行卡只有背面那条黑磁条，信息容易被复制、盗刷；换成正面的小芯片后，卡内信息加密存储，每笔交易都要动态校验，很难被克隆。现在的芯片卡就算被偷窥，小偷也复制不出一张能用的卡。刷卡时挥一下、插一下都认，就是靠这颗小芯片在做加密通信。所以那枚小金片，是钱包里的安全锁，如今刷卡挥卡都靠它加密通信，盗刷比磁条时代少多了。",s:"维基百科·芯片卡",u:"https://zh.wikipedia.org/wiki/芯片卡"},
      {q:"为什么充电宝不能带上飞机托运？",a:"因为它里面是锂电池，怕摔怕压。托运的行李在货舱里要经历搬运、颠簸、挤压，锂电池一旦被碰伤、短路，就可能发热起火；货舱没人盯着，火着起来很难及时发现。而随身带进客舱，万一出问题空乘能立刻处置。所以民航规定锂电池、充电宝一律随身、不能托运，飞行中还不能用它给手机快充。这不是为难旅客，是防火于未燃，随身带、不托运，这一条规矩保的是整架飞机的安全。",s:"维基百科·移动电源",u:"https://zh.wikipedia.org/wiki/移动电源"},
      {q:"为什么坐飞机要开飞行模式？",a:"因为怕手机信号干扰导航。飞机靠无线电和地面塔台、卫星保持通信和定位，手机一直搜信号会不断发射电磁波，理论上可能干扰驾驶舱的仪表。飞行模式一关通信模块，手机不再发射信号，就安全了。现代飞机抗干扰能力强了，很多航班允许全程开飞行模式用手机，但起飞降落阶段仍要求保持。那一小段时间的安静，是为了整机舱人的安全。",s:"维基百科·飞行模式",u:"https://zh.wikipedia.org/wiki/飞行模式"},
      {q:"为什么雾霾天要戴口罩？",a:"因为雾霾里全是细颗粒。PM2.5这种小颗粒直径不到头发丝的三十分之一，能直接钻进肺泡、进血液，长期吸对呼吸道和心肺都不好。普通布口罩挡不住它们，得用带熔喷层的医用口罩或KN95，才能把细颗粒滤掉。雾霾天空气差、能见度低，出门戴口罩、回家洗脸漱口，就是给呼吸道加一道过滤网，普通布口罩挡不住它们，得用带熔喷层的医用口罩或KN95，出门戴、回家洗鼻漱口，就是给呼吸道加一道过滤网。",s:"维基百科·口罩",u:"https://zh.wikipedia.org/wiki/口罩"},
      {q:"为什么各国插座长得不一样？",a:"因为各国电力标准是各自定的。当年欧美各自发展电网，电压有110伏也有220伏，插头形状也按各自习惯设计，谁也没统一。于是中国用扁两脚、英国用三方脚、欧洲用圆两脚、美国又是另一种扁脚。出差带个万能转换插头，就是为了应付这五花八门的插座。形状背后，是各国电气化历史各走各的路留下的痕迹，出差带个万能转换插头，就走遍天下都不怕。",s:"维基百科·插座",u:"https://zh.wikipedia.org/wiki/插座"},
      {q:"为什么保险丝会烧断？",a:"因为它是电路里的替罪羊。保险丝是一段低熔点的金属丝，串在电路里；一旦电流过大、短路，它最先发热熔断，切断电源，保护后面昂贵的电器和电线不被烧坏。它牺牲自己，换全家平安。所以保险丝一断，说明电路过载或短路了，要先查原因，换同规格的保险丝，不能用铜丝代替——那等于把安全闸拆了，换保险丝要换同规格的，千万别用铜丝代替，那等于拆了安全闸。",s:"维基百科·保险丝",u:"https://zh.wikipedia.org/wiki/保险丝"},
      {q:"为什么冰箱门边有一圈磁条？",a:"因为它是冰箱的自动密封条。磁条里嵌着磁铁，关门时自动吸住门框，把门缝吸得严严实实，不让冷气跑出去、外面热空气钻进来。冰箱要是门封老化、吸不紧，冷气漏光，冰箱就得拼命制冷，费电还不保鲜。所以开关冰箱门时那声吸住的闷响，正是磁条在卖力锁温，门封老化吸不紧就费电，开关门那声闷响，正是它在卖力锁温，所以开关冰箱门时那声吸住的闷响，正是磁条在卖力锁温，门关紧了冷气才不跑。",s:"维基百科·冰箱",u:"https://zh.wikipedia.org/wiki/冰箱"},
      {q:"为什么洗衣机洗完还要甩干？",a:"因为甩干靠离心力把水甩出去。洗完的衣服吸饱了水，挂着慢慢滴干要大半天；洗衣机高速旋转时，离心力把衣服里的水从微孔甩出去，十几分钟就脱到八成干，晾晒时间大大缩短。甩得越干，衣服干得越快、也不容易闷出味道。所以甩干不是多此一举，是给衣服做一次快速脱水，甩得越干，晾得越快，也不容易闷出怪味，那十几分钟的高速旋转，靠离心力把水从衣服微孔里甩出去，比手拧、滴水都快得多。",s:"维基百科·洗衣机",u:"https://zh.wikipedia.org/wiki/洗衣机"},
      {q:"为什么电梯要定期检修？",a:"因为它天天负重运行，零件会老。电梯里有钢丝绳、刹车、门机、控制系统，日复一日开关门、上上下下，钢丝绳会磨损、制动器会老化、安全回路也可能失灵。定期检修就是给它做体检，换掉磨损件、测试安全钳和限速器，防止突然停梯、坠落。那一张张贴在轿厢里的年检合格证，就是它的健康证明，轿厢里那张年检合格证，就是它的健康证明，到期必须检。",s:"维基百科·电梯",u:"https://zh.wikipedia.org/wiki/电梯"},
      {q:"为什么地铁进站要安检？",a:"因为地铁人多、空间封闭，一旦出事后果严重。包里的易燃易爆品、管制刀具如果被带上车，万一引燃行凶，隧道里疏散困难。安检机和安检员就是把危险拦在站外。排队那几分钟，是用一点时间换整车人的安全。所以配合安检不是麻烦，是给大家多一道保险，排队那几分钟，是用一点时间换整车人的安心，那台安检机和安检员，就是把易燃易爆、管制刀具拦在站外，护住封闭车厢里的每一个人。",s:"维基百科·安检",u:"https://zh.wikipedia.org/wiki/安检"},
      {q:"为什么要垃圾分类？",a:"因为不同垃圾命运不一样。厨余会腐烂发臭、还能堆肥；纸、塑料、玻璃、金属回收后能再造成新东西；电池、灯管里有毒，单独处理才不污染水土。混在一起埋，好东西烂掉、毒东西扩散。分好类，回收的回炉、厨余的堆肥、有害的专门处置，城市才不被垃圾淹没。那四个颜色的桶，是让各走各的路，那四个颜色的桶，是让不同垃圾各回各家、各走各路。",s:"维基百科·垃圾分类",u:"https://zh.wikipedia.org/wiki/垃圾分类"},
      {q:"为什么夏天穿白衣服凉快？",a:"因为白色反光、吸热少。太阳光里带着热量，深色衣服把光大部分吸收进来，越穿越热；白色衣服把大部分阳光反射掉，吸收的热量少，穿在身上就清爽。所以夏天短袖、防晒衣多是浅色。同样道理，屋顶刷白、汽车选浅色，都是为了少吸热。一件白T恤，是夏天最朴素的防晒，一件浅色短袖，就是夏天最朴素也最管用的防晒，同理，屋顶刷白、汽车选浅色都是一个道理——少吸热，人就舒服。",s:"维基百科·颜色",u:"https://zh.wikipedia.org/wiki/颜色"},
      {q:"为什么黑色衣服吸热？",a:"因为黑色是光的回收站。深色对各种波长的光几乎不反射，统统吸收进来，光能变成热能，穿在身上像裹了层小太阳。夏天在太阳下穿黑T恤，后背很快就发烫。所以防晒讲究穿浅色、宽松。黑色酷是酷，但大夏天太阳底下，它确实是给自己加热，黑T恤虽酷，大太阳底下却像给自己裹了层小太阳，黑色把各种光几乎全吸收进来，光能变成热能，夏天太阳下穿它像裹着层小太阳，所以防晒才选浅色宽松。",s:"维基百科·颜色",u:"https://zh.wikipedia.org/wiki/颜色"},
      {q:"为什么寄快递要实名制？",a:"因为这是为了寄件可追溯。快递单上登记真实身份，万一寄的是违禁品、出了问题，能顺着查到寄件人，对快递员和收件人也是保护。推行实名后，乱寄危险品、诈骗包裹少了很多。你寄件时报手机号、出示身份证，那一步看似麻烦，其实是给整个快递网络上一道安全锁，这一步看似麻烦，其实是给整个快递网络上了道安全锁，推行实名后，乱寄危险品和诈骗包裹明显少了，你收到的快递也更让人放心。",s:"维基百科·快递",u:"https://zh.wikipedia.org/wiki/快递"},
      {q:"为什么加油站不能打电话？",a:"因为怕火花点燃油气。加油站空气里可能飘着挥发的汽油分子，虽然平时浓度不高，但手机接通瞬间可能在电路里产生微小电火花，万一遇上油气浓度偏高，理论上有起火风险。规定虽然保守，但加油站是防火重地，任何可能产生火花的行为都被禁。所以进加油站，先把手机收起来、别抽烟，这是对自己和别人负责，进油站先把手机收好、别抽烟，这是对自己也对别人负责。",s:"维基百科·加油站",u:"https://zh.wikipedia.org/wiki/加油站"},
      {q:"为什么说手机屏幕蓝光伤眼睛？",a:"因为蓝光能量高、还影响睡眠。手机、电脑屏幕发出的短波蓝光，长时间盯着会让眼睛干涩、疲劳，眼底也长期受刺激；更麻烦的是蓝光会抑制褪黑素分泌，睡前刷手机，大脑以为天还亮着，就迟迟睡不着。所以晚上把屏幕调暗、开夜间模式、别躺床上刷手机，眼睛和睡眠都能松口气，睡前少刷手机、开夜间模式，眼睛和睡眠都能松口气。",s:"维基百科·蓝光",u:"https://zh.wikipedia.org/wiki/蓝光"},
      {q:"为什么充电器一直插着也费电？",a:"因为它在偷偷耗电。插头不拔、充电器空载插在插座上，内部电路仍在工作，一点点发热、耗电，这叫待机功耗。单个不起眼，一屋子充电器长年累月加起来也不少电费，还加速器件老化。养成用完拔插头的习惯，省电又安全。所以那个一直插着的充电头，不是睡着了，是在悄悄吃电，用完顺手拔插头，既省电又安全，一年下来也能省点电费。",s:"维基百科·电源",u:"https://zh.wikipedia.org/wiki/电源"},
      {q:"为什么安全气囊能救命？",a:"因为它在毫秒内弹出来接住你。撞车瞬间，传感器检测到猛烈撞击，气体发生器立刻充气，气囊像枕头一样在你和方向盘、挡风玻璃之间弹开，把人缓冲住，避免头部胸部直接撞硬物。它必须和安全带配合才有效：安全带先把人拉住，气囊再兜一把。那一瞬间的展开，是汽车给乘员备的救命软垫，它得和安全带一起用才灵，两个搭档缺一不可。",s:"维基百科·安全气囊",u:"https://zh.wikipedia.org/wiki/安全气囊"},
      {q:"为什么消防通道不能堵？",a:"因为那是火灾时的救命路。楼道里的消防通道、小区的消防车道，是消防车开进、人员逃生的唯一通道。一旦被电动车、杂物、私家车堵死，着火时人跑不出去、消防车开不进来，后果不堪设想。所以哪怕一分钟图方便，也别在消防通道堆东西、停车。那一条畅通的路，关键时刻能救命，那一条畅通的路，火灾关键时刻就是逃生的救命路。",s:"维基百科·消防通道",u:"https://zh.wikipedia.org/wiki/消防通道"},
      {q:"为什么人行横道叫斑马线？",a:"因为它画得像斑马的条纹。英国人最早在马路上画一道道黑白相间的粗条纹引导行人过街，远远看去像斑马身上的斑纹，于是得了这个形象的名字。白色条纹在灰色路面上醒目，司机老远就能看到要减速让行。后来全世界沿用这种画法，名字也跟着叫开了。所以过马路走的那一道道白杠，名字来自一匹斑马，原来名字来自一匹斑马，听着有趣，用着安全。",s:"维基百科·斑马线",u:"https://zh.wikipedia.org/wiki/斑马线"},
      {q:"为什么井盖大多是圆的？",a:"因为圆形井盖怎么放都不会掉下去。圆形的直径处处相等，就算被顶起来，盖子也不会从同样直径的圆洞漏下去；换成方形，斜着就可能掉进井里。圆形还方便搬运、滚动着走，受力均匀不易裂。所以马路上那些圆井盖，不是为了好看，是工程上最稳妥的选择，圆井盖怎么放都不掉下去，是工程上最稳妥的形状，圆形受力均匀、不易裂，搬运时还能滚着走，比方形省力气，所以城市井盖几乎都是圆的。",s:"维基百科·井盖",u:"https://zh.wikipedia.org/wiki/井盖"},
      {q:"为什么赶飞机要提前两小时到？",a:"因为机场比火车站复杂得多。你要值机托运行李、过安检、走到登机口，国内航班还经常要排大队；遇到节假日、大机场，光安检可能就要半小时。飞机起飞前十五到三十分钟就停止登机，晚了直接关舱门。提前两小时到，是把排队、延误、找路的余量都留出来。早到的从容，总比狂奔误机强，早到的从容，总比一路狂奔误了机强得多，飞机起飞前十几分钟就关闭登机口，晚了直接关门走人，提前到才能从容值机、安检、走到登机口。",s:"维基百科·机场",u:"https://zh.wikipedia.org/wiki/机场"},
      {q:"为什么飞机舷窗是椭圆的？",a:"因为圆形能分散压力。飞机飞到高空，舱内加压、舱外低压，机身承受巨大应力。早年方窗的飞机在拐角处应力集中，容易裂；改成圆角椭圆后，压力均匀散开，窗框不容易开裂。这是血的教训换来的设计。所以你看到的小圆窗，每一道弧度都是为了在高空把压力卸掉，每一道圆角，都是为了在高空把压力均匀卸掉，早年方窗飞机拐角应力集中出过事，改成圆角后压力均匀散开，窗框才经得起高空反复加压。",s:"维基百科·飞机",u:"https://zh.wikipedia.org/wiki/飞机"},
      {q:"为什么高铁座位号里没有E？",a:"因为它学的是飞机编号习惯。高铁二等座一排五座，用A、B、C、D、F，跳过了E。早年飞机座位是单双数排座，A和F代表靠窗，久而久之E被空出来，大家也习惯了A靠窗、F靠窗。高铁沿用这套，让你一看座位号就知道是不是靠窗。所以没有E，是航空编号留下的小传统，一看座位号就知道靠不靠窗，是航空编号留下的小传统。",s:"维基百科·高铁",u:"https://zh.wikipedia.org/wiki/高铁"},
      {q:"为什么超市购物车要投币才能推？",a:"因为这是为了让大家把车还回去。投一块钱解锁购物车，用完推回原位插回链条，钱就退给你；不还，那一块就留在那儿。这一招让顾客自觉把车归位，不用超市雇人到处收车，停车场也不会被乱停的车子占满。小小的一块钱，换来整齐的车场和人手的节省，那一块钱押金，换来停车场整齐又不用雇人收车，用完推回原位插回链条，那一块钱就退给你，既整齐又不用超市雇人满场收车。",s:"维基百科·购物车",u:"https://zh.wikipedia.org/wiki/购物车"},
      {q:"为什么电梯里要装一面镜子？",a:"一开始不是为了让你整理仪容。电梯里装镜子，主要是给坐轮椅和推婴儿车的人看后方、方便倒着退出；也能让狭小的轿厢显得宽敞些、减少幽闭感。后来大家顺手用它照照头发、补补妆，反倒成了镜子最常见的用途。所以那面镜子，最初是无障碍设计，意外成了补妆镜，它本是无障碍设计，意外成了大家的补妆镜，坐轮椅、推婴儿车的人靠它看后方、方便倒退着出来，还让狭小轿厢显得不那么憋闷。",s:"维基百科·电梯",u:"https://zh.wikipedia.org/wiki/电梯"},
      {q:"为什么自动门会自己开？",a:"因为它在悄悄感应你。门框上方装着感应器，有的发射红外线、有的探测地面的微波变化，人一走近，传感器捕捉到变化，立刻通知电机把门打开。你走到跟前它就滑开，人走后又自动合上，全程不用手碰。这就是商场、写字楼大门不用推的秘密，你走到跟前它就滑开，全程不用手碰，干净又方便，门框上方的红外或微波感应器探测到有人走近，立刻通知电机开门，人走后再自动合上。",s:"维基百科·自动门",u:"https://zh.wikipedia.org/wiki/自动门"},
      {q:"为什么感应水龙头会自己出水？",a:"因为它靠红外线探测你的手。水龙头出水口下方有个红外传感器，平时不断往外发射红外线；手一伸过来，红外线被反射回去，传感器一收到信号，立刻打开电磁阀出水。手拿开，反射消失，水就停。既省水又不用手拧开关，公共洗手间用它，干净又卫生，手一伸就来、一拿就停，公共洗手间干净又省水，红外一收到手反射回来的信号就开阀，手拿开就停，不用手拧开关，公共场合干净又卫生。",s:"维基百科·水龙头",u:"https://zh.wikipedia.org/wiki/水龙头"},
      {q:"为什么镜子里的人左右相反？",a:"因为镜子是前后翻转，不是左右翻转。你举起右手，镜里的人看起来举的是他的左手，其实那是因为镜面把你前后照反了——你的正面变成了镜里人的背面，左右自然就对着错位。镜子并不会把左右颠倒，它只是把前后照了个面。明白这一点，再照镜子就不觉得奇怪了，它只是把前后照了个面，左右其实并没有颠倒，镜面对的是前后，你举起右手，镜里那个人只是把你前后照反了，左右并没有真的颠倒。",s:"维基百科·镜像",u:"https://zh.wikipedia.org/wiki/镜像"},
      {q:"为什么近视要戴凹透镜？",a:"因为近视眼把像成在了视网膜前面。近视眼的眼球太长或屈光太强，远处物体的像没落到视网膜上就先聚了焦，看东西模糊。凹透镜能先把光线发散一点，让像往后挪，正好落在视网膜上，远处就清楚了。所以近视镜是中间薄边上厚的凹透镜，专门帮眼睛把像推到正确的位置，那副中间薄边上厚的眼镜，专门帮你把像推回视网膜上，凹透镜先把光线发散一点，让像往后挪，正好落在视网膜上，远处的字一下就清楚了。",s:"维基百科·近视",u:"https://zh.wikipedia.org/wiki/近视"},
      {q:"为什么太阳镜能挡住强光？",a:"因为它镜片里加了偏振或滤光材料。强光里有刺眼的眩光和紫外线，太阳镜通过深色镜片吸收部分光线，偏振片还能把路面、水面反射的乱光滤掉，让眼前柔和不晃眼。好的太阳镜还能挡紫外线，保护眼底。夏天出门戴一副合适的墨镜，眼睛不眯、也不累，夏天出门戴副合适的墨镜，眼睛不眯也不累，深色镜片吸收部分光线，偏振片滤掉路面水面的眩光，好的墨镜还能挡紫外线保护眼底。",s:"维基百科·太阳镜",u:"https://zh.wikipedia.org/wiki/太阳镜"},
      {q:"为什么手机要贴膜戴壳？",a:"因为屏幕和后盖都怕摔怕刮。手机玻璃再硬，掉在水泥地上、钥匙刮到，照样碎、划花。贴张钢化膜、套个软壳，摔下去时膜和壳先扛冲击，碎的是它们而不是手机屏。换膜换壳便宜，换屏就贵了。所以那层膜、那个壳，是花小钱给手机买的保险，花小钱换膜换壳，总比摔碎屏幕花大钱强，摔下去膜和壳先扛冲击，碎的是它们不是屏幕，换膜换壳便宜多了，是给手机买份小保险。",s:"维基百科·智能手机",u:"https://zh.wikipedia.org/wiki/智能手机"},
      {q:"为什么充电线用久了容易坏？",a:"因为最常折的地方先老化。充电线两头根部每天反复弯折，里面的铜线和绝缘皮被折来折去，慢慢断裂、露铜；加上长期插插拔拔，接口处磨损。所以坏的总是插头那一段。用的时候别拽线、绕圈别太死，能多用一阵子。线坏了及时换，露铜的线有短路风险，别拽线、别绕太死，坏了及时换，露铜线有短路风险，两头根部天天反复弯折，铜线慢慢断裂露铜，用的时候别拽线、别绕太死，坏了及时换。",s:"维基百科·电源线",u:"https://zh.wikipedia.org/wiki/电源线"},
      {q:"为什么冬天手机掉电特别快？",a:"因为锂电池怕冷。锂电池靠内部化学反应发电，温度一低，反应变慢、内阻变大，电放不出来，手机看着电量满格却很快关机。这不是电池坏了，是它在偷懒。回到暖和地方捂一捂，电量又回来了。所以冬天手机冻得自动关机，别着急，捂热就好，冻得自动关机别急，捂回暖和地方电量就回来了，低温让电池内部反应变慢、内阻变大，电放不出来才虚电，捂回暖和地方电量就回来了。",s:"维基百科·锂电池",u:"https://zh.wikipedia.org/wiki/锂电池"},
      {q:"为什么家里Wi-Fi总有死角？",a:"因为信号穿墙会衰减。Wi-Fi是电磁波，每穿过一堵墙、一层楼板，信号就弱一截；微波炉、蓝牙、邻居的路由器还在同个频段抢干扰。路由器放墙角、塞进柜子里，死角更多。把路由器放在家中间、抬高一点、远离电器，死角就小很多。那格信号，是被墙和距离一点点吃掉的，把路由器放屋子中间、抬高些，死角就小多了，每穿一堵墙信号弱一截，再加上微波炉蓝牙抢频段，把路由器放屋子中间抬高些就好很多。",s:"维基百科·Wi-Fi",u:"https://zh.wikipedia.org/wiki/Wi-Fi"},
      {q:"为什么路由器要定期重启？",a:"因为它久开会变迟钝。路由器也是一台小电脑，长时间运行内存塞满、缓存堆积，就会变慢、断流。拔掉电源等半分钟再插上，相当于让它重新开机、清空缓存，网速往往就回来了。家里Wi-Fi突然变慢，先别投诉运营商，重启一下路由器，常常立马见效，网速变慢先别急着报修，重启一下常常立马见效，它也是小电脑，久开内存塞满就变慢断流，拔电半分钟再插上，清空缓存常常立刻恢复网速。",s:"维基百科·路由器",u:"https://zh.wikipedia.org/wiki/路由器"},
      {q:"为什么空调要定期清洗？",a:"因为它里面攒了一堆灰和霉。空调滤网、散热片上积满灰尘、螨虫，甚至长霉，一吹冷风全飘进屋里，鼻子嗓子都遭殃，还费电。每年用前洗一次滤网、请人深度清洗，风更干净、制冷也更快。所以吹空调闻到霉味，别硬扛，那是机器在喊你给它洗个澡，吹出霉味就别硬扛，那是机器在喊你给它洗个澡，滤网散热片积满灰尘螨虫甚至长霉，一吹全飘进屋里，每年用前洗一次，风干净还省电。",s:"维基百科·空调",u:"https://zh.wikipedia.org/wiki/空调"},
      {q:"为什么空调室内机会滴水？",a:"因为它在拆空气里的水。空调制冷时，室内机蒸发器很冷，潮湿空气一碰到它，水蒸气就凝结成水，顺着托盘流到室外。这跟夏天冰可乐瓶外壁冒汗是一个道理。水本该顺着排水管排走，要是管子堵了、装歪了，水就滴到屋里。所以空调滴水，多半是排水管该通一通了，水本该排到室外，滴到屋里，多半是排水管该通一通了，潮湿空气碰到冰冷蒸发器凝结成水，本该顺排水管走，管子堵了或装歪了才滴进屋里。",s:"维基百科·空调",u:"https://zh.wikipedia.org/wiki/空调"},
      {q:"为什么老式冰箱要除霜？",a:"因为霜是一层隔热棉被。冷冻室里的水分不断在蒸发器上结霜，霜越积越厚，像给制冷管盖了层棉被，冷气传不出来，冰箱就得更费力制冷，费电还冻不透。定期把霜铲掉，制冷效率立刻回来。现在的无霜冰箱靠风扇自动除霜，就不用自己动手了，霜厚了像盖棉被，铲掉它制冷才快、也省电，霜像棉被盖在制冷管上，冷气传不出去，冰箱拼命制冷又费电又冻不透，铲掉就好。",s:"维基百科·冰箱",u:"https://zh.wikipedia.org/wiki/冰箱"},
      {q:"为什么洗衣粉会起泡泡？",a:"因为它里面有表面活性剂。表面活性剂一头爱水、一头爱油，把油污包住带走；揉搓时又把空气卷进水里，形成稳定的泡泡。泡泡本身不直接去污，但它说明活性剂在工作。泡泡多少和去污力不完全成正比，低泡洗衣粉一样洗得干净，还容易漂清，泡泡多少不代表去污力，低泡的一样洗得干净还好漂，表面活性剂一头亲水一头亲油，把空气卷进水里形成泡泡，泡泡多不代表去污力强。",s:"维基百科·洗衣粉",u:"https://zh.wikipedia.org/wiki/洗衣粉"},
      {q:"为什么洗洁精能去油？",a:"因为它是油水之间的和事佬。洗洁精里的表面活性剂分子，一头亲水、一头亲油，亲油那头扎进油滴，亲水那头留在水里，把大油滴拆成无数小油滴包裹起来，油就被水冲走了。所以温水加洗洁精，碗筷上的油一冲就净。它不是把油变没了，是把油乳化进水里带走，它不是把油变没，而是把油乳化进水里一起冲走，活性剂一头扎进油滴一头牵着水，把大油滴拆成小油滴包裹带走，温水冲一遍碗筷就净。",s:"维基百科·洗洁精",u:"https://zh.wikipedia.org/wiki/洗洁精"},
      {q:"为什么肥皂能把手洗干净？",a:"因为它一边拉手一边拉油。肥皂分子一头亲水、一头亲油，沾水搓手时，亲油端扎进手上的油污和细菌，亲水端牵着水，一冲就把脏东西带进水里。搓出泡泡的过程，就是肥皂分子在四处抓脏。所以洗手要搓够二十秒，让肥皂分子有时间把手背、指缝都照顾到，洗手要搓够二十秒，让肥皂分子把指缝都照顾到，亲油端扎进油污细菌，亲水端牵着水一冲就走，洗手要搓够二十秒才洗得彻底。",s:"维基百科·肥皂",u:"https://zh.wikipedia.org/wiki/肥皂"},
      {q:"为什么牙刷要三个月换一次？",a:"因为刷毛会越用越脏、越趴。牙刷天天湿着放，刷毛里藏着食物残渣和细菌，时间一长又软又塌，刷不干净还可能伤牙龈。三个月换一支，刷毛挺括、清洁力在线。刷头卷毛了、变色了，也别等三个月，提前换。那支旧牙刷，早该退休了，刷毛卷了变色了，别等三个月，提前换更卫生，刷毛里藏着残渣细菌，久用又软又塌刷不干净，卷毛变色了就提前换，别硬撑。",s:"维基百科·牙刷",u:"https://zh.wikipedia.org/wiki/牙刷"},
      {q:"为什么毛巾用久了会变硬？",a:"因为水里的钙镁在上面结垢。自来水含矿物质，毛巾用久了，钙镁沉积在纤维上，毛巾就发硬、发腻，还容易有味。用煮毛巾、加白醋泡一泡，能把水垢溶掉，毛巾又软回来。定期换毛巾、晾在通风处，才不会又硬又臭，用白醋煮一煮去去水垢，毛巾又能软回来，自来水里的钙镁沉积在纤维上就发硬发腻，用白醋煮一煮溶掉水垢，毛巾又软回来。",s:"维基百科·毛巾",u:"https://zh.wikipedia.org/wiki/毛巾"},
      {q:"为什么被子要晒太阳？",a:"因为阳光是免费的除味除潮大师。被子睡久了吸进汗气和皮屑，潮乎乎的还容易滋生螨虫。太阳一晒，水分蒸发、紫外线杀菌去味，被子蓬蓬松松。晒完那股阳光味，其实是被晒过的纤维和微量臭氧的味道。所以冬天晒过的被子盖着格外暖，那是阳光存进去的味道，晒过的被子那股阳光味，其实是纤维被晒后的清香，晒走汗气潮气、紫外线杀螨虫，被子蓬蓬松松，那股阳光味就是晒过纤维的清香。",s:"维基百科·被子",u:"https://zh.wikipedia.org/wiki/被子"},
      {q:"为什么雾霾天不能开窗？",a:"因为外面的空气比屋里还差。雾霾天外面飘着大量PM2.5和污染物，一开窗，脏空气全灌进来，空气净化器都白开。这时候要紧闭门窗、开净化器，等空气质量好转再短时通风。雾霾天里待在屋里，反而是更干净的选择，这时候紧闭门窗、开净化器，才是更干净的选择，外面飘着大量PM2.5，一开窗全灌进来，净化器都白开，要紧闭门窗等空气好转再短时通风。",s:"维基百科·雾霾",u:"https://zh.wikipedia.org/wiki/雾霾"},
      {q:"为什么雨伞撑开是弧形的？",a:"因为弧形最挡雨又结实。伞面做成圆弧形，雨水顺着弧度流下来，不会在中间积水；伞骨均匀撑开，结构稳定，风一吹不容易翻。直杆伞骨长、稳当，折叠伞收起来小巧。那道弯弯的弧线，是几百年试出来的最挡雨造型，那道弯弯弧线，是几百年试出来最挡雨的造型，弧形让雨水顺弧度流走不积水，伞骨均匀撑开结构稳，风一吹也不容易翻。",s:"维基百科·雨伞",u:"https://zh.wikipedia.org/wiki/雨伞"},
      {q:"为什么马路中间画双黄线？",a:"因为它是看不见的隔离墙。双黄线用来分隔对向车流，告诉司机这边不能越线超车、掉头。实线严禁跨越，虚线在安全时可临时越。它比实体护栏灵活，又比单黄线更强调严禁。所以压双黄线超车是违章，那两条黄线，是对向车流之间的安全分界线，压双黄线超车是违章，它就是对向车流的安全分界线，它分隔对向车流，实线严禁跨越掉头，比护栏灵活，是对向车之间的安全分界线。",s:"维基百科·道路",u:"https://zh.wikipedia.org/wiki/道路"},
      {q:"为什么安全带能保命？",a:"因为它把你牢牢按在座位上。急刹车或撞车时，身体会因惯性继续往前冲，没有安全带，人会撞向方向盘、挡风玻璃甚至飞出窗外。安全带在你冲出去的一瞬间绷紧，把人拉住，配合安全气囊缓冲。所以开车坐车都要系好，那根带子不是束缚，是保命绳，开车坐车都系好，那根带子不是束缚，是救命绳，撞车时身体因惯性前冲，安全带在冲出去的一瞬绷紧把人拉住，配合气囊缓冲才安全。",s:"维基百科·安全带",u:"https://zh.wikipedia.org/wiki/安全带"},
      {q:"为什么骑电动车要戴头盔？",a:"因为头部是最经不起摔的部位。电动车摔倒时，头往往先着地，戴头盔能缓冲撞击、保护颅骨和大脑。同样一摔，戴不戴头盔结果天差地别。交规要求骑电动车戴头盔，就是用最简单的装备，守住最关键的部位。那顶头盔，关键时刻真能救命，戴不戴头盔，同样一摔结果天差地别，摔倒时头往往先着地，头盔缓冲撞击保护颅骨，同样一摔戴不戴结果天差地别。",s:"维基百科·头盔",u:"https://zh.wikipedia.org/wiki/头盔"},
      {q:"为什么刹车时人会往前倾？",a:"因为惯性在作怪。车开着时，你和车一起往前；刹车时车慢下来了，可你的身体还想保持原来的速度继续往前，于是就往前一倾。这就是牛顿说的惯性——物体都想维持原来的运动状态。猛刹车人往前冲、加速时人往后仰，都是同一个惯性在起作用，猛刹车前冲、加速后仰，都是同一个惯性在作怪，车慢了身体还想保持原来的速度往前，这就是惯性，加速后仰、刹车前冲都是它在起作用。",s:"维基百科·惯性",u:"https://zh.wikipedia.org/wiki/惯性"},
      {q:"为什么坐车容易犯困？",a:"因为车在轻轻摇。车一路匀速颠簸、微微振动，像小时候被摇篮晃着，让人放松；加上窗外景色单调、发动机嗡嗡的白噪音，大脑很快就困倦。容易晕车的人反而睡不着，那是因为前庭在闹别扭。所以坐长途车容易点头打瞌睡，是身体被晃舒服了，车一路轻轻晃着，像摇篮一样把人晃困了，车一路匀速轻晃像摇篮，加上窗外景色单调、发动机嗡嗡白噪音，大脑很快就放松犯困。",s:"维基百科·晕车",u:"https://zh.wikipedia.org/wiki/晕车"},
      {q:"为什么打哈欠会传染？",a:"因为这是一种共情和模仿。打哈欠会传染，科学界认为和大脑里的镜像神经元有关——看到别人打，你会不自觉模仿，这是远古群居生活留下的同步机制。连看到文字、听到哈欠都会让人想打，足见这反射多强。它也可能和犯困、降温有关，总之哈欠一来，挡都挡不住，连看到哈欠两个字都想打，足见这反射有多强，这和大脑镜像神经元、模仿本能有关，看到、听到甚至读到哈欠都让人想打，挡都挡不住。",s:"维基百科·打哈欠",u:"https://zh.wikipedia.org/wiki/打哈欠"},
      {q:"为什么蹲久了站起来会头晕？",a:"因为血一下子没跟上大脑。蹲着时下肢受压、血液集中在下半身；猛地站起来，重力让血液往下半身涌，大脑瞬间供血不足，就眼前发黑、头晕几秒。身体通过加快心跳、收缩血管很快调节回来。所以蹲久了别猛站，慢慢起身给身体一点反应时间，就不晕了，慢慢起身给身体点反应时间，就不眼前发黑了，猛一站血往下半身涌，大脑瞬间供血不足才眼前发黑，慢慢起身给身体几秒反应时间就好。",s:"维基百科·体位性低血压",u:"https://zh.wikipedia.org/wiki/体位性低血压"},
      {q:"为什么熬夜会有黑眼圈？",a:"因为眼周皮肤薄又累。熬夜时眼周血液循环变慢，静脉血颜色暗，透在薄薄的眼皮上就成了青黑；加上色素沉着、水肿，眼圈更重。睡够觉、少揉眼、冷敷，能缓解。长期熬夜的黑眼圈，是眼睛在替你记着欠下的睡眠债，那圈青黑，是眼睛在记着你欠下的睡眠债，眼周皮肤薄，熬夜后血液循环慢、静脉血透出来发青，再加上色素和水肿，眼圈就重了。",s:"维基百科·黑眼圈",u:"https://zh.wikipedia.org/wiki/黑眼圈"},
      {q:"为什么久坐腰会酸？",a:"因为腰一直在默默扛着你。坐着时腰椎承受的压力比站着还大，腰背部肌肉长时间紧张、得不到放松，时间一长就僵硬酸痛。每隔一小时起来走两步、伸个懒腰，让肌肉松一松。那点腰酸，是身体在提醒你：坐久了，该动一动了，每小时起来走两步伸个懒腰，腰才不闹脾气，坐着时腰椎压力比站着还大，腰背肌肉长时间紧张不放松，每小时起来走两步伸懒腰就缓解。",s:"维基百科·久坐",u:"https://zh.wikipedia.org/wiki/久坐"},
      {q:"为什么空调开26度最舒服又省电？",a:"因为它卡在舒适和省电的平衡点。夏天空调每调低一度，耗电就往上蹿；26度左右不冷不热，人体感觉舒适，压缩机也不用拼命工作。配合风扇、通风，体感更凉快。所以空调开到26度上下，既不闷汗，电费也温柔，是被反复验证过的黄金温度，配上风扇和通风，体感更凉快，电费也温柔，每调低一度耗电就蹿一截，26度不冷不热压缩机不用拼命，配风扇体感更凉快电费也温柔。",s:"维基百科·空调",u:"https://zh.wikipedia.org/wiki/空调"},
      {q:"为什么暖气房里要放盆水？",a:"因为暖气把空气烤得太干。冬天暖气烧着，室内空气水分被烘干，鼻子喉咙干、皮肤起皮。放盆水或开加湿器，让水分蒸发补充湿度，房间才不那么燥。湿度舒服了，呼吸和皮肤都好受。那一小盆水，是干燥暖气房里的小小加湿器，湿度舒服了，鼻子喉咙和皮肤都不那么干，暖气把空气烘得太干，放盆水或开加湿器补充湿度，鼻子喉咙皮肤都不那么干了。",s:"维基百科·湿度",u:"https://zh.wikipedia.org/wiki/湿度"},
      {q:"为什么冬天窗玻璃里会结冰花？",a:"因为屋里的水汽撞上了冰玻璃。室内暖湿空气碰到冰冷的窗玻璃，水汽直接凝华成冰晶，在玻璃内侧长成一片片树枝状的冰花。越冷的窗户，冰花越漂亮。等太阳出来、玻璃回暖，冰花又化成水珠淌下来。那层漂亮窗花，是屋里水汽在冷玻璃上开的花，那层漂亮窗花，是屋里水汽在冷玻璃上开的花，屋里暖湿空气碰到冰冷玻璃，水汽直接凝华成冰晶，长成一片片树枝状的漂亮冰花。",s:"维基百科·冰",u:"https://zh.wikipedia.org/wiki/冰"},
      {q:"为什么电影院座位是红色的？",a:"因为红色在暗里会先变黑。电影院灯光暗下来后，红色在视觉里最先褪去，变成接近黑色，观众的注意力就集中在银幕上，不会被一排排红座椅分散。而且红色耐脏、不显污迹。所以剧场、影院偏爱红色座椅，是利用了人眼对红色的暗适应，灯一暗红色先变黑，观众的注意力就全在银幕上，灯一暗红先在人眼里变黑，注意力就集中到银幕上，而且红色耐脏不显污迹。",s:"维基百科·电影院",u:"https://zh.wikipedia.org/wiki/电影院"},
      {q:"为什么银行门口常摆石狮子？",a:"因为它是从传统镇宅习俗来的。古人认为狮子威严、能镇宅辟邪，把石狮子放在衙门、府邸门口守门显气派。后来银行、酒楼沿袭这个讲究，图个镇守、生意兴隆的好彩头。左边踩球的是雄狮、右边抚小狮的是雌狮，成对摆放。所以门口那对石狮子，是图个吉利和威风，那对石狮子，是图个镇守和生意兴隆的好彩头，古人认为狮子威严镇宅，成对摆放显气派，后来银行酒楼沿袭，图个镇守兴隆的好彩头。",s:"维基百科·石狮子",u:"https://zh.wikipedia.org/wiki/石狮子"},
      {q:"为什么高铁站台要退到黄线后？",a:"因为列车经过时会把空气带跑。高铁飞速驶过，车身周围空气被带着高速流动，压强降低，而身后静止的空气压强大，会把站台上的人往车那边推。离得太近，人可能被吸向列车。那条黄线，就是提醒你留出安全距离，别被气流带走，那条黄线，就是提醒你别被高速气流吸过去，列车飞速经过把周围空气带跑、压强变低，身后空气会把人往车那边推，黄线就是安全距离。",s:"维基百科·火车站",u:"https://zh.wikipedia.org/wiki/火车站"},
      {q:"为什么下雨打雷时要关窗？",a:"因为怕雷电和跨步电压。打雷时，室外的雷电可能沿电线、雨水窜进屋里；开窗时球雷还可能飘进来。关窗、拔插头、不站在窗边，能减少被雷击的风险。雷雨天躲在关窗的屋里，是最安全的选择。那扇窗，是雷电天的一道屏障，雷雨天躲在关窗的屋里，是最安全的做法，雷电可能沿电线雨水窜进屋，开窗时球雷还可能飘进来，关窗拔插头不站窗边最安全。",s:"维基百科·雷电",u:"https://zh.wikipedia.org/wiki/雷电"},
      {q:"为什么红绿灯配了声音提示？",a:"因为这是给视障行人用的。视障朋友看不清红绿灯，靠听路口的嘀嗒声或快慢提示音判断能不能过马路。声音节奏变快表示绿灯可走，变慢表示要停下。这小小的提示音，让视障人士也能独自安全过街。城市的便利，是照顾到每一个人，这小小的提示音，让视障朋友也能独自安全过街，视障朋友看不清灯色，靠快慢提示音判断能不能过街，这小小的声音让他们也能独自行走。",s:"维基百科·交通信号灯",u:"https://zh.wikipedia.org/wiki/交通信号灯"},
      {q:"为什么自动扶梯要紧急停止按钮？",a:"因为它是救命的急停装置。万一有人鞋带、裙摆被夹住，或老人小孩摔倒，旁边人拍下急停按钮，扶梯立刻停住，避免越卷越严重。那个红色按钮平时不起眼，关键时候能止损。乘扶梯抓好扶手、不踩黄线，就是为了不让急停按钮派上用场，那个红按钮平时不起眼，关键时刻能止损救人，万一有人鞋带裙摆被夹或摔倒，拍下它扶梯立刻停住，避免越卷越严重，平时抓好扶手别让它派上用场。",s:"维基百科·自动扶梯",u:"https://zh.wikipedia.org/wiki/自动扶梯"},
      {q:"为什么医院走廊要保持安静？",a:"因为病人需要休息和康复。病房里的人本来就虚弱，吵闹影响休息、加重焦虑；医生护士讨论病情也需要安静环境。低声说话、手机调静音，是对病人的体谅。医院的安静，是用众人的自觉，给康复让路，低声说话、手机静音，是给病人康复让路，病人本来就虚弱，吵闹影响休息、医生讨论病情也需安静，低声说话手机静音是对病人的体谅。",s:"维基百科·医院",u:"https://zh.wikipedia.org/wiki/医院"},
      {q:"为什么图书馆不能吃东西？",a:"因为食物会招虫招味、还打扰别人。零食碎屑引来蟑螂老鼠，气味和咀嚼声影响安静看书的人；书是公共财产，油污水渍会污损纸张。带瓶水可以，零食就免了。那份安静整洁，要靠每个人一起守，带瓶水可以，零食免了，安静整洁靠大家一起守，零食碎屑招蟑螂老鼠，气味咀嚼声打扰别人，油污水渍还会污损公共图书，带瓶水就好，那份安静整洁，是靠每个读者一起守出来的。",s:"维基百科·图书馆",u:"https://zh.wikipedia.org/wiki/图书馆"},
      {q:"为什么垃圾桶要分类颜色？",a:"因为颜色一眼就能告诉你扔哪儿。可回收物多是蓝、厨余是绿、有害是红、其他是灰，不用看字也能凭颜色大概分辨。设计分类桶时就想到了快速识别，让扔垃圾这一秒不出错。那几个不同颜色的桶，是给垃圾指的路牌，那几个颜色桶，就是给不同垃圾指的路牌，蓝是可回收、绿是厨余、红是有害、灰是其他，凭颜色一眼就能分清，不用看字也能扔对。",s:"维基百科·垃圾分类",u:"https://zh.wikipedia.org/wiki/垃圾分类"},
      {q:"为什么超市冷柜大多是开放式的？",a:"因为方便顾客随手拿。开放式冷柜不用掀盖、不用拉门，伸手就取，购物效率高；冷柜口喷出的低温冷气往下沉，能保持低温不跑光。但它比带门的费电，所以现在越来越多换成玻璃门。那一柜冒着凉气的饮料，是图方便的设计，伸手就取购物方便，现在也越来越多换成玻璃门省电，不用掀盖伸手就取，冷气往下沉能保低温，但比带门费电，现在越来越多换成玻璃门。",s:"维基百科·冷柜",u:"https://zh.wikipedia.org/wiki/冷柜"},
      {q:"为什么飞机起飞降落要打开遮光板？",a:"和前面那条一样：应急时能看清内外情况。起降最危险，遮光板打开，客舱明亮，乘客和机组能观察外面有没有异常；救援人员也能看清机舱。这是安全规范里不起眼却重要的一条。那一小扇窗，关键时刻是观察哨，起降最危险，打开遮光板客舱明亮能看清内外，救援时外界也能观察机舱，是安全规范里重要一条，那一小扇窗，关键时刻就是机组和外界的观察哨。",s:"维基百科·民航",u:"https://zh.wikipedia.org/wiki/民航"},
      {q:"为什么高楼外面要装擦窗机？",a:"因为高层玻璃外墙人爬不上去。摩天楼几十层高，蜘蛛人吊绳风险大、效率低，楼顶的擦窗机像小吊车，吊着作业平台把工人送到窗外清洗、维修。那串在楼外晃来晃去的铁匣子，是高楼的美容师。没有它，玻璃幕墙一年就成了大花脸，没有它，摩天楼的玻璃幕墙很快就成大花脸，几十层高楼蜘蛛人吊绳风险大，楼顶擦窗机吊着作业平台把工人送到窗外清洗维修，是高楼美容师。",s:"维基百科·摩天大楼",u:"https://zh.wikipedia.org/wiki/摩天大楼"},
      {q:"为什么红绿灯黄灯要亮几秒？",a:"因为它是缓冲提醒。绿灯转红灯之间，黄灯亮两三秒，让已经过线的车赶紧开过去、没过线的停下，避免路口被堵住或撞车。黄灯不是加速冲的信号，而是收尾的提示。那几秒，是给司机的刹车反应时间，黄灯是收尾提示，不是让你加速冲过去，它在绿灯红灯之间做缓冲，让过线的车赶紧过去、没过线的停下，避免路口堵塞或相撞，那几秒，是留给司机判断刹车还是通过的反应时间。",s:"维基百科·交通信号灯",u:"https://zh.wikipedia.org/wiki/交通信号灯"},
      {q:"为什么雨天开车要减速、开雾灯？",a:"因为雨水让轮胎和视线都变差。雨天路面滑，轮胎抓地力下降，刹车距离变长；雨点挡玻璃、大灯反射，视线模糊。减速、开雾灯或近光灯、拉大车距，才能看清、停得住。雨天路滑，慢一点比快一点安全得多，慢一点、拉开距离，雨天路滑才停得住，雨水让轮胎抓地力下降、刹车距离变长，雨点挡玻璃视线模糊，减速开灯拉大距离才安全。",s:"维基百科·轮胎",u:"https://zh.wikipedia.org/wiki/轮胎"},
      {q:"为什么书包要双肩背而不是单肩？",a:"因为双肩让两边受力均匀。单肩背久了，一边肩膀长期负重，高低肩、腰背酸痛都找上门；双肩把重量分到两边，脊柱受力平衡，背起来更轻松、也保护脊椎。学生书包再沉，也得两个肩一起扛。那两根带子，是为了不让腰替你受过，两根带子分担重量，腰和脊椎才不替你受过，单肩久了高低肩腰背酸，双肩把重量分到两边、脊柱受力平衡，背起来轻松也保护脊椎。",s:"维基百科·书包",u:"https://zh.wikipedia.org/wiki/书包"},
      {q:"为什么酒店房间卡才能取电？",a:"因为这是节能加防盗的设计。插卡才有电，客人一拔卡出门，空调、灯自动断电，既省电又防止忘关空房长明灯。房卡同时也是钥匙，拔卡即走、回来插卡就亮。小小一张卡，把省电和门禁合在了一起，拔卡即断电，既节能又防止空房长明灯，插卡才有电，拔卡出门空调灯自动关，既省电又防忘关空房长明灯，房卡还兼作钥匙，小小一张卡，把节能和门禁两件事合在了一起。",s:"维基百科·酒店",u:"https://zh.wikipedia.org/wiki/酒店"},
      {q:"为什么高铁过隧道耳朵会闷？",a:"因为气压在变。列车进隧道时，隧道里空气被挤压，车厢外气压瞬间升高，传到耳膜，耳朵像被堵住一样；出隧道又往外一鼓。嚼口香糖、咽口水、打哈欠，让咽鼓管打开，平衡耳内外压力，闷胀感就缓解了。那耳闷，是气压在跟你的耳膜较劲，嚼嚼口香糖、咽咽口水，耳闷很快就缓解，进隧道时气压瞬间升高压到耳膜，嚼口香糖咽口水打哈欠打开咽鼓管，耳闷很快就缓解。",s:"维基百科·隧道",u:"https://zh.wikipedia.org/wiki/隧道"},
      {q:"为什么手机信号格满也可能上不了网？",a:"因为信号满只说明连得上基站。信号格代表你和基站的通信好不好，但基站出口带宽被一堆人同时用，就堵了；或者手机连着Wi-Fi却没网。满格不等于网速快。人多的广场、演唱会，基站被挤爆，照样转圈。那几格信号，只是进门证，不是快车道，那几格只是进门证，人多拥挤照样转圈，满格只说明连得上基站，基站出口被一堆人同时用就堵了，人多的广场演唱会照样转圈。",s:"维基百科·移动通信",u:"https://zh.wikipedia.org/wiki/移动通信"},
      {q:"为什么过马路要一停二看三通过？",a:"因为车辆有盲区、也可能抢灯。走到路口先停下，左右都看清、确认没车再走，别埋头刷手机。司机有视线死角、也可能闯红灯，你自己多看一眼，比指望司机让行更稳妥。那几秒钟的停看，是把命攥在自己手里，自己多看一眼，比指望司机让行更稳妥，司机有视线死角也可能抢灯，自己走到路口先停下左右看清再走，比指望让行更稳妥。",s:"维基百科·交通",u:"https://zh.wikipedia.org/wiki/交通"}
    ]
  };

  var CATS = ["科学","历史","自然","动物","人体","食物","文化","常识"];
  var TOTAL = 0;
  for (var c=0;c<CATS.length;c++){ TOTAL += BANK[CATS[c]].length; }

  var TODAY = "2026-09-29";
  var VER = 3;
  var KEY = "lkc_" + VER + "_seen_" + TODAY;
  var FAV_KEY = "lkc_" + VER + "_fav";

  var mode = "random";   // random=随机一批 | cat=单分类 | fav=我的收藏
  var currentCat = null;

  /* ===== 已看记录（按日期，跨天自动重置） ===== */
  function loadSeen(){
    try{
      var raw = localStorage.getItem(KEY);
      if(raw){ var o = JSON.parse(raw); if(o && typeof o==="object"){ return o; } }
    }catch(e){}
    return {};
  }
  function saveSeen(o){
    try{ localStorage.setItem(KEY, JSON.stringify(o)); }catch(e){}
  }

  /* ===== 收藏记录（跨天保留） ===== */
  function loadFav(){
    try{
      var raw = localStorage.getItem(FAV_KEY);
      if(raw){ var o = JSON.parse(raw); if(o && o instanceof Array){ return o; } }
    }catch(e){}
    return [];
  }
  function saveFav(o){
    try{ localStorage.setItem(FAV_KEY, JSON.stringify(o)); }catch(e){}
  }
  function isFav(cat, idx){
    var fav = loadFav();
    for(var i=0;i<fav.length;i++){
      if(fav[i].cat===cat && fav[i].idx===idx){ return true; }
    }
    return false;
  }

  /* ===== 工具 ===== */
  function randInt(n){ return Math.floor(Math.random()*n); }
  function toast(msg){
    var el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(function(){ el.classList.remove("show"); }, 1800);
  }
  function escapeHtml(s){
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  /* ===== 抽题：每分类 1 条，不重复 ===== */
  function draw(){
    var seen = loadSeen();
    var picks = [];   // {cat, item, index}
    var reset = false;
    for(var i=0;i<CATS.length;i++){
      var cat = CATS[i];
      var arr = BANK[cat];
      var seenList = seen[cat] || [];
      var avail = [];
      for(var j=0;j<arr.length;j++){
        if(seenList.indexOf(j) === -1){ avail.push(j); }
      }
      if(avail.length === 0){
        seenList = [];
        avail = [];
        for(var k=0;k<arr.length;k++){ avail.push(k); }
        reset = true;
      }
      var idx = avail[randInt(avail.length)];
      if(seenList.indexOf(idx) === -1){ seenList.push(idx); }
      seen[cat] = seenList;
      picks.push({cat:cat, item:arr[idx], index:idx});
    }
    saveSeen(seen);
    return {picks:picks, reset:reset, seen:seen};
  }

  function seenTotal(seen){
    var n = 0;
    for(var c=0;c<CATS.length;c++){ n += (seen[CATS[c]]||[]).length; }
    return Math.min(n, TOTAL);
  }

  /* ===== 渲染 ===== */
  function renderNav(){
    var nav = document.getElementById("nav");
    var html = "";
    for(var i=0;i<CATS.length;i++){
      var c = CATS[i];
      html += '<a href="#cat-'+c+'" style="--c:'+colorOf(c)+'"'+(mode==="cat" && currentCat===c?' class="active"':'')+' onclick="window.goCat(\''+c+'\');return false;">'+c+'</a>';
    }
    nav.innerHTML = html;
  }

  function updateToolbar(){
    var ab = document.getElementById("allBtn");
    var fb = document.getElementById("favBtn");
    ab.classList.toggle("active", mode === "random");
    fb.classList.toggle("active", mode === "fav");
  }

  function colorOf(cat){
    var map = {"科学":"#17786E","历史":"#9A6B22","自然":"#5C7F31","动物":"#C05A2B","人体":"#C13F5B","食物":"#C9841B","文化":"#2E6DA3","常识":"#6B7280"};
    return map[cat] || "#17786E";
  }

  function render(result){
    var list = document.getElementById("list");
    var html = "";
    for(var i=0;i<result.picks.length;i++){
      var p = result.picks[i];
      var col = colorOf(p.cat);
      var favOn = isFav(p.cat, p.index);
      html +=
        '<article class="card" id="card-'+mode+'-'+(i+1)+'" style="--c:'+col+'">'+
          '<div class="card-head" role="button" tabindex="0" aria-expanded="false">'+
            '<span class="num">0'+(i+1)+'</span>'+
            '<span class="tag">'+escapeHtml(p.cat)+'</span>'+
            '<h2 class="q">'+escapeHtml(p.item.q)+'</h2>'+
            '<span class="chev">›</span>'+
          '</div>'+
          '<div class="card-body">'+
            '<div class="card-body-inner">'+
              '<p class="a">'+escapeHtml(p.item.a)+'</p>'+
              '<div class="meta">'+
                '<a class="src" href="'+escapeHtml(p.item.u)+'" target="_blank" rel="noopener">来源：'+escapeHtml(p.item.s)+' ↗</a>'+
                '<div class="meta-btns">'+
                  '<button class="copy" type="button">复制</button>'+
                  '<button class="fav'+(favOn?' on':'')+'" type="button" data-cat="'+p.cat+'" data-idx="'+p.index+'" onclick="window.toggleFav(\''+p.cat+'\','+p.index+');">'+(favOn?'已收藏':'收藏')+'</button>'+
                '</div>'+
              '</div>'+
            '</div>'+
          '</div>'+
        '</article>';
    }
    list.innerHTML = html;
    document.getElementById("favbar").hidden = true;
    updateCount(result.seen);
    var eb = document.getElementById("expandBtn");
    if(eb){ eb.textContent = "展开"; }
    if(result.reset){
      toast("这一批已经看完啦，重新洗牌再来一轮");
    }
  }

  /* ===== 单分类视图：显示该分类全部题目（可选打乱顺序） ===== */
  function shuffle(arr){
    var a = arr.slice();
    for(var i=a.length-1;i>0;i--){
      var j = randInt(i+1);
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function renderCat(cat, shuffleFlag){
    mode = "cat";
    currentCat = cat;
    var arr = BANK[cat];
    var order = [];
    for(var i=0;i<arr.length;i++){ order.push(i); }
    if(shuffleFlag){ order = shuffle(order); }
    var picks = [];
    for(var j=0;j<order.length;j++){
      var idx = order[j];
      picks.push({cat:cat, item:arr[idx], index:idx});
    }
    render({picks:picks, reset:false, seen:loadSeen()});
    document.getElementById("count").textContent = "「"+cat+"」分类 · 共 " + arr.length + " 条";
    renderNav();
    updateToolbar();
  }

  /* ===== 我的收藏视图 ===== */
  function renderFav(){
    mode = "fav";
    currentCat = null;
    var fav = loadFav();
    var picks = [];
    for(var i=0;i<fav.length;i++){
      var f = fav[i];
      var arr = BANK[f.cat];
      if(arr && arr[f.idx]){
        picks.push({cat:f.cat, item:arr[f.idx], index:f.idx});
      }
    }
    if(picks.length === 0){
      document.getElementById("list").innerHTML = '<div class="empty">还没有收藏的冷知识。打开任意卡片，点「收藏」就能收进这里。</div>';
      document.getElementById("count").textContent = "我的收藏 · 0 条";
      document.getElementById("favbar").hidden = false;
      document.getElementById("favbarInfo").textContent = "共 0 条";
      var eb = document.getElementById("expandBtn");
      if(eb){ eb.textContent = "展开"; }
      renderNav();
      updateToolbar();
      return;
    }
    render({picks:picks, reset:false, seen:loadSeen()});
    document.getElementById("count").textContent = "我的收藏 · " + picks.length + " 条";
    document.getElementById("favbar").hidden = false;
    document.getElementById("favbarInfo").textContent = "共 " + picks.length + " 条";
    renderNav();
    updateToolbar();
  }

  function updateCount(seen){
    var n = seenTotal(seen);
    document.getElementById("count").textContent = "今天已看 " + n + " / " + TOTAL + " 条";
  }

  function goAll(){
    mode = "random";
    currentCat = null;
    render(draw());
    renderNav();
    updateToolbar();
  }

  function refresh(){
    var btn = document.getElementById("refreshBtn");
    btn.classList.add("spin");
    setTimeout(function(){ btn.classList.remove("spin"); }, 480);
    if(mode === "cat"){
      renderCat(currentCat, true);
      return;
    }
    goAll();
  }

  /* ===== 交互：全部 / 展开收起 / 我的 / 收藏 ===== */
  document.getElementById("allBtn").addEventListener("click", goAll);
  document.getElementById("favBtn").addEventListener("click", renderFav);

  document.getElementById("expandBtn").addEventListener("click", function(){
    var cards = document.querySelectorAll(".card");
    if(cards.length === 0){ return; }
    var allOpen = true;
    for(var i=0;i<cards.length;i++){
      if(!cards[i].classList.contains("open")){ allOpen = false; break; }
    }
    for(var j=0;j<cards.length;j++){
      var open = !allOpen;
      cards[j].classList.toggle("open", open);
      var head = cards[j].querySelector(".card-head");
      if(head){ head.setAttribute("aria-expanded", open ? "true" : "false"); }
    }
    this.textContent = allOpen ? "展开" : "收起";
  });

  window.goCat = function(cat){ renderCat(cat); };

  window.toggleFav = function(cat, idx){
    var fav = loadFav();
    var pos = -1;
    for(var i=0;i<fav.length;i++){
      if(fav[i].cat===cat && fav[i].idx===idx){ pos = i; break; }
    }
    if(pos >= 0){
      fav.splice(pos, 1);
      toast("已取消收藏");
    }else{
      fav.push({cat:cat, idx:idx});
      toast("已收藏，去「我的」里找它");
    }
    saveFav(fav);
    if(mode === "fav"){
      renderFav();
    }else{
      var btns = document.querySelectorAll('.fav[data-cat="'+cat+'"][data-idx="'+idx+'"]');
      for(var j=0;j<btns.length;j++){
        btns[j].classList.toggle("on", pos < 0);
        btns[j].textContent = pos < 0 ? "已收藏" : "收藏";
      }
    }
  };

  document.addEventListener("click", function(e){
    var head = e.target.closest ? e.target.closest(".card-head") : null;
    if(head){
      var card = head.closest(".card");
      var open = card.classList.toggle("open");
      head.setAttribute("aria-expanded", open ? "true" : "false");
      return;
    }
    var btn = e.target.closest ? e.target.closest(".copy") : null;
    if(btn){
      var card = btn.closest(".card");
      var q = card.querySelector(".q").textContent;
      var a = card.querySelector(".a").textContent;
      var text = q + "\n\n" + a;
      copyText(text).then(function(){ toast("已复制，去分享吧"); })
        .catch(function(){ toast("复制失败，请手动长按选择"); });
    }
  });

  document.addEventListener("keydown", function(e){
    if(e.key === "Enter" || e.key === " "){
      var t = e.target;
      if(t && t.classList && t.classList.contains("card-head")){
        e.preventDefault();
        var card = t.closest(".card");
        var open = card.classList.toggle("open");
        t.setAttribute("aria-expanded", open ? "true" : "false");
      }
    }
  });

  function copyText(text){
    return new Promise(function(resolve, reject){
      if(navigator.clipboard && window.isSecureContext && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(resolve, function(){
          legacyCopy(text, resolve, reject);
        });
        return;
      }
      legacyCopy(text, resolve, reject);
    });
  }

  function legacyCopy(text, resolve, reject){
    var ta = null;
    try{
      ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.top = "0";
      ta.style.left = "0";
      ta.style.width = "2em";
      ta.style.height = "2em";
      ta.style.border = "0";
      ta.style.padding = "0";
      ta.style.margin = "0";
      ta.style.boxShadow = "none";
      ta.style.outline = "none";
      ta.style.background = "transparent";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      var ok = document.execCommand("copy");
      document.body.removeChild(ta);
      ta = null;
      if(ok){ resolve(); }
      else{ reject(new Error("execCommand copy failed")); }
    }catch(err){
      if(ta && ta.parentNode){ ta.parentNode.removeChild(ta); }
      reject(err);
    }
  }

  /* ===== 我的收藏：全部复制 ===== */
  window.copyAllFav = function(){
    var fav = loadFav();
    var parts = [];
    for(var i=0;i<fav.length;i++){
      var f = fav[i];
      var arr = BANK[f.cat];
      if(arr && arr[f.idx]){
        parts.push("【" + f.cat + "】" + arr[f.idx].q + "\n\n" + arr[f.idx].a);
      }
    }
    if(parts.length === 0){
      toast("还没有可复制的收藏");
      return;
    }
    copyText(parts.join("\n\n————\n\n")).then(function(){
      toast("已复制全部收藏");
    }).catch(function(){
      toast("复制失败，请手动长按选择");
    });
  };

  /* ===== 下拉刷新（触摸） ===== */
  (function(){
    var tip = document.getElementById("pullTip");
    var startY = null, pulling = 0, released = false;
    document.addEventListener("touchstart", function(e){
      if(window.scrollY <= 0){
        startY = e.touches[0].clientY;
        pulling = 0;
        released = false;
      }
    }, {passive:true});
    document.addEventListener("touchmove", function(e){
      if(startY === null){ return; }
      var dy = e.touches[0].clientY - startY;
      if(dy > 0 && window.scrollY <= 0){
        pulling = Math.min(dy, 110);
        released = true;
        tip.textContent = pulling > 70 ? "松开再好奇" : "↓ 下拉再好奇";
        tip.classList.add("show");
        e.preventDefault();
      }
    }, {passive:false});
    document.addEventListener("touchend", function(){
      if(released){
        tip.classList.remove("show");
        if(pulling > 70){ refresh(); }
        else{ toast("再往下拉一点就能再好奇"); }
      }
      startY = null; pulling = 0; released = false;
    });
  })();

  /* ===== 启动 ===== */
  document.getElementById("refreshBtn").addEventListener("click", refresh);
  renderNav();
  updateToolbar();
  render(draw());
})();
</script>
</body>
</html>
