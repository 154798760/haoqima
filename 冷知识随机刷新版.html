      {q:"为什么热带雨林里植物那么密？",a:"因为那里又热又湿，植物疯长。热带雨林全年高温多雨，没有冬天，植物一年到头都能光合作用、开花结果。为了抢阳光，树拼命往上长，几十米高的大树遮天蔽日；树下的藤本、附生植物缠在树干上抢光，层层叠叠。一公顷雨林里能有几百种树木，物种密度是温带森林的几十倍。雨林还产了全球大量氧气，被称为地球之肺。植物密，是因为这里全年都是夏天，谁都不肯停长。",s:"维基百科·热带雨林",u:"https://zh.wikipedia.org/wiki/热带雨林"},
      {q:"为什么高山上的花颜色特别艳？",a:"高山上冷、风大、昆虫少，花要想尽办法吸引传粉者。高海拔紫外线强，植物多产生花青素、类胡萝卜素来防晒，这些色素让花瓣颜色特别浓艳——红、紫、黄格外扎眼。颜色越鲜艳，越容易在绿绿的草甸上被蝴蝶、熊蜂看见。高山开花植物短短几周内要完成传宗接代，所以开得特别用力，一片草甸五颜六色。高山野花艳，既是防晒的副产品，也是在 scarce 的传粉者面前拼命招手。",s:"维基百科·高山植物",u:"https://zh.wikipedia.org/wiki/高山植物"},
      {q:"为什么有些花只在夜里开？",a:"因为它们的传粉伙伴是夜行动物。月光花、昙花、夜来香只在晚上开，是因为替它们传粉的蛾、蝙蝠在夜里活动。夜里花不必开得五颜六色，但要香——浓烈的香味在夜风中飘得远，把蛾子从远处引来。白天开的花靠颜色招蜜蜂，夜里开的花靠香气引蛾子。昙花一现只有几小时，因为沙漠夜里短暂凉快，花开久了失水太多。花的作息，是跟着它的传粉朋友一起订的。",s:"维基百科·授粉",u:"https://zh.wikipedia.org/wiki/授粉"},
      {q:"为什么含羞草一碰就合拢？",a:"那是它在「装死」躲虫子。含羞草叶子基部有个鼓鼓的叶枕，里面充满水分撑着叶片。你一碰，叶枕里的水立刻流走，叶片失去支撑就合拢、下垂。这一下一缩，虫子会觉得这叶子枯了、不好吃，就转而去啃别的。大风、大雨也会让它合拢，是为了减少被打断、被打烂的风险。等过一会儿水分重新流回叶枕，叶子又展开了。含羞草不是怕羞，是它在千百万年里练出了一招「缩叶逃生」。",s:"维基百科·含羞草",u:"https://zh.wikipedia.org/wiki/含羞草"},
      {q:"为什么爬山虎能爬上墙？",a:"它的枝条上长着无数小吸盘。爬山虎的卷须顶端特化成一个个小吸盘，碰到墙面、岩石，就分泌出黏黏的胶质，像小吸盘一样紧紧扒住墙。一步一吸、一步一爬，几年就能盖满一整面楼。它不靠人扶，是自带一整排小粘脚。夏天爬山虎一墙翠绿，还能给墙面降温；秋天叶子变红，又是一墙秋色。爬山虎不是在「攀关系」，是它每根小卷须都长着一双会粘墙的小手。",s:"维基百科·爬山虎",u:"https://zh.wikipedia.org/wiki/爬山虎"},
      {q:"为什么树叶秋天会变黄变红？",a:"秋天温度降、日照短，树木准备落叶。叶子里本来有绿色的叶绿素，它最容易被分解，天冷时叶绿素先退掉，平时被它盖住的黄色类胡萝卜素就露出来——叶子变黄。有些树（枫叶、黄栌）这时候还拼命制造花青素，把叶子染红。所以秋天叶子不是「染」上去的色，是绿色退场后，本来就在里面的黄和新造的红轮流登场。银杏金黄、枫叶火红，都是落叶前的告别秀。",s:"维基百科·秋叶",u:"https://zh.wikipedia.org/wiki/叶"},
      {q:"为什么树桩断面有一圈圈年轮？",a:"那是树一年年写的日记。春天雨水足、温度合适，树长得快，细胞大、壁薄，颜色浅；夏秋雨少、温度低，长得慢，细胞小、壁厚，颜色深。一浅一深，就是一年的年轮。数年轮，就知道这棵树多少岁。年轮宽的年份，风调雨顺；窄的年份，干旱寒冷。科学家还从老树年轮里读出几千年前的气候。树不会说话，但每一圈年轮，都是它在那一年记下的天气笔记。",s:"维基百科·年轮",u:"https://zh.wikipedia.org/wiki/年轮"},
      {q:"为什么海边白天吹海风、晚上吹陆风？",a:"因为陆地和海水冷热不一样。白天太阳晒，陆地比海水升温快，陆地上空空气被烤热变轻上升，海面较冷的空气就流过来补位——这就是海风，从海上吹向陆地，凉快。晚上反过来：陆地散热快、比海面凉，陆地上空空气变冷下沉，风从陆地吹向海上——这就是陆风。一昼夜风向反转一次，叫海陆风。住在海边的人都能感觉到：上午起风往岸上吹，后半夜风又转向海里。这是海洋和陆地在比谁凉谁热。",s:"维基百科·海陆风",u:"https://zh.wikipedia.org/wiki/海陆风"}
    ],
    "动物":[
      {q:"为什么长颈鹿的脖子那么长？",a:"这是「够得着」的胜利。长颈鹿的祖先脖子并不长，但在干旱的非洲草原，低处的草在旱季常常枯死，能吃到高处树叶的个体活得更好、留下更多后代。脖子越长，越够得到别人够不着的食物，优势越大——自然选择一代代「拔高」了它们的脖子，最终长成今天两三米长的颈子。长颈鹿的脖子虽然长，但颈椎骨只有七节，和人类一样，只是每节都特别长。它还为此进化出强大的心脏和特殊的血压调节系统，低头喝水不头晕，抬头也不爆血管。长脖子不是天生的浪漫，而是一份「吃饭靠身高」的生存答卷。",s:"维基百科·长颈鹿",u:"https://zh.wikipedia.org/wiki/长颈鹿"},
      {q:"为什么猫头鹰的脸是圆圆的？",a:"因为那张圆脸是它的「雷达」。猫头鹰是夜行猛禽，多在黑暗里捕猎，眼睛虽然大，但夜间光线弱，主要还得靠听力定位。它那圆圆的脸，由一圈圈特殊羽毛组成「面盘」，像一对天然的「卫星锅盖」：能把四面八方传来的细微声音反射、汇集到耳朵里，让猫头鹰精准判断猎物在哪个方位、多远。而且猫头鹰两只耳朵位置一高一低，声音到达两耳的时间差，帮它算出猎物高度。所以圆脸不是卖萌，是猫头鹰吃饭的家伙——脸越圆，耳朵越灵，夜里抓老鼠越准。",s:"维基百科·鸮形目",u:"https://zh.wikipedia.org/wiki/鸮形目"},
      {q:"为什么猪爱在泥里打滚？",a:"因为猪其实很怕热，而它「不会出汗」。猪的汗腺非常少，几乎不具备蒸发散热的能力，天热时体温降不下来。泥巴里水分多，猪滚一身泥，水分慢慢蒸发，带走身体的热量，等于给自己抹了一层「天然空调」；泥浆晒干后还能像防晒霜一样挡住紫外线，顺便把寄生虫和蚊虫糊住。所以猪打滚不是不爱干净，而是没有更好的散热办法。它甚至会特意挑湿润的泥坑，滚完还要拱一拱，把泥巴抹匀。猪的「脏」，其实是它在高温下的生存智慧。",s:"维基百科·家猪",u:"https://zh.wikipedia.org/wiki/家猪"},
      {q:"为什么企鹅走路摇摇晃晃？",a:"因为企鹅的身体结构「不适合走路」。它的腿很短，长在身体最后方，重心高高在上，双脚一前一后迈步时，身体像钟摆一样左右晃动，看起来特别笨拙。但科学家发现，这种摇摆恰恰是企鹅最省力的走法：每一次左右摇摆，都把一部分动能储存起来、再转化成前进的动力，比挺直身子走反而省能量。在冰面上，摇摇晃晃的步态还能帮助它们保持平衡、不容易滑倒。所以别笑话企鹅走路晃，那是它在南极冰原上进化出来的「节能步态」。",s:"维基百科·企鹅",u:"https://zh.wikipedia.org/wiki/企鹅"},
      {q:"为什么鸭子的脚泡在冰水里不怕冷？",a:"因为鸭子脚上有套「逆流热交换系统」。鸭子的脚掌几乎没有羽毛，直接暴露在冰水里，但它脚里的血管长得很巧妙：从心脏流出来的热动脉血，和从脚掌流回去的冷静脉血，在腿里紧紧挨着、方向相反。热的动脉血一路把热量传给冷静脉血，热量还没到脚就「折返」回身体；流到脚掌的动脉血已接近冰水温度，流回身体的静脉血又把热量带回去。这样一来，鸭子既不怕脚冷，又不浪费体温，脚掌虽凉，身体核心始终暖暖的。冬天能在冰面上站一整天，靠的就是这条聪明的「保暖管线」。",s:"维基百科·鸭",u:"https://zh.wikipedia.org/wiki/鸭"},
      {q:"为什么蜗牛爬过的地方亮晶晶？",a:"那是它分泌的「黏液公路」。蜗牛腹部长着足腺，会分泌大量黏液铺在身下，减小摩擦，保护柔软的腹足不被粗糙地面划伤；黏液还能锁住水分，防止身体被晒干。蜗牛就靠在这条湿滑的「公路」上蠕动前行，所以爬过的地方留下一道亮晶晶的痕迹。这条黏液路还有妙用：能顺着原路找回自己的窝，也能让蚂蚁等小虫知难而退。天热水分蒸发，就变成一道白色的印子。蜗牛走得慢，但人家自带润滑系统，一路走一路铺路，从不担心「路难走」。",s:"维基百科·蜗牛",u:"https://zh.wikipedia.org/wiki/蜗牛"},
      {q:"为什么蝙蝠倒挂着睡觉？",a:"因为蝙蝠的腿「站不起来」。蝙蝠的翅膀由前肢演化而来，后腿又细又弱，几乎撑不起身体，在地上只能爬，飞起来反而利索；而它的脚爪结构特殊，能像钩子一样牢牢抓住树枝、岩壁，倒挂时几乎不费力气。倒挂还有实际好处：居高临下，遇到危险松开爪子就能直接滑翔起飞，比先爬高再起飞快得多。所以倒挂不是蝙蝠在凹造型，而是它最省力、最安全的「待机姿势」。白天挂成一排睡觉，傍晚一松爪，扑棱棱就飞进夜色里。",s:"维基百科·蝙蝠",u:"https://zh.wikipedia.org/wiki/蝙蝠"},
      {q:"为什么啄木鸟天天啄树不头疼？",a:"因为它的头是「减震器」套装。啄木鸟啄树时速度可达每小时二十多公里，冲击力很大，但它有一整套缓冲设计：头骨坚硬，内部还有海绵状结构，能吸收震动；舌头又长又软，绕过头骨缠住脑腔，像安全带一样固定大脑；啄木的瞬间还会闭眼，防止眼球被震伤。这套结构让它每天啄树上千次也安然无恙。科学家研究啄木鸟的头骨，还想模仿它设计更耐撞的头盔和飞行器。不是不疼，是人家天生自带安全气囊。",s:"维基百科·啄木鸟",u:"https://zh.wikipedia.org/wiki/啄木鸟"},
      {q:"狗见到主人为什么爱摇尾巴？",a:"摇尾巴不是狗在说「我开心」那么简单，它更像是狗的「心情信号灯」。尾巴翘得高、摇得快，说明它兴奋、友好；尾巴夹在两腿之间，则是害怕、顺从；尾巴平着慢慢晃，往往是在犹豫、观察。狗和人一样，见面要靠表情和肢体语言打招呼，只是狗没有眉毛笑容，只好把心情全挂在尾巴上。而且尾巴摇的方向也有讲究：偏右摇代表积极情绪，偏左摇则带点紧张。所以下次回家看狗，先看它尾巴翘多高，就知道它有多想你。",s:"维基百科·犬",u:"https://zh.wikipedia.org/wiki/犬"},
      {q:"猫为什么睡觉时会打呼噜？",a:"猫打呼噜主要发生在它放松、舒服的时候，比如被人抚摸、安心入睡。那是一种从喉咙深处发出的、有节奏的嗡嗡声，频率大约每秒二十多次。科学家认为，这是猫通过迷走神经让喉部肌肉快速颤动产生的，既不像真打呼噜那么响，也不是因为感冒鼻塞。有意思的是，这种频率被认为有助于猫自己放松、甚至促进骨骼和肌肉修复——所以猫打呼噜既是「我很幸福」，也是一场天然的自我理疗。如果你家猫在你腿上呼噜起来，说明它真的把你当自己人了。",s:"维基百科·家猫",u:"https://zh.wikipedia.org/wiki/家猫"},
      {q:"老虎额头上为什么像写着个「王」字？",a:"其实老虎额头上并没有真的「王」字，那是黑色条纹在额头正中凑出来的巧合。老虎全身都布满黑色条纹，每只老虎的条纹都像指纹一样独一无二；额头这几条纹路正好竖下来，中间再一横，远远看去就像汉字「王」。古人远远望见这种大猫，又敬又怕，就把这道纹路附会成王权、威严的象征，说它是「山中之王」。所以「王」字不是老虎天生戴的徽章，而是人在条纹里读出来的想象——老虎真正的威风，从来不是写在脸上，而是藏在爪子和爆发力里。",s:"维基百科·虎",u:"https://zh.wikipedia.org/wiki/虎"},
      {q:"蚊子叮完人为什么会起包发痒？",a:"蚊子叮人时不是简单扎一下，它先往皮肤里吐一管唾液，里面含着抗凝血的化学物质，方便它安心吸血。人体的免疫系统从来没见过这种外来蛋白，立刻拉响警报，释放组胺去「围堵入侵者」，结果让局部血管扩张、组织液渗出来，就鼓起一个红包。痒，是神经末梢被组胺刺激后的信号——等于免疫系统在你耳边喊：「这里有东西，快挠！」可越挠越会把组胺扩散开，包反而越大越痒。所以最止痒的办法不是猛挠，而是冷敷、轻轻拍一拍，让免疫系统慢慢冷静下来。",s:"维基百科·蚊",u:"https://zh.wikipedia.org/wiki/蚊"},
      {q:"蜜蜂为什么会跳「8」字舞？",a:"这是蜜蜂巢里的「导航暗号」。采蜜的工蜂发现一片好花田后，飞回蜂巢，在垂直的巢脾上跳一种特别的舞：跑半个圈、转个身、再跑半个圈，轨迹像横躺的数字「8」。跳舞时，蜜蜂头朝上，意思是花田在太阳的方向；头朝下，则相反。跳舞跑直线那段的时长，还能告诉同伴花有多远——大概每跑一秒，相当于飞出去一公里。其他蜜蜂跟着跳舞、闻它身上的花香，飞出巢就能直奔那片花田。一只小小的蜜蜂，把地图和罗盘都编进了舞蹈里。",s:"维基百科·蜜蜂舞蹈",u:"https://zh.wikipedia.org/wiki/蜜蜂舞蹈"},
      {q:"蚂蚁为什么下雨前要忙着搬家？",a:"蚂蚁其实并不真的「预测」下雨，而是对窝的湿度和震动特别敏感。蚂蚁窝通常在地下，一旦空气湿度变大、雨水快渗进来，它们就会感到巢里变潮、温度下降，于是把卵、幼虫和食物搬到地势更高、更干燥的地方，免得被水淹。所以民间看到蚂蚁排队搬家，往往真的要下雨——不是它们会算天气，而是它们的家比人更早「湿了脚」。蚂蚁搬家时队伍长长的，每只都叼着白色的卵或碎屑，看起来像在认真拖家带口。",s:"维基百科·蚂蚁",u:"https://zh.wikipedia.org/wiki/蚂蚁"},
      {q:"变色龙为什么能随环境变颜色？",a:"以前人们以为变色龙是为了「伪装」，但现在科学家发现，它变色更多是为了「交流」和调体温。变色龙皮肤里有几层特殊的色素细胞和虹彩细胞，像一层叠一层的彩色玻璃。它可以通过肌肉收缩、放松，让不同颜色的细胞浮上来：放松时显绿色，紧张时显黄色、红色，求偶时还会亮出鲜艳花纹。同时，颜色深一点能多吸热，浅一点能反光降温。所以变色不是它在玩捉迷藏，而是变色龙在「写情绪」——高兴、生气、想谈恋爱，全写在皮肤上。",s:"维基百科·变色龙",u:"https://zh.wikipedia.org/wiki/变色龙"},
      {q:"壁虎断尾后为什么还能再长出来？",a:"这是壁虎的「逃生外挂」。当被天敌咬住尾巴时，壁虎尾椎上有专门的「断点」，肌肉一收缩，尾巴就啪地断下来，断尾还会在地上扭动一会儿，吸引捕食者注意力，自己趁机溜走。过一段时间，尾巴会从断面重新长出来——只是新尾巴通常是软骨构成，没有原来的分节，颜色也略有不同。这种「舍车保帅」的本事，让壁虎在蜥蜴家族里特别能活。所以看见壁虎断尾别惊慌，它不是受伤残废，而是刚演完一场金蝉脱壳。",s:"维基百科·壁虎",u:"https://zh.wikipedia.org/wiki/壁虎"},
      {q:"青蛙冬天为什么要躲进泥巴里冬眠？",a:"青蛙是变温动物，体温跟着环境走。天一冷，它的新陈代谢会慢到几乎停摆，再在外面活动就会冻僵。所以秋末冬初，青蛙钻进水边的泥巴、落叶下或水底淤泥里，把心跳、呼吸、血液循环都压到最低，靠皮肤在水里慢慢吸氧，硬扛过整个冬天。有些北方的青蛙甚至体内会生成天然「防冻剂」，让自己部分结冰也不死。等春天气温回升，它再醒过来、跳进池塘呱呱叫。冬眠对青蛙不是睡觉，而是把身体调成「省电模式」。",s:"维基百科·无尾目",u:"https://zh.wikipedia.org/wiki/无尾目"},
      {q:"蛇没有脚为什么也能爬得飞快？",a:"蛇虽然没脚，但它肚子上长满了一排排宽大的腹鳞，肌肉又分节得特别精巧。爬行时，蛇靠肋骨带动腹鳞像小车轮一样依次竖起、抓地，身体一弯一伸地往前推；遇到粗糙地面，腹鳞抠住缝隙，就能稳稳前进。在光滑的玻璃上，蛇反而爬不动，因为没东西给它抓。有的蛇还会把身体盘成S形一弹一弹，叫「侧行」，在沙漠里尤其快。所以蛇不是「滑」，而是用肋骨和肚子给自己装了一副内建履带。",s:"维基百科·蛇",u:"https://zh.wikipedia.org/wiki/蛇"},
      {q:"乌龟为什么能活那么久？",a:"乌龟长寿的秘密藏在它的代谢里。它是变温动物，心跳慢、呼吸慢、消耗低，细胞分裂的速度也比一般动物慢，身体里的「磨损」自然就少。再加上它有坚硬的壳当护甲，天敌少，野外死亡率低，自然寿命就长。大型陆龟和某些海龟能活上百年，世界纪录里一只象龟活了快一百九十年。但并不是所有乌龟都长寿——小型宠物龟往往只活十几二十年。所以乌龟活得久，靠的不是什么灵丹妙药，而是慢节奏、硬壳和少操心的日子。",s:"维基百科·龟",u:"https://zh.wikipedia.org/wiki/龟"},
      {q:"大象的耳朵为什么长得那么大？",a:"大象大耳朵最主要的用途是「风扇」。非洲象生活在炎热的草原，耳朵上布满薄薄的皮肤和密集的血管，像两把天然的散热板。它一扇动耳朵，血液里的热量就顺着皮肤散到空气里，体温立刻降下来。所以天越热，大象扇耳朵越勤。耳朵上那密密麻麻的纹路，还能帮它挡住蚊虫、感知远处的低频震动。亚洲象耳朵小一些，因为老家在丛林里没那么晒。所以大耳朵不是为了听更远，而是为了凉快——它是大象自带的空调。",s:"维基百科·象",u:"https://zh.wikipedia.org/wiki/象"},
      {q:"鲸鱼为什么会从头顶喷出水柱？",a:"鲸鱼是哺乳动物，用肺呼吸，不能像鱼那样在水里吸氧。它隔一段时间就要浮出水面，把肺里的废气呼出来，再吸一口新鲜空气。呼出的气体又热又湿，一碰到外界冷空气，立刻凝结成一团水雾，看起来像喷泉；有时候还会夹着鼻孔周围的海水一起喷上来，就成了我们看见的水柱。不同鲸鱼喷出的水柱高度、形状都不一样，老水手远远一看就能分辨是哪种鲸。所以那不是鲸鱼在「喷水玩」，而是它在水面深呼吸、换口气。",s:"维基百科·鲸",u:"https://zh.wikipedia.org/wiki/鲸"},
      {q:"海豚睡觉为什么只闭一只眼睛？",a:"海豚睡觉采用的是「半脑睡眠」：左右两个大脑半球轮流休息，一边睡着、一边清醒。对应地，闭着的那只眼属于在休息的那半边脑，睁开的那只眼则盯着周围，负责呼吸、警惕鲨鱼。这样海豚既能睡觉，又不会在水里忘了浮上水面换气，也不容易被偷袭。人如果也这样睡，就像永远在半梦半醒之间。这种睡眠方式在鸟类和一些海洋哺乳动物身上都有，是它们为了在水里活着进化出来的「轮换值班」制度。",s:"维基百科·海豚",u:"https://zh.wikipedia.org/wiki/海豚"},
      {q:"候鸟每年为什么要千里迢迢迁徙？",a:"候鸟迁徙本质是「追着好季节跑」。夏天北方昼长夜短、虫子多，特别适合孵小鸟；冬天北方一片冰雪，虫子没了、植物枯了，它们只能飞到温暖的南方过冬。年复一年，基因里刻下了这条迁徙路线，老鸟带着幼鸟，靠太阳、星星、地磁和地标导航，一次飞几千甚至上万公里。迁徙路上危险重重，风暴、饥饿、城市灯光都会让它们迷路，但为了繁殖和觅食，它们每年还是准时出发。候鸟不是爱旅行，而是被季节和肚子逼着，在两块大陆之间来回跑。",s:"维基百科·鸟类迁徙",u:"https://zh.wikipedia.org/wiki/鸟类迁徙"},
      {q:"萤火虫的屁股为什么会发光？",a:"萤火虫肚子末端有专门的发光器，里面装着荧光素和荧光素酶。萤火虫控制氧气进入发光器，氧气和这两种物质相遇，就会发生化学反应，把能量几乎全部变成光，几乎不发热——这就是高效的「冷光」。它们发光主要是为了找对象：不同种类的萤火虫有不同的闪光节奏，像在打摩斯密码，雌虫在草丛里看到合适的信号，就回闪一下，双方对上暗号才继续约会。所以夏夜草丛里那一闪一闪，不是路灯掉下来，是一群小虫在发相亲启事。",s:"维基百科·萤火虫",u:"https://zh.wikipedia.org/wiki/萤火虫"},
      {q:"蚕宝宝为什么会吐丝结茧？",a:"蚕宝宝的丝其实是它化蛹前给自己织的「小房间」。蚕吃了满满一肚子桑叶，体内的绢丝蛋白在丝腺里变成黏液，经过头部一个吐丝孔拉出来，一遇空气就凝固成丝。它不停摇头摆尾，把丝一层层绕在自己身上，结成椭圆的茧。在茧里，蚕会安安静静变成蛹，再羽化成蛾。如果不结茧，蛹就容易被天敌吃掉、被干燥空气风干。人类发现这种丝又长又结实，就把茧煮了抽丝，织成丝绸。一只蚕吐的丝能长达一千多米，它用整个身体，给自己盖了一座丝做的小房子。",s:"维基百科·蚕",u:"https://zh.wikipedia.org/wiki/蚕"},
      {q:"鸵鸟那么大一只为什么不会飞？",a:"鸵鸟是现存最大的鸟，体重能到一百多公斤，翅膀相对身体却又小又短，羽毛也太软太蓬松，没法产生升力。它的祖先本来会飞，但在非洲草原上，靠跑得快、腿粗壮、踢一脚能踢死狮子就足够自保，飞行反而越来越不重要，翅膀就慢慢退化了。现在鸵鸟一步能跨三米，时速七十公里，比大多数马还快。它的翅膀并没有完全废掉：奔跑时张开当舵平衡身体，求偶时还会张开跳舞。不会飞的鸵鸟，把飞行的本事换成了四条腿野兽都比不过的奔跑。",s:"维基百科·鸵鸟",u:"https://zh.wikipedia.org/wiki/鸵鸟"},
      {q:"骆驼为什么好久不喝水也能在沙漠里走？",a:"骆驼耐旱不是靠把水存在驼峰里——驼峰其实存的是脂肪，分解时既能供能又能产生水。它真正的节水本事在别处：骆驼尿浓得像糖浆，粪便干得能直接烧；体温白天随太阳升高到四十度左右才出汗，晚上再降下来，尽量少让水分蒸发；红血球是椭圆形的，一次能喝一百多升水，还能在脱水时不破裂。所以它十天半个月不喝水也能走，一找到水源就猛灌。沙漠里的骆驼，是一台把每一滴水都用到极致的行走节水器。",s:"维基百科·骆驼",u:"https://zh.wikipedia.org/wiki/骆驼"},
      {q:"袋鼠为什么总是蹦蹦跳跳地走？",a:"袋鼠的后腿又长又有力，前腿却短小，结构决定了它不适合走路，反而特别适合跳。每跳一步，尾巴像第三条腿一样撑地，帮它平衡、发力。跳跃在长距离奔跑时非常节能：袋鼠一跳能弹起两米高、八米远，时速可达六十公里，比大多数动物慢跑还省力气。小袋鼠生下来只有花生米大，要在妈妈的育儿袋里吸奶长到半大才能出来蹦。所以袋鼠的跳不是可爱卖萌，是它在澳洲开阔草原上进化出来的最快、最省力的赶路方式。",s:"维基百科·袋鼠",u:"https://zh.wikipedia.org/wiki/袋鼠"},
      {q:"河马身上为什么红红的像在流血？",a:"那不是血，是河马自己分泌的「天然防晒霜」。河马皮肤薄、没汗腺，太阳一晒很容易晒伤，泡在水里又被紫外线折射。它的皮肤会分泌一种红色粘稠液体，一开始无色，遇空气后变成红棕色，既能挡住紫外线，又能抗菌、防止蚊虫叮咬，还能锁住水分。这种液体被叫作「血汗」，但其实一点血都没有。远看河马浑身粉红，像在流血，实际上它是在给自己抹一层防水防晒的护肤霜。所以河马白天泡水，一半是为了凉快，一半是怕晒。",s:"维基百科·河马",u:"https://zh.wikipedia.org/wiki/河马"},
      {q:"斑马身上为什么长满黑白条纹？",a:"斑马的条纹到底为什么存在，科学家研究了很多年，目前最被认可的说法是「防蚊虫」和「迷惑捕食者」。非洲草原上有一种叫采采蝇的吸血蝇，会传播疾病，它们不喜欢落在黑白条纹快速交错的表面——条纹会干扰它的视觉，让它找不到落脚地。另一方面，一群斑马跑起来时，密密麻麻的条纹会让狮子眼花缭乱，很难从奔跑的群体里单独锁定一只。条纹每只斑马都不一样，像条形码，同伴之间也能互相辨认。所以斑马穿「条纹衫」，既是防蚊装，也是集体迷彩。",s:"维基百科·斑马",u:"https://zh.wikipedia.org/wiki/斑马"},
      {q:"猴子为什么总爱互相扒毛？",a:"猴子互相理毛表面是在捉虱子，其实更重要的是「社交」。灵长类动物聚群生活，谁跟谁好、谁让着谁，都要靠日常互动维持。互相翻毛、捡盐粒、捉寄生虫，是它们表达友好、化解矛盾、巩固关系的方式——相当于人类见面拍拍肩膀、喝杯茶。地位高的猴子可以让下属帮自己理，自己却不一定回报。所以猴群里那些互相扒毛的身影，不是单纯的卫生活动，而是一场又一场不动声色的「人情往来」。",s:"维基百科·灵长目",u:"https://zh.wikipedia.org/wiki/灵长目"},
      {q:"牛吃完草为什么还要回嘴里嚼？",a:"牛是反刍动物，有四个胃。它吃草时来不及细嚼，匆匆吞进第一个胃——瘤胃里储存发酵。等歇下来时，草团再一团团返回到嘴里，被慢慢嚼碎，这叫反刍。反复嚼过的草才进真正的胃里消化。这种结构特别适合在野外边吃边逃：先快速把肚子装满，躲到安全的地方再慢慢嚼。一头牛每天要花好几个小时反刍，嚼的次数上万次。所以牛躺在阳光下嘴巴不停动，不是发呆，是在把午餐重新加工一遍。",s:"维基百科·反刍动物",u:"https://zh.wikipedia.org/wiki/反刍动物"},
      {q:"鸡为什么要吞小石子帮助消化？",a:"鸡没有牙齿，食物进嘴后只能整块吞下。它肚子里有一个叫「肌胃」的厚肌肉胃，也就是我们说的鸡胗。鸡平时啄进肚子里的小沙子、小石子，就留在肌胃里；胃壁肌肉强力收缩，石子和食物一起摩擦，把谷物、种子磨碎，相当于替牙齿干活。所以农家喂鸡，常会看到鸡在地上不停啄土啄沙，那不是饿疯了，是在给自己「备牙口」。杀鸡后剖开鸡胗，里面常常能看到一层黄色内膜和混在一起的小石子，那就是鸡的天然磨盘。",s:"维基百科·家鸡",u:"https://zh.wikipedia.org/wiki/家鸡"},
      {q:"猫从高楼摔下为什么反而不容易摔死？",a:"猫有一种天生的「翻正反射」：在空中下落时，它能在几分之一秒内把头转正、扭转身体、伸开四肢，像降落伞一样增加空气阻力，最后用四只脚缓冲落地。加上猫体重轻、骨头软、肌肉弹性好，从十层楼摔下反而比从三层楼摔下存活率高——因为它有足够时间调整姿势、放松身体。但这并不意味着可以故意把猫往楼下扔：高楼坠落依然会造成骨折、内脏破裂，每年都有猫因此伤亡。所谓「猫有九条命」，只是说它比一般动物更会在空中保命，不是真的摔不死。",s:"维基百科·家猫",u:"https://zh.wikipedia.org/wiki/家猫"},
      {q:"狗夏天为什么总吐着舌头喘气？",a:"狗身上的汗腺几乎全在脚垫上，靠皮肤出汗散不了多少热。它降温主要靠喘气：快速吸入空气，让舌头、口腔和呼吸道表面的水分蒸发，带走热量。舌头伸得越长、嘴张得越大，蒸发面积越大，散热越快。所以夏天遛狗，它张着大嘴哈气，其实是在给自己开「呼吸空调」。这也意味着狗特别怕热、容易中暑，天热时不能把它锁在车里，也别在正午太阳下长时间遛。看见狗吐舌头，别以为它只是口渴，那是它正在拼命给自己降温。",s:"维基百科·狗",u:"https://zh.wikipedia.org/wiki/狗"},
      {q:"鱼为什么睁着眼睛也能睡觉？",a:"鱼没有眼睑，也就是没有眼皮，所以它睡觉时没法闭眼，看起来总像睁着眼睛。但它其实会休息：找个石缝、水草间躲起来，游动变慢，呼吸变缓，对周围的反应也迟钝，这就是它在「打盹」。有些鱼甚至会一边慢慢游一边睡。所以下次看到鱼缸里的鱼静静地贴在角落不动，别以为它发呆，它很可能正在闭目养神——只是没有眼皮可闭。如果哪天它翻肚皮浮在水上，那才是真的出问题了。",s:"维基百科·鱼",u:"https://zh.wikipedia.org/wiki/鱼"},
      {q:"鱼在水里为什么不会被淹死？",a:"鱼不是用肺呼吸，而是用鳃。鳃丝里布满细密的微血管，水流过鳃时，水里溶解的氧气会透过薄薄的鳃丝进入血液，二氧化碳再排回水里。所以鱼不是在「喝水」，而是让水从嘴里进、从鳃盖后缘流出，一路过滤氧气。一旦水污染严重、水里缺氧，或者被捞上岸鳃丝粘在一起，鱼就真的会窒息而死——这就是岸上的「淹死」。养鱼要打氧、要换水，就是为了让水一直有足够溶解氧，让鱼能顺畅「呼吸」。",s:"维基百科·鳃",u:"https://zh.wikipedia.org/wiki/鳃"},
      {q:"公鸡为什么天不亮就要打鸣？",a:"公鸡打鸣主要是在「宣示领地」和「报时」。鸡是群居动物，一只公鸡打鸣，等于告诉周围其他公鸡：这一片是我的地盘，母鸡是我的。它的大脑里还有生物钟，黎明时分激素水平变化，即使关在完全黑暗的笼子里，公鸡到点也会准时打鸣。不同公鸡的啼声不一样，有的嘹亮有的低沉，邻居甚至能凭声音认出是谁。所以公鸡打鸣不是在替太阳上班，而是在天刚亮时，向整个村子宣布：新的一天开始了，我还在这儿呢。",s:"维基百科·鸡",u:"https://zh.wikipedia.org/wiki/鸡"},
      {q:"鸭子为什么天生就会游泳？",a:"鸭子会游泳是一身装备配合出来的。它的脚蹼像小桨，划水特别有力；羽毛又密又油，尾脂腺会分泌油脂，鸭经常用嘴把油抹到羽毛上，形成防水层，水浸不进去；底下还有一层绒毛锁住空气和体温。所以鸭子下水不沉、不湿、不冷。小鸭子出壳后没多久，跟着妈妈下水，游得有模有样，几乎不用教。相比之下，鸡没有蹼、羽毛不防水，一下水就成落汤鸡。鸭子那身防水羽和小蹼，是它天生自带的游泳圈。",s:"维基百科·鸭",u:"https://zh.wikipedia.org/wiki/鸭"},
      {q:"马为什么站着也能睡觉？",a:"马是被捕食者，野外睡着如果躺倒，遇到狮子、狼来袭就来不及逃跑。所以它进化出一套「站着睡」的本事：前腿有特殊的韧带和肌腱，像支架一样把身体锁住，站着时几乎不费肌肉力气，就能保持平衡。真要进入深睡眠，马才会躺下来，而且通常一群马里总有几匹站着放哨。家养的马在熟悉、安全的环境里，也会躺下打滚打盹。所以马站着睡觉不是不累，而是祖先留给它的「随时能跑」的警觉。",s:"维基百科·马",u:"https://zh.wikipedia.org/wiki/马"},
      {q:"老鼠为什么总爱在夜里出来活动？",a:"老鼠是小型啮齿动物，白天是猫、鹰、蛇的热门猎物，夜里出来活动最安全。它的眼睛在弱光下特别灵敏，胡须又能感知周围障碍物，哪怕在黑暗的墙角里也能溜得飞快。人类住在楼里，老鼠就顺着下水道、墙缝、吊顶，在我们睡着后开「夜生活」：找食物、咬电线、做窝。久而久之，老鼠形成了严格的夜行节律。所以厨房夜里听到窸窸窣窣，多半不是闹鬼，而是老鼠在值夜班。",s:"维基百科·鼠",u:"https://zh.wikipedia.org/wiki/鼠"},
      {q:"兔子的耳朵为什么长得那么长？",a:"兔子的大耳朵主要是「雷达」和「空调」。兔子是被狐狸、老鹰追着跑的猎物，耳朵要能转动，从各个方向收集细微声响，哪怕草叶一动都能听见。大耳朵上还布满血管，天热时兔子把耳朵竖起来，风一吹，血液里的热量就散出去，等于随身带了两个散热片。所以天冷时兔子会把耳朵贴在背上保暖，天热时就竖起来扇风。长耳朵不是为了好看，是兔子在草原上活命的两大刚需：听危险，降体温。",s:"维基百科·兔",u:"https://zh.wikipedia.org/wiki/兔"},
      {q:"松鼠为什么秋天要拼命囤松果？",a:"松鼠冬天不冬眠，可冬天树林里没有新鲜果子，它必须在秋天把吃不完的松果、坚果埋在各处当口粮。一只松鼠一个秋天能埋几千个藏食点，靠超强的记忆力和嗅觉，在雪下面挖出来吃。但它经常忘了几个藏在哪，那些被忘掉的种子来年就发芽长成小树——所以松鼠无意中还当了森林的播种员。秋天看松鼠嘴里塞满坚果、上蹿下跳，不是嘴馋，是在为冬天储备整个冰箱。",s:"维基百科·松鼠",u:"https://zh.wikipedia.org/wiki/松鼠"},
      {q:"熊冬天为什么要躲进洞里睡大觉？",a:"熊在冬天进洞不是严格意义上的冬眠，而是「冬蛰」。它不会像青蛙那样把体温降到冰点，而是让心跳和代谢大幅减慢，靠秋天大吃特吃攒下的脂肪撑过几个月。洞里温度稳定，母熊甚至会在洞里生下小熊，靠舔舔舔舔喂养。出洞时，熊体重能比秋天轻掉三分之一。所以熊冬眠不是懒，是冬天山里确实没果子、没猎物，睡一觉最省电。等春天雪化了，它再伸个懒腰出山找吃的。",s:"维基百科·熊",u:"https://zh.wikipedia.org/wiki/熊"},
      {q:"狮子为什么要成群结队地生活？",a:"和老虎独居不同，狮子是唯一群居的猫科动物。一个狮群通常由几头母狮、它们的孩子和一两只雄狮组成。母狮们协同围捕羚羊、斑马，比单只狮子成功率高得多；雄狮负责守护领地、赶走外来的公狮。集体生活还能共同保护小狮子，让幼崽存活率更高。所以你看草原上一群狮子晒太阳，不是它们特别热情，而是这种「组队打猎、轮流带娃」的方式，在非洲稀树草原上最划算。",s:"维基百科·狮",u:"https://zh.wikipedia.org/wiki/狮"},
      {q:"猎豹为什么能跑得那么快？",a:"猎豹是陆地上跑得最快的动物，短距离时速能到一百一十公里。它的身体几乎就是为速度设计的：骨骼轻、腰像弹簧一样柔韧，每一步能跨出七米；尾巴长而灵活，奔跑时当舵转弯；鼻腔大、心脏大、肺也大，瞬间供氧跟得上。但代价是它只能冲刺几百米，再跑肌肉就会过热、抽筋。所以猎豹捕猎时全靠一击即中，追上就扑倒，追不上就放弃。它不是耐力选手，而是一台为了几百米冲刺而生的生物跑车。",s:"维基百科·猎豹",u:"https://zh.wikipedia.org/wiki/猎豹"},
      {q:"鳄鱼吃东西时为什么会流眼泪？",a:"「鳄鱼的眼泪」其实是误会。鳄鱼没有真正的泪腺情绪，它吃东西时下巴用力挤压，会把眼眶里的润滑液挤出来，看起来像在流泪。同时鳄鱼在陆地上张嘴时，眼睛暴露在空气里，眼球需要不断润滑，也会流出液体。所以鳄鱼一边撕咬一边流泪，不是假慈悲，而是机械挤压的副产品。这个短语后来被用来形容坏人假装同情，可对鳄鱼来说，它只是在吃饭时被自己挤得「热泪盈眶」。",s:"维基百科·鳄",u:"https://zh.wikipedia.org/wiki/鳄"},
      {q:"孔雀为什么会开屏？",a:"开屏的基本都是雄孔雀。它尾上那些像眼睛一样的花纹，其实不是尾巴本身，而是尾羽上方长长的覆羽。求偶季节，雄孔雀把这一片「屏幕」竖起来、抖得沙沙响，在雌孔雀面前转圈展示。羽毛越华丽、眼斑越多，越容易被雌孔雀选中。此外，突然开屏也能吓退天敌——一张长满眼睛的「大脸」猛地撑开，狐狸和狼都会愣一下。所以孔雀开屏不是为了给人类表演，而是在找对象、顺便吓敌人。",s:"维基百科·孔雀",u:"https://zh.wikipedia.org/wiki/孔雀"},
      {q:"鹦鹉为什么能学会人说话？",a:"鹦鹉能模仿人声，是因为它的鸣管和舌头特别灵活。人类靠喉咙和舌头发声，鹦鹉则靠胸部的鸣管，配合厚大、灵活的舌头，把听到的声音一个个「拼」出来。它并不真的懂人话的意思，只是在模仿声音、讨好主人、换奖励。野外的鹦鹉成群生活，互相之间也有复杂的叫声，模仿是它的社交本能。所以家里的鹦鹉会说「你好」「恭喜发财」，不是它成精了，而是它把你的声音当成了另一只鹦鹉的招呼。",s:"维基百科·鹦鹉",u:"https://zh.wikipedia.org/wiki/鹦鹉"},
      {q:"老鹰的眼睛为什么那么锐利？",a:"鹰眼比人眼强好几倍。它视网膜上的感光细胞密度远高于人眼，同样大小的视野里，它能分辨出更细的东西；鹰眼还有两个中央凹，相当于有两组高清对焦，既能看远又能兼顾旁边。在几千米高空，老鹰能看清草地上一只兔子在动，然后俯冲下来一抓一个准。它瞳孔大、进光多，又有眼睑和瞬膜保护，挡风又防眩光。所以「鹰的眼睛」一直被当作观察力的代名词——它真的是天生的高空侦察机。",s:"维基百科·鹰",u:"https://zh.wikipedia.org/wiki/鹰"},
      {q:"乌鸦为什么被说特别聪明？",a:"鸦科鸟类的大脑占身体比例非常大，会使用工具、会记人脸、会解决一连串问题。科学家做过实验：乌鸦会把弯铁丝改造成钩子，把管子里的小虫子勾出来；它还能记住谁对它好、谁吓过它，过好几年还认得那张脸，并告诉同伴。日本甚至有乌鸦把核桃丢在红绿灯前，等汽车压碎、红灯时飞下来吃果仁。所以「乌鸦反哺」「乌鸦喝水」不只是寓言，它们确实是鸟里的聪明鬼。",s:"维基百科·鸦科",u:"https://zh.wikipedia.org/wiki/鸦科"},
      {q:"燕子低飞为什么常常预示要下雨？",a:"燕子低飞不是它能预测天气，而是被虫子「带」低的。下雨前空气湿度大、气压低，小昆虫翅膀沾了水汽飞不高，只能贴着地面飞。燕子吃虫子，自然跟着虫群一起低飞。老人们看燕子贴地飞、蜻蜓低飞，就知道雨要来了。这其实是一套观察昆虫的间接经验——燕子不是气象预报员，它只是在追一顿午餐，而那顿午餐刚好被雨前的空气压到了地面。",s:"维基百科·燕",u:"https://zh.wikipedia.org/wiki/燕"},
      {q:"螃蟹走路为什么横着走？",a:"螃蟹的关节结构决定了它横着走。它的步足关节向两侧弯曲，只能往侧面屈伸，没法像人那样前后大步迈。横着走反而又快又稳：八条腿同时着地，遇到礁石缝也能灵活侧身钻过去。不过并不是所有螃蟹都横行，蜘蛛蟹、和尚蟹有时也会直着走。横着走还有一个好处：身体扁宽，紧贴地面，不容易被浪掀翻。所以螃蟹横行不是霸道，是它腿的关节只能这么弯。",s:"维基百科·蟹",u:"https://zh.wikipedia.org/wiki/蟹"},
      {q:"虾煮熟之后为什么会变成红色？",a:"虾和螃蟹生前外壳里藏着一种叫虾青素的色素，平时被蛋白质包裹着，看起来是青灰色。一加热，蛋白质变性凝固，被包住的虾青素就露了出来——它本身是橙红色，所以整只虾瞬间变红。虾青素其实和三文鱼、火烈鸟身上那抹粉红是同一种东西。生的三文鱼发白、煮熟后变橙，也是这个道理。所以虾变红不是被煮熟了才「害羞」，而是高温帮它把藏在壳里的红色颜料翻了出来。",s:"维基百科·虾",u:"https://zh.wikipedia.org/wiki/虾"},
      {q:"寄居蟹为什么总要换不同的壳？",a:"寄居蟹腹部柔软、没有硬壳保护，必须借住在螺壳里防身。它一天天长大，原来的壳就会挤，于是它经常在海边找空螺壳，钻进去比一比大小，合适就搬家。有时候几只寄居蟹还会排成一队，按大小顺序「交换房子」——最大的先搬进新壳，空出来的壳依次让给下一只。换壳对寄居蟹是大事：壳太大，拖着走不动；太小，又保护不住肚子。所以海边看见螺壳在自己动，里面多半住着一位正在装修搬家的小房客。",s:"维基百科·寄居蟹",u:"https://zh.wikipedia.org/wiki/寄居蟹"},
      {q:"蜘蛛为什么会结出那么精巧的网？",a:"蜘蛛丝是它腹部纺丝器吐出来的蛋白质纤维，比同样粗细的钢丝还强韧。蜘蛛先拉出几根「辐条」当骨架，再一圈圈绕上粘丝，网上有的丝带黏液、有的不带，它自己专踩不粘的那几条。网是它的捕虫工具：飞虫一撞上去被粘住，蜘蛛顺着震动跑过去捆起来吃掉。结网是蜘蛛的本能，不用学，小蜘蛛一出壳就会结。一张精致的圆网，往往只要一两个小时就织好。",s:"维基百科·蜘蛛",u:"https://zh.wikipedia.org/wiki/蜘蛛"},
      {q:"蜻蜓为什么总在水面上点来点去？",a:"蜻蜓点水其实是雌蜻蜓在产卵。它的幼虫叫水虿，生活在水里，靠捕食小鱼小虫长大，要蜕好几次皮才出水变成蜻蜓。所以雌蜻蜓必须把卵产在水里，尾巴往水面一点一弹，卵就落进水里。我们在湖边看到蜻蜓成群低飞、尾巴一下下点水，那是一群妈妈在给孩子找托儿所。雄蜻蜓则在水面上空巡逻，抢地盘、争配偶。蜻蜓点水不是在玩水，是在给下一代选个有水的家。",s:"维基百科·蜻蜓",u:"https://zh.wikipedia.org/wiki/蜻蜓"},
      {q:"蝉为什么夏天叫得那么响亮？",a:"夏天叫得最响的是雄蝉。它肚子两侧有一对叫「鼓膜」的发声器，靠肌肉快速收缩、放松，鼓膜震动发出高频声响，再腹腔共鸣放大，声音能传几百米远。它这么拼，是为了在茂密树叶里喊雌蝉来约会。一只蝉能在地下蛰伏好几年，爬出来羽化后却只有几周寿命，所以拼了命地叫。雌蝉是哑巴，听到合适的声音才飞过去。夏天那股铺天盖地的蝉鸣，其实是一群短命歌手在抓紧时间找对象。",s:"维基百科·蝉",u:"https://zh.wikipedia.org/wiki/蝉"},
      {q:"飞蛾为什么总爱扑向灯火？",a:"飞蛾不是故意找死，它是被月光「骗」了。夜行昆虫靠远处的月光、星光导航——只要让光线始终从同一个角度照进眼睛，它就能一直直线飞。可人类点起灯火后，对飞蛾来说这是个近在眼前的强光源，它还按老办法保持固定角度飞，结果轨迹就绕着灯一圈圈盘旋，最后撞上去。这叫「光罗盘效应」。所以飞蛾扑火不是向往光明，是被人造灯光拐进了死胡同。",s:"维基百科·蛾",u:"https://zh.wikipedia.org/wiki/蛾"},
      {q:"屎壳郎为什么拼命滚粪球？",a:"屎壳郎学名蜣螂，它滚粪球不是玩，而是给孩子准备的口粮。它把动物粪便搓成圆球，倒退着推到安全的地方埋起来，在粪球上产卵；幼虫孵出来后，就靠吃这个粪球长大。粪球同时也是它们自己的食物和求偶礼物——雄蜣螂推得越大，越容易吸引雌蜣螂。别看这事臭，蜣螂是草原上的清洁工：它们把粪便埋回土里，既肥田又减少苍蝇。所以屎壳郎滚粪球，是一份又脏又重要的环保工作。",s:"维基百科·蜣螂",u:"https://zh.wikipedia.org/wiki/蜣螂"},
      {q:"苍蝇为什么总爱停下来搓手？",a:"苍蝇搓手是在「搞个人卫生」。它的脚上有味觉和触觉感受器，落在食物上靠脚先尝味道；脚上沾了灰尘、花粉、食物残渣，会影响它感知和攀爬。停下来搓手、搓脚、搓脑袋，其实是在把这些脏东西搓掉，让脚爪和吸盘保持灵敏。它还会把脚上沾的食物搓下来吃一点。所以你看到苍蝇停在桌上搓得不亦乐乎，不是在准备吃饭，是在擦鞋、洗手、顺便舔一口。",s:"维基百科·苍蝇",u:"https://zh.wikipedia.org/wiki/苍蝇"},
      {q:"蜜蜂蜇人之后为什么自己会死？",a:"工蜂的蛰针末端长着倒刺，像小鱼钩。人一被蜇，蜜蜂想飞走，蛰针拔不出来，连同连接的内脏一起被扯出体外，蜜蜂不久就死了。所以工蜂蜇人是一次性的自卫——它不是故意同归于尽，而是倒刺结构决定了它在哺乳动物坚韧皮肤面前拔不出来。蜂王的蛰针光滑，可以反复蜇；雄蜂根本没有蛰针。所以下次被蜜蜂蜇，别太恨它，它已经为这一下赔上了命。",s:"维基百科·蜜蜂",u:"https://zh.wikipedia.org/wiki/蜜蜂"},
      {q:"章鱼为什么长着八条长长的腕？",a:"章鱼的八条腕不是「手」那么简单：每条腕上有几百个吸盘，能吸、能尝、能爬，腕里还分布着三分之二的神经元——相当于它有八个「小脑袋」，每条腕都能自己决定抓什么、怎么动。所以章鱼能拧瓶盖、开罐子、从罐子里越狱，还会喷墨、变色、装石头。它没有骨头，身体软得能从硬币大的洞里钻出去。八条腕对章鱼来说，是八套自带吸盘、自带味觉、自带小脑的万能工具。",s:"维基百科·章鱼",u:"https://zh.wikipedia.org/wiki/章鱼"},
      {q:"乌贼遇到危险为什么会喷出墨汁？",a:"乌贼肚子里有一个墨囊，平时储存着黑色墨汁。遇到鲨鱼、海鸟追捕时，它猛地把墨汁喷出去，在水里炸开一团黑雾，趁天敌看不清的瞬间，用漏斗喷水向后逃。更狡猾的是，它有时会喷一团和自己身体差不多大的「假墨团」，让天敌扑向假象，自己已经跑远。墨汁里还含有轻微麻痹作用的化学物质，能干扰捕食者的嗅觉和味觉。所以乌贼喷墨不是投降，是一张烟幕弹加调虎离山。",s:"维基百科·乌贼",u:"https://zh.wikipedia.org/wiki/乌贼"},
      {q:"海星断掉腕足为什么还能再长出来？",a:"海星有惊人的再生能力。它的主要器官都分布在腕足和中央盘里，只要断掉的那截腕足还带一部分中央盘，就能重新长出完整的新海星。有些海星甚至靠这种方式无性繁殖——把自己一拉两半，变成两只。遇到危险时，它还会主动断掉一只腕迷惑捕食者，像壁虎断尾一样。所以海边看到只有四条腿的海星别奇怪，它可能刚断过、正在补作业。",s:"维基百科·海星",u:"https://zh.wikipedia.org/wiki/海星"},
      {q:"珊瑚为什么其实是动物而不是植物？",a:"珊瑚看起来像树枝、像花，但它是一群叫珊瑚虫的小动物群居而成。每个小珊瑚虫只有指头大，长着一圈触手，在海里抓浮游生物吃；它分泌碳酸钙外壳，一代代堆在一起，就形成了珊瑚礁。珊瑚组织里还住着 tiny 藻类叫虫黄藻，靠光合作用给珊瑚供营养，珊瑚则给藻类遮风挡浪——两者是合租关系。所以珊瑚礁不是海底森林，而是几百万个小生物一起盖出来的城市，也是海洋里生物最丰富的地方。",s:"维基百科·珊瑚",u:"https://zh.wikipedia.org/wiki/珊瑚"},
      {q:"大熊猫为什么那么爱吃竹子？",a:"大熊猫本质上是食肉目动物，牙齿和消化道还像熊，但几百万年前它转向了几乎只吃竹子。竹子在竹林里到处都是、竞争少，它一天能啃十几公斤。但竹子营养低，所以熊猫每天要花十几个小时吃，剩下时间就趴着睡，尽量省能量。它手腕上还多长出一块骨头，像伪拇指一样握住竹子。偶尔熊猫也会啃点野味。看它天天抱竹子啃，看似佛系，其实是它在山里给自己找到了一份没人抢的稳定外卖。",s:"维基百科·大熊猫",u:"https://zh.wikipedia.org/wiki/大熊猫"},
      {q:"考拉为什么一天睡二十个小时？",a:"考拉几乎只吃桉树叶，而桉树叶有毒、纤维粗、热量极低。为了处理这种又毒又没营养的食物，考拉进化出特别长的盲肠，靠里面的细菌慢慢发酵解毒。这个过程非常耗能，所以它必须尽量少动、多睡觉，把能量省下来消化叶子。一天睡十八到二十小时是常态，醒着的时候大半时间也在慢吞吞吃叶子。小考拉甚至要先吃妈妈排出来的软便，获得能分解桉树叶的细菌，才能断奶自己吃叶子。",s:"维基百科·考拉",u:"https://zh.wikipedia.org/wiki/考拉"},
      {q:"树懒为什么动作那么慢？",a:"树懒慢，是因为它吃的树叶热量太低，身体必须把代谢压到最慢才能活下去。它的肌肉量少、体温不恒定，连消化一片叶子都要花一个月。慢还有个好处：动作小，不会引起老鹰和豹的注意；它毛里甚至长着绿藻，让它在树上像一团苔藓，天敌更难发现。树懒一周才下地拉一次屎，其余时间全挂在树上。它的慢不是懒，是把生命调成了节能模式。",s:"维基百科·树懒",u:"https://zh.wikipedia.org/wiki/树懒"},
      {q:"北极熊的毛为什么看起来是白色的？",a:"北极熊的毛其实不是白色，而是中空、透明的。光线照到这些空心毛上，被反复散射、反射，最后看起来像白色；它的皮肤其实是黑色的，黑色皮肤能更好吸收阳光。透明中空的毛还像一根根小光纤，把阳光直接导到皮肤，帮它在北极严寒里吸热保暖。加上它皮下有十几厘米厚的脂肪，游泳都不怕冷。所以远看一身雪白，是为了在雪地里隐身；近看穿了「透明皮草」，是为了在北极取暖。",s:"维基百科·北极熊",u:"https://zh.wikipedia.org/wiki/北极熊"},
      {q:"鸽子为什么能千里之外找到家？",a:"鸽子归巢靠的是一套多模导航。它能感知地球磁场，用脑内的磁性颗粒当罗盘；也能靠太阳方位和生物钟校正方向；近距离时，还靠地标、气味一路找回家。信鸽比赛时，把它带到几百公里外放飞，它照样能找准方向飞回去。人类很早就利用这一点传信。至今科学家还在研究鸽子导航的全部细节，但可以确定：它不是靠死记硬背，而是同时看磁场、看太阳、闻气味、认路牌。",s:"维基百科·家鸽",u:"https://zh.wikipedia.org/wiki/家鸽"},
      {q:"狼为什么爱在夜里对天长嚎？",a:"狼嚎是它的「集体广播」。狼群是领地动物，一声悠长的嚎叫能传好几公里，告诉附近的狼群：这块地盘是我们的，别来碰。同时，散开觅食的狼靠嚎叫互相定位，凑齐队伍再一起行动。狼群里几只狼一起嚎，声音叠在一起，听起来比实际数量多，更能吓唬外敌。所以月圆夜听到狼嚎，不是狼在对月亮抒情，而是狼群在开一场远距离的集体喊话。",s:"维基百科·狼",u:"https://zh.wikipedia.org/wiki/狼"},
      {q:"黄鼠狼遇到危险为什么会放臭屁？",a:"黄鼠狼肛门旁有一对臭腺，紧急时能喷出一股奇臭无比的黄色液体，气味几十米外都能闻到。这是它的化学武器：追它的鹰、狐狸闻到这股恶臭会愣一下、打喷嚏，它就趁机溜进洞里。臭液溅到眼睛还会造成短暂刺痛和流泪。所以民间说「黄鼠狼放屁——毒」，虽不致命，但足以让追击者退避三舍。它真正的武器不是咬，而是这股保命的臭雾。",s:"维基百科·黄鼠狼",u:"https://zh.wikipedia.org/wiki/黄鼬"},
      {q:"刺猬遇见危险为什么缩成一个球？",a:"刺猬背上长着几千根角质硬刺，平时贴在背上，遇到危险时，它皮肤下面有一圈专门的肌肉一收缩，全身硬刺立刻竖起、外翻，身体团成一个刺球，脸和肚子都藏在里面。狐狸、狼想咬，满口是刺，无从下口；等危险过去，它再放松肌肉，伸头伸脚继续找虫子吃。刺不是随便长的，是它唯一的盔甲。所以路边碰到刺猬，别用手直接抓，它缩成球时看着萌，其实每一根刺都很硬。",s:"维基百科·刺猬",u:"https://zh.wikipedia.org/wiki/刺猬"},
      {q:"穿山甲为什么浑身披着鳞片？",a:"穿山甲全身覆盖角质鳞片，像一身叠起来的瓦。遇到狮子、老虎咬它，它立刻卷成一个硬球，鳞片边缘锋利，掠食者根本咬不动。鳞片是它真正的盔甲，连子弹都未必打得穿。它的爪子特别长，专门挖蚁穴，舌头能伸到三十厘米长，把白蚁粘出来吃。可惜，因为人们误信鳞片能入药，穿山甲被非法偷猎得极惨，现在成了极度濒危物种。它那身保命鳞，反而给它招来了杀身之祸。",s:"维基百科·穿山甲",u:"https://zh.wikipedia.org/wiki/穿山甲"},
      {q:"鸭嘴兽为什么是卵生的哺乳动物？",a:"鸭嘴兽是澳洲特有的「活化石」：它下蛋，却用乳汁喂孩子；有鸭嘴、有蹼，却长着哺乳动物的毛；嘴还能在泥里靠电场感知虫子。它是单孔目动物，是哺乳动物早期演化留下来的一支。小鸭嘴兽从蛋里孵出来后，舔妈妈腹部乳腺分泌的奶长大。这种一半像爬行动物、一半像哺乳动物的奇怪组合，让科学家第一次见到标本时以为是有人把鸭子缝在海狸身上。",s:"维基百科·鸭嘴兽",u:"https://zh.wikipedia.org/wiki/鸭嘴兽"},
      {q:"袋鼠妈妈为什么肚子上长口袋？",a:"袋鼠是有袋类动物，宝宝生下来时极其不成熟——只有花生米大、没毛、看不见东西，必须爬进妈妈肚子上的育儿袋里，叼着乳头继续发育几个月。育儿袋就是它的「外置子宫」，里面温暖、柔软、随时有奶。等小袋鼠长到能蹦会跳，才敢钻出袋子，受惊又会一头扎回去。所以袋鼠的口袋不是装饰，而是它们这一族把怀孕「外挂」在身上的办法，特别适合澳洲这种随时要跑的生活。",s:"维基百科·袋鼠",u:"https://zh.wikipedia.org/wiki/袋鼠"},
      {q:"飞鱼为什么能飞出水面滑翔？",a:"飞鱼在海里被鲨鱼追急了，会用尾巴猛打水，把自己推出水面，然后张开胸鳍像翅膀一样在空中滑翔。它的胸鳍特别宽大，一次能滑几十米甚至上百米，高度离水面几米。这是它的逃生手段：水下有天敌，飞上空中能短暂躲开。不过空中也有海鸟等着，它只能滑一段就得落回水里。飞鱼不是真的会飞，而是把自己变成了一架带鳍的滑翔机。",s:"维基百科·飞鱼",u:"https://zh.wikipedia.org/wiki/飞鱼"},
      {q:"电鳗为什么能放出强电？",a:"电鳗身体两侧有几千个特殊的「发电细胞」，像一堆小电池串联起来。平时它们每个细胞只产生零点一伏电压，几千个串起来，瞬间能放出六百多伏的强电，足够击昏小鱼、甚至把人电麻。它放电主要用来捕食和自卫：猎物一被电晕，它就吞下去。电鳗自己为什么不电到自己？因为它身体的脂肪有绝缘作用，电流主要从水上传过去。这种鱼不是鳗鱼，其实更接近鲶鱼，但它的电击能力，在动物界堪称一绝。",s:"维基百科·电鳗",u:"https://zh.wikipedia.org/wiki/电鳗"},
      {q:"比目鱼为什么两只眼睛长在同一边？",a:"比目鱼刚孵化时跟普通小鱼一样，眼睛两边各一只、在水里正着游。长着长着，它开始侧着身子贴海床生活，下方那只眼睛会慢慢越过头顶，挪到朝上的那一侧。两只眼睛都长在朝上那面，它趴在沙地上也能同时看见上方过来的猎物和天敌。体色还会随周围沙地变化，把自己埋进沙里只露眼睛。所以比目鱼不是天生脸歪，而是为了躺平生活，把一只眼睛硬是搬到了同侧。",s:"维基百科·比目鱼",u:"https://zh.wikipedia.org/wiki/比目鱼"},
      {q:"海马为什么是雄性负责怀孕生宝宝？",a:"海马是少数由「爸爸怀孕」的动物。雌海马把卵产进雄腹部的育儿囊里，雄海马给卵受精，然后带着这袋卵怀孕两三周，最后靠肌肉收缩，把小海马一只只「生」出来。虽然怀孕的是雄海马，但卵还是雌海马产的，性别分工上并没有颠倒。小海马生出来后就要独自面对大海，存活率很低，所以一次生几百条。这种奇怪的生育方式，让海马成了海洋里最浪漫、最反差的爸爸。",s:"维基百科·海马",u:"https://zh.wikipedia.org/wiki/海马"},
      {q:"海牛为什么被传成「美人鱼」？",a:"古代水手在海上长途航行，偶尔远远看到海牛浮出水面喂奶、用胸鳍抱着小海牛，月光下轮廓模糊，就把它当成了传说中的美人鱼。其实海牛圆滚滚、皮肤粗糙，和美人差得远。它是食草的海洋哺乳动物，慢悠悠啃海草，被称为「海底除草机」。欧洲大航海时代的许多美人鱼故事，回头看都是海牛在迷雾里的远镜头。所以美人鱼不是海里有美女，是寂寞水手看错了一头胖海牛。",s:"维基百科·海牛",u:"https://zh.wikipedia.org/wiki/海牛"},
      {q:"鲸死去后为什么会沉入深海成「鲸落」？",a:"一头巨鲸死去后，巨大的身体会慢慢沉入几千米深的海底。在深海，本来食物极其匮乏，可一具鲸尸能成为一座「绿洲」：盲鳗、深海蟹、睡鲨先来撕吃肉，几年甚至几十年；肉吃完后，甲壳生物、蠕虫住进骨头里；最后骨头被细菌分解，化能生物在周围聚成一片小群落。一座鲸落可以供养一套生态系统上百年。生物学家说，鲸落、热泉、冷泉是深海三大生命绿洲。鲸死了，还在海底继续喂着一整个世界。",s:"维基百科·鲸落",u:"https://zh.wikipedia.org/wiki/鲸落"},
      {q:"犀牛鼻子上为什么长着角？",a:"犀牛的角不是骨头，而是和我们指甲、头发一样的角蛋白，紧紧堆在鼻梁上的骨垫上。它用来威慑同伴、打斗、挖水、折断树枝。犀牛视力差，靠角和厚皮自卫，狮子一般不敢惹成年犀牛。但因为有人迷信犀牛角能入药，犀牛被疯狂偷猎，现在几种犀牛都濒临灭绝。它那根角其实跟你的指甲成分一样，磨粉并不能治病，却差点让整个物种消失。",s:"维基百科·犀牛",u:"https://zh.wikipedia.org/wiki/犀牛"},
      {q:"河马白天为什么总爱泡在水里？",a:"河马皮肤特别敏感，离开水太久会干裂、晒伤。它又没有汗，泡在水里能降温、挡阳光。白天太阳毒，它全家泡在河里，只露眼睛耳朵鼻孔；等天黑凉快了，才上岸吃草。河马看起来憨厚，其实脾气暴躁、咬合力惊人，是非洲最危险的动物之一。它白天泡水，一半是怕晒，一半是懒得动；夜里上岸暴走吃草，一次能走几十公里。所以河马不是在河里洗澡，是在水里避暑、顺便埋伏。",s:"维基百科·河马",u:"https://zh.wikipedia.org/wiki/河马"},
      {q:"大象为什么能记住好几年前的事？",a:"大象的海马体大而复杂，长期记忆力惊人。母象作为首领，记得几十年前哪条河在旱季不会干、哪片草地在特定年份有水；象群跟着它的记忆迁徙，才能在大旱中活下来。它也记得家族里每一头象的叫声，甚至记得几年前伤害过它的人。科学家观察到，大象会定期回到死去同伴的骨头旁，用鼻子轻轻触摸，像在凭吊。所以「象群记得路」不只是传说，它们靠记忆把整个家族带过一次次灾难。",s:"维基百科·象",u:"https://zh.wikipedia.org/wiki/象"},
      {q:"老鼠为什么总爱啃咬东西？",a:"老鼠的门牙一生都在长，一年能长十几厘米，不磨就会戳穿上颚。所以它必须不停啃木头、电线、塑料、墙角，把牙磨短。这就是为什么家里老鼠一来，家具线全遭殃。老鼠啃东西不是嘴馋，是在给自己「磨牙」。它的咬合力很强，硬纸板、软金属都能咬穿。防鼠的关键不只是堵食物，还要把它能咬的管线包好——否则它半夜咬电线，还可能短路起火。",s:"维基百科·鼠",u:"https://zh.wikipedia.org/wiki/鼠"},
      {q:"牛为什么看见红布会激动？",a:"其实牛是红绿色盲，它根本看不出红和绿。斗牛士用红布，不是为了「激怒牛」，而是给观众看的——红色鲜艳、有戏剧感。真正让牛冲过来的，是那块布在它面前不停晃动、再加上斗牛士的挑逗动作。对牛来说，晃的是红布还是绿布都一样，它冲的是那个移动的目标。所以别拿块红布去牛跟前试，换块蓝布它一样顶你。让牛发火的不是颜色，是那块布在它眼前晃。",s:"维基百科·牛",u:"https://zh.wikipedia.org/wiki/牛"},
      {q:"驴为什么被说很犟？",a:"驴不是真的犟，而是比马更谨慎。驴是被驯化来在山路上驮货的，环境险、负担重，它一旦判断前面不安全——比如桥太窄、路太滑、负载太重，就会站住不动，怎么打都不走。马可能受惊狂奔，驴却会「想清楚」再动。在主人眼里，这就是「犟」；其实它是在保命。驴耐力好、吃得少、不容易惊，在山区和沙漠里一直是最可靠的驮兽。说驴犟，多半是主人没听懂它在说「这条路我不走」。",s:"维基百科·驴",u:"https://zh.wikipedia.org/wiki/驴"},
      {q:"骡子为什么不能生小骡子？",a:"骡子是马和驴生的后代：母马配公驴生的叫马骡，个头大、力气足；母驴配公马生的叫驴骡。马有64条染色体，驴有62条，骡子身上分到63条，是个奇数，生殖细胞没法正常配对分裂，所以几乎没有生育能力。但骡子结合了爸妈的优点：力气比马大、脾气比驴稳、吃得少、寿命长，是农村和山区传统的好劳力。骡子不是不能干活，只是它这一支「混血」到它就停下了。",s:"维基百科·骡",u:"https://zh.wikipedia.org/wiki/骡"}
    ],
    "人体":[
      {q:"为什么人一紧张，手心就出汗？",a:"因为紧张触发了身体的「警报系统」。当我们感到紧张、害怕、兴奋时，大脑的交感神经会立刻进入「战斗或逃跑」状态：心跳加速、血压升高、肌肉绷紧，同时汗腺也开始分泌。手心、脚心这些部位的汗腺对交感神经特别敏感，一点点紧张就会先出汗，所以考试前、上台演讲前，手心总是湿漉漉的。这种反应其实是祖先留给我们的：远古时遇到猛兽，手心出汗能增加抓握力，方便逃跑或搏斗。到了现代，猛兽没了，但面试、表白、答辩照样触发这套程序。手心出汗，是身体在替你紧张。",s:"维基百科·交感神经系统",u:"https://zh.wikipedia.org/wiki/交感神经系统"},
      {q:"为什么感冒时吃什么都没味道？",a:"因为味觉有一半是「闻」出来的。舌头上的味蕾只能尝出酸、甜、苦、咸、鲜五种基本味道，而食物丰富的香气，要靠鼻子里的嗅觉细胞来识别。感冒时鼻黏膜充血肿胀，鼻孔堵住，气味分子进不了鼻子，嗅觉失灵，于是味道立刻减半——吃什么都像嚼蜡。这也是为什么捏住鼻子吃东西，土豆和苹果几乎分不出区别。所以感冒时觉得饭不香，不是厨艺退步，而是鼻子罢工，连累了舌头。等鼻子通了，熟悉的味道就全回来了。下次感冒，试试捏住鼻子吃一口最爱的东西，你会发现「香」真的有一半是闻出来的。",s:"维基百科·嗅觉",u:"https://zh.wikipedia.org/wiki/嗅觉"},
      {q:"为什么人睡觉时会流口水？",a:"因为睡着了，嘴巴的「闸门」松了。人在睡眠时全身肌肉放松，负责闭嘴的咬肌和口轮匝肌也跟着松懈，如果睡姿是仰面或侧卧、再赶上鼻子不通气不得不张嘴呼吸，口水就容易顺着嘴角流出来。另外，白天我们不断吞咽口水，睡着了吞咽频率大幅下降，唾液积在嘴里，满则溢。所以流口水是正常的生理现象，尤其是白天太累、睡得特别沉的时候更容易发生。偶尔流一次不必担心；但要是每天醒来枕头都湿一大片，还伴有口臭、牙疼，就可能是牙齿或口腔问题，建议看看牙医。",s:"维基百科·唾液",u:"https://zh.wikipedia.org/wiki/唾液"},
      {q:"为什么人特别怕痒？",a:"怕痒其实是一道「防御警报」。科学家发现，怕痒最敏感的部位是腋下、腰侧、脚心——这些地方皮肤薄、神经密，而且是身体最容易被攻击的软肋。轻挠这些部位时，大脑会把它当成「有东西在偷袭」，自动产生躲闪、缩身、笑出声的反应；笑是一种信号，提醒同伴「我这儿受攻击了，快停下」。所以自己挠自己通常不痒：因为大脑已经知道「这是我的手，没有危险」，警报提前解除。怕痒还有社交功能，朋友间互相挠痒嬉闹，能增进亲密感。真正怕痒的人被碰一下就会跳起来，那是身体在替他说：这是我的软肋，别碰。",s:"维基百科·痒",u:"https://zh.wikipedia.org/wiki/痒"},
      {q:"为什么运动后第二天浑身酸痛？",a:"这叫「延迟性肌肉酸痛」，一般出现在运动后 24 到 72 小时。以前人们怪罪乳酸，但现在研究认为，主因是肌肉纤维在做不习惯的高强度运动时发生了细微损伤，引发轻微炎症，修复过程中产生酸痛感——这其实是肌肉在变强的信号：身体会多长一些肌纤维，下次同样的运动就没那么疼了。缓解的办法是：运动后充分拉伸、适当活动、补充蛋白质和水分，让身体加速修复；疼得厉害可以用热敷或泡沫轴放松。注意，如果运动时立刻剧痛、动不了，那可能是拉伤了，要休息就医。酸痛是成长，剧痛是受伤，两者要分清。",s:"维基百科·延迟性肌肉酸痛",u:"https://zh.wikipedia.org/wiki/延迟性肌肉酸痛"},
      {q:"为什么腿会抽筋？",a:"抽筋是肌肉「不听话」地突然收缩。最常见的原因：剧烈运动后肌肉疲劳、乳酸堆积；出汗太多导致钙、镁、钾等电解质流失；夜里被子压脚、血液循环不畅；还有受凉——温度骤降会让肌肉兴奋性升高。抽筋时肌肉持续紧绷，又疼又硬，马上反向拉伸能缓解：小腿抽筋就把脚尖往膝盖方向扳，保持十几秒。预防的办法：运动前充分热身、及时补水补盐、睡前拉伸、注意腿部保暖。偶尔抽一次是身体提醒你「累过头了」，频繁抽筋就要去查查电解质和血管了。",s:"维基百科·肌肉痉挛",u:"https://zh.wikipedia.org/wiki/肌肉痉挛"},
      {q:"为什么打喷嚏时眼睛会闭上？",a:"这是身体在「紧急制动」。喷嚏是鼻腔受到刺激后引发的强烈反射：横膈膜猛地收缩，胸腔压力骤增，气流以极快的速度冲出鼻腔，顺便带出飞沫和异物。为了防止这股冲击波伤到眼睛，大脑会在喷嚏瞬间自动下令闭眼——这是一种本能的保护反射，几乎不受意志控制。顺带一提，想打喷嚏时硬憋着不闭眼，不仅难受，还可能让压力冲击鼓膜。所以打喷嚏闭眼不是巧合，是身体在给最脆弱的器官「拉安全闸」。",s:"维基百科·喷嚏反射",u:"https://zh.wikipedia.org/wiki/喷嚏"},
      {q:"为什么早上醒来容易口臭？",a:"因为口腔「加班」了一整夜。睡觉时唾液分泌大幅减少，口腔变得干燥，而唾液本来有抑菌和冲刷的作用；细菌趁夜深人静大量繁殖，分解食物残渣、脱落细胞，产生含硫的臭味气体，这就是晨起口臭的主要来源。刷牙能缓解，是因为清掉了细菌的食物来源。想改善：睡前认真刷牙、用牙线，再刷一刷舌苔，别带着食物残渣入睡；早上醒来先喝口水，等唾液重新上岗，气味就会慢慢散去。晨起口臭人人都有，重在睡前功夫。",s:"维基百科·口臭",u:"https://zh.wikipedia.org/wiki/口臭"},
      {q:"人为什么会打哈欠？",a:"打哈欠不是因为困那么简单。一种被广泛接受的解释是：当人困倦、无聊时，呼吸变慢，血液里二氧化碳积得多、氧气变少。一次深长的哈欠，能猛地吸进一大口氧气，让胸腔、横膈膜和颈部肌肉拉伸，顺便给大脑降降温，让人短暂清醒。所以久坐、开会、刚睡醒时容易哈欠连连。打哈欠还和「社交同步」有关——看到别人打，自己也跟着打。所以下次开会连打哈欠，别光顾着困，那是身体在给大脑做一次深呼吸。",s:"维基百科·哈欠",u:"https://zh.wikipedia.org/wiki/哈欠"},
      {q:"打哈欠为什么会传染？",a:"看到别人打哈欠，自己也忍不住跟着打，这种「传染」被认为和共情能力有关。脑成像研究发现，看到别人打哈欠时，大脑里负责镜像和情绪共享的区域会被激活，让你下意识模仿同伴的动作。这在群居动物里很常见：整群动物同时打哈欠，可能是在统一作息——一起醒、一起休息、一起活动。关系越亲密的人之间，哈欠越容易传染。所以开会时一个人张嘴，全会议室跟着张嘴，不是大家都困，而是大脑在替朋友「感同身受」。",s:"维基百科·哈欠",u:"https://zh.wikipedia.org/wiki/哈欠"},
      {q:"人为什么会做梦？",a:"梦主要发生在快速眼动睡眠阶段。这时大脑活动活跃，眼球在眼皮底下快速转动，但身体肌肉几乎被「关机」，防止我们把梦演出来。科学家认为，做梦是大脑在整理白天的记忆、清理没用的信息、巩固情绪——相当于每晚做一次「内存整理」。梦的画面常常荒诞跳跃，因为负责逻辑和判断的前额叶在梦里比较安静，而视觉、情绪区域很活跃。大多数梦醒后几分钟就忘。梦不是预兆吉凶，而是大脑在后台悄悄加班。",s:"维基百科·梦",u:"https://zh.wikipedia.org/wiki/梦"},
      {q:"人年纪大了头发为什么会变白？",a:"头发的颜色来自毛囊里黑素细胞生产的黑色素。随着年龄增长，黑素细胞慢慢减少、活性下降，新长出来的头发里色素越来越少，就从黑慢慢变灰、变白。压力、熬夜、营养和遗传都会影响这个过程，有的人三十出头就白发早生。白发其实不是「白」，而是透明的头发因为光线反射看起来发白。头发一旦变白，毛囊里的色素很难再回来，所以染发只是暂时遮一下。年轻人少白头不用太焦虑，多半是遗传和压力，注意休息和均衡营养就好。",s:"维基百科·白发",u:"https://zh.wikipedia.org/wiki/白发"},
      {q:"人为什么会打嗝？",a:"打嗝是横膈膜突然、不由自主地痉挛收缩，空气猛地冲进喉咙，被声带一关，就发出「嗝」的一声。诱因很多：吃得太快、太撑，喝了碳酸饮料或冰水，突然受凉，紧张大笑，都可能刺激横膈膜。多数嗝几分钟内自己停。想止住，可以试试屏气几秒、喝口温水、让别人吓一跳——这些办法都是为了打断痉挛反射、让横膈膜放松。如果连续打嗝超过一两天，就要去看医生，那可能不是普通嗝，而是身体在提醒你肠胃或神经出了问题。",s:"维基百科·打嗝",u:"https://zh.wikipedia.org/wiki/呃逆"},
      {q:"人为什么会放屁？",a:"放屁是正常消化现象，谁都躲不掉。屁的来源有两个：一是吞咽食物、说话时带进胃里的空气；二是肠道细菌分解食物残渣时产生的气体，尤其是豆类、洋葱、红薯这类产气食物。这些气体会一路往下走，最后从肛门排出，一天十几次都算正常。屁臭不臭，主要看里面硫化氢等气体的比例，吃的肉和蛋越多，往往越臭。所以放屁不丢人，是肠道在正常工作；要是一整天一个屁都没有、肚子还胀，反而要警惕。",s:"维基百科·屁",u:"https://zh.wikipedia.org/wiki/屁"},
      {q:"眼皮为什么会跳？",a:"眼皮跳在医学上叫「眼睑痉挛」，是眼周肌肉不受控制地轻微抽动。绝大多数情况是因为熬夜、用眼过度、精神紧张、咖啡因喝多了，导致神经和肌肉太兴奋。一般跳几分钟到几天自己就好，民间「左眼跳财、右眼跳灾」没有科学依据。缓解办法很简单：好好睡一觉、热敷眼睛、少喝咖啡、放松心情。如果眼皮连跳几周都不停，甚至半边脸一起抽，就要去神经内科看看，排除面部神经问题。眼皮跳不是吉凶预报，是眼睛在喊「我累了」。",s:"维基百科·眼睑痉挛",u:"https://zh.wikipedia.org/wiki/眼睑痉挛"},
      {q:"坐久了腿为什么会发麻？",a:"久坐或盘腿时，腿上的血管和神经被压住，血液流通不畅、神经信号传不顺畅，腿就会出现又麻又刺、像无数小针扎的感觉。站起来走一走，血液重新流过去，那种麻酥酥的感觉才慢慢消退。这就是俗话常说的「腿麻了」「腿坐麻了」。偶尔麻一下不要紧，但如果不改久坐习惯，长期压迫会让腿酸、腿胀、甚至静脉曲张。所以每坐一小时最好起来活动两分钟，让腿重新「通电」。",s:"维基百科·麻木",u:"https://zh.wikipedia.org/wiki/感觉异常"},
      {q:"吃饱了为什么会犯困？",a:"饭后犯困，主要是身体把血液和能量调去消化了。吃完饭后，胃肠道需要大量供血来蠕动、消化，脑部供血相对减少，人就容易昏昏欲睡。同时饭后血糖升高，会抑制大脑里让人清醒的「食欲素」神经元，更觉得困。如果这顿饭精制碳水多、又吃特别饱，困意会更明显。想饭后不那么困，可以七分饱、少喝甜饮料、饭后散步十几分钟。所以饭后打哈欠不是懒，是身体在把加班的肠胃排在第一位。",s:"科普中国",u:"https://www.kepuchina.cn/"},
      {q:"人为什么会晕车晕船？",a:"晕车晕船是因为身体里两套系统「意见不合」。眼睛看到的是车厢内壁没动，内耳前庭却感觉到车在加速、转弯、颠簸，大脑同时收到「没动」和「在动」两个矛盾信号，就判定为「中毒幻觉」，于是引发恶心、呕吐，想把「毒」吐出去。看远处地平线、坐前排、开窗通风、闭眼睡觉，都能缓解——让视觉和前庭重新对齐。容易晕车的人可以提前半小时吃晕车药。等身体慢慢适应了，症状也会减轻。",s:"维基百科·晕动病",u:"https://zh.wikipedia.org/wiki/晕动病"},
      {q:"人为什么会脸红？",a:"脸红是交感神经让面部血管扩张、血液涌到脸上的结果。人在害羞、尴尬、被当众表扬或发怒时，大脑情绪中枢一激动，脸部那些又浅又密的小血管立刻扩张，脸就红了、发烫。这是人类独有的社交表情之一，其他动物几乎不会脸红。肾上腺素让人紧张时心跳加速、手心出汗，而脸红是不受控的生理反应，越想压越红。所以脸红不是「心虚」，而是情绪写在了脸上——它其实是一种真诚的社交信号。",s:"维基百科·脸红",u:"https://zh.wikipedia.org/wiki/脸红"},
      {q:"冬天皮肤为什么会发痒？",a:"冬天空气干、气温低，皮肤表面的油脂和水分容易被抽干，角质层变干、出现小裂口，神经末梢更容易受刺激，于是又干又痒。洗澡太烫、太勤、用碱性强的肥皂，会把本来就不多的皮脂洗掉，更痒。缓解办法：洗澡水温别太烫、时间别太长，洗完三分钟内涂身体乳，多喝水、屋里用加湿器。冬天皮肤痒不是皮肤病，多半是「干」出来的，做好保湿就能缓解大半。",s:"科普中国",u:"https://www.kepuchina.cn/"},
      {q:"指甲上的「月牙」到底是什么？",a:"指甲根部那圈白色半月形，叫甲半月，是指甲生长区的「露脸部分」。指甲从根部的甲基长出来，新长出来的角蛋白还没完全角化、颜色发白，就形成了月牙。它的大小和明显程度因人而异，大拇指通常最明显，小拇指常常看不见。月牙多大多小、有没有，和健康没有直接对应关系，更不能据此判断缺什么维生素。但如果月牙短期内突然变大变小、颜色变深，或者指甲出现竖纹、横沟、开裂，那才需要去看看皮肤科。",s:"维基百科·指甲",u:"https://zh.wikipedia.org/wiki/指甲"},
      {q:"人为什么会长智齿？",a:"智齿是牙槽骨上最里面的第三颗大牙，一般在十七到二十五岁才长出来，所以叫「智慧齿」。远古人类吃生肉、硬壳食物，需要更多磨牙，颌骨也比现在大，四颗智齿刚刚好。现代人吃精细熟食，颌骨慢慢变小，可智齿还没来得及从基因里淘汰，位置不够，就常常长歪、横着顶在第二磨牙上，引起肿痛、发炎。所以很多人要把智齿拔掉。智齿不是「聪明」的象征，而是进化没跟上的「遗留零件」。",s:"维基百科·智齿",u:"https://zh.wikipedia.org/wiki/智齿"},
      {q:"人老了为什么会老花眼？",a:"我们眼睛里有一个晶状体，靠周围的睫状肌收缩、放松来调节厚薄，看近看远都清楚。随着年龄增长，晶状体慢慢变硬、弹性下降，睫状肌也没那么有力，看近处时晶状体鼓不起来，近处的书报就变得模糊。这就是老花眼，一般四十岁以后开始出现，人人都躲不掉。老花眼不是「近视变好」，而是眼睛失去了调焦能力。解决办法就是配一副老花镜，把近处光线提前聚焦到视网膜上。",s:"维基百科·老花眼",u:"https://zh.wikipedia.org/wiki/老花眼"},
      {q:"婴儿刚出生时为什么会哭？",a:"婴儿出生后的第一声哭，不是伤心，而是他人生中第一次大口呼吸。在妈妈肚子里，胎儿靠脐带供氧，肺是塌着的。出生后剪断脐带，外界冷空气和光线刺激让他猛地吸气，肺泡第一次张开，气流冲过喉咙就发出了「哇哇」的哭声。这一声哭标志着呼吸系统正式启动。医生听到哭声才放心——说明宝宝肺张开了、氧气进去了。所以新生儿那声大哭，是他来到这个世界的第一口深呼吸。",s:"维基百科·啼哭",u:"https://zh.wikipedia.org/wiki/啼哭"},
      {q:"人老了个子为什么会变矮？",a:"人到中老年变矮，主要是脊椎和关节在「缩水」。脊椎骨之间有椎间盘，像一块软垫，年轻时含水多、有弹性，把身体撑得挺拔；年纪大了椎间盘脱水变薄，脊椎被一点点压扁。再加上骨质疏松、背部肌肉变弱，背慢慢驼下去，身高就矮了两三厘米。女性绝经后因为雌激素下降，骨量流失更快，变矮更明显。所以年轻时注意补钙、晒太阳、做负重运动，老了还能挺直腰板。",s:"维基百科·骨质疏松",u:"https://zh.wikipedia.org/wiki/骨质疏松"},
      {q:"憋气久了为什么会脸红脖子粗？",a:"憋气时胸腔压力升高，静脉血回心脏变难，血液淤积在头部和颈部，脸就涨红、血管鼓起来。同时身体缺氧，二氧化碳越积越多，大脑收到「再不呼吸就危险」的信号，会强行触发呼吸反射。所以憋到最后不是自己想呼，是身体强制让你喘。那种满脸通红、太阳穴突突跳的感觉，就是身体在抗议缺氧。偶尔试试憋气练肺活量可以，但千万别硬撑，尤其是水里，容易晕过去。",s:"维基百科·呼吸",u:"https://zh.wikipedia.org/wiki/呼吸"},
      {q:"早上起来脸为什么会肿？",a:"早上眼周、脸肿，多是水分「躺」出来的。睡觉时平躺一夜，身体里的水分更容易跑到疏松的眼周组织；睡前水喝多了、吃太咸、熬夜、哭过，第二天尤其肿。加上睡眠不足让代谢变慢，水排不出去。一般起床后活动几小时，水往低处流，自己就消了。想避免：睡前少喝水、饮食清淡、枕头别太低。如果脸肿持续一整天、还伴腿肿尿少，就要去查查肾和心脏。",s:"科普中国",u:"https://www.kepuchina.cn/"},
      {q:"紧张时为什么总想上厕所？",a:"紧张、害怕时，交感神经接管身体，进入「战斗或逃跑」模式，心跳加速、肌肉绷紧，同时肠道和膀胱也会被波及。这种状态下，身体倾向于「减负」——把体内多余的东西排出去，轻装上阵。所以大考前、面试前、上台前，很多人忍不住想跑厕所，甚至拉肚子。这就是俗话所说的「吓得尿裤子」的生理基础。等事情过去、副交感神经重新接管，这种感觉就会消退。",s:"维基百科·交感神经",u:"https://zh.wikipedia.org/wiki/交感神经"},
      {q:"伤口愈合时为什么会发痒？",a:"伤口快好时发痒，是新皮肤在长。皮肤受伤后，深层的新生组织——包括神经和血管——正在往里长，这些新生的神经末梢特别敏感，稍微受到刺激就会发出「痒」的信号。所以伤口发痒往往说明它正在愈合，不是感染。但别用手抓，抓掉刚长好的薄皮，可能留疤、感染。实在痒可以轻轻拍一拍、涂一点保湿或医生开的药膏。等皮肤长结实了，痒自然会退。",s:"维基百科·伤口愈合",u:"https://zh.wikipedia.org/wiki/创伤愈合"},
      {q:"为什么有的人喝牛奶会拉肚子？",a:"这叫乳糖不耐受。牛奶里有乳糖，需要小肠里的乳糖酶来分解。很多中国人成年后乳糖酶活性下降，喝进去的乳糖没法被消化，直接进大肠，被细菌发酵产气、吸水，就会腹胀、放屁、拉肚子。这不是对牛奶过敏，而是身体长大了、不再天天喝奶，酶就「下岗」了。解决办法：改喝酸奶、低乳糖奶，或者少量多次慢慢喝，让肠道慢慢适应。别硬灌，否则跑厕所比补钙还勤。",s:"维基百科·乳糖不耐症",u:"https://zh.wikipedia.org/wiki/乳糖不耐症"},
      {q:"天冷了为什么会起鸡皮疙瘩？",a:"鸡皮疙瘩是远古祖先留下的「御毛反射」。皮肤下面有一块小肌肉叫立毛肌，一受冷或紧张，它就收缩，把毛发立起来。我们的祖先浑身是毛，毛发竖起能在皮肤间锁住一层空气当保温层，还能让自己看起来变大、吓退敌人。现代人毛少了，立毛肌却还在，于是只能把皮肤顶出一个个小疙瘩。起鸡皮疙瘩时，摸上去一粒一粒，那就是身体在替你「竖起寒毛」。",s:"维基百科·立毛肌",u:"https://zh.wikipedia.org/wiki/立毛肌"},
      {q:"睡觉为什么会说梦话？",a:"说梦话在医学上叫梦呓，可以发生在睡眠的任何阶段。我们睡着后，大脑并不是完全关机，部分语言中枢还活跃，白天没说出口的话、紧张的事，可能在梦里变成喃喃自语。梦话通常很短、没逻辑，自己第二天完全不记得。压力大、熬夜、白天太兴奋时更容易出现。多数梦话不需要治疗，规律作息、睡前放松就会减少。但如果梦话伴随大喊大叫、拳打脚踢，可能是睡眠行为障碍，要去看医生。",s:"维基百科·梦呓",u:"https://zh.wikipedia.org/wiki/梦呓"},
      {q:"人为什么会流眼泪？",a:"眼泪不只是伤心时才流，它其实一直都在。眼球表面每时每刻都被一层薄薄的泪膜覆盖，靠眨眼把它涂匀，保持湿润、冲走灰尘。这种「基础泪」你感觉不到。当洋葱刺激、情绪激动、大笑大哭时，泪腺大量分泌，眼泪来不及从鼻泪管排走，就从眼角涌出来。所以哭的时候鼻涕也会多——眼泪一部分顺着鼻子流下去。眼泪里还有溶菌酶，能杀菌，是眼睛自带的消毒水。",s:"维基百科·眼泪",u:"https://zh.wikipedia.org/wiki/泪"},
      {q:"切洋葱为什么会忍不住流泪？",a:"洋葱被切开时，细胞破裂，会释放一种酶，和洋葱里的含硫物质反应，生成挥发性的刺激性气体。这种气体飘到眼睛上，接触泪膜就变成弱酸，角膜神经一受刺激，大脑立刻下令泪腺大量分泌眼泪来「冲洗」它。所以越切越辣眼。想少流泪：把洋葱先冷藏十分钟、切的时候刀沾水、在通风处或抽油烟机下切，都能让气体少飘进眼睛。下次切洋葱泪流满面，不是洋葱凶，是你的眼睛在自动清洗。",s:"维基百科·洋葱",u:"https://zh.wikipedia.org/wiki/洋葱"},
      {q:"哭的时候为什么会一把鼻涕一把泪？",a:"眼泪产生后，除了从眼角流出来，还有一部分通过内眼角的小口子——泪点——流进鼻泪管，再进到鼻腔。平时量小，你感觉不到；大哭时泪腺疯狂分泌，多余的眼泪全灌进鼻腔，和鼻涕混在一起，于是鼻涕也跟着流。所以「痛哭流涕」不是鼻涕多，是眼泪改道从鼻子出来了。擤鼻涕时那股咸味，其实就是混着泪的水。哭完鼻子堵堵的，要过一会儿才通。",s:"维基百科·泪",u:"https://zh.wikipedia.org/wiki/泪"},
      {q:"人为什么要不停眨眼？",a:"眨眼不是多余动作，而是眼睛在「自动做保养」。正常人每分钟眨十几次，每次不到一秒。眨眼时眼皮像雨刷，把泪膜均匀铺在角膜上，保持湿润，同时挡掉灰尘和强光。专注看手机、看书时，眨眼次数会不自觉减少，眼睛就干、酸、涩。所以建议看屏幕半小时就看远处、多眨几次眼。眨眼虽然不显眼，但它是眼睛最便宜的润滑和清洁，别小看这一秒。",s:"中国数字科技馆",u:"https://www.cdstm.cn/gallery/media/mkjx/jtyyklys/art/2018/art_91a22b60d6d84dacb32ff579cdbf65d7.html"},
      {q:"看手机久了为什么眼睛干？",a:"看手机时眼睛紧盯着屏幕，眨眼次数从平时每分钟十几次降到五六次，泪膜来不及补，眼睛表面就干了。加上屏幕蓝光和近距离聚焦让睫状肌一直收缩，时间一长就酸胀、视物模糊。这就是「视频终端视疲劳」。办法：保持屏幕离眼睛一臂远、亮度别太亮、每二十分钟看六米外二十秒、有意识多眨眼、空调房里开加湿器。眼睛干不是大病，但长期硬扛会发展成干眼症。",s:"维基百科·干眼症",u:"https://zh.wikipedia.org/wiki/干眼症"},
      {q:"瞳孔为什么会一会变大一会变小？",a:"瞳孔是虹膜中间的小黑洞，大小由两块小肌肉控制。光线强时，瞳孔自动缩小，少进光，保护视网膜；光线暗时，瞳孔放大，多进光，才能看清。看近处、集中精力、情绪激动、看到喜欢的东西时，瞳孔也会不自觉放大，这是交感神经在起作用。所以拍证件照要在柔和光下，否则瞳孔小、眼神没神。瞳孔大小不受意志控制，反而泄露了我们的情绪。",s:"维基百科·瞳孔",u:"https://zh.wikipedia.org/wiki/瞳孔"},
      {q:"为什么有的人天生是左撇子？",a:"左撇子和大脑两半球分工有关。大多数人左脑占优势，控制右侧身体，所以右手更灵活；少数人右脑占优势，就成了左撇子。这和遗传、胎儿期发育都有关系，比例大约占人群一成。过去有些家长硬把左撇子孩子扳成右手，反而造成口吃、书写困难。其实左撇子在某些运动、空间思维上还有优势。左撇子不是毛病，只是大脑「主驾驶座」装在了另一边。",s:"维基百科·左撇子",u:"https://zh.wikipedia.org/wiki/左撇子"},
      {q:"为什么越想睡反而越睡不着？",a:"这是「失眠的焦虑」在作怪。越告诉自己「必须睡着、明天要早起」，大脑越紧张、交感神经越兴奋，心率加快、身体紧绷，反而清醒。睡眠像一只蝴蝶，你追它它就飞，你安静坐着它才落上来。办法：别在床上硬躺二十分钟以上，起来做点无聊的事，等困了再回去；睡前别刷手机、别喝奶茶咖啡；固定起床时间。长期失眠别自己硬扛，找睡眠门诊更靠谱。",s:"维基百科·失眠",u:"https://zh.wikipedia.org/wiki/失眠"},
      {q:"睡觉为什么会磨牙？",a:"夜磨牙的原因还没完全搞清楚，普遍认为和精神紧张、咬合不正、睡眠浅有关。睡着后咀嚼肌不自主收缩，上下牙「吱吱」磨。偶尔磨一次没事，长期磨会把牙齿磨平、腮帮酸、早上头痛。原因包括：白天压力大、喝咖啡、酒精、睡姿不好。办法：减压、睡前放松、看牙医配一副咬合垫，把牙齿隔开。别信什么「磨牙是肚子有虫」，那是老说法。",s:"维基百科·磨牙症",u:"https://zh.wikipedia.org/wiki/磨牙症"},
      {q:"人为什么会打呼噜？",a:"呼噜是睡觉时气道变窄，气流通过时把软腭、悬雍垂震得发抖发出的声音。胖、脖子短、鼻塞、喝酒、仰睡，都会让喉咙肌肉更松、气道更窄，呼噜更响。偶尔呼噜问题不大，但如果打着打着突然没声、憋几秒再猛地吸气，那可能是「睡眠呼吸暂停」——夜里反复缺氧，白天嗜睡、高血压风险高。这种情况要去睡眠门诊检查，别把它当成「睡得香」。",s:"维基百科·打鼾",u:"https://zh.wikipedia.org/wiki/打鼾"},
      {q:"人为什么会笑？",a:"笑最初不是为了搞笑，而是一种社交信号。灵长类动物打闹时，会发出类似笑的喘息，表示「我是在玩，不是真打」。人类把它扩展到幽默、惊喜、被逗乐时。笑时大脑释放多巴胺和内啡肽，让人放松、舒服，还能降压、增强免疫。一群人一起笑比一个人笑更开心，因为笑本身就是在拉近关系。所以笑不只是表情，是身体在说：我安全、我喜欢和你待在一起。",s:"维基百科·笑",u:"https://zh.wikipedia.org/wiki/笑"},
      {q:"天冷了为什么会发抖？",a:"发抖是身体自带的「电暖气」。温度一下降，大脑下丘脑发现体温低了，立刻命令骨骼肌快速、节律地收缩——就是发抖。肌肉每抖一下都产生热量，帮身体升温。所以冷到极致时人会控制不住地打哆嗦，嘴唇发紫、牙齿打颤。这是祖先在没暖气时撑下来的保命反应。抖得越厉害，说明身体越急着产热。这时赶紧加衣服、喝热水，别硬扛。",s:"维基百科·战栗",u:"https://zh.wikipedia.org/wiki/战栗"},
      {q:"汗为什么是咸的？",a:"汗里除了水，还有少量盐分、尿素和乳酸。我们的血液里本来就有氯化钠，出汗时汗腺会把一部分盐分一起排出来，所以尝起来咸。大量出汗后如果只喝白水，会把血液盐分稀释，人会乏力、抽筋，这就是为什么运动饮料里要加盐。汗本身无味，「汗臭」是皮肤表面细菌把汗和油脂分解后产生的。勤洗澡、换干爽衣服，就能大大减轻汗味。",s:"维基百科·汗",u:"https://zh.wikipedia.org/wiki/汗"},
      {q:"为什么伤口会留疤？",a:"皮肤分表皮和真皮。如果只是擦伤表皮，皮肤能完全长好、不留痕。可一旦伤到真皮，身体就要用「疤痕组织」——胶原蛋白快速堆起来——把伤口补上。这种组织排列不如原来皮肤整齐，颜色、质地也不一样，就成了疤。伤口越深、感染越重、越爱抠，疤越明显。想少留疤：伤口保持清洁、别抠痂、拆线后涂祛疤膏、防晒。疤痕体质的人更容易长凸起的疤，要更小心。",s:"维基百科·疤痕",u:"https://zh.wikipedia.org/wiki/疤痕"},
      {q:"为什么有的人特别怕疼？",a:"痛觉是身体的报警系统，敏感度因人而异。遗传、性别、年龄、情绪、过往经验都会影响：女性通常对痛更敏感；紧张、焦虑会把痛放大；而专注、愉快时痛会减轻。大脑还能在关键时刻「关掉」痛觉——比如比赛受伤的运动员当时不觉得疼。所以「耐不耐痛」不是意志力问题，而是神经和大脑共同调出来的。长期慢性疼痛要找医生，别光靠忍。",s:"维基百科·痛觉",u:"https://zh.wikipedia.org/wiki/痛觉"},
      {q:"为什么嘴里老长口腔溃疡？",a:"复发性口腔溃疡很常见，诱因一堆：熬夜、压力大、维生素B族或铁锌不足、不小心咬到腮帮子、刷牙刷太猛、家族遗传。它不是病毒，也不是「上火」那么简单。一般一到两周自己会好。疼得厉害可以用口腔溃疡贴、含漱药水。如果同一个位置超过两周不愈、硬块变大、出血，要去口腔黏膜科排查，别总当普通溃疡硬扛平时注意睡眠和口腔卫生，能少长不少溃疡。。",s:"维基百科·口腔溃疡",u:"https://zh.wikipedia.org/wiki/口腔溃疡"},
      {q:"刷牙时牙龈为什么会出血？",a:"刷牙出血最常见的原因是牙龈炎。牙菌斑、牙结石堆在牙龈边上，细菌刺激牙龈发红变脆，一刷就破。很多人因为出血就不敢刷，结果菌斑越积越多，出血更厉害，进入恶性循环。正确做法是：认真用软毛牙刷、用牙线、半年洗一次牙。换了软毛、好好刷两周还出血，就要去看牙周科。牙龈出血不是「刷太狠」，而是「该洗牙了」好好刷牙、定期洗牙，牙龈很快就会恢复粉红健康。。",s:"维基百科·牙龈炎",u:"https://zh.wikipedia.org/wiki/牙龈炎"},
      {q:"牙齿为什么会蛀出洞？",a:"蛀牙是细菌「吃」出来的。嘴里的变形链球菌等细菌以食物残渣——尤其是糖——为食，产生酸。酸长期腐蚀牙釉质，把坚硬的牙齿一点点脱矿、软化，最后蛀出洞。糖吃得越频繁、越不刷牙，蛀得越快。早期蛀牙不痛，只是牙面发黑；等痛起来，往往已经蛀到牙神经，要做根管治疗。所以防蛀关键是：早晚刷牙、用牙线、少喝甜饮料、定期洗牙。",s:"维基百科·蛀牙",u:"https://zh.wikipedia.org/wiki/蛀牙"},
      {q:"人为什么有两副牙齿？",a:"人一生长两副牙：乳牙二十颗，半岁到三岁长齐；六岁开始换牙，乳牙一颗颗掉，恒牙三十二颗（含智齿）长出。因为小时候颌骨小，乳牙够用；等长大、脸变大，需要更大、更耐用的恒牙来啃咬食物。恒牙掉了不会再长第三副，所以从小就要认真刷牙。现在很多人恒牙先天缺失或长歪，要靠牙医矫正和修复。两副牙是身体给你的「一次换新机会」，换完就得用一辈子。",s:"维基百科·牙齿",u:"https://zh.wikipedia.org/wiki/牙齿"},
      {q:"为什么人上了年纪会脱发？",a:"头发也是有寿命的，一根头发一般长两三年到五六年就掉，然后毛囊再长新的。每天掉五十到一百根是正常代谢。但随着年龄增长，毛囊活性下降、雄性激素（尤其是男性）让前额和头顶毛囊逐渐萎缩、头发变细变软，最后变秃。压力、熬夜、减肥、产后、生病也会让大量头发提前进入休止期，集中掉。洗头时看到一把别太慌，持续三个月以上明显变稀，再去皮肤科。",s:"维基百科·脱发",u:"https://zh.wikipedia.org/wiki/脱发"},
      {q:"为什么男性秃顶多？",a:"男性型脱发和遗传、雄激素关系最大。头顶和前额的毛囊对一种叫二氢睾酮的激素特别敏感，它让毛囊慢慢变小、头发变细，最后只长绒毛。这种遗传倾向在男性身上表现得更明显，因为男性睾酮水平高。女性雄激素少，所以多是头顶整体变稀，很少完全秃成地中海。治疗上有外用米诺地尔、口服非那雄胺（男性）等，要在医生指导下用，别轻信生发偏方。",s:"维基百科·雄性脱发",u:"https://zh.wikipedia.org/wiki/雄性脱发"},
      {q:"为什么眉毛不会长得像头发那么长？",a:"每根毛发都有自己的「生长期」，到点就掉。头发的生长期长达两到六年，所以能长几十厘米；眉毛、睫毛的生长期只有几个月，长到一两厘米就停、脱落，再长新的。这是基因安排好的：眉毛只需要那么长，太长反而挡视线、流汗淌眼。所以剪了眉毛别担心，它过几个月会自己长回来。头发如果不剪，理论上能长一米多——但实际上大部分毛囊到时间就换茬。",s:"维基百科·毛发",u:"https://zh.wikipedia.org/wiki/毛发"},
      {q:"为什么指甲会一直长个不停？",a:"指甲根部的甲基细胞不停地分裂、角化，把旧的角蛋白往外推，就形成了指甲。它一辈子都在长，平均每月长三四毫米，手指比脚趾快。指甲其实是死的角蛋白，和头发、动物的爪子是同一类材料。剪了还会再长，因为甲基还在皮肤下面。指甲能保护指尖、帮忙抠小东西。如果指甲突然变薄、变色、出现纵沟，可能是营养或全身健康出了问题，可以看看医生。",s:"维基百科·指甲",u:"https://zh.wikipedia.org/wiki/指甲"},
      {q:"为什么指甲上会有一道道竖纹？",a:"指甲上的竖纹非常常见，多数是正常的老化现象。随着年龄增长，甲基功能不如年轻时均匀，长出来的指甲就带细细的纵沟，就像皮肤长皱纹一样。只要竖纹细、均匀、指甲不变脆不变色，就不用管。但如果竖纹突然变深、裂开、指甲和甲床分离，或者某一条黑线特别宽，就要去皮肤科，排除甲母痣或其他问题。别信「竖纹代表肝肾不好」那种说法，那是没根据的。",s:"维基百科·指甲",u:"https://zh.wikipedia.org/wiki/指甲"},
      {q:"为什么手指边上老长倒刺？",a:"倒刺是指甲周围的表皮小裂口，多因为皮肤太干、洗手太勤、咬手指、摩擦。指甲边上的皮肤很薄，没有皮脂腺，一旦水分流失，就容易翘起一小块皮。千万别用手撕，一撕就是一道口子、还可能感染。正确做法：用小剪刀齐根剪掉，再涂护手霜。平时少用碱性洗手液、做家务戴手套，倒刺就少。倒刺不是缺维生素，多半是手太干只要勤护手、少手撕，倒刺就不会老来找麻烦。。",s:"维基百科·皮肤",u:"https://zh.wikipedia.org/wiki/皮肤"},
      {q:"为什么脚会那么臭？",a:"脚臭主要是细菌在鞋里「开派对」。脚心有大量汗腺，一天能出几十毫升汗。脚被袜子球鞋闷着，又热又湿，皮肤上的细菌把脚汗和角质分解，产生有臭味的代谢物。汗本身无味，是细菌让它臭。办法：穿透气鞋、纯棉袜、每天换袜子、鞋子轮换晒、泡脚时加一点白醋。脚汗特别多的人可以找医生开止汗药。别信「脚毒」这种说法，只是鞋里太潮。",s:"维基百科·足臭",u:"https://zh.wikipedia.org/wiki/多汗症"},
      {q:"为什么有的人身上有股怪味？",a:"腋下、胯下这些部位有大汗腺，分泌的汗液里含蛋白质和脂肪酸。皮肤表面的细菌把它们分解，就产生了一种特殊的体味，也就是常说的狐臭。这种体味和遗传有关，青春期后大汗腺活跃，味道最明显。注意清洁、穿透气衣服、用止汗露能明显减轻；严重的可以做微创手术。这不是不讲卫生，而是体质问题，没必要自卑保持清洁、穿透气衣物，体味自然会轻很多。。",s:"维基百科·腋臭",u:"https://zh.wikipedia.org/wiki/腋臭"},
      {q:"为什么有的人冬天总手脚冰凉？",a:"天冷时，身体为了保护心、脑等重要器官，会让四肢末端血管收缩，减少末梢供血，热量优先供给内脏。于是手脚先冷。女生、体型偏瘦、贫血、血压偏低、缺乏运动的人更明显。办法：动起来——走路、甩手、搓手，让血液循环起来；多穿一层袜子、喝温水；少喝太浓的茶和咖啡。如果手脚一年到头都冰凉、还麻木发紫，要去查查甲状腺和血液循环。",s:"维基百科·体温",u:"https://zh.wikipedia.org/wiki/体温"},
      {q:"冬天嘴唇为什么容易干裂起皮？",a:"嘴唇和别处皮肤不一样，它没有皮脂腺，锁不住水。冬天空气干、风又大，嘴唇表面水分快速蒸发，就起皮、开裂。再加上越干越舔，唾液蒸发时带走更多水分，越舔越裂。办法：多喝水、戴口罩挡风、随时涂无刺激的润唇膏；已经开裂别撕皮，用热毛巾敷软后轻轻擦掉。嘴唇长期干裂、口角炎，还要看看是不是缺B族维生素养成涂润唇膏的小习惯，冬天嘴唇也能软软嫩嫩。。",s:"维基百科·唇",u:"https://zh.wikipedia.org/wiki/唇"},
      {q:"为什么有的人笑起来有酒窝？",a:"酒窝其实是面部肌肉的一个「小坑」。我们笑的时候，颧大肌等肌肉牵拉嘴角；有些人这些肌肉天生有一点粘连或缩短，牵拉时皮肤就被向内凹出一个小窝，就是酒窝。它主要是遗传的，不是练出来的。传统上酒窝被认为可爱、有福气，现在甚至有医美手术人工造酒窝。酒窝不是病，只是面部肌肉长法不同有没有酒窝都是爸妈给的记号，笑起来都很好看。。",s:"维基百科·酒窝",u:"https://zh.wikipedia.org/wiki/酒窝"},
      {q:"为什么有的人天生是卷发？",a:"头发直还是卷，由毛囊形状决定。毛囊是圆的，长出来的头发截面圆，就直；毛囊是椭圆或肾形，长出来的头发截面扁，自然就卷。这是基因决定的，白人、黑人卷发比例更高，东亚人多为直发。卷发不是「发质差」，只是截面扁、更容易毛躁。烫头是用化学药剂把角蛋白结构暂时切断重排，让直发变卷；新长出来的头发还是原来的样子。",s:"维基百科·头发",u:"https://zh.wikipedia.org/wiki/头发"},
      {q:"为什么头发发尾会分叉？",a:"头发从根部往外长，发尾是最老的一截。日晒、吹风、染烫、梳头拉扯、洗发水不当，都会让发尾的毛鳞片剥落、角蛋白开裂，最后分成两三叉。一旦分叉，是没法自己长好的，只能剪掉。预防办法：少染烫、洗头用护发素、少用高温吹风机、梳头别硬扯。看到发尾分叉就去修一下，它不会自己「愈合」定期去理发店修一下发尾，头发看起来会更有光泽。。",s:"维基百科·头发",u:"https://zh.wikipedia.org/wiki/头发"},
      {q:"为什么有的人头发油得特别快？",a:"头皮和脸一样有皮脂腺，出油多少由激素、遗传、饮食决定。雄激素高、熬夜、吃油腻甜食多，皮脂腺就特别活跃，一天不洗头就油成条。油性头皮如果用强力去油洗发水，反而把头皮洗得更干，皮脂腺代偿性出更多油。建议：选温和洗发水、水温别太烫、少吃甜油炸。如果同时头痒、有厚头屑，可能是脂溢性皮炎，要看看医生选温和洗发水、少熬夜，头发会慢慢变回清爽。。",s:"维基百科·皮脂腺",u:"https://zh.wikipedia.org/wiki/皮脂腺"},
      {q:"为什么会有头皮屑？",a:"头皮和身体皮肤一样，表皮细胞不断新陈代谢，老的角质脱落。正常脱落你看不见；当头皮油脂多、马拉色菌活跃、加上干燥或过敏，角质成片脱落，就成了可见的头皮屑。换洗发水、压力大、换季都可能加重。办法：选含酮康唑或二硫化硒的去屑洗发水，每周用两三次；别用指甲猛抓。如果头皮红、流水、结痂，要看皮肤科坚持用去屑洗发水几周，头屑就会明显少下去。。",s:"维基百科·头皮屑",u:"https://zh.wikipedia.org/wiki/头皮屑"},
      {q:"为什么春天会花粉过敏？",a:"花粉里的蛋白对免疫系统来说是「外来敌人」。过敏体质的人第一次接触时，身体把它记成危险信号；下次再吸到花粉，肥大细胞立刻释放组胺，鼻子痒、打喷嚏、流鼻涕、眼睛红痒，甚至哮喘。不是花粉有毒，而是免疫系统反应过度。春天戴口罩、关窗、回家洗脸洗鼻、过敏季前提前用药，能明显减轻。严重的可以查过敏原、做脱敏治疗。",s:"中国疾控中心环境所",u:"https://www.niehs.cn/jkfh/kpzs/202503/t20250312_304883.html"},
      {q:"感冒时鼻子为什么会堵？",a:"感冒病毒钻进鼻黏膜，免疫系统拉响警报，鼻黏膜血管扩张、组织水肿，鼻腔通道一下子变窄；同时鼻涕大量分泌，把通道堵得更死。所以你觉得鼻子不通气、只能张嘴呼吸。躺下时充血更明显，所以夜间鼻塞更重。办法：生理盐水洗鼻、抬头枕高点、热水熏一下，都能暂时通一通。鼻塞一般三五天随感冒好起来，超过两周就要考虑鼻炎或鼻窦炎。",s:"维基百科·普通感冒",u:"https://zh.wikipedia.org/wiki/普通感冒"},
      {q:"发烧的时候为什么反而觉得冷？",a:"发烧时大脑把体温「设定点」调高了。正常体温三十七度，设定点被病毒、细菌毒素拉到三十八、三十九度，身体觉得现在温度太低，于是打哆嗦、缩手缩脚，让你多穿被子——这就是「畏寒」。等体温升上去、和新设定点对齐，你就不再冷，反而觉得热、开始出汗退烧。所以发烧时盖大厚被子捂汗不是万能，尤其小孩容易捂过头，正确做法是监测体温、多喝水、高烧看医生。",s:"维基百科·发热",u:"https://zh.wikipedia.org/wiki/发热"},
      {q:"饿了肚子为什么会咕咕叫？",a:"肚子叫是胃和小肠在「打扫」。胃排空后，还会继续周期性地蠕动，把里面残余的空气、液体和没消化干净的残渣往肠子里推。气体和液体被挤来挤去，就发出咕噜咕噜的声音。这种收缩叫「移行性复合运动」，像在清空仓库。所以肚子叫不是饿的标志，是肠胃在例行打扫。旁边人听到别笑，那是你肠胃很敬业肚子叫不用害羞，那是肠胃在认真干活。。",s:"维基百科·胃",u:"https://zh.wikipedia.org/wiki/胃"},
      {q:"为什么有的人一喝酒就脸红？",a:"喝酒上脸是因为乙醛代谢慢。酒精先被肝脏变成乙醛，再变成乙酸排出。东亚人很多人携带一种基因变异，让第二种酶活性不足，乙醛堆在体内，让毛细血管扩张，脸红、心跳快、恶心。这叫「酒精代谢缺陷」，不是「酒量好」，反而是身体在报警。这类人长期饮酒，食管癌风险明显升高。别练酒量，脸红就是基因在劝你少喝喝酒上脸的人，最聪明的做法就是少喝或不喝。。",s:"国家自然科学基金委",u:"https://www.nsfc.gov.cn/csc_phone/kqkd29/kjyq1/27228/index.html"},
      {q:"喝酒为什么会喝醉？",a:"酒精是小分子，喝下去很快被小肠吸收入血，几分钟就进大脑。它抑制大脑前额叶——负责判断、自控的区域，于是人变话多、胆子大、反应慢；继续喝，小脑被影响，走路晃；再严重就昏迷、呼吸抑制。肝脏每小时只能处理约十克酒精，喝快了必然醉。酒醒后头痛、恶心，是脱水和乙醛残留的账。喝酒别劝、别拼，喝多了伤肝又伤脑喝酒不开车、不劝酒，既是对自己也是对别人负责。。",s:"维基百科·乙醇",u:"https://zh.wikipedia.org/wiki/乙醇"},
      {q:"为什么喝咖啡能提神？",a:"困意来自大脑里一种叫腺苷的物质，它和受体结合后就告诉大脑「该睡了」。咖啡因结构和腺苷很像，能抢先占住受体，让腺苷「敲不进门」，于是大脑收不到困信号，人就精神。但腺苷还在慢慢堆积，等咖啡因代谢掉，困意一起反扑，就是所谓「咖啡后劲」。所以下午三点后别喝，否则晚上失眠。一杯咖啡大概提神三到四小时咖啡虽好，也别当水喝，下午三点后最好忌口。。",s:"维基百科·咖啡因",u:"https://zh.wikipedia.org/wiki/咖啡因"},
      {q:"为什么晚上喝浓茶会睡不着？",a:"茶叶里也有咖啡因和茶碱，一杯浓茶的咖啡因不比一杯咖啡少。它和咖啡一样，挡住大脑的困意信号，让神经兴奋。茶里还有茶氨酸，虽然让人放松，但赶不走咖啡因的提神效果。傍晚喝浓茶，等于给大脑加了晚班。容易失眠的人下午两点后就别碰茶和咖啡了。喝温牛奶、温水，反而更助眠晚上想睡好，把浓茶换成温牛奶更靠谱。。睡前一小时放下茶杯、改喝温牛奶，睡眠质量会好很多。",s:"维基百科·茶",u:"https://zh.wikipedia.org/wiki/茶"},
      {q:"饿的时候为什么会手抖、心慌？",a:"这是低血糖在报警。血糖是大脑和肌肉的主要燃料，长时间不吃饭，血糖下降，身体赶紧分泌肾上腺素和胰高血糖素：心跳加快、手抖、出冷汗、发慌，催你赶紧吃东西。这种反应在糖尿病患者身上更明显。办法很简单：随身带点饼干、糖块，按时吃饭。如果明明刚吃过还这样，要去查查血糖和甲状腺规律三餐、随身带点零食，就不容易出现这种情况。。",s:"维基百科·低血糖",u:"https://zh.wikipedia.org/wiki/低血糖"},
      {q:"为什么盐吃多了血压会高？",a:"盐里的钠会把水分「锁」在血管里，血容量一多，血管壁承受的压力就大，血压升高。长期高盐饮食，血管壁还会慢慢变硬，血压更难降。世界卫生组织建议每人每天盐不超过五克，可国人平均往往超标一倍。口味重是练出来的，慢慢减盐，一两个月后舌头就适应了。血压高的人尤其要少腌菜、酱肉、外卖慢慢减盐，一两个月后舌头反而觉得淡而有味。。",s:"维基百科·高血压",u:"https://zh.wikipedia.org/wiki/高血压"},
      {q:"为什么不能长期憋尿？",a:"膀胱像一个弹性口袋，装到三百到五百毫升就该去排。长期硬憋，膀胱肌肉过度拉伸，弹性变差；尿液长时间留在里面，细菌容易繁殖，引起尿路感染；严重时还会反流到肾脏，伤肾。尿急时别总说「等一下」，尤其是开会、开车憋尿的人。平时多喝水、有尿意就去，是对膀胱和肾最基本的爱护有尿意就去，别把「忍」当本事。。长期憋尿还可能诱发尿路感染和膀胱问题，千万别大意。",s:"维基百科·膀胱",u:"https://zh.wikipedia.org/wiki/膀胱"},
      {q:"为什么会便秘？",a:"便秘主要和饮食、运动、排便习惯有关。吃得太精细、蔬菜水喝少、膳食纤维不够，大便就干硬；久坐不动、肠道蠕动慢；有便意总忍着，直肠对刺激越来越迟钝。办法：每天吃够一斤蔬菜、半斤水果、喝一千五到两千毫升水、早晚散步、定时上厕所。超过三周便血、体重下降，要去查肠镜，别只靠泻药吃得粗一点、动得多一点，肠道自然会轻松。。",s:"维基百科·便秘",u:"https://zh.wikipedia.org/wiki/便秘"},
      {q:"人为什么会近视？",a:"近视是眼睛把像成在了视网膜前面。长时间看近处，睫状肌一直收缩，久而久之眼球被慢慢拉长，看远处时光线落不到视网膜上，就糊了。遗传和环境都有份：父母高度近视，孩子风险高；但天天看手机、户外活动少，是近视率暴涨的主要原因。预防最有效的办法不是吃保健品，而是每天两小时户外活动——阳光能促进多巴胺分泌，抑制眼轴拉长。",s:"维基百科·近视",u:"https://zh.wikipedia.org/wiki/近视"},
      {q:"为什么看手机会让近视加深？",a:"看手机时眼睛离屏幕很近，睫状肌持续收缩，晶状体一直鼓着。长时间近距离用眼，眼球壁被慢慢拉长，眼轴变长，近视就加深。加上屏幕蓝光、眨眼少、屏幕反光，眼睛更累。小孩眼球还在发育，最容易被「看坏」。办法：一尺距离、二十分钟看远处二十秒、每天户外两小时。手机本身不是洪水猛兽，「长时间近距离」才是给眼睛留出看远的时间，比换再好的屏幕都管用。。",s:"维基百科·近视",u:"https://zh.wikipedia.org/wiki/近视"},
      {q:"为什么熬夜后会有黑眼圈？",a:"黑眼圈分两种。一种是血管型：熬夜、疲劳让眼周血液循环变慢，青紫的血管透出来，看起来青黑；另一种是色素型：长期揉眼、日晒、过敏让眼周色素沉积，变成茶色。熬夜还会让眼周水肿，阴影加深。办法：睡够七到八小时、冷敷、防晒、少揉眼。如果黑眼圈很久不退、还伴月经不调，要看看内分泌睡够觉、做好防晒，黑眼圈会慢慢变淡。。",s:"维基百科·黑眼圈",u:"https://zh.wikipedia.org/wiki/黑眼圈"},
      {q:"为什么眼睛下面会有眼袋？",a:"下眼皮那圈松垮的鼓包，叫眼袋。年轻时皮肤紧、眶隔脂肪被兜住；随着年龄增长，皮肤和肌肉松弛，眼眶里的脂肪向外突出，就形成眼袋。熬夜、水肿、睡前喝水多会让它更明显。真性眼袋靠眼霜很难消，严重时要做医美手术去除。年轻妹子如果只是早晨临时肿，那是水肿，冷敷、垫高枕头就能消好好睡觉、少熬夜，是最省钱的护眼方法。。",s:"维基百科·眼袋",u:"https://zh.wikipedia.org/wiki/眼袋"},
      {q:"人为什么会变老？",a:"衰老不是单一原因，而是细胞和身体长年累月的「磨损累积」。DNA每次复制都有小错误，越攒越多；线粒体产能下降；免疫细胞分不清敌我；胶原蛋白流失，皮肤长皱；器官功能慢慢下滑。基因决定寿命上限，生活方式决定你离上限多远：不抽烟、少喝酒、多运动、睡够觉、心情好，老得慢一些。没有长生不老药，但可以让老的过程舒服一点。",s:"维基百科·衰老",u:"https://zh.wikipedia.org/wiki/衰老"},
      {q:"为什么老年人脸上会长老年斑？",a:"老年斑是皮肤长年累月晒出来的色素沉淀。紫外线让皮肤基底层的黑色素细胞活跃、局部堆积，形成褐色、扁平的小斑点。它不是「老年病」，而是晒出来的——年轻人从小不防晒，三十多岁也可能长。预防最有效的办法就是防晒：出门戴帽、涂防晒霜。已经长出来的老年斑对健康无害，但如果突然变大、破、出血，要去皮肤科排除其他问题。",s:"维基百科·老人斑",u:"https://zh.wikipedia.org/wiki/老人斑"},
      {q:"为什么人老了耳朵会背？",a:"听力像眼睛一样会「老化」。内耳里的毛细胞负责把声波转成神经信号，它们一辈子不停地振动，年复一年慢慢损耗，尤其是高频声音最先听不见。加上长时间戴耳机、噪音环境、心血管病，会加速听力下降。老了听不清别人说话，不是故意不理人，是真的高频声没收到。办法：别长时间大音量戴耳机、在噪音环境戴耳塞，发现听不清早就医。",s:"维基百科·老年性耳聋",u:"https://zh.wikipedia.org/wiki/老年性耳聋"},
      {q:"为什么跑步后心跳会那么快？",a:"运动时肌肉需要大量氧气和能量，心脏只能跳得更快、更用力，把富含氧气的血泵过去。安静时心跳每分钟六十到八十次，跑步时可以冲到一百五以上，这是正常的。运动结束后，心跳会慢慢降下来，心肺越好的人，恢复越快。长期坚持跑步，心脏肌肉变强，安静心率反而会变低——这是心脏更高效的标志坚持跑步一段时间，安静心率会慢慢降下来。。",s:"维基百科·心率",u:"https://zh.wikipedia.org/wiki/心率"},
      {q:"人为什么要出汗？",a:"出汗是身体自带的空调。体温一升高，下丘脑下令汗腺分泌汗液，汗液在皮肤表面蒸发时带走热量，把体温降下来。天热、运动、紧张都会出汗。一天不怎么动也能出半升汗，剧烈运动能出好几升。汗出多了要及时补水补盐，否则会抽筋、中暑。不出汗的人夏天更危险，因为身体没法降温出汗多时记得补水补盐，别等渴了才喝。。出汗后及时擦干换衣，避免吹风着凉，身体才舒服。",s:"维基百科·汗",u:"https://zh.wikipedia.org/wiki/汗"},
      {q:"为什么哭多了眼睛会肿？",a:"大哭时泪腺大量分泌，一部分眼泪从眼角流出来，一部分渗进眼周疏松的皮肤组织里，造成水肿。加上揉眼睛、血管扩张，第二天早上眼皮就肿成一条缝。这种水肿一般几个小时自己消。办法：冷敷、抬高枕头睡觉、别揉。如果平时不也肿，就要查查肾和甲状腺哭过好好睡一觉，第二天肿就消了。。哭完别揉眼睛，用冷毛巾敷几分钟，第二天就不会太肿。",s:"维基百科·泪",u:"https://zh.wikipedia.org/wiki/泪"},
      {q:"为什么打哈欠会眼泪直流？",a:"打哈欠时张大嘴、面部肌肉收缩，会挤压泪腺和泪囊。同时深长的呼吸让胸腔压力升高，影响眼泪的回流，眼泪来不及从鼻泪管走，就从眼角溢出来。所以打哈欠时常常眼泪汪汪，不是难过，是被「挤」出来的。打完一个大哈欠揉一揉眼睛，那滴泪就是这么来的打个大哈欠流点泪，其实也是眼睛在放松。。这是身体自己的小反射，不用紧张，擦一擦就好。",s:"维基百科·哈欠",u:"https://zh.wikipedia.org/wiki/哈欠"},
      {q:"为什么看到别人吃东西自己也会流口水？",a:"这是经典的条件反射。巴甫洛夫当年给狗做实验：摇铃后喂食，久了狗听到铃就流口水。人也一样：从小吃饭、看别人吃，把「食物」和「分泌唾液」连在了一起。看到美食、想到酸梅，甚至听到别人说好吃，唾液腺就自动开工。这是身体在提前准备消化液，不是嘴馋。所以美食视频让人咽口水，是大脑在替你「预演吃饭」所以看美食节目咽口水，是身体在诚实地准备开饭。。",s:"维基百科·唾液",u:"https://zh.wikipedia.org/wiki/唾液"}
    ],
    "食物":[
      {q:"为什么煮饺子要「点三次水」？",a:"为了皮和馅一起熟。饺子皮薄馅厚，如果一直用大火猛煮，水剧烈沸腾，皮很快熟了，可里面的肉馅还没熟透，皮还可能被沸水冲破。点凉水，是让锅里的水温瞬间降下来，沸腾暂停，热气慢慢往馅里渗透，等水再开，再点一次，这样皮和馅的进度就拉平了。反复三次，饺子皮筋道、馅鲜嫩，还不容易破。这是老一辈传下来的经验：水开点水、水开再点，三开三点，饺子准好。同样道理也适用于煮汤圆。所以那三碗凉水，不是给锅降温，是给馅争取时间。",s:"维基百科·饺子",u:"https://zh.wikipedia.org/wiki/饺子"},
      {q:"为什么切开的苹果会变黄褐色？",a:"这是苹果在「氧化」。苹果果肉里含有一种叫多酚氧化酶的物质，平时被细胞膜关着，碰不到氧气。一旦苹果被切开，细胞破裂，多酚氧化酶跑出来，和空气中的氧气相遇，把果肉里的多酚类物质氧化成褐色物质——这个过程就叫「酶促褐变」。想让苹果不变色，办法都围绕「阻隔氧气」或「破坏酶」：泡在淡盐水里，盐能抑制酶的活性；挤点柠檬汁，柠檬酸也能给酶捣乱；或者把切好的苹果泡进凉白开里，隔绝空气。所以苹果变黄不是坏了，只是它受不了「见光就脸红」。",s:"科普中国",u:"https://cloud.kepuchina.cn/newSearch/imgText?id=7502127838833889280"},
      {q:"为什么酒越陈越香？",a:"因为酒在坛子里「悄悄修炼」。新酿的酒里含有醇、醛、酸等多种物质，味道冲、有辛辣感。存放过程中，醇类和酸类慢慢发生酯化反应，生成带有香味的酯类物质，比如乙酸乙酯有果香、丁酸乙酯有菠萝香；同时一些刺激性的醛类会挥发或转化，酒体变得柔和醇厚。这个过程非常缓慢，要几个月到几年才明显，所以叫「陈酿」。但不是所有酒都适合久放：高度白酒、黄酒和部分葡萄酒能越陈越好，而啤酒、果酒这类保质期短的，放久了只会变质。酒陈香的前提是「会存」——密封、避光、阴凉，缺一不可。",s:"维基百科·白酒",u:"https://zh.wikipedia.org/wiki/白酒"},
      {q:"为什么柠檬那么酸，却被说是「碱性食物」？",a:"因为食物的酸碱性不看入口味道，而看它消化代谢后的产物。柠檬里富含柠檬酸和钾、钙、镁等矿物质，尝起来很酸；但进入人体代谢后，柠檬酸被分解成二氧化碳和水排出体外，剩下的钾、钙、镁等离子呈碱性，反而让体液环境偏向碱性。所以营养学上说的「碱性食物」，指的是代谢后呈碱性的食物，跟口感完全两回事——醋、山楂、青梅也都是酸味碱性食物。这个「碱」指的是体内代谢环境，不是柠檬本身的酸碱度。所以别因为柠檬酸，就觉得它是酸性食物，身体的账，算的是代谢后的结果。",s:"科普中国",u:"https://www.kepuchina.cn/wiki/science/201903/t20190325_1029889.shtml"},
      {q:"为什么盐放久了会结块？",a:"因为盐「爱喝水」。食盐主要成分是氯化钠，本身不太吸水，但食盐里常含有少量氯化镁、氯化钙等杂质，这些成分吸湿性特别强，会从空气里把水汽吸过来。盐粒表面一旦沾上水分，就会慢慢溶解、再结晶，颗粒之间互相粘连，结成硬块。空气越潮湿，结块越快，所以南方梅雨季的盐罐子最容易「板结」。防止的办法很简单：把盐罐盖严、放在干燥处；或者在罐底放几粒生米、一小块干海带，它们先帮盐把湿气吸走。已经结块的盐不用扔，敲碎照样能用，只是下次记得给它找个干爽的家。",s:"维基百科·食盐",u:"https://zh.wikipedia.org/wiki/食盐"},
      {q:"为什么爆米花会「砰」地爆开？",a:"因为玉米粒里藏着「小锅炉」。爆米花用的玉米品种，果皮特别硬，内部胚乳含水量高。加热时，粒内的水分变成高温高压的水蒸气，被坚硬的果皮死死锁住，粒内压力越攒越高，一旦超过果皮的承受极限，「砰」一声炸开，淀粉瞬间膨胀定型，就成了蓬松的爆米花。所以爆米花是「压力锅」原理的零食版。放久了受潮的玉米粒爆不开，因为水分流失、压力不足；刚买的新鲜爆米花玉米粒，颗颗都是蓄势待发的「小炸弹」。",s:"维基百科·爆米花",u:"https://zh.wikipedia.org/wiki/爆米花"},
      {q:"为什么冰淇淋会冒白烟？",a:"那不是冰淇淋在「冒冷气」，而是空气里的水蒸气被它「冻」出来了。冰淇淋温度远低于室温，周围的空气碰到冰凉的表面，温度骤降，空气中的水蒸气容纳不了那么多水分，立刻凝结成无数细小的水滴——和冬天哈气成雾、夏天冰可乐瓶外壁冒水珠是同一个道理，都叫「液化」。白烟其实是极小的小水珠组成的雾。冰淇淋越冰、空气越潮湿，白烟越明显。所以别担心冰淇淋「发烧」冒烟，它只是把空气中的水汽现了原形，看着仙气飘飘，其实是物理课现场。",s:"维基百科·液化",u:"https://zh.wikipedia.org/wiki/液化"},
      {q:"为什么隔夜的米饭会变硬？",a:"这是淀粉在「回生」。米饭里的淀粉煮的时候吸水膨胀、糊化，变得软糯；放凉的过程中，淀粉分子慢慢重新排列、抱成团，把水分挤出来，这个过程叫「老化」或「回生」。于是隔夜饭变硬、变干，口感差很多。想让米饭回软，关键在加热时补回水分：炒饭前把饭用微波炉加热一分钟、或者加点水焖一下，淀粉重新吸水，就又软了。其实新鲜热饭放久了也会慢慢回生，只是时间问题。所以剩饭别怕，给它补点水，它还能再香一回。",s:"维基百科·淀粉回生",u:"https://zh.wikipedia.org/wiki/淀粉"},
      {q:"为什么面包那么松软多孔？",a:"因为面团里藏了一堆小气球。做面包时要加酵母，酵母「吃」面团里的糖，呼出二氧化碳气泡；这些气泡被面筋像网一样兜住，跑不出去，面团就越胀越大。进烤箱后，热气让气泡猛地膨胀，面筋遇热定型，把一个个小气孔永久「焊」在里面。烤好一掰开，全是蜂窝似的小洞，那就是当年气泡住过的房间。所以面包软不软，全看面筋的网牢不牢、酵母的气足不足，发面那一步偷不得懒。",s:"维基百科·面包",u:"https://zh.wikipedia.org/wiki/面包"},
      {q:"为什么可乐打开会冒气泡？",a:"因为可乐里被强行压进了很多二氧化碳。工厂在高压下把二氧化碳溶解进糖水，再密封瓶盖，气体就乖乖待在水里。一开盖，压力骤降，气体在水里待不住了，争先恐后跑出来，就变成咕噜咕噜的气泡。如果轻轻开，气泡慢慢冒；摇过再开，瓶内压力变大、气泡又到处成核，就会嘭地喷你一手。所以可乐开瓶前别摇，那不是饮料生气，是二氧化碳在找出口。",s:"维基百科·碳酸饮料",u:"https://zh.wikipedia.org/wiki/碳酸饮料"},
      {q:"为什么酸奶一定要放冰箱？",a:"因为酸奶里的活菌还在加班。酸奶是靠乳酸菌发酵牛奶做出来的，那些活菌进了冰箱，低温让它们慢下来，酸奶才稳定在酸酸稠稠的状态；一旦放在室温，细菌又开始猛干活，继续发酵，酸奶会越来越酸、甚至出水变质。而且低温能抑制杂菌生长，防止酸奶变坏。所以买回家的酸奶别图省事放桌上，赶紧进冰箱，那是给乳酸菌降温下班，也是给酸奶保鲜续命。",s:"维基百科·酸奶",u:"https://zh.wikipedia.org/wiki/酸奶"},
      {q:"为什么米饭越嚼越甜？",a:"因为嘴里有个化学开关。米饭的主要成分是淀粉，淀粉本身没甜味，嚼第一口时你尝不到甜。但唾液里有一种叫唾液淀粉酶的东西，它像剪刀一样，把长长的淀粉分子一点点剪成短短的麦芽糖；嚼得越久，剪出来的麦芽糖越多，甜味就慢慢冒出来。这也是为什么细嚼慢咽不仅养胃，还能让饭更香。所以饭不是一开始就甜，是你的舌头和唾液一起，把淀粉熬成了糖。",s:"维基百科·唾液",u:"https://zh.wikipedia.org/wiki/唾液"},
      {q:"为什么臭豆腐闻着臭吃着香？",a:"因为它被细菌腌过了。臭豆腐是豆腐在卤水里发酵而成，发酵时微生物把豆腐里的蛋白质分解，产生硫化氢、吲哚这类有刺激性气味的气体，闻起来就是臭的。可一旦下锅油炸，臭味物质大部分被高温挥发掉，同时蛋白质分解出的氨基酸、核苷酸全是鲜味物质，吃起来反而鲜香。加上外酥里嫩的口感，就成了闻着躲、吃着香的矛盾小吃。所以那股臭，是细菌在豆腐上做的鲜味前戏。",s:"维基百科·臭豆腐",u:"https://zh.wikipedia.org/wiki/臭豆腐"},
      {q:"为什么皮蛋上有松枝一样的花纹？",a:"那是蛋白里长出来的盐花。皮蛋用生石灰、草木灰等碱性材料包裹鸭蛋腌制，碱慢慢渗透进蛋里，让蛋白凝固成凝胶状。在这个过程中，蛋白里的蛋白质分解产生氨基酸，氨基酸和镁离子结合，在凝胶里长出像松针、雪花一样的结晶花纹，这就是松花。花纹越清晰，往往说明腌制工艺到位、品质越好。所以皮蛋又叫松花蛋，那一朵朵小松花，其实是蛋白质在碱里开出的盐晶花。",s:"维基百科·皮蛋",u:"https://zh.wikipedia.org/wiki/皮蛋"},
      {q:"为什么蜂蜜放好几年都不坏？",a:"因为蜂蜜是天然的防腐大师。它有两把刷子：一是糖度极高、水分极少，细菌一旦进去，反而会被高浓度的糖抽干水分，活不下去；二是蜂蜜偏酸，还含有少量过氧化氢这种天然抑菌物质。所以密封好的蜂蜜放几年都不会变质，古埃及墓里挖出的蜂蜜居然还能吃。唯一要防的是吸水：蜂蜜吸湿性强，盖子没拧紧，从空气里吸了水，糖度被稀释，就可能发酵变酸。",s:"维基百科·蜂蜜",u:"https://zh.wikipedia.org/wiki/蜂蜜"},
      {q:"为什么吃辣会辣得出汗、流鼻涕？",a:"因为辣椒素骗了你的神经。辣椒里的辣椒素会专门激活舌头和皮肤上那些感知高温的感受器，大脑一接到信号，就误以为你在被灼烧，立刻启动降温程序：出汗、流鼻涕、脸通红、心跳加快。可实际上你并没有发烧，这是神经被谎报军情了。越能吃辣的人，其实是反复训练让神经对这种假信号慢慢脱敏。所以辣不是一种味道，而是一种被误导出来的燃烧感。",s:"维基百科·辣椒素",u:"https://zh.wikipedia.org/wiki/辣椒素"},
      {q:"为什么咖啡能让人不犯困？",a:"因为咖啡因冒充了困意信号。人清醒久了，大脑会积累一种叫腺苷的物质，它跟受体结合后就告诉身体该睡了。咖啡因长得跟腺苷很像，能抢先占住受体，让腺苷叫不醒大脑，困意被暂时屏蔽。但咖啡因一代谢掉，积攒的腺苷一拥而上，困意反而更猛，这就是为什么咖啡喝完几小时后会报复性犯困。所以咖啡不是给你充电，是帮你把闹钟按掉一会儿。",s:"维基百科·咖啡因",u:"https://zh.wikipedia.org/wiki/咖啡因"},
      {q:"为什么茶喝起来是苦的？",a:"因为茶叶里藏着苦味双雄。茶的苦涩主要来自茶多酚（尤其是儿茶素）和咖啡因，它们在热水里被泡出来，刺激舌头的苦味受体。好茶之所以不苦得难受，是因为泡茶时间短、水温合适，苦味物质出得少，同时茶叶里的氨基酸、糖类又带来鲜和甜，把苦托住。泡太久、水太烫，苦物质全跑出来，就又涩又苦。所以茶的苦不是缺点，关键在于泡得点到为止，苦后回甘才是好茶。",s:"维基百科·茶",u:"https://zh.wikipedia.org/wiki/茶"},
      {q:"为什么烤红薯比蒸红薯甜？",a:"因为烤的时候糖越聚越多。红薯里的淀粉在高温下会被淀粉酶转化成糖，烤的时间长、温度高，转化出来的糖就多。更妙的是，烤红薯时水分从表皮蒸发，糖被浓缩；而蒸红薯泡在水里，一部分糖溶进了汤里。于是烤的吃着又甜又绵，蒸的相对清淡。街边烤红薯那股焦香，还来自糖分在表皮的焦糖化反应。所以烤红薯甜，是脱水加糖化联手干的好事。",s:"维基百科·甘薯",u:"https://zh.wikipedia.org/wiki/甘薯"},
      {q:"为什么汤圆煮熟会浮起来？",a:"因为汤圆里打了气。生汤圆密度比水大，沉在锅底；加热后，糯米皮吸水变软，里面的馅料融化、水分变成水蒸气，整个汤圆内部充满了小气泡，体积胀大、平均密度变小。当汤圆整体轻于同体积的水时，它就浮上了水面。这跟木块浮水是一个道理，排开的水够重，就能托起来。所以老话说浮起来就是熟了，其实是浮力在报信：里面已经鼓胀熟透了。",s:"维基百科·汤圆",u:"https://zh.wikipedia.org/wiki/汤圆"},
      {q:"为什么豆浆要点卤才能变成豆腐？",a:"因为豆浆里的蛋白质需要抱团。豆浆里的蛋白质像一颗颗带负电的小球，互相排斥，分散在水中不结块。点卤就是加入石膏或盐卤，提供钙离子、镁离子，把这些小球之间的排斥力中和掉，蛋白质立刻手拉手聚在一起，变成软软的豆花；再压掉多余水分，就成了豆腐。卤水点豆腐，一物降一物，降的就是那层负电。所以豆腐不是凝出来的，是盐把蛋白质撮合到了一起。",s:"维基百科·豆腐",u:"https://zh.wikipedia.org/wiki/豆腐"},
      {q:"为什么咸鸭蛋煮熟会流油？",a:"因为盐把蛋黄里的油逼了出来。鲜鸭蛋的蛋黄里本来就有不少脂肪，只是和蛋白质均匀混在一起，看不见油。腌制时盐分慢慢渗透进蛋里，盐会让蛋黄中的蛋白质脱水凝固，把原本包裹着脂肪的那层保护膜破坏掉，脂肪就被挤了出来。腌制时间越久、盐度越高，析出的油越多。煮熟后切开，橙红的油顺着蛋黄往外冒，那就是被盐挤出来的蛋黄油。高邮咸鸭蛋之所以出名，靠的就是这一口流油的沙瓤。",s:"维基百科·咸鸭蛋",u:"https://zh.wikipedia.org/wiki/咸鸭蛋"},
      {q:"为什么巧克力放久了表面有白霜？",a:"那层白霜不是发霉，是巧克力出了油汗。巧克力里含有可可脂这种脂肪，如果存放时温度忽高忽低，可可脂会从巧克力里跑出来，浮到表面再重新结晶，形成一层灰白色的薄霜；糖在受潮后也会同样跑出来形成糖霜。白霜不影响安全，只是口感变粗糙。想避免，把巧克力放在阴凉干燥、温度稳定的地方就行。所以看到巧克力长白毛先别慌，它多半只是热得出油了。",s:"维基百科·巧克力",u:"https://zh.wikipedia.org/wiki/巧克力"},
      {q:"为什么啤酒倒杯里有一层泡沫？",a:"因为啤酒里的二氧化碳在冒泡。啤酒酿造时自然产生二氧化碳，装瓶后被压在酒液里。倒进杯子时压力释放，气体在杯壁的小瑕疵上成核，冒成一串串气泡；同时啤酒里的蛋白质和酒花树脂会在气泡表面形成一层结实的膜，让气泡不容易破，于是堆成一层雪白的泡沫。这层泡沫不仅好看，还能锁住香气、隔绝空气。倒酒时顺着杯壁慢倒，泡沫才不至于溢出来。所以那层泡，是啤酒的小帽子。",s:"维基百科·啤酒",u:"https://zh.wikipedia.org/wiki/啤酒"},
      {q:"为什么甘蔗越靠根部越甜？",a:"因为糖都沉在了底下。甘蔗靠叶子光合作用制造糖分，这些糖分要通过茎秆向下运输、储存；根部是甘蔗离地面最近、也是积累养分最久的部位，糖分常年往下沉、往根里堆。加上甘蔗上部还在生长、要消耗糖，下部早已成熟、只存不用，于是根部最甜、越往上越淡。削甘蔗时把梢头切掉、留下根部，就是这个道理。所以挑甘蔗要挑节间长、根部粗壮的，甜水都藏在那截老根里。",s:"维基百科·甘蔗",u:"https://zh.wikipedia.org/wiki/甘蔗"},
      {q:"为什么切洋葱会辣得流眼泪？",a:"因为洋葱被切时放了毒气弹。洋葱细胞里本来有两类东西：一类是含硫的氨基酸，一类是酶，平时被细胞膜隔开。一切到洋葱，细胞破裂，两者相遇发生反应，生成一种挥发性的含硫气体，它飘进眼睛，刺激角膜上的神经末梢，大脑立刻命令泪腺分泌眼泪来冲洗。想减少辣眼，把洋葱先冷藏一下，低温让酶反应变慢；或者在水里切，气体被水溶解。所以流泪不是你矫情，是洋葱在自卫。",s:"维基百科·洋葱",u:"https://zh.wikipedia.org/wiki/洋葱"},
      {q:"为什么大蒜能杀菌？",a:"因为大蒜里藏着天然抗生素。大蒜本身没有辣味，当你把它拍碎、切开，细胞破裂，里面的蒜氨酸和蒜酶相遇，反应生成大蒜素，这就是大蒜刺鼻气味和杀菌力的来源。大蒜素对多种细菌、真菌都有抑制作用，所以民间历来用大蒜防腐、驱邪。可惜大蒜素怕热、怕久放，煮熟或切碎后放太久都会损失，所以蒜泥要现剁现吃，杀菌效力才最好。",s:"维基百科·大蒜",u:"https://zh.wikipedia.org/wiki/大蒜"},
      {q:"为什么油烧到一定温度会冒烟？",a:"因为油里的小分子先跑了。食用油不是单一物质，里面混着甘油三酯、游离脂肪酸和少量杂质。油被加热时，那些沸点低的小分子（尤其是游离脂肪酸）最先蒸发，遇到冷空气凝结成青烟，这就是油的烟点。一旦冒烟，说明油温已经偏高，不仅油烟呛人、还可能产生有害物质。好油烟点高，适合炒菜；反复加热的旧油烟点越来越低，烟越来越大。所以炒菜别等油冒烟，那是油在喊我太热了。",s:"维基百科·食用油",u:"https://zh.wikipedia.org/wiki/食用油"},
      {q:"为什么高压锅煮饭特别快？",a:"因为高压锅把水的沸点顶高了。普通锅敞着盖，水到一百度就沸腾，再烧也升不上去；高压锅是密封的，蒸汽跑不出去，锅内气压升高，水的沸点随之升到一百一十多度。温度越高，食物熟得越快，米饭、炖肉十几分钟就烂。锅上那个小阀门，就是用来放气调压，防止压力过大。所以高压锅快，不是火更旺，是它偷偷把水温加热到了一百度以上。",s:"维基百科·高压锅",u:"https://zh.wikipedia.org/wiki/高压锅"},
      {q:"为什么泡菜放久了会变酸？",a:"因为乳酸菌在里面酿酒呢。蔬菜泡在盐水里，盐抑制了杂菌，却拦不住乳酸菌，它们是厌氧菌，喜欢在盐水里安家，把蔬菜里的糖分慢慢分解成乳酸。乳酸越积越多，泡菜就越来越酸、越来越脆爽。这个过程叫乳酸发酵，酸奶、酸菜、醋都是同一个套路。所以泡菜的酸不是加了醋，是细菌替我们酿出来的；想让它别太酸，就放冰箱低温减缓发酵。",s:"维基百科·泡菜",u:"https://zh.wikipedia.org/wiki/泡菜"},
      {q:"为什么生柿子吃起来发涩？",a:"因为柿子里藏着涩味子弹。未熟的柿子含有大量可溶性鞣酸，它一碰到嘴里的唾液蛋白，就会让蛋白质凝固、产生强烈的收敛感，舌头像被麻住一样，又涩又干。等柿子成熟，或者经过脱涩处理，鞣酸被转化成不溶性物质，就不涩了。放软了、和苹果梨一起密封催熟、温水浸泡，都是常见的脱涩办法。所以吃柿子要挑软熟的，硬邦邦的生柿子，那是它还没准备好被你吃。",s:"维基百科·柿",u:"https://zh.wikipedia.org/wiki/柿"},
      {q:"为什么油条要两条拧在一起炸？",a:"因为一条油条根本炸不起来。油条面团里加了明矾和碱，下锅遇热会迅速膨胀。如果只炸一条，表面接触热油的那一面马上定型，内部热气被封住，胀不开；两条面叠在一起、中间贴住，接触面不直接碰油，保持柔软，一膨胀就顺着缝分开、鼓成空心。所以油条那条腰永远是软的、两头鼓。这是老一辈用几百年试出来的造型：不粘在一起，就炸不出那股蓬松劲。",s:"维基百科·油条",u:"https://zh.wikipedia.org/wiki/油条"},
      {q:"为什么煮肉汤上面会浮一层灰沫？",a:"那是肉里的血和杂质被煮出来了。肉里残留的血液、蛋白质和杂质遇热凝固，变成灰褐色的浮沫，浮在汤面上。这层沫不怎么好看，还带点腥气，讲究的做法会用勺子把它撇掉，汤才清亮。并不是肉坏了，而是血水和杂质在高温下现了原形。所以炖肉汤先大火煮开、撇去浮沫，再转小火慢炖，这锅汤才会又清又鲜，喝着也不腥，学会撇沫，是炖汤变清的第一道功夫。",s:"维基百科·肉汤",u:"https://zh.wikipedia.org/wiki/肉汤"},
      {q:"为什么骨头汤熬着熬着就变白了？",a:"因为脂肪被打散成了小颗粒。骨头和肉里的脂肪本来是黄黄的一大坨，不溶于水。但大火翻滚熬煮时，汤汁的剧烈搅动把脂肪撕成无数极细的小油滴，均匀悬浮在水里，这叫乳化。细小的油滴会散射光线，汤看起来就变成了奶白色。汤越浓白，说明乳化得越充分、脂肪越多。所以奶白汤其实是脂肪小颗粒汤，想减脂的人喝起来可要留意这一口白。",s:"维基百科·汤",u:"https://zh.wikipedia.org/wiki/汤"},
      {q:"为什么冻豆腐里面全是小孔？",a:"因为豆腐被冰镇过一遍。豆腐放进冷冻室，里面的水分结冰，水结冰体积会膨胀，把豆腐的网状结构撑出一个个空洞；解冻后冰化成水流走，就留下蜂窝一样的小孔。这些小孔像海绵，炖菜时特别容易吸满汤汁，咬一口满嘴鲜。所以冻豆腐不是变质，是冻出来的多孔吸味器。南方人火锅里必点它，图的就是这一身能喝汤的小孔，所以火锅里它吸汤最狠，下次涮锅别忘了点它。",s:"维基百科·豆腐",u:"https://zh.wikipedia.org/wiki/豆腐"},
      {q:"为什么煮绿豆汤会越煮越红？",a:"因为绿豆皮里的物质见了空气就变脸。绿豆皮含多酚类物质，它们一旦接触氧气、又碰到水里的铁离子或偏碱性环境，就会氧化聚合成红色素，汤慢慢变红。用纯净水煮、盖上盖减少接触空气、滴几滴醋调成弱酸，就能保持碧绿。所以想喝绿汤，别用铁锅、别敞着盖久煮；变红的绿豆汤也没毒，只是颜值打折、清热的成分少了些，想要碧绿解暑，记住这几个小窍门就行。",s:"维基百科·绿豆",u:"https://zh.wikipedia.org/wiki/绿豆"},
      {q:"为什么虾和螃蟹煮熟会变红？",a:"因为它们本来就是穿红外套的，只是被盖住了。虾蟹外壳里含有虾青素这种橙红色色素，平时它和蛋白质结合在一起，颜色被锁成青灰蓝绿。加热后蛋白质变性凝固，把虾青素释放出来，它就显出本来的橙红色。所以生青熟红，是蛋白质松绑、色素重见天日的过程。同样道理，三文鱼橙红、蛋黄橘黄，背后都有虾青素的功劳，大自然早就把调色盘写在了它们的壳里。",s:"维基百科·虾",u:"https://zh.wikipedia.org/wiki/虾"},
      {q:"为什么糖炒栗子要放一把沙子？",a:"因为沙子是导热小助手。栗子壳厚，如果直接炒，火一集中，挨着锅的一面糊了，里面还没热。锅里放上粗砂或炒货专用砂，沙子被油和糖炒热后，像无数个小热源，从四面八方同时包住栗子，受热均匀、熟得快，还不容易焦。糖稀裹在栗子和沙子上，炒出来油光锃亮、甜香扑鼻。所以那锅黑沙子不是脏，是栗子的恒温陪炒员，那锅黑沙看似不起眼，却是炒货师傅的传家宝。",s:"维基百科·板栗",u:"https://zh.wikipedia.org/wiki/板栗"},
      {q:"为什么炒青菜要大火快炒？",a:"因为青菜怕焖。绿叶菜水分多、叶绿素娇嫩，火小、炒得久，锅里的热气把菜焖黄，维生素也流失大半。大火快炒，几秒钟就熟，既能锁住翠绿和脆嫩，又减少营养损失。这就是热锅热油、大火快翻的道理。慢火炖青菜，出来又黄又软；大火猛炒一盘，翠绿爽口。所以炒青菜讲究的就是一个快字，火一大、手一抖，菜就出锅了，记住这一个快字，青菜想不翠绿都难。",s:"维基百科·蔬菜",u:"https://zh.wikipedia.org/wiki/蔬菜"},
      {q:"为什么包子蒸好拿出来会塌皮？",a:"因为包子受了惊吓。蒸好立刻掀锅盖，外面的冷空气猛地扑到热包子上，表皮骤然遇冷收缩，内部热气又遇冷凝水，包子就瘪下去、起皱。正确做法是关火后焖三分钟再开盖，让温度慢慢降下来，表皮才不会被激到。同样道理，蒸好的馒头也别急着揭锅。那一口塌陷，不是面没发好，是你开盖开得太急，多焖这三分钟，包子个个圆鼓不塌陷。",s:"维基百科·馒头",u:"https://zh.wikipedia.org/wiki/馒头"},
      {q:"为什么方便面能放几个月不坏？",a:"因为它被脱水油炸了。面饼蒸熟后再用高温油炸，把水分降到很低，细菌没有水就活不下去；加上密封包装隔绝氧气和杂菌，面饼自然能存很久。调料包里的脱水蔬菜、肉酱也是干制或高盐高油，同样靠脱水加高盐防腐。所以方便面不是加了多少防腐剂，而是把水抽干了让微生物无处下手。想吃得健康，少放调料包、多加个鸡蛋和青菜，它方便归方便，营养单一，别顿顿当饭吃。",s:"维基百科·方便面",u:"https://zh.wikipedia.org/wiki/方便面"},
      {q:"为什么薯片又薄又脆？",a:"因为它被切薄烘干了。土豆切成极薄的片，表面的淀粉在油炸中迅速脱水、糊化，形成一层酥脆的壳；水分一少，咬下去咔嚓就碎。片切得越薄，脱水越彻底，口感越脆。厚一点的就成了薯片家族里的厚切。所以薯片的脆，来自薄和干两个字，油把水分带走的同时，也带走了热量负担，所以它好吃但别贪多，薄和脆的代价，是它也是高热量零食。",s:"维基百科·薯片",u:"https://zh.wikipedia.org/wiki/薯片"},
      {q:"为什么摇过的汽水一开会喷出来？",a:"因为你给气泡铺好了路。汽水里溶着二氧化碳，平时安安静静待着。一摇，液体剧烈晃动，瓶壁和里面的杂质成了无数个气泡落脚点，气体立刻大量析出，在瓶内攒了一堆压力。瓶盖一拧开，压力瞬间释放，气泡带着液体一起冲出来。所以摇过的汽水别急着开，放一会儿、等气泡回到液体里，再慢慢开盖就不喷了。那一口喷你脸上的不是脾气，是物理压力。",s:"维基百科·碳酸饮料",u:"https://zh.wikipedia.org/wiki/碳酸饮料"},
      {q:"为什么吃多了味精会口渴？",a:"因为味精里的钠在抽水。味精的主要成分是谷氨酸钠，含有不少钠。钠和盐一样，进入身体后会把水分拉到血管里，肾脏要把多余的钠排出去，就得带走更多水，于是人会觉得口干想喝水。这跟吃咸了口渴是同一个道理。所以浓汤、外卖里放味精多，吃完总想灌水，不全是鲜得想喝，是身体在帮你排钠。做菜少放味精和盐，口就不那么渴了。",s:"维基百科·味精",u:"https://zh.wikipedia.org/wiki/味精"},
      {q:"为什么火锅汤越煮越咸？",a:"因为锅里的水在不断跑掉。火锅一直沸腾，水分大量蒸发，可盐和调料不会跟着蒸发，它们全留在汤里。汤越煮越少，盐的浓度却越来越高，自然就越喝越咸。想缓解，中途加点水或骨汤稀释；别一直加辣汤，那是咸上加咸。所以老火锅越煮越够味，其实是水分被烧干、味道被浓缩的结果，想喝淡点，中途记得加汤，别一直熬着，所以老饕涮火锅到最后，宁可添一勺骨汤，也不愿喝那碗越来越咸的原汤。",s:"维基百科·火锅",u:"https://zh.wikipedia.org/wiki/火锅"},
      {q:"为什么腐乳闻着也臭臭的？",a:"因为它也是发酵派。腐乳是豆腐经过霉菌和细菌发酵制成的，发酵过程中蛋白质被分解，产生带臭味的硫化物和氨基酸。跟臭豆腐不同的是，腐乳的发酵更温和、时间更长，臭得细腻柔和，还长出了氨基酸带来的鲜味。配白粥、抹馒头，一小块就够咸香。所以腐乳的臭，是细菌慢工出细活腌出来的陈香，一小块腐乳下粥，就够香一整顿早饭。",s:"维基百科·腐乳",u:"https://zh.wikipedia.org/wiki/腐乳"},
      {q:"为什么冰糖是大块透明的？",a:"因为它是糖慢慢长大的。冰糖是白砂糖溶解后，让水分在温和条件下慢慢蒸发，蔗糖分子一层层、有秩序地排列结晶，就长成了大块透明的晶体。结晶越慢，颗粒越大、越透亮。相比之下，白砂糖是快速离心出来的小晶体。所以冰糖看着像水晶，吃着清甜不齁，炖雪梨、泡花茶用它，图的就是这股慢工出的温润，炖甜品用冰糖，比白糖更清甜不齁嗓子。",s:"维基百科·冰糖",u:"https://zh.wikipedia.org/wiki/冰糖"},
      {q:"为什么棉花糖能变得那么蓬松？",a:"因为糖被甩成了细丝。棉花糖机中心加热把砂糖熔成糖浆，再通过高速旋转的离心力从细孔里甩出来，糖浆一接触冷空气立刻凝固成无数极细的糖丝。这些糖丝缠绕在小棍上，像蚕丝一样层层叠叠，空气占了大部分体积，于是变得又轻又蓬。看着大得吓人，其实糖没多少。所以棉花糖不是变大的糖，是糖被拉成了空气做的网，好看好吃，但糖分可不比一颗方糖多多少。",s:"维基百科·棉花糖",u:"https://zh.wikipedia.org/wiki/棉花糖"},
      {q:"为什么炒瓜子越炒越香？",a:"因为高温把香味逼了出来。瓜子里含有油脂和挥发性芳香物质，生的时候香味很淡。下锅一炒，热量让油脂融化、芳香物质释放，同时发生美拉德反应，产生新的香味物质，瓜子就越炒越香、越炒越脆。火候要匀，不然一面糊一面生。沙子炒瓜子，就是用沙子帮它受热均匀。所以那口焦香，是热量和瓜子油脂联手做出来的，火候不到不香，火候过了就苦，全凭手感。",s:"维基百科·葵花籽",u:"https://zh.wikipedia.org/wiki/葵花籽"},
      {q:"为什么小磨香油特别香？",a:"因为芝麻被慢火细磨了。芝麻里的芝麻素和芳香油，只有在低温慢焙、石磨细磨的传统工艺下才能最大程度保留。高温机榨虽然出油快，却会让香气挥发掉一部分。小磨香油还用热水代水取油，把油从酱里分离出来，香气更醇厚。所以几滴香油就能整碗飘香，那是芝麻被温柔对待后释放出的精华，几滴提味足矣，多了反而压过菜本身的鲜。",s:"维基百科·芝麻油",u:"https://zh.wikipedia.org/wiki/芝麻油"},
      {q:"为什么绿茶泡出来是绿的？",a:"因为绿茶没经过发酵。茶叶里的叶绿素本来就是绿的，绿茶采下来立刻高温杀青，把氧化酶烫死，叶子没法发酵，叶绿素被完整保留，泡出来自然碧绿。而红茶、乌龙要经过发酵，叶绿素被氧化分解，茶汤就变红变黄。所以绿茶的绿，是杀青杀得早留住的原色。喝绿茶讲究水温别太高，不然把叶绿素烫黄、维生素烫坏，就可惜了，想喝这口鲜绿，水温别太烫是关键。",s:"维基百科·绿茶",u:"https://zh.wikipedia.org/wiki/绿茶"},
      {q:"为什么红茶是全发酵的？",a:"因为它故意让叶子变红。红茶采下来要经过萎凋、揉捻、充分发酵，茶叶里的多酚类物质在酶的作用下氧化，生成茶红素、茶黄素，叶子和茶汤就变成了红褐色。发酵越充分，汤色越红、口感越醇厚不苦涩。所以红茶的红不是染的，是发酵养出来的。它养胃温和，冬天来一杯红茶加奶，就是这么来的，冬天怕冷的人，多半更爱这一杯暖红。",s:"维基百科·红茶",u:"https://zh.wikipedia.org/wiki/红茶"},
      {q:"为什么鱼身上有一股腥味？",a:"因为鱼皮和鱼鳃在分泌腥气。鱼体表和黏液里含有氧化三甲胺，它在细菌作用下分解成有腥味的三甲胺；鱼鳃更是腥味集中地。鱼越不新鲜，细菌越多，腥味越重。去腥的办法都是对着它来：用醋、料酒、姜葱中和三甲胺，刮净黑膜、去掉鱼鳃，新鲜鱼尽快下锅。所以鱼要现杀现吃、洗得干净，再用姜酒一压，那股土腥味才肯让位，处理鱼多花两分钟，端上桌就只剩鲜了。",s:"维基百科·鱼",u:"https://zh.wikipedia.org/wiki/鱼"},
      {q:"为什么冻肉解冻会流出血水？",a:"因为冰把肉的细胞扎破了。肉里的水分冻成冰，冰晶会刺破肌肉细胞；解冻时，这些被破坏的细胞里的汁液连同血水一起流出来，就是那摊红红的水。解冻越快、细胞破损越厉害，汁水流失越多，肉就越柴。正确做法是提前放冷藏室慢慢解冻，让汁水慢慢被肉吸回去；别用热水泡，外热内冰还会加速细菌滋生，提前一晚放冷藏解冻，肉才不柴不腥。",s:"维基百科·肉类",u:"https://zh.wikipedia.org/wiki/肉类"},
      {q:"为什么草莓洗过更容易坏？",a:"因为草莓没穿外套。草莓表皮极薄、几乎没有保护层，上面还有细小的籽和凹陷，水一进去就很难出来。洗过的草莓带着一层水，室温下细菌和霉菌特别喜欢这种湿润环境，很快就软烂长霉。所以草莓最好吃前再洗，洗完立刻吃；买回家先别洗，盖好放冰箱，等吃的时候再冲。那一层娇气，正是它鲜甜的代价，娇气的果子，真得吃多少洗多少。",s:"维基百科·草莓",u:"https://zh.wikipedia.org/wiki/草莓"},
      {q:"为什么老姜比嫩姜更辣？",a:"因为老姜里的姜辣素攒得多。姜的辣味来自姜辣素这种物质，姜长得越老，生长周期越长，姜辣素积累得越多，辣味越冲、纤维也越粗。嫩姜水分大、纤维嫩，辣得温和，适合腌着吃；老姜辛辣浓烈，用来去腥、炖肉、煮姜汤。所以受凉煮姜汤要挑老的，那股辣才够劲；想脆嫩下饭，就选嫩姜芽，选姜做菜，先想清楚是要去腥还是要脆嫩。",s:"维基百科·姜",u:"https://zh.wikipedia.org/wiki/姜"},
      {q:"为什么做菜最后放盐更鲜？",a:"因为盐放早了会逼走水。盐有渗透压，早早撒在菜上，会把蔬菜里的水杀出来，菜出水变软、维生素流失，还会越炒越多水。最后放盐，盐一接触菜就出锅，咸味只停在表面，菜还保持脆嫩，盐的用量也少。炖肉则相反，早期少盐、后期再调，让肉先酥烂。所以小炒要后放盐，脆嫩不咸；这是火候和盐的时间配合，少放一点盐，菜的本味反而更突出。",s:"维基百科·食盐",u:"https://zh.wikipedia.org/wiki/食盐"},
      {q:"为什么粽子要煮好几个小时？",a:"因为粽叶把糯米包得严严实实。粽子用生糯米包在箬叶里，叶子隔水又隔气，热气要一层层透进去才能把米焖熟；粽子包得越紧、个头越大，熟透所需的时间越长。煮两三个小时，糯米才从里到外软糯黏牙，竹叶的清香也渗进米里。所以粽子是慢火养出来的，急不得。用电饭煲高压锅能省不少时间，但那股粽叶香，还是慢煮出来的更足，心急吃不了热粽子，也吃不到那口糯。",s:"维基百科·粽子",u:"https://zh.wikipedia.org/wiki/粽子"},
      {q:"为什么流心月饼的蛋黄会流油？",a:"因为咸蛋黄被油养透了。流心月饼的咸鸭蛋黄经过腌制出油，再拌上糖浆、奶油做成馅，加热后蛋黄里的脂肪融化、变成半流动状态。切开时金黄的馅缓缓流出，就是融化的蛋黄油。这种月饼要趁温热吃，凉了油脂凝固，流心就变实心了。所以那一口爆浆，是咸蛋黄和奶油在嘴里融化的瞬间，买回家记得微波炉叮几秒，流心才重现，趁热切开那一刻金黄缓缓流出，正是它最诱人的高光时刻。",s:"维基百科·月饼",u:"https://zh.wikipedia.org/wiki/月饼"},
      {q:"为什么煮玉米最好带着两层皮？",a:"因为玉米皮是天然蒸笼布。留两层内皮一起煮，能锁住玉米的水分和清甜，不让香味跑到水里；煮出来的玉米又嫩又多汁，颜色也鲜亮。剥得光光的煮，糖分和香气溶进水里，吃着就差口气。煮的时候加一点点盐，还能让甜味更突出。所以下次煮玉米，别把皮剥太干净，给它留件小绿袄，带皮煮出来的玉米，咬一口都是甜水，这样煮出来的玉米粒粒饱满、咬开还带汁，比光溜溜煮的香得多。",s:"维基百科·玉米",u:"https://zh.wikipedia.org/wiki/玉米"},
      {q:"为什么酵母能把面团发起来？",a:"因为酵母是会呼吸的小气泡厂。酵母碰到糖分和温水就活跃起来，一边吃面团里的糖，一边呼出二氧化碳。面筋像弹性网，把这些气泡兜住，面团就一点点膨胀变大。温度太低酵母偷懒，太烫又会被烫死，三十度上下最活跃。发好的面团按下去回弹、里面全是蜂窝孔，蒸出来就是松软的馒头面包。所以发面不是等它变大，是在等酵母加班产气。",s:"维基百科·酵母",u:"https://zh.wikipedia.org/wiki/酵母"},
      {q:"为什么酱油尝起来是鲜的？",a:"因为酱油是酿出来的鲜味库。黄豆经过长时间发酵，蛋白质被微生物分解成大量氨基酸，其中谷氨酸就是味精的主要成分，再加上核苷酸、盐和糖，鲜得有层次。生抽提鲜、老抽上色，靠的都是这长时间发酵。酱油越陈、氨基酸越多，鲜味越厚。所以一勺酱油能顶半把味精，那是黄豆在缸里酿了半年的精华，好酱油咸中带鲜，不用放味精也够味。",s:"维基百科·酱油",u:"https://zh.wikipedia.org/wiki/酱油"},
      {q:"为什么醋放久了会更香？",a:"因为醋在慢慢陈酿。新醋醋酸冲、口感生，存放过程中，醋里的有机酸和醇类发生酯化反应，生成带香气的酯类物质，刺激感减弱，香味变醇厚。跟酒陈酿是同一个道理。但醋要密封、避光，不然醋酸菌继续活动会让醋越来越酸、甚至长白膜。家里那瓶老陈醋，放得越久，蘸饺子越香，一瓶老陈醋，往往是厨房里的陈酿宝贝，老陈醋那股醇厚，是时间一点点磨掉了醋酸的尖锐，磨出了回味。",s:"维基百科·醋",u:"https://zh.wikipedia.org/wiki/醋"},
      {q:"为什么蚝油开了瓶要冷藏？",a:"因为它鲜得招细菌。蚝油是生蚝熬制的浓缩汁，富含糖、氨基酸和盐分，开盖后接触空气，细菌很容易在里面繁殖，常温下容易发酸、长霉、变色。冷藏能让细菌慢下来，延长保质期。而且蚝油久放容易分层、香味挥发，放冰箱能锁住鲜。所以蚝油瓶上那句开盖后冷藏，不是吓唬人，是为了保住那一口蚝鲜，夏天不冷藏，蚝油几天就可能发酸发霉。",s:"维基百科·蚝油",u:"https://zh.wikipedia.org/wiki/蚝油"},
      {q:"为什么番茄酱倒之前要摇一摇？",a:"因为它油水分家了。番茄酱是浓稠的酱体，存放时里面的水分和固体慢慢分层，水沉在下、酱糊在底，直接倒会先流出稀水。摇一摇，让水和酱重新混匀，挤出来的才是均匀浓稠的番茄酱。这跟摇沙拉酱、摇蜂蜜是一个道理，悬浮的东西放久了总会沉底，摇匀了才好用，挤之前摇两下，挤出来的才均匀不稀水，不摇就挤，先淌一手稀水；摇匀了挤出来，才是浓稠挂勺的那一口。",s:"维基百科·番茄酱",u:"https://zh.wikipedia.org/wiki/番茄酱"},
      {q:"为什么花生煮过是软软的？",a:"因为它吸饱了水。花生干的时候水分少、质地硬，下锅一煮，水分透过种皮慢慢渗进仁里，细胞吸水膨胀，蛋白质和淀粉被煮软，口感就软糯了。炒花生则相反，是把水分烘干，所以又香又脆。同一种花生，煮和炒走向两个极端：一个泡水变软，一个失水变脆。所以下酒炒花生，粥里煮花生，各有各的口感，同是花生，煮炒两吃，口感天差地别。",s:"维基百科·花生",u:"https://zh.wikipedia.org/wiki/花生"},
      {q:"为什么芝士加热能拉出长丝？",a:"因为它的蛋白质排着队。奶酪里的酪蛋白在加热后变得柔软有弹性，分子像一串串橡皮筋，受热被拉长时不断开，就能拉出丝来。不同奶酪拉丝能力不一样，马苏里拉最能拉，所以披萨专门用它。一旦放凉，蛋白质重新凝固，丝就断了。所以披萨要趁热吃，那一口拉丝，是酪蛋白在被你拉长，想拉丝，选对芝士比什么都重要，披萨刚出炉那口绵长拉丝，靠的就是马苏里拉这种天生会拉的奶酪。",s:"维基百科·奶酪",u:"https://zh.wikipedia.org/wiki/奶酪"},
      {q:"为什么肉松是松松的？",a:"因为肉被撕成了绒。瘦肉先煮烂、撕成丝，再加上油、糖、调料慢慢翻炒烘干。水分一点点收干，肉丝越来越松散，最后变成蓬松的绒状。它体积大、密度小，所以看着一大碗其实没多少肉。肉松配粥、包面包，咸香入口即化。那一身蓬，是炒出来的脱水功夫，看着一大碗，其实没多少肉，别被体积骗了，看着满满一大碗，其实肉没多少，配粥解馋刚好，别指望顶饱。",s:"维基百科·肉松",u:"https://zh.wikipedia.org/wiki/肉松"},
      {q:"为什么腐竹要先晒干再吃？",a:"因为豆浆表面那层膜晒一晒才耐用。煮豆浆时，表层蛋白质和脂肪遇热凝固，挑起一层薄膜，就是鲜腐竹；把它晒干脱水，就能长期保存。干腐竹质地紧实，泡发后吸饱水，又恢复成软韧的口感，还特别吸汤。所以腐竹不是长出来的，是豆浆结的一层豆皮衣，晒干脆制后方便储存，泡发后吸满汤汁，是豆制品里的吸味高手，干制后方便存放，泡发后软韧吸汤，是豆制品里的一把好手。",s:"维基百科·腐竹",u:"https://zh.wikipedia.org/wiki/腐竹"},
      {q:"为什么年糕要使劲捶打才糯？",a:"因为捶打让米牵起手。蒸熟的糯米被反复捶打，米粒的结构被破坏，淀粉颗粒互相黏连，形成紧密的网络，吃起来才软糯黏牙。不捶打的糯米饭是散的，捶过之后才成了一整块拉得开的年糕。所以打年糕是力气活，那股糯劲全靠一锤一锤砸出来。烤着吃拉丝，煮着吃滑糯，都是捶打的功劳，这口糯，全靠力气一下一下砸出来，不捶就散，捶过才黏，这一口拉丝糯劲全在那一锤一锤里。",s:"维基百科·年糕",u:"https://zh.wikipedia.org/wiki/年糕"},
      {q:"为什么甜酒酿是甜甜的？",a:"因为霉菌把米糖化了。糯米饭拌入酒曲，酒曲里的毛霉先把淀粉分解成糖，让酒变甜；随后酵母菌再把一部分糖变成酒精。掌握好时间和温度，糖化多、发酵少，就是甜甜嫩嫩的酒酿；放太久酒精变浓，就成了米酒。所以酒酿的甜，是微生物在米饭上先造糖、再酿酒的半成品状态，夏天冰镇一碗，是江南人最爱的甜，糖多酒少是它温柔的秘诀，天热来一碗冰镇的，清甜又解腻。",s:"维基百科·酒酿",u:"https://zh.wikipedia.org/wiki/酒酿"},
      {q:"为什么煮面的汤上面有白沫？",a:"那是面粉里的蛋白质被煮出来了。面条表面的淀粉和少量蛋白质遇热溶进水里，受热后凝固成白色浮沫，跟煮肉浮沫一个道理。它没什么害处，但会让汤发浑、面汤发黏。喜欢清汤面的，煮面时头水倒掉、再换清水，面汤就清爽；或者点一次凉水，浮沫也会减少。所以那层白沫不是脏，是面粉的本色出演，爱清汤面的，记住煮面换一次水就够。",s:"维基百科·面条",u:"https://zh.wikipedia.org/wiki/面条"},
      {q:"为什么烤鱼的皮烤完会变脆？",a:"因为水分被烤跑了。鱼皮里的水分在高温下快速蒸发，皮下的胶原蛋白和脂肪受热收缩、焦化，形成一层又香又脆的壳。这就是美拉德反应和焦糖化在起作用，食物表面在高温下脱水变色，香气迸发。想要脆皮，鱼皮要擦干、油要热、别老翻动；火小了水汽焖着，皮就软塌塌。所以那一口脆皮，是高温把水分赶走后的功劳，擦干鱼皮、油温够高，脆皮并不难。",s:"维基百科·美拉德反应",u:"https://zh.wikipedia.org/wiki/美拉德反应"},
      {q:"为什么生豆浆不能直接喝？",a:"因为它里面藏着抗营养因子。生豆浆里含有皂素、胰蛋白酶抑制剂等物质，没煮熟会让人恶心、腹泻、咽喉发麻。而且豆浆加热到八十度左右会假沸，泡沫涌上来看着像开了，其实温度不够。正确做法是煮沸后再小火煮几分钟，把这些物质破坏掉。所以豆浆一定要真正煮熟，别被那层泡沫骗了，煮豆浆看到冒泡，再多煮几分钟才放心，看到表面起大泡还不够，再小火多煮三五分钟，喝着才踏实。",s:"维基百科·豆浆",u:"https://zh.wikipedia.org/wiki/豆浆"},
      {q:"为什么鲜黄花菜吃了会中毒？",a:"因为它含秋水仙碱。新鲜黄花菜里的秋水仙碱本身毒性不强，但进入人体后会被氧化成有毒的二秋水仙碱，刺激肠胃，让人恶心、呕吐、拉肚子。干黄花菜经过蒸煮晒干，毒素被破坏，吃着就安全。鲜吃的办法：先焯水、再用清水浸泡几小时，换水多次，把秋水仙碱溶掉。所以凉拌黄花，别图鲜直接下锅，干黄花泡发再炒，安全又好吃，焯水浸泡这步别偷懒，处理得当，那口鲜才安心端上桌。",s:"维基百科·黄花菜",u:"https://zh.wikipedia.org/wiki/黄花菜"},
      {q:"为什么四季豆一定要炒熟？",a:"因为它带天然毒素。四季豆里含有皂素和植物血凝素，没煮熟时会刺激消化道，让人腹痛、呕吐。这些毒素怕热，充分加热就能被破坏。所以四季豆一定要炒到变色、变软、没有生味；凉拌或脆生生吃最危险。干煸、焖煮彻底熟透才安全。那一口脆，恰恰可能是毒素还在，宁可炒老一点，也别贪那一口脆生，图脆生吃它最危险，焖煮到通体变软，毒素才被彻底破坏掉。",s:"维基百科·菜豆",u:"https://zh.wikipedia.org/wiki/菜豆"},
      {q:"为什么发芽的土豆不能吃？",a:"因为它开始造毒了。土豆发芽、变绿时，会产生大量龙葵素，这是土豆抵抗害虫的天然防御物质。龙葵素对人有毒，吃多了会口舌发麻、恶心呕吐。芽眼、变绿的皮和发芽周围含量最高。所以发芽少、芽眼浅的，深挖芽眼、削掉绿皮、浸泡后还能吃；发芽多、皮肉变绿发黑的，就别舍不得，直接扔掉，土豆买回家放阴凉处，别捂着捂着就发芽。",s:"维基百科·马铃薯",u:"https://zh.wikipedia.org/wiki/马铃薯"},
      {q:"为什么银杏果不能多吃？",a:"因为它好看但带毒。银杏果（白果）果肉和种皮里含有白果酸、银杏毒素，生吃或一次吃太多，会刺激肠胃、甚至引起中毒，小孩尤其敏感。炒熟后毒性降低，但也不是完全没有。所以白果做菜要去芯、少量、做熟，一次十来颗点到为止。它香糯归香糯，可不能当瓜子一把接一把，当个点缀尝鲜可以，千万别当零嘴嗑，大人小孩都得管住量，一次十来颗点到为止，才不闹肚子。",s:"维基百科·银杏",u:"https://zh.wikipedia.org/wiki/银杏"},
      {q:"为什么菠菜吃起来有点涩？",a:"因为它草酸多。菠菜里含有不少草酸，草酸一碰到嘴里的钙，就会形成草酸钙，产生那种涩涩的感觉。草酸还会影响钙吸收，吃多了对身体不友好。解决办法很简单：菠菜先用开水焯一分钟，大部分草酸就溶进水里，涩味大减、也更营养。所以凉拌菠菜前先焯个水，那一口滑嫩不涩的关键，就在这一步，焯这一分钟，菠菜又嫩又不涩，这焯过的菠菜翠绿不涩，凉拌做汤都更顺口，营养也好吸收。",s:"维基百科·菠菜",u:"https://zh.wikipedia.org/wiki/菠菜"},
      {q:"为什么紫菜汤是紫色的？",a:"因为它本来就是紫的。紫菜这种海藻类蔬菜，含有藻红素和叶绿素，干品呈深紫黑色；煮汤后藻红素溶出，汤就带紫红色或紫褐色。好紫菜泡发后紫中带绿、有光泽；如果泡出来水很红、紫菜一捏就烂，可能是染色或变质。所以那碗紫色汤，是海藻本身的颜色，不是加了色素，好紫汤色自然，不用怕那层紫，那抹紫红是藻红素的本色，汤色清亮不浑浊，才是好紫菜。",s:"维基百科·紫菜",u:"https://zh.wikipedia.org/wiki/紫菜"},
      {q:"为什么干木耳泡发会变大？",a:"因为它吸饱了水。干木耳是鲜木耳脱水制成的，菌丝紧紧缩在一起，又轻又小。泡进冷水里，水分慢慢钻进每一丝组织，木耳吸水膨胀，从一小撮变成肥厚柔软的一大碗。泡发要用凉水或温水，别用热水，不然外面烂了里面还硬。所以那一碗黑木耳，是一小把干木耳喝饱水后的变身，一小把泡出一大碗，性价比极高，一小撮干木耳泡开就是满满一碗，性价比高，凉拌炒菜都百搭。",s:"维基百科·木耳",u:"https://zh.wikipedia.org/wiki/木耳"},
      {q:"为什么干香菇比鲜香菇更香？",a:"因为日晒让它转化出香气。鲜香菇晒干过程中，里面的麦角固醇在紫外线作用下变成维生素D，同时香菇中的核酸和糖分反应生成大量香菇精，那股特殊的香气。脱水浓缩后，香味物质密度更高，泡发后炖汤特别鲜。所以香菇要选菇肉厚、花纹自然的干品，泡发的水别倒，那是鲜美的精华，干香菇炖汤那股鲜，是鲜香菇比不了的，那股浓缩的鲜香，炖鸡煲汤时丢几朵，整锅汤都提了档次。",s:"维基百科·香菇",u:"https://zh.wikipedia.org/wiki/香菇"},
      {q:"为什么腊肉能放很久不坏？",a:"因为盐和风干联手防腐。腊肉先用大量盐腌制，盐把肉里的水分抽出来、抑制细菌；再挂在通风处风干脱水，让微生物无处生存。高盐加低水分，就是古老的防腐组合。南方冬天阴冷干燥，正好做腊肉，能存到第二年。但腊肉盐多、脂肪高，吃前多泡多煮减盐，偶尔解馋即可，好吃归好吃，高血压人群可要浅尝辄止，但它盐重油多，一次别吃太多，泡煮减盐后偶尔解馋就好。",s:"维基百科·腊肉",u:"https://zh.wikipedia.org/wiki/腊肉"},
      {q:"为什么香肠要挂着风干？",a:"因为它要脱水成熟。灌好的香肠挂在通风阴凉处，水分慢慢蒸发，肉渐渐紧实，香料和酒的味道渗进去，发生缓慢的发酵和熟成。水分少了，细菌长不起来，香肠才能存住。风干和熏制让香肠变得越嚼越香。所以广式腊肠、川味香肠，都是时间和风口的作品；自己家做，可别挂在暖气旁，时间和风口，是香肠最好的调料，时间和风口慢慢养出那股陈香，越嚼越有滋味，急不得。",s:"维基百科·香肠",u:"https://zh.wikipedia.org/wiki/香肠"},
      {q:"为什么冻过的西红柿会变软？",a:"因为冰把它的结构撑坏了。西红柿果肉含水量高，放进冷冻室，水结成冰、体积膨胀，把果肉细胞撑破。解冻后，细胞破损、汁水外流，果肉就软塌塌、面乎乎的，没有鲜番茄那股脆劲。所以西红柿适合常温放，不适合冷冻；冻番茄倒是适合拿来做汤，因为一煮本来就烂，出汁更浓，下次冻西红柿，留着打汤最合适，鲜番茄别冻，冻过的拿来做汤做酱，反而出汁浓郁刚刚好。",s:"维基百科·番茄",u:"https://zh.wikipedia.org/wiki/番茄"},
      {q:"为什么煮鸡蛋蛋黄边上有一层灰绿？",a:"因为它煮过头了。鸡蛋煮太久，蛋白里的硫和蛋黄里的铁反应，生成灰绿色的硫化铁，附着在蛋黄表面。这层绿膜对身体无害，只是影响卖相、口感也偏老。想避免：鸡蛋冷水下锅，水开后煮八到十分钟立刻捞出过凉水，蛋黄正好嫩黄。所以那层绿边，是在提醒你，下次别煮那么久，煮好立刻过凉水，蛋黄嫩黄不发绿，煮好立刻捞出来过凉水，蛋黄嫩黄不发绿，口感也更嫩。",s:"维基百科·鸡蛋",u:"https://zh.wikipedia.org/wiki/鸡蛋"},
      {q:"为什么不粘锅真的不粘？",a:"因为它穿了滑溜外衣。锅内壁涂了一层聚四氟乙烯，就是俗称的特氟龙。这种材料表面能极低、分子排列紧密，食物里的油和水分很难粘上去，煎蛋、摊饼轻轻松松。但它怕高温和金属铲：空烧超过二百六十度涂层会分解，铁铲会刮伤涂层。所以不粘锅要用硅胶铲、小火温油，那层滑皮才能用得久，善待这层涂层，它能用好几年，用硅胶铲、别空烧，这层滑溜外衣才能陪你煎好几年的蛋。",s:"维基百科·不粘涂层",u:"https://zh.wikipedia.org/wiki/不粘涂层"},
      {q:"为什么刚出炉的面包特别香？",a:"因为高温让它香气全开。面团进炉后，表面糖分和氨基酸发生美拉德反应，生成上百种香气物质；同时酒精、酯类受热挥发，整个面包房都被香味笼罩。出炉后温度一降，香味慢慢散去，所以刚出炉那一刻最香。这也是面包房总把香气往街上排的原因，那股香味，就是最好的招牌，那一口香气，趁热吃最幸福，那一口外脆内软、麦香扑鼻，刚出炉趁热吃最是幸福。",s:"维基百科·面包",u:"https://zh.wikipedia.org/wiki/面包"},
      {q:"为什么鸡精比味精还鲜？",a:"因为它是鲜味组合拳。味精主要是谷氨酸钠，提供基础鲜味；鸡精在谷氨酸钠之外，还加了核苷酸，这两种鲜味物质和谷氨酸钠一搭配，鲜度能翻好几倍，这叫鲜味协同。再加上鸡肉粉、香辛料，味道更复合。所以鸡精鲜得更厚，但它也含盐，别因为鲜就多放，鲜归鲜，它和味精一样要控量，它鲜得厚，可也含盐，炒菜照样要少放，别被鲜字骗了手。",s:"维基百科·味精",u:"https://zh.wikipedia.org/wiki/味精"},
      {q:"为什么熬猪油会溅油？",a:"因为肉里有水。熬猪油时，猪板油里残留的水分遇到热油迅速汽化，噼里啪啦往外溅。水比油重、沉在锅底，一沸腾就带着油花蹦出来。想少溅，切小块、凉油下锅、小火慢熬，盖个带孔的锅盖；火一大、水一干，油就安静了。所以熬猪油溅油，不是油脾气大，是水在热油里炸开了锅，小火凉油慢慢来，油渣金黄不溅手，切小块凉油下锅、小火慢熬，油渣金黄，也溅不到你一脸。",s:"维基百科·猪油",u:"https://zh.wikipedia.org/wiki/猪油"}
